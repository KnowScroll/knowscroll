  # transform that lowers rest parameters Hermes cannot compile (see that file).
  babel-preset-expo: 58.0.18
  '@babel/plugin-transform-parameters': 7.29.7
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.0
