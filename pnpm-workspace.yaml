  '@fast-check/vitest': 0.5.0
  kysely-codegen: 0.20.0
  squawk-cli: 2.70.0
  fast-check: 4.10.2
  # Client (Expo SDK 58: versions from expo@58.0.14 bundledNativeModules.json)
  expo: 58.0.14
  expo-clipboard: 58.0.3
  expo-constants: 58.0.12
  expo-crypto: 58.0.7
  expo-font: 58.0.8
  expo-linking: 58.0.13
