# KnowScroll v2 workspace. Every third-party version is pinned exactly in the catalog below and
# recorded, with peers, licences and what CI proves, in docs/v2/operations/dependency-matrix.md.
# Change a version only together with that document.
packages:
  - apps/*
  - packages/*
  - migrations
  - tests/integration

# Write exact versions when a dependency is added; never a range.
savePrefix: ''
# Every workspace manifest must take third-party versions from the catalog.
catalogMode: strict
# Fail installs on peer-dependency conflicts instead of warning.
strictPeerDependencies: true
# Only these packages may run install scripts.
onlyBuiltDependencies:
  - squawk-cli
  - unrs-resolver
# Ship prebuilt binaries through optional dependencies; their install scripts are fallbacks.
ignoredBuiltDependencies:
  - '@parcel/watcher'

catalog:
  # Toolchain
  typescript: 6.0.3
  '@types/node': 22.20.5
  eslint: 10.13.0
  '@eslint/js': 10.0.1
  '@eslint-community/eslint-plugin-eslint-comments': 4.8.1
  typescript-eslint: 8.71.2
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.13.0
  prettier: 3.9.10
  dependency-cruiser: 18.6.0
  knip: 6.42.0
  # Backend runtime
  '@nestjs/common': 12.1.3
  '@nestjs/core': 12.1.3
  '@nestjs/platform-express': 12.1.3
  '@nestjs/platform-socket.io': 12.1.3
  '@nestjs/websockets': 12.1.3
  '@nestjs/cli': 12.0.8
  '@orpc/contract': 1.15.7
  '@orpc/server': 1.15.7
  '@orpc/nest': 1.15.7
  '@orpc/openapi': 1.15.7
  '@orpc/zod': 1.15.7
  '@orpc/client': 1.15.7
  '@orpc/openapi-client': 1.15.7
  zod: 4.6.7
  kysely: 0.29.7
  pg: 8.23.1
  '@types/pg': 8.23.1
  pg-boss: 12.38.0
  pino: 10.4.0
  # The exact version @nestjs/platform-socket.io 12.1.3 depends on (one copy in the tree).
