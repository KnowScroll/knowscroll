name: Contributor CLI on Windows
on:
  pull_request:
    paths:
      - scripts/issue-context/**
      - package.json
      - .github/workflows/issue-context.yml
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Exercise contributor entry points in PowerShell
        shell: pwsh
        run: |
          $env:KS_DEV_ROOT = Join-Path $env:RUNNER_TEMP 'KnowScroll data'
          pnpm issue-context new "Next part" --offline
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          '# Example report' | pnpm issue-context --file -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test scripts/issue-context/lookup.test.mjs
