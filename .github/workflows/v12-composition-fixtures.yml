# Synthetic source-only #343/#232 proof fixtures. No launcher, host or provider authority.
name: v12 composition fixtures
on:
  push:
    branches: [codex/343-v12-composition-v3]
  pull_request:
    paths:
      - .github/workflows/v12-composition-fixtures.yml
      - tests/fixtures/v12-composition/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  composition-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python stdlib only: no dependency install, network, credentials or services.
      # AST selects one data validator; top-level launcher/HANDOFF never execute.
      - name: Full synthetic positive and adversarial proof suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v12-composition-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/v12-composition-evidence/checkout.txt"
          python3 --version 2>&1 | tee "$RUNNER_TEMP/v12-composition-evidence/python.txt"
          sha256sum tests/fixtures/v12-composition/* > "$RUNNER_TEMP/v12-composition-evidence/source-sha256.txt"
          timeout 120s python3 -B tests/fixtures/v12-composition/composition-proof.test.py \
            2>&1 | tee "$RUNNER_TEMP/v12-composition-evidence/full-suite.log"
      - name: Retain full output and exact frozen fixture sources
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v12-composition-${{ github.sha }}
          path: |
            ${{ runner.temp }}/v12-composition-evidence/
            tests/fixtures/v12-composition/
          if-no-files-found: error
          retention-days: 30
