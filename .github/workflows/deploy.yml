# Deploys KnowScroll to its worlds on the VPS (#201; v2 releases #228, docs/v2/operations/environments.md).
#
# A push to `dev` or `stage` deploys that world once `checks` has passed on the same commit.
# `workflow_dispatch` deploys any ref to dev only (the agent may try a branch there).
# Live (`main`) joins when the live world is set up; its environment already waits for a reviewer.
#
# Two release generations, told apart by the deployed commit itself:
# - v2 (the commit carries scripts/release/build.mjs): nothing is built here. The release that
#   `checks` built and smoke-tested for this exact commit (artifact `release-<commit>`: the tar
#   and its .sha256) is taken only from a successful `checks` run triggered by a *push* in this
#   repository (never a pull_request run, which may come from a fork's own workflow), the earliest
#   such run; its .sha256 must be one line naming the tar and match it; those bytes are streamed to
#   the server. Afterwards /health must report the commit, the world and that artifact hash. A
#   promotion reuses the server's copy and is compared against the same artifact. An artifact that
#   has expired is the only case in which a promotion goes ahead without that comparison; any
#   error while looking for or downloading it fails the deploy.
# - v1 (legacy/v1-final and older): built here from source, exactly as before.
#
# Never a self-hosted runner: the repository is public, so pull requests from forks could run
# code on the server. This workflow runs only on pushes and manual dispatch, never on PRs.
name: deploy

on:
  push:
    branches: [dev, stage]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to deploy to dev
        required: true

permissions:
  contents: read
  actions: read

# One deploy per world at a time. A newer one waits rather than cancelling: cancelling would cut
# the SSH session in the middle of a migration.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'dev' || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.ref_name }}
      url: https://app.${{ github.event_name == 'workflow_dispatch' && 'dev' || github.ref_name }}.knowscroll.space
    env:
      WORLD: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.ref_name }}
      HOST: ${{ vars.KS_DEPLOY_HOST }}
    steps:
      - name: Resolve the commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          else
            sha=$GITHUB_SHA
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha to $WORLD"

      # v2 commits carry scripts/release/build.mjs; no v1 commit ever did (v1 had
      # scripts/build-release.mjs and also an apps/api, so apps/api cannot tell them apart).
      - name: Which release generation is this commit?
        id: generation
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if out=$(gh api "repos/$GITHUB_REPOSITORY/contents/scripts/release/build.mjs?ref=$SHA" --jq .type 2>&1); then
            generation=v2
          elif printf '%s' "$out" | grep -q 'HTTP 404'; then
            generation=v1
          else
            echo "could not tell which release generation $SHA is: $out"; exit 1
          fi
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "$SHA is a $generation release"

      # Any successful `checks` run on this exact commit counts: a promotion to stage moves a commit
      # that already passed on dev, so it does not wait for CI a second time. For v2 only runs
      # triggered by a push count, because only those may supply the release (below).
      - name: Wait for checks to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
          GENERATION: ${{ steps.generation.outputs.generation }}
        run: |
          event=()
          [ "$GENERATION" != v2 ] || event=(--event push)
          for attempt in $(seq 1 120); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --commit "$SHA" "${event[@]}" \
              --json status,conclusion --jq '[.[] | {status, conclusion}]')
            if echo "$runs" | jq -e 'any(.[]; .conclusion == "success")' >/dev/null; then
              echo "checks passed on $SHA"; exit 0
            fi
            if echo "$runs" | jq -e 'length > 0 and all(.[]; .status == "completed")' >/dev/null; then
              echo "checks finished without success on $SHA: $runs"; exit 1
            fi
            sleep 30
          done
          echo "timed out waiting for checks on $SHA"; exit 1

      - name: SSH access to the server (this world's deploy key only)
        env:
          KEY: ${{ secrets.KS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.KS_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host knowscroll\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$HOST" > ~/.ssh/config

      - name: Does the server already hold this release?
        id: present
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if ssh knowscroll "has-release $SHA"; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      # v2: the tested bytes, never a rebuild. Only successful `checks` runs triggered by a push in
      # this repository may supply them (m3). The earliest such run is the one whose release the
      # first deploy of this commit used, so a later promotion compares the server's copy with the
      # same artifact. "Expired" and "not uploaded" are told apart from errors: an error looking for
      # or downloading the artifact fails the deploy (m5).
      - name: Fetch the release that checks built and tested (v2)
        id: artifact
        if: steps.generation.outputs.generation == 'v2'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
          PRESENT: ${{ steps.present.outputs.present }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?head_sha=$SHA&event=push&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$SHA\" and .head_repository.full_name == \"$GITHUB_REPOSITORY\" and .repository.full_name == \"$GITHUB_REPOSITORY\")] | sort_by(.created_at) | .[] | \"\\(.id) \\(.head_branch)\"")
          [ -n "$runs" ] || { echo "no successful push-triggered checks run in $GITHUB_REPOSITORY on $SHA"; exit 1; }
          found=
          expired=
          while read -r run branch; do
            # Errors here fail the step (set -e); only "no such artifact" and "expired" move on.
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"release-$SHA\")] | if length == 0 then \"absent\" elif all(.expired) then \"expired\" else \"available\" end")
            echo "checks run $run (push to $branch): release-$SHA is $state"
            if [ "$state" = available ]; then found=$run; break; fi
            [ "$state" != expired ] || expired=$run
            # A promotion must compare with the earliest run's artifact, which the first deploy used.
            if [ "$PRESENT" = true ]; then break; fi
          done <<< "$runs"
          if [ -z "$found" ]; then
            if [ "$PRESENT" = true ] && [ -n "$expired" ]; then
              echo "::warning::The release-$SHA artifact of checks run $expired has expired. The server already holds this release and re-verifies it against its files.sha256; the outside check cannot compare the artifact hash."
              echo "artifact=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "no usable release-$SHA artifact on the earliest push-triggered checks run on $SHA: there is no tested release to deploy"; exit 1
          fi
          gh run download "$found" --repo "$GITHUB_REPOSITORY" --name "release-$SHA" --dir "$dir"
          tar="$dir/release-$SHA.tar"
          sum="$dir/release-$SHA.tar.sha256"
          [ -f "$tar" ] && [ -f "$sum" ] ||
            { echo "the release-$SHA artifact must hold release-$SHA.tar and release-$SHA.tar.sha256 at its root"; ls -la "$dir"; exit 1; }
          # m4: exactly one line, naming exactly this tar; the hash is compared here, not by sha256sum
          # (which would check whatever file the line names).
          [ "$(wc -l < "$sum")" -eq 1 ] && grep -Eqx "[0-9a-f]{64}  release-$SHA\.tar" "$sum" ||
            { echo "release-$SHA.tar.sha256 must be exactly one line: <sha256>  release-$SHA.tar"; exit 1; }
          artifact=$(cut -d' ' -f1 "$sum")
          actual=$(sha256sum "$tar" | cut -d' ' -f1)
          [ "$actual" = "$artifact" ] || { echo "release-$SHA.tar is $actual, its .sha256 says $artifact"; exit 1; }
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "release-$SHA.tar from checks run $found, sha256 $artifact"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.generation.outputs.generation == 'v1' && steps.present.outputs.present == 'false'
        with:
          ref: ${{ steps.commit.outputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.generation.outputs.generation == 'v1' && steps.present.outputs.present == 'false'
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.generation.outputs.generation == 'v1' && steps.present.outputs.present == 'false'
        with:
          node-version: 22.23.0
          cache: pnpm
      - name: Build the release (v1)
        if: steps.generation.outputs.generation == 'v1' && steps.present.outputs.present == 'false'
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build:release --out "$RUNNER_TEMP/release" --commit "$SHA"

      - name: Deploy
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          PRESENT: ${{ steps.present.outputs.present }}
        run: |
          if [ "$PRESENT" = true ]; then
            ssh knowscroll "promote $WORLD $SHA" < /dev/null
          else
            ssh knowscroll "deploy $WORLD $SHA" < "$RUNNER_TEMP/release/release-$SHA.tar"
          fi

      - name: Check it from outside
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          GENERATION: ${{ steps.generation.outputs.generation }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
        run: |
          for host in app backend; do
            body=$(curl -fsS "https://$host.$WORLD.knowscroll.space/health")
            echo "$host: $body"
            echo "$body" | jq -e --arg sha "$SHA" --arg world "$WORLD" '.commit == $sha and .world == $world' >/dev/null
            if [ "$GENERATION" = v2 ]; then
              if [ -n "$ARTIFACT" ]; then
                echo "$body" | jq -e --arg artifact "$ARTIFACT" '.artifact == $artifact' >/dev/null ||
                  { echo "$host serves artifact $(echo "$body" | jq -r .artifact), not the tested $ARTIFACT"; exit 1; }
              else
                echo "$body" | jq -e '(.artifact | type) == "string" and (.artifact | test("^[0-9a-f]{64}$"))' >/dev/null
              fi
            fi
          done
          {
            echo "### Deployed to $WORLD"
            echo "- commit: \`$SHA\` ($GENERATION)"
            [ "$GENERATION" != v2 ] || echo "- artifact sha256: \`$(echo "$body" | jq -r .artifact)\`"
            [ "$GENERATION" != v2 ] || echo "- latest migration: \`$(echo "$body" | jq -r '.migration // "none"')\`"
          } >> "$GITHUB_STEP_SUMMARY"
