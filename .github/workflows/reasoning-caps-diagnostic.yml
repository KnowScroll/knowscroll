# Finite #343 fixture diagnostic. Required checks.yml remains unchanged and runs separately.
# This issue branch is the only automatic trigger; no deployment, credentials or model provider.
name: reasoning cap diagnostic
on:
  push:
    branches: [codex/343-cap-coordination]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cap-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point fixture caches and evidence at runner temp
        run: |
          echo "KS_DEV_ROOT=$RUNNER_TEMP/ks-dev" >> "$GITHUB_ENV"
          echo "CAP_EVIDENCE=$RUNNER_TEMP/cap-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/cap-evidence"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Five complete cap fixture repetitions (real PostgreSQL, no provider)
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$CAP_EVIDENCE/source-sha.txt"
          for round in 1 2 3 4 5; do
            timeout 180s pnpm --filter @knowscroll/integration-tests test \
              --project integration modules/reasoning-caps-race.test.ts --reporter=verbose \
              2>&1 | tee "$CAP_EVIDENCE/normal-$round.log"
          done
      - name: Removing only the budget snapshot lock produces actual over-admission
        run: |
          set -euo pipefail
          target=packages/backend/src/reasoning/adapters/postgres-ledger.ts
          cp "$target" "$CAP_EVIDENCE/postgres-ledger.pristine.ts"
          trap 'cp "$CAP_EVIDENCE/postgres-ledger.pristine.ts" "$target"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/backend/src/reasoning/adapters/postgres-ledger.ts')
          source = path.read_text()
          lock = '      await sql`select pg_advisory_xact_lock(${BUDGET_LOCK_KEY}::bigint)`.execute(trx);\n'
          if source.count(lock) != 1:
              raise SystemExit('Expected exactly one budgetUsage lock to mutate')
          path.write_text(source.replace(lock, '', 1))
          PY
          git diff -- "$target" > "$CAP_EVIDENCE/mutation.diff"
          set +e
          timeout 180s pnpm --filter @knowscroll/integration-tests test \
            --project integration modules/reasoning-caps-race.test.ts \
            -t 'a global token cap that fits 3 reservations' \
            --reporter=json --outputFile="$CAP_EVIDENCE/mutation.json" \
            > "$CAP_EVIDENCE/mutation.log" 2>&1
          status=$?
          set -e
          cat "$CAP_EVIDENCE/mutation.log"
          test "$status" -eq 1 || { echo "Expected assertion exit 1, received $status"; exit 1; }
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(readFileSync(`${process.env.CAP_EVIDENCE}/mutation.json`, 'utf8'));
          assert.equal(report.numFailedTests, 1);
          const failed = report.testResults.flatMap(file => file.assertionResults).filter(test => test.status === 'failed');
          assert.equal(failed.length, 1);
          assert.match(failed[0].fullName, /a global token cap that fits 3 reservations/);
          const message = failed[0].failureMessages.join('\n').replace(/\x1b\[[0-9;]*m/g, '');
          assert.ok(message.includes('expected { proposed: 5, exhausted: 7 } to deeply equal { proposed: 3, exhausted: 9 }'), message);
          console.log(message);
          console.log('Confirmed actual cap over-admission: 5 proposed / 7 exhausted; expected 3 / 9.');
          JS
          cp "$CAP_EVIDENCE/postgres-ledger.pristine.ts" "$target"
          git diff --exit-code -- "$target"
      - name: Restored real ledger passes every cap fixture again
        run: |
          set -euo pipefail
          timeout 180s pnpm --filter @knowscroll/integration-tests test \
            --project integration modules/reasoning-caps-race.test.ts --reporter=verbose \
            2>&1 | tee "$CAP_EVIDENCE/restored.log"
      - name: Retain complete diagnostic output even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reasoning-caps-${{ github.sha }}
          path: ${{ runner.temp }}/cap-evidence/
          if-no-files-found: error
          retention-days: 30
