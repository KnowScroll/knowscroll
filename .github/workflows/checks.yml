name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      KS_DEV_ROOT: /tmp/knowscroll-dev
      DATABASE_URL: postgresql://knowscroll:test-only-ci-password@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knowscroll
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Web (apps/web) typecheck
        run: pnpm typecheck:web
      - name: Web (apps/web) unit/component tests
        run: pnpm test:web
      - name: Verify deterministic fairness policy traces
        run: pnpm exec tsx scripts/capture-fairness-evidence.ts artifacts/fairness-ci.json
      - name: Verify durable fairness across disposable PostgreSQL restart
        run: pnpm exec tsx scripts/fairness/sql-restart.ts artifacts/sql-fairness-restart-ci.json
      - run: pnpm exec tsx --test scripts/journey-verifier.test.ts
      - name: Verify isolated HTTP, worker and PostgreSQL journey
        run: pnpm exec tsx scripts/run-isolated-journey.ts
      - name: Verify two-session isolation and privacy epoch fences
        run: pnpm exec tsx scripts/run-isolated-session-journey.ts
      - name: Verify retryable history clear and universe isolation
        run: pnpm exec tsx scripts/run-isolated-history-journey.ts
      - name: Verify reasoning crash and late-usage boundaries
        run: |
          pnpm exec tsx scripts/run-isolated-reasoning-journey.ts --receipt artifacts/j004-ci.json
          pnpm exec tsx scripts/verify-reasoning-journey.ts artifacts/j004-ci.json
      - name: Verify literal Ask durability over separate HTTP
        run: pnpm exec tsx scripts/run-isolated-ask-journey.ts artifacts/explicit-ask-ci.json
      - name: Verify scheduled seven-day private retirement
        run: pnpm exec tsx scripts/run-isolated-retirement-journey.ts artifacts/reasoning-retirement-ci.json
      - name: Verify pinned Cutroom client with separate local fixture restarts
        run: pnpm exec tsx scripts/run-isolated-cutroom-http-journey.ts artifacts/cutroom-http-ci.json
      - name: Verify interrupted reasoning runtime cleanup
        run: pnpm exec tsx scripts/verify-reasoning-cleanup.ts
      - name: Preserve sanitized interruption evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reasoning-interruption-evidence
          path: |
            artifacts/j004-cleanup-*.json
            artifacts/j004-interrupt-*.json
          if-no-files-found: ignore
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-37.2 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --no-daemon
        working-directory: apps/mobile
