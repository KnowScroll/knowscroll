name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      KS_DEV_ROOT: /tmp/knowscroll-dev
      DATABASE_URL: postgresql://knowscroll:test-only-ci-password@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knowscroll
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
      - run: pnpm install --frozen-lockfile
      # ubuntu-latest (24.04, image 20260907.300.1) does not ship ffmpeg/ffprobe in its default
      # software list (confirmed against actions/runner-images' own Ubuntu2404-Readme.md: only
      # MediaInfo is listed under media tools, no ffmpeg entry). tests/generation-import.test.ts
      # (#94 verified media import) needs both on PATH.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm typecheck
      - run: pnpm test
      - name: Web (apps/web) typecheck
        run: pnpm typecheck:web
      - name: Web (apps/web) unit/component tests
        run: pnpm test:web
      - name: Verify deterministic fairness policy traces
        run: pnpm exec tsx scripts/capture-fairness-evidence.ts artifacts/fairness-ci.json
      - name: Verify durable fairness across disposable PostgreSQL restart
        run: pnpm exec tsx scripts/fairness/sql-restart.ts artifacts/sql-fairness-restart-ci.json
      - run: pnpm exec tsx --test scripts/journey-verifier.test.ts
      - name: Verify isolated HTTP, worker and PostgreSQL journey
        run: pnpm exec tsx scripts/run-isolated-journey.ts
      - name: Verify two-session isolation and privacy epoch fences
        run: pnpm exec tsx scripts/run-isolated-session-journey.ts
      - name: Verify retryable history clear and universe isolation
        run: pnpm exec tsx scripts/run-isolated-history-journey.ts
      - name: Verify reasoning crash and late-usage boundaries
        run: |
          pnpm exec tsx scripts/run-isolated-reasoning-journey.ts --receipt artifacts/j004-ci.json
          pnpm exec tsx scripts/verify-reasoning-journey.ts artifacts/j004-ci.json
      - name: Verify literal Ask durability over separate HTTP
        run: pnpm exec tsx scripts/run-isolated-ask-journey.ts artifacts/explicit-ask-ci.json
      - name: Verify scheduled seven-day private retirement
        run: pnpm exec tsx scripts/run-isolated-retirement-journey.ts artifacts/reasoning-retirement-ci.json
      - name: Verify pinned Cutroom client with separate local fixture restarts
        run: pnpm exec tsx scripts/run-isolated-cutroom-http-journey.ts artifacts/cutroom-http-ci.json
      - name: Verify interrupted reasoning runtime cleanup
        run: pnpm exec tsx scripts/verify-reasoning-cleanup.ts
      - name: Preserve sanitized interruption evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reasoning-interruption-evidence
          path: |
            artifacts/j004-cleanup-*.json
            artifacts/j004-interrupt-*.json
          if-no-files-found: ignore
          retention-days: 7
  web-journey:
    # #115: the backend job's typecheck/unit-test steps never exercise the real web client
    # against a real server, so a backend contract change (ADR-0030's recordingPausedAt, #120)
    # can break the web surface silently while every other check stays green. This job runs
    # scripts/run-web-reader-journey.ts -- the real Vite dev server, a real API/worker and a
    # real Chromium via Playwright, against the same kind of disposable PostgreSQL the backend
    # job above provisions (same pinned action SHAs, Node and pnpm versions).
    runs-on: ubuntu-latest
    # Bounds a hang in cleanup, which the runner's own watchdog no longer covers once it is stopping.
    timeout-minutes: 30
    env:
      KS_DEV_ROOT: /tmp/knowscroll-dev
      DATABASE_URL: postgresql://knowscroll:test-only-ci-password@127.0.0.1:5432/postgres
      # Set once at job level so the browser-install step below and the runner's own Playwright
      # invocation (scripts/run-web-reader-journey.ts, which otherwise falls back to a
      # KS_DEV_ROOT-relative default only meant for local dev) agree on where Chromium lives.
      PLAYWRIGHT_BROWSERS_PATH: /tmp/knowscroll-dev/playwright-browsers
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knowscroll
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright's Chromium (with OS deps)
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Verify the web-reader journey end to end (#92, #115)
        run: pnpm exec tsx scripts/run-web-reader-journey.ts
      - name: Verify the web owner journey (#135 cookie sign-in, privacy, account deletion)
        run: pnpm exec tsx scripts/run-web-owner-journey.ts
      - name: Verify the web "What led here" journey (#133 journey G)
        run: pnpm exec tsx scripts/run-web-why-journey.ts
      - name: Preserve sanitized receipt and Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-journey-evidence
          path: |
            docs/journeys/evidence/web-reader/last-run-receipt.json
            docs/journeys/evidence/web-owner/last-run-receipt.json
            docs/journeys/evidence/web-why/last-run-receipt.json
            apps/web/artifacts/playwright-report/**
            apps/web/artifacts/playwright-results.json
          if-no-files-found: ignore
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-37.2 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --no-daemon
        working-directory: apps/mobile
