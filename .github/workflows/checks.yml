# Required checks for KnowScroll v2. The file name `checks.yml` and the workflow name `checks` are a
# contract: deploy.yml and scripts/promote.sh wait for a successful `checks.yml` run on the exact
# commit before deploying or promoting it.
#
# Release artifact contract (#228, docs/v2/operations/environments.md): when this workflow builds
# the v2 release, it builds it for $GITHUB_SHA (`build.mjs --commit "$GITHUB_SHA"`), never a PR head
# SHA, and uploads it as the artifact `release-$GITHUB_SHA` holding exactly
# `release-$GITHUB_SHA.tar` and `release-$GITHUB_SHA.tar.sha256` at its root. deploy.yml takes it
# only from successful runs triggered by a push in this repository.
#
# Jobs: `integrity` (main-update hook, vendored design and Cutroom snapshots), `static` (format,
# lint, typecheck, import boundaries, unused code, migration lint), `backend` (unit tests and
# real-PostgreSQL integration tests), `build` (production builds, the `pnpm deploy` release
# trees, generated database types, and those trees booted against PostgreSQL through the S1.2
# spike journey) and `client` (jest-expo tests and the Expo web
# export). Never remove, skip or weaken a job to get a green run.
name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
      - name: Main-update hook refuses what it must and allows what it may
        run: node --test .claude/hooks/refuse-main-update.test.mjs
      - name: Server deploy tool decisions (ks plan, release tree and backup script tests)
        run: node --test ops/vps/tool/plan.test.ts ops/vps/tool/tree.test.ts ops/vps/backup/scripts.test.ts
      - name: v2.1 design export matches its recorded SHA-256 list
        working-directory: docs/v2/design/KnowScroll-design-v2.1
        run: |
          sha256sum --check --quiet ../KnowScroll-design-v2.1.sha256
          expected=$(wc -l < ../KnowScroll-design-v2.1.sha256)
          actual=$(find . -type f | wc -l)
          test "$expected" -eq "$actual" || { echo "file count $actual != recorded $expected"; exit 1; }
      - name: v3 design files match their recorded SHA-256 list
        working-directory: docs/v2/design/v3
        run: |
          sha256sum --check --quiet SHA256SUMS
          expected=$(wc -l < SHA256SUMS)
          actual=$(find . -type f ! -name README.md ! -name SHA256SUMS | wc -l)
          test "$expected" -eq "$actual" || { echo "file count $actual != recorded $expected"; exit 1; }
      - name: Vendored Cutroom wire schema matches its pinned upstream hashes
        working-directory: packages/backend/src/modules/content/adapters/cutroom/wire-v1
        run: |
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            const manifest = JSON.parse(readFileSync("source.json", "utf8"));
            let failed = 0;
            for (const file of manifest.files) {
              const actual = createHash("sha256").update(readFileSync(file.path)).digest("hex");
              if (actual !== file.sha256) { console.error(`${file.path}: ${actual} != ${file.sha256}`); failed++; }
            }
            if (failed) process.exit(1);
            console.log(`${manifest.files.length} files match ${manifest.repository}@${manifest.revision}`);
          '

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .npmrc puts the pnpm store under ${KS_DEV_ROOT}; on runners that is the job's temp folder.
      - name: Point KS_DEV_ROOT at the runner's temp folder
        run: echo "KS_DEV_ROOT=$RUNNER_TEMP/ks-dev" >> "$GITHUB_ENV"
      # The pnpm version comes from package.json `packageManager` (pnpm@10.34.7).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint (typed)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Import boundaries (dependency-cruiser)
        run: pnpm boundaries
      - name: Import boundary rules reject the forbidden probe imports
        run: pnpm boundaries:probe
      - name: Workspace imports in production code are declared dependencies
        run: pnpm boundaries:manifests
      - name: The unmarked-transaction lint rule rejects every direct form (probe)
        run: pnpm lint:probe
      - name: Network clients stay in infrastructure and the reasoning adapters (probe)
        run: pnpm lint:probe:network
      - name: Unused files, exports and dependencies (knip)
        run: pnpm knip
      - name: Migration hazards (squawk)
        run: |
          pnpm --filter @knowscroll/migrations exec squawk --version
          pnpm --filter @knowscroll/migrations lint:sql

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Production major (dependency-matrix.md). Disposable: the job's container is discarded.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .npmrc puts the pnpm store under ${KS_DEV_ROOT}; on runners that is the job's temp folder.
      - name: Point KS_DEV_ROOT at the runner's temp folder
        run: echo "KS_DEV_ROOT=$RUNNER_TEMP/ks-dev" >> "$GITHUB_ENV"
      # The pnpm version comes from package.json `packageManager` (pnpm@10.34.7).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Media fixture tooling (no provider calls)
        # Fail visibly on a stalled package mirror or lock before any test is claimed to run.
        timeout-minutes: 10
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # The runner's Azure mirror has repeatedly stalled before tests can start.
            # Keep Ubuntu signature verification and use its official archive over HTTPS.
            if test -f /etc/apt/apt-mirrors.txt; then
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update --error-on=any
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: PostgreSQL server version
        run: psql "$KS_TEST_DATABASE_URL" --no-psqlrc --tuples-only --command 'select version()'
      # Scroll's unchanged timing assertions must not compete with other test workers on this
      # runner. Its Vitest config also runs files serially; every Scroll test still runs here.
      - name: Scroll model unit, property and timing tests (isolated scheduling)
        run: pnpm --filter @knowscroll/scroll-model test
      - name: Scene core unit tests (bounded descriptors and deterministic geometry)
        run: pnpm --filter @knowscroll/scene-core test
      - name: Unit and property tests (contracts, backend, migrations, api)
        run: pnpm --filter @knowscroll/contracts --filter @knowscroll/backend --filter @knowscroll/migrations --filter @knowscroll/api test
      - name: Integration tests (real PostgreSQL, one template-derived database per file)
        run: pnpm --filter @knowscroll/integration-tests test

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Production major (dependency-matrix.md). Disposable: the job's container is discarded.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .npmrc puts the pnpm store under ${KS_DEV_ROOT}; on runners that is the job's temp folder.
      - name: Point KS_DEV_ROOT at the runner's temp folder
        run: echo "KS_DEV_ROOT=$RUNNER_TEMP/ks-dev" >> "$GITHUB_ENV"
      # The pnpm version comes from package.json `packageManager` (pnpm@10.34.7).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Media fixture tooling (no provider calls)
        # Fail visibly on a stalled package mirror or lock before any test is claimed to run.
        timeout-minutes: 10
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # The runner's Azure mirror has repeatedly stalled before tests can start.
            # Keep Ubuntu signature verification and use its official archive over HTTPS.
            if test -f /etc/apt/apt-mirrors.txt; then
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update --error-on=any
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Build packages, API and worker (nest build)
        run: pnpm --filter '!@knowscroll/client' --filter '!@knowscroll/integration-tests' build
      - name: Deploy release trees (pnpm deploy --prod, from the lockfile)
        run: |
          release="$RUNNER_TEMP/release"
          # Injected workspace packages make pnpm deploy install from the shared lockfile (D-014).
          pnpm --config.inject-workspace-packages=true --filter @knowscroll/api deploy --prod "$release/api"
          pnpm --config.inject-workspace-packages=true --filter @knowscroll/worker deploy --prod "$release/worker"
          for path in api/package.json api/dist/main.js api/dist/migrate.js api/node_modules worker/package.json worker/dist/main.js worker/node_modules; do
            test -e "$release/$path" || { echo "missing $path in the release tree"; exit 1; }
          done
          echo "KS_RELEASE_DIR=$release" >> "$GITHUB_ENV"
      - name: Generated database types match the migrated schema (kysely-codegen --verify)
        run: |
          psql "$KS_TEST_DATABASE_URL" --no-psqlrc --quiet --command 'create database knowscroll_types'
          types_url="postgres://postgres:postgres@localhost:5432/knowscroll_types"
          (cd "$KS_RELEASE_DIR/api" && KS_WORLD=ci DATABASE_URL="$types_url" node dist/migrate.js)
          DATABASE_URL="$types_url" pnpm --filter @knowscroll/backend db:types:verify
      - name: Boot the deployed release against PostgreSQL (health, refusals, spike journey)
        run: pnpm --filter @knowscroll/integration-tests test:release

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .npmrc puts the pnpm store under ${KS_DEV_ROOT}; on runners that is the job's temp folder.
      - name: Point KS_DEV_ROOT at the runner's temp folder
        run: echo "KS_DEV_ROOT=$RUNNER_TEMP/ks-dev" >> "$GITHUB_ENV"
      # The pnpm version comes from package.json `packageManager` (pnpm@10.34.7).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Unit tests (design tokens, client core)
        run: pnpm --filter @knowscroll/design-tokens --filter @knowscroll/client-core test
      - name: UI primitive tests (jest-expo)
        run: pnpm --filter @knowscroll/ui test
      - name: Component tests (jest-expo)
        run: pnpm --filter @knowscroll/client test
      # The export bundles @knowscroll/contracts and the @knowscroll/scroll-model it re-exports from
      # their dist/, like every other build (D-012); the trailing `...` builds contracts' own
      # workspace dependencies first.
      - name: Build the packages the web export bundles
        run: pnpm --filter '@knowscroll/contracts...' build
      - name: Web export (expo export --platform web)
        run: |
          pnpm --filter @knowscroll/client build
          test -f apps/client/dist/index.html
      # Positive control for the check below: the same marker is in a gallery build, so the
      # production check cannot pass because the marker was renamed.
      - name: Gallery export (EXPO_PUBLIC_KS_GALLERY=1) carries the gallery marker
        run: |
          pnpm --filter @knowscroll/client build:gallery
          grep -rlq 'ks-component-gallery' apps/client/dist-gallery
          grep -rlq 'ks-scroll-gallery' apps/client/dist-gallery
          grep -rlq 'ks-dev-evidence' apps/client/dist-gallery
      - name: The production export carries no developer gallery
        run: |
          if grep -rlE 'ks-component-gallery|ks-scroll-gallery|A bridge has one job' apps/client/dist; then
            echo 'the component gallery is in a production export'; exit 1
          fi
          if grep -rlE 'ks-dev-evidence|Developer diagnostics: evidence' apps/client/dist; then
            echo 'the dev evidence panel is in a production export'; exit 1
          fi
          grep -rlq 'BricolageGrotesque' apps/client/dist
      # The browser is installed here only; nothing installs it on a developer machine.
      - name: Install Chromium for the web smoke
        run: pnpm --filter @knowscroll/client exec playwright install --with-deps chromium
      - name: Web smoke over the exports (keyboard, links, titles, sheet, no gallery in production)
        run: pnpm --filter @knowscroll/client test:web

  # #228: the release deploy.yml ships (docs/v2/operations/environments.md). Built once, here, for
  # this exact commit ($GITHUB_SHA), after the build and client jobs passed; checked with the
  # server's own rules (scripts/release/smoke.mjs uses ops/vps/tool) and booted against this job's
  # disposable PostgreSQL the way a world's v2 units run it; then uploaded as `release-$GITHUB_SHA`
  # holding exactly the tar and its .sha256. deploy.yml takes it only from push-triggered runs.
  release:
    needs: [build, client]
    runs-on: ubuntu-latest
    services:
      postgres:
        # Production major (dependency-matrix.md). Disposable: the job's container is discarded.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .npmrc puts the pnpm store under ${KS_DEV_ROOT}; on runners that is the job's temp folder.
      - name: Point KS_DEV_ROOT at the runner's temp folder
        run: echo "KS_DEV_ROOT=$RUNNER_TEMP/ks-dev" >> "$GITHUB_ENV"
      # The pnpm version comes from package.json `packageManager` (pnpm@10.34.7).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build packages, API and worker (nest build), as the build job does
        run: pnpm --filter '!@knowscroll/client' --filter '!@knowscroll/integration-tests' build
      - name: Web export (expo export --platform web), as the client job does
        run: |
          pnpm --filter @knowscroll/client build
          test -f apps/client/dist/index.html
      - name: Assemble the release (pnpm deploy trees, web export, release.json, files.sha256, tar)
        id: release
        run: |
          out="$RUNNER_TEMP/release"
          node scripts/release/build.mjs --out "$out" --commit "$GITHUB_SHA"
          sum="$out/release-$GITHUB_SHA.tar.sha256"
          artifact=$(cut -d' ' -f1 "$sum")
          printf '%s' "$artifact" | grep -Eqx '[0-9a-f]{64}' || { echo "malformed $sum"; exit 1; }
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c %s "$out/release-$GITHUB_SHA.tar")" >> "$GITHUB_OUTPUT"
      # The v2 API unit also reads the shared AgentMail file (production refuses to start without
      # AgentMail configured, S1.3); here a fixture key and inbox stand in for it. Nothing is sent:
      # the smoke test never asks for a sign-in link.
      - name: Smoke-test the release as the server runs it (migrate, /health, problems, worker)
        env:
          AGENTMAIL_API_KEY: fixture-not-a-key
          AGENTMAIL_INBOX_ID: fixture@agentmail.invalid
        run: |
          psql "$KS_TEST_DATABASE_URL" --no-psqlrc --quiet --command 'create database knowscroll_release_smoke'
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/knowscroll_release_smoke" \
            node scripts/release/smoke.mjs "$RUNNER_TEMP/release/release-$GITHUB_SHA.tar" --start --world dev \
            --pass-env AGENTMAIL_API_KEY --pass-env AGENTMAIL_INBOX_ID \
            --unauthenticated /auth/session --unauthenticated /v1/saved \
            --unauthenticated /v1/experience/open --unauthenticated /v1/observations/batch \
            --unauthenticated /v1/diagnostics/exposures/00000000-0000-4000-8000-000000000000/evidence
      - name: Upload release-${{ github.sha }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/release-${{ github.sha }}.tar
            ${{ runner.temp }}/release/release-${{ github.sha }}.tar.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Record the release identity
        env:
          ARTIFACT: ${{ steps.release.outputs.artifact }}
          BYTES: ${{ steps.release.outputs.bytes }}
        run: |
          {
            echo "### release-$GITHUB_SHA"
            echo "- event: \`$GITHUB_EVENT_NAME\` (deploy.yml uses only push runs)"
            echo "- tar sha256: \`$ARTIFACT\`"
            echo "- tar size: $BYTES bytes"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "release-$GITHUB_SHA.tar: $BYTES bytes, sha256 $ARTIFACT"
