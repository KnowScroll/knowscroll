# Worlds that run the app on this server. Live is added when the live slice lands; until then
# its two names serve placeholders (roles/caddy).
ks_worlds:
  - name: dev
    port: 4330
    database: knowscroll_test_dev
    db_role: ks_dev
    app_host: app.dev.knowscroll.space
    backend_host: backend.dev.knowscroll.space
    memory_high: 1200M
    memory_max: 1536M
    cpu_weight: 50
    cpu_quota: 100%
    oom_score_adjust: 500
    shared_pool: true
    # #199: publish real Reels as soon as they are imported, and write Scrolls from reading demand
    # (ADR-0046's Quartermaster) with MiniMax on the token plan.
    auto_publish_policy: publication-v2
    scroll_supply: true
  - name: stage
    port: 4320
    database: knowscroll_test_stage
    db_role: ks_stage
    app_host: app.stage.knowscroll.space
    backend_host: backend.stage.knowscroll.space
    memory_high: 1200M
    memory_max: 1536M
    cpu_weight: 100
    cpu_quota: 100%
    oom_score_adjust: 200
    shared_pool: true
    auto_publish_policy: publication-v2
    scroll_supply: true

ks_live_app_host: app.knowscroll.space
ks_live_backend_host: backend.knowscroll.space
ks_apex_hosts: [knowscroll.space, www.knowscroll.space]

# Services each world runs. generation follows the shared Cutroom's runs for the world (#199).
ks_world_services: [api, worker, maintenance, generation]

# The shared Reel pool (#199, ADR-0050): one Cutroom with the real providers, used by every world
# marked shared_pool, and one spend record (the knowscroll_pool database) holding their $5.
ks_cutroom_instance: pool
ks_cutroom_port: 8797
ks_cutroom_voice: English_Graceful_Lady
ks_cutroom_reel_cap: "$0.75"

# v2 (#228, D-004): v2 runs in the existing dev and stage worlds, on the same users, ports, slices
# and hosts, and replaces v1 in a world when a v2 release is deployed there. Each world listed here
# gets its own v2 database knowscroll_v2_<world> (role ks2_<world>), media folder media-v2/, env
# files and the ks2-* units (installed, never enabled here). v1 databases, media and units stay as
# they are. Live is owner-only and is never listed.
ks_v2_worlds: [dev, stage]
# #226 review m2: operator sign-in links (D-007) only for addresses on this domain, which the
# project owns and which receives no mail, so no real person's account can be opened by one.
ks_v2_operator_sign_in_pattern: "*@test.knowscroll.space"
ks_v2_db_conn_limit: 30
# Worlds whose worker runs the Personal Planner (KS_PLANNER_ENABLED=1, #236). Others keep it off.
# It spends the same MiniMax token plan as every other role and is subject to the harness caps.
ks_v2_planner_enabled_worlds: [dev]
# Worlds whose worker runs the Cartographer (KS_CARTOGRAPHER_ENABLED=1, #237): qualified reading forms
# systems, stars and planets. Same token plan and harness caps.
ks_v2_cartographer_enabled_worlds: [dev]
# The Composer policy new decisions are made under, per world (KS_COMPOSER_POLICY, v3 S-5, D-190): v0 or v1. A world not
# listed gets v0. The numbers of v1 were chosen from `composer replay-policy` on dev's stored decisions (D-190), so dev runs v1.
ks_v2_composer_policy: { dev: v1 }
# Worlds whose worker asks Jev for a semantic assessment while preparing Explore buffers
# (KS_JEV_ENABLED=1, #234). Without it, ranking uses the deterministic semantic fit.
ks_v2_jev_enabled_worlds: [dev]
# The share, in whole percent, of the global and the per-person daily model caps that background roles
# (Jev, Cartographer, Planner: they run because a person read or swiped) may use together
# (KS_REASONING_BACKGROUND_SHARE_PERCENT, #231, D-058). The rest is kept for what a person asks for: What-if,
# a room ask, request matching, Scroll production. A world not listed gets the default of 50. The caps
# themselves (300 requests a day for the world, 60 per person) stay at their defaults.
ks_v2_reasoning_background_share_percent: { dev: 50 }
# Worlds where the AI residents of a room may speak unprompted (KS_REASONING_ROOM_ENABLED=1, v3 R-2, D-162). They are paid
# by the nonpersonal 'rooms' scope with its own daily caps, and as the 'ambient' class they stay within a share of the
# world's cap, so they can never take what a person asked for. Dev raises the world's cap first (D-068): a room of three
# people and a real model make about 20 calls on a busy day, and Jev alone used 200 of the old 300.
ks_v2_room_residents_worlds: [dev]
# Worlds where the residents post finds about library assets and keep each room's memory current on a heartbeat
# (KS_ROOMS_FEED_ENABLED=1, v3 R-8, D-248). It needs the residents above. Listed nowhere by default: an operator adds a world
# once its caps are set, because each look can make a model call (a room with nothing new, nothing due or nobody listening makes none).
ks_v2_room_feed_worlds: []
ks_v2_reasoning_room_requests_per_day: { dev: 150 }
ks_v2_reasoning_room_tokens_per_day: { dev: 1500000 }
ks_v2_reasoning_ambient_share_percent: { dev: 30 }
ks_v2_reasoning_global_requests_per_day: { dev: 1000 }
ks_v2_reasoning_global_tokens_per_day: { dev: 10000000 }
# Worlds whose worker may run Scroll production (KS_REASONING_PRODUCTION_ENABLED=1, #232/#239). The
# database root `reasoning.production_scopes` must also be enabled by an operator; both default off.
ks_v2_production_enabled_worlds: [dev]
# How many shared Scroll productions Quartermaster's Create may start per UTC day, per world
# (KS_SUPPLY_CREATE_DAILY_CAP, #239, D-037). Both the API (people's requests) and the worker (the
# Planner's demand) read it; a world not listed gets 0, which turns Create off.
ks_v2_supply_create_daily_cap: { dev: 10 }
# The part of that day's work the Planner's demand may use (KS_SUPPLY_PLANNER_CREATE_DAILY_CAP). It is
# counted apart from people's requests and never exceeds the cap above, so a person's explicit ask is
# not starved by the Planner. A world not listed gets the default of 5.
ks_v2_supply_planner_create_daily_cap: { dev: 5 }
# Ask orders (a short Scroll made for one person's question, #478, D-218) that Quartermaster may make per
# UTC day, per world (KS_SUPPLY_ASK_DAILY_CAP), counted apart from every cap above. Each is one writer take of
# at most two paid requests. A world not listed gets 0, which turns ask orders off.
ks_v2_supply_ask_daily_cap: { dev: 8 }
# The ask orders one person may have made per UTC day (KS_SUPPLY_ASK_PERSON_DAILY_CAP). A world not listed gets 5.
ks_v2_supply_ask_person_daily_cap: { dev: 5 }
# Quick answers (a short unchecked answer about selected words, #480, D-253) the whole world may have per UTC day, per world
# (KS_SUPPLY_QUICK_ANSWER_DAILY_CAP). Each is one writer call and at most one repair. A world not listed gets 0, which turns them off.
ks_v2_supply_quick_answer_daily_cap: {}
# The Quick answers one person may ask per UTC day (KS_SUPPLY_QUICK_ANSWER_PERSON_DAILY_CAP). A world not listed gets 10.
ks_v2_supply_quick_answer_person_daily_cap: {}
# Branches of content threads (a what-if or another perspective, #244, D-049) that Quartermaster may
# order per UTC day, per world (KS_SUPPLY_SCENARIO_DAILY_CAP), counted apart from the caps above. Each is
# one writer call and at most one repair. A world not listed gets 0, which turns scenario Create off.
ks_v2_supply_scenario_daily_cap: { dev: 6 }
# The branches one thread may have ordered per UTC day (KS_SUPPLY_SCENARIO_THREAD_DAILY_CAP, D-158). A world not listed gets 5.
ks_v2_supply_scenario_thread_daily_cap: { dev: 5 }
# Per-process memory for the v2 units, inside the world's slice (MemoryMax 1536M above).
ks_v2_services:
  api: { memory_high: 600M, memory_max: 800M }
  worker: { memory_high: 450M, memory_max: 600M }

# Backups (#228, docs/v2/operations/backups.md): nightly pg_dump of every v2 database and the shared
# pool into /srv/knowscroll/backups, kept 14 days; a weekly restore check of the newest dumps.
ks_backup_keep_days: 14

