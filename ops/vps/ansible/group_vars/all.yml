# Worlds that run the app on this server. Live is added when the live slice lands; until then
# its two names serve placeholders (roles/caddy).
ks_worlds:
  - name: dev
    port: 4330
    database: knowscroll_test_dev
    db_role: ks_dev
    app_host: app.dev.knowscroll.space
    backend_host: backend.dev.knowscroll.space
    memory_high: 1200M
    memory_max: 1536M
    cpu_weight: 50
    cpu_quota: 100%
    oom_score_adjust: 500
    shared_pool: true
    # #199: publish real Reels as soon as they are imported, and write Scrolls from reading demand
    # (ADR-0046's Quartermaster) with MiniMax on the token plan.
    auto_publish_policy: publication-v2
    scroll_supply: true
  - name: stage
    port: 4320
    database: knowscroll_test_stage
    db_role: ks_stage
    app_host: app.stage.knowscroll.space
    backend_host: backend.stage.knowscroll.space
    memory_high: 1200M
    memory_max: 1536M
    cpu_weight: 100
    cpu_quota: 100%
    oom_score_adjust: 200
    shared_pool: true
    auto_publish_policy: publication-v2
    scroll_supply: true

ks_live_app_host: app.knowscroll.space
ks_live_backend_host: backend.knowscroll.space
ks_apex_hosts: [knowscroll.space, www.knowscroll.space]

# Services each world runs. generation follows the shared Cutroom's runs for the world (#199).
ks_world_services: [api, worker, maintenance, generation]

# The shared Reel pool (#199, ADR-0050): one Cutroom with the real providers, used by every world
# marked shared_pool, and one spend record (the knowscroll_pool database) holding their $5.
ks_cutroom_instance: pool
ks_cutroom_port: 8797
ks_cutroom_voice: English_Graceful_Lady
ks_cutroom_reel_cap: "$0.75"

# v2 (#228, D-004): v2 runs in the existing dev and stage worlds, on the same users, ports, slices
# and hosts, and replaces v1 in a world when a v2 release is deployed there. Each world listed here
# gets its own v2 database knowscroll_v2_<world> (role ks2_<world>), media folder media-v2/, env
# files and the ks2-* units (installed, never enabled here). v1 databases, media and units stay as
# they are. Live is owner-only and is never listed.
ks_v2_worlds: [dev, stage]
ks_v2_db_conn_limit: 30
# Per-process memory for the v2 units, inside the world's slice (MemoryMax 1536M above).
ks_v2_services:
  api: { memory_high: 600M, memory_max: 800M }
  worker: { memory_high: 450M, memory_max: 600M }

# Backups (#228, docs/v2/operations/backups.md): nightly pg_dump of every v2 database and the shared
# pool into /srv/knowscroll/backups, kept 14 days; a weekly restore check of the newest dumps.
ks_backup_keep_days: 14

# Deploy keys (public halves only; the private halves live in GitHub environment secrets). Each is
# pinned to one world by the SSH gate (ops/vps/gate.sh).
