# Node 22 from NodeSource: Ubuntu 26.04 ships 22.22.1 and KnowScroll requires >=22.23.0 <23.

- name: NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: NodeSource repository (Node 22)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://deb.nodesource.com/node_22.x
      Suites: nodistro
      Components: main
      Signed-By: /etc/apt/keyrings/nodesource.asc

- name: Prefer NodeSource's nodejs over Ubuntu's
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nodesource
    mode: "0644"
    content: |
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 600

- name: Node.js
  ignore_errors: "{{ ansible_check_mode }}"  # a preview never adds the repository, so the package is unknown
  ansible.builtin.apt:
    name: nodejs
    state: latest  # noqa package-latest -- stays within the pinned 22.x line
    update_cache: true

- name: Node meets the repository's engines range
  ansible.builtin.command: node -e "const [a,b]=process.versions.node.split('.').map(Number); process.exit(a===22&&b>=23?0:1)"
  changed_when: false
  when: not ansible_check_mode
