# v2 in the existing dev and stage worlds (#228, D-004, docs/v2/operations/environments.md).
# Adds, per world in ks_v2_worlds: a service user of its own (ks2-<world>), a database and role of
# its own, a root-only database secret generated on the server, a root-only settings file, a media
# folder, and the ks2-* units. Nothing here touches a v1 database, role, env file, media folder or
# unit, and nothing is started or enabled: `ks deploy` enables ks2-world@<world>.target when it
# deploys a v2 release to the world.

- name: V2 is only for dev and stage (live is owner-only)
  ansible.builtin.assert:
    that: ks_v2_worlds | difference(['dev', 'stage']) | length == 0
    fail_msg: ks_v2_worlds may name only dev and stage; live stays untouched.
    quiet: true

- name: The v2 worlds, with their v1 settings (port, host, OOM score)
  ansible.builtin.set_fact:
    ks_v2_world_list: "{{ ks_worlds | selectattr('name', 'in', ks_v2_worlds) | list }}"

# #226 review m6: v2 programs run as their own user, never v1's ks-<world>, so they cannot read
# v1's settings (/etc/knowscroll/<world>.env is 0640 root:ks-<world> and embeds the AgentMail key
# and v1's database password), v1's media or anything else ks-<world> may read. Not in ks-pool:
# v2 does not reach the shared Reel pool.
- name: V2 service groups
  ansible.builtin.group:
    name: ks2-{{ item.name }}
    system: true
  loop: "{{ ks_v2_world_list }}"
  loop_control:
    label: ks2-{{ item.name }}

- name: V2 service users (no login, no home of their own, in no other group)
  ignore_errors: "{{ ansible_check_mode }}"  # a preview never creates the group
  ansible.builtin.user:
    name: ks2-{{ item.name }}
    group: ks2-{{ item.name }}
    system: true
    shell: /usr/sbin/nologin
    home: /srv/knowscroll/{{ item.name }}
    create_home: false
  loop: "{{ ks_v2_world_list }}"
  loop_control:
    label: ks2-{{ item.name }}

- name: V2 secret folders (root only)
  ansible.builtin.file:
    path: /etc/knowscroll/secrets/v2-{{ item.name }}
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ ks_v2_world_list }}"
  loop_control:
    label: v2-{{ item.name }}

# Generated on the server once and never sent anywhere; Ansible reads it only with no_log.
- name: V2 database passwords exist
  ansible.builtin.shell: |
    set -eu
    umask 077
    f=/etc/knowscroll/secrets/v2-{{ item.name }}/db_password
    [ -s "$f" ] || { openssl rand -hex 24 > "$f"; echo created; }
  loop: "{{ ks_v2_world_list }}"
  loop_control:
    label: v2-{{ item.name }}
  register: ks_v2_secrets
  changed_when: "'created' in ks_v2_secrets.stdout"

- name: Read v2 database passwords
  ansible.builtin.slurp:
    src: /etc/knowscroll/secrets/v2-{{ item.name }}/db_password
  loop: "{{ ks_v2_world_list }}"
  loop_control:
    label: v2-{{ item.name }}
  register: ks_v2_db_passwords
  no_log: true
  when: not ansible_check_mode

# Skipped in a preview: in check mode this module runs CREATE ROLE and rolls it back, which is not
# read-only (the v1 role task is skipped the same way).
- name: V2 database roles (no superuser, no createdb, no createrole; bounded connections)
  community.postgresql.postgresql_user:
    name: ks2_{{ item.name }}
    password: "{{ ks_v2_db_passwords.results[ks_index].content | b64decode | trim }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE
    conn_limit: "{{ ks_v2_db_conn_limit }}"
  loop: "{{ ks_v2_world_list }}"
  loop_control:
    index_var: ks_index
    label: ks2_{{ item.name }}
  become: true
  become_user: postgres
  no_log: true
  when: not ansible_check_mode

# In a preview this only reads pg_database and reports whether the database would be created.
- name: V2 databases, each owned by its world's v2 role (pg-boss creates its schema there)
  ignore_errors: "{{ ansible_check_mode }}"  # the role does not exist in a preview
  community.postgresql.postgresql_db:
    name: knowscroll_v2_{{ item.name }}
    owner: ks2_{{ item.name }}
    encoding: UTF8
  loop: "{{ ks_v2_world_list }}"
  loop_control:
    label: knowscroll_v2_{{ item.name }}
  become: true
  become_user: postgres

- name: Only a world's own v2 role may connect to its v2 database; its queries are bounded
  community.postgresql.postgresql_query:
    login_db: postgres
    query: |
      REVOKE CONNECT ON DATABASE knowscroll_v2_{{ item.name }} FROM PUBLIC;
      GRANT CONNECT ON DATABASE knowscroll_v2_{{ item.name }} TO ks2_{{ item.name }};
      ALTER ROLE ks2_{{ item.name }} SET statement_timeout = '30s';
  loop: "{{ ks_v2_world_list }}"
  loop_control:
    label: knowscroll_v2_{{ item.name }}
  become: true
  become_user: postgres
  changed_when: false
  when: not ansible_check_mode

- name: V2 database secret, assembled on the server (root only; values never reach Ansible output)
  ansible.builtin.shell: |
    set -eu
    umask 077
    d=/etc/knowscroll/secrets/v2-{{ item.name }}
    f=$d/database.env
    tmp=$(mktemp "$d/.database.env.XXXXXX")
    {
      echo "# Managed by ops/vps/ansible (#228). Root only; systemd and ks read it for the v2 units."
      echo "DATABASE_URL=postgresql://ks2_{{ item.name }}:$(cat $d/db_password)@127.0.0.1:5432/knowscroll_v2_{{ item.name }}"
    } > "$tmp"
    chmod 0600 "$tmp"
    if cmp -s "$tmp" "$f"; then rm -f "$tmp"; echo KS_SAME; else mv "$tmp" "$f"; echo KS_UPDATED; fi
  loop: "{{ ks_v2_world_list }}"
  loop_control:
    label: v2-{{ item.name }}
  register: ks_v2_envs
  changed_when: "'KS_UPDATED' in ks_v2_envs.stdout"
  no_log: true
  when: not ansible_check_mode

# Root only (#226 review m6): systemd and ks read it as root and hand the programs its values as
# their environment; no service user reads files under /etc/knowscroll.
- name: V2 settings (no secrets; root only)
  ansible.builtin.copy:
    dest: /etc/knowscroll/{{ item.name }}.v2.env
    owner: root
    group: root
    mode: "0600"
    content: |
      # KnowScroll v2 settings for world {{ item.name }} — managed by ops/vps/ansible (#228).
      # No secrets here: DATABASE_URL is in /etc/knowscroll/secrets/v2-{{ item.name }}/database.env.
      KS_WORLD={{ item.name }}
      PORT={{ item.port }}
      NODE_ENV=production
      KS_MEDIA_ROOT=/srv/knowscroll/{{ item.name }}/media-v2
      KS_PUBLIC_ORIGIN=https://{{ item.app_host }}
      # Sign-in (S1.3, D-007): mail through AgentMail (the key is in secrets/shared/agentmail.env,
      # read by systemd for the API unit only), and operator links for disposable test accounts,
      # only for addresses matching the pattern (checked when a link is issued and when it is
      # redeemed). This role serves dev and stage only; the API and the operator command refuse
      # operator sign-in in every world but dev, stage, ci and local.
      # KS_NATIVE_SIGN_IN_BINDING stays unset (off) until the native app ships (#226 re-review N1).
      KS_MAIL_SENDER=agentmail
      KS_ALLOW_OPERATOR_SIGN_IN=1
      KS_OPERATOR_SIGN_IN_PATTERN={{ ks_v2_operator_sign_in_pattern }}
      # Worker only: runs the Personal Planner after material evidence changes (#236).
      KS_PLANNER_ENABLED={{ '1' if item.name in ks_v2_planner_enabled_worlds else '0' }}
  loop: "{{ ks_v2_world_list }}"
  loop_control:
    label: "{{ item.name }}.v2.env"

# Recursive: media written before the move to ks2-<world> (if any) moves with the folder.
- name: V2 media folders (KS_MEDIA_ROOT), private to the world's v2 user; v1 media is left alone
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.file:
    path: /srv/knowscroll/{{ item.name }}/media-v2
    state: directory
    recurse: true
    owner: ks2-{{ item.name }}
    group: ks2-{{ item.name }}
    mode: "u=rwX,g=rX,o="
  loop: "{{ ks_v2_world_list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Tool folder
  ansible.builtin.file:
    path: /usr/local/lib/knowscroll-ops
    state: directory
    mode: "0755"

- name: The v2 program launcher (runs what a release's release.json names)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../tool/ks2-run.sh"
    dest: /usr/local/lib/knowscroll-ops/ks2-run
    mode: "0755"

# S2.2 (D-021): ks2-worker@ reads the token-plan key from the shared MiniMax file and sets
# KS_REASONING_PROVIDER=minimax. A missing file stops the worker unit; a key of the wrong shape
# makes the worker exit with config.invalid, which takes its other consumers (evidence apply, the
# identity and reasoning sweeps) down with it. So the unit is installed only when the file is
# there and defines the key in the token-plan shape. The test returns only ok or bad: the value
# is never printed, never registered with output, never logged.
- name: MiniMax settings are on the server (the v2 worker unit reads them; copied once from the owner's Mac, never in Git)
  ansible.builtin.stat:
    path: /etc/knowscroll/secrets/shared/minimax.env
  register: ks_v2_minimax

- name: Refuse to install the worker unit without them
  ansible.builtin.fail:
    msg: >-
      /etc/knowscroll/secrets/shared/minimax.env is missing. ks2-worker@ reads the token-plan
      MINIMAX_API_KEY from it (S2.2) and would not start, taking its other consumers with it; copy
      the file once from the owner's Mac (root, 0600, never printed) and run this role again.
      See docs/v2/operations/environments.md.
  when: not ks_v2_minimax.stat.exists and not ansible_check_mode

- name: The file defines MINIMAX_API_KEY as a token-plan key (returns only ok or bad; the value is never printed)
  ansible.builtin.shell: |
    set -eu
    if grep -Eq "^(export[[:space:]]+)?MINIMAX_API_KEY=[\"']?sk-cp-[A-Za-z0-9_-]{16,}[\"']?[[:space:]]*\$" /etc/knowscroll/secrets/shared/minimax.env; then
      echo ok
    else
      echo bad
    fi
  register: ks_v2_minimax_shape
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Refuse to install the worker unit with a missing or malformed key
  ansible.builtin.fail:
    msg: >-
      /etc/knowscroll/secrets/shared/minimax.env does not define MINIMAX_API_KEY as a token-plan
      key (sk-cp-…, 16 or more characters after the prefix). The worker would exit with
      config.invalid. Fix the file on the server (never print its contents) and run this role again.
  when: not ansible_check_mode and ks_v2_minimax_shape.stdout != 'ok'

- name: V2 units (the instance name is the world; installed, not enabled)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - ks2-api@.service
    - ks2-worker@.service
    - ks2-world@.target
  notify: Reload systemd for v2

- name: Drop-in folders for each world's v2 services
  ansible.builtin.file:
    path: /etc/systemd/system/ks2-{{ item.1 }}@{{ item.0.name }}.service.d
    state: directory
    mode: "0755"
  loop: "{{ ks_v2_world_list | product(ks_v2_services | list) | list }}"
  loop_control:
    label: ks2-{{ item.1 }}@{{ item.0.name }}

- name: Under memory pressure v2 dies in the same order as v1 (dev first, never Postgres)
  ansible.builtin.copy:
    dest: /etc/systemd/system/ks2-{{ item.1 }}@{{ item.0.name }}.service.d/oom.conf
    mode: "0644"
    content: |
      [Service]
      OOMScoreAdjust={{ item.0.oom_score_adjust }}
  loop: "{{ ks_v2_world_list | product(ks_v2_services | list) | list }}"
  loop_control:
    label: ks2-{{ item.1 }}@{{ item.0.name }}
  notify: Reload systemd for v2
