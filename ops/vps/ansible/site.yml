# KnowScroll server: one machine, worlds dev/stage/live (#201, docs/plans/environments); v2 releases
# in dev and stage (#228, docs/v2/operations/environments.md).
- name: KnowScroll server
  hosts: knowscroll-vps
  become: false
  roles:
    - base
    - postgres
    - node
    - caddy
    - worlds
    - worlds_v2
    - cutroom
    - ops-tools
    - backups
