  { id: 'behaviour', group: 'Guidelines', name: 'Behaviour', render: () => `<div class="doc"><span class="kick">Guidelines</span><h1>Behaviour</h1>
    <p class="lede">How people move through the universe. Every level has one back step, every pick shows a card before going in, and the place you were last is always marked.</p>
    <h2>The way down</h2><div class="card"><div class="flow">
      <span class="n">Your universe<small>U01 Overview</small></span><span class="a">tap system</span><span class="n">System card<small>U08 Far</small></span><span class="a">Open system</span>
      <span class="n">System<small>U02</small></span><span class="a">tap planet</span><span class="n">Planet<small>U03 globe</small></span><span class="a">tap region</span>
      <span class="n">Region card<small>U04</small></span><span class="a">Open</span><span class="n">Encounter<small>Reel / Scroll</small></span><span class="a">back</span><span class="n">You were here<small>U04</small></span></div></div>
    <h2>Interactions</h2><table class="spec"><tr><th>Where</th><th>Input</th><th>Result</th></tr>
      <tr><td>Overview</td><td>Tap a system</td><td>Camera flies in (2.4 s); the system card opens. “Return to …” jumps back to the last planet.</td></tr>
      <tr><td>Overview</td><td>Lately</td><td>Lens on: quiet systems go calm (grey, no bloom), labels at 50%; “Everything is where you left it.” after time away.</td></tr>
      <tr><td>U03 Planet</td><td>Drag · tap</td><td>Drag rotates the globe. A tap enters the world: Enter a world plays and lands on the map at planet level, nothing picked.</td></tr>
      <tr><td>U04 Map</td><td>Tap a region</td><td>Camera drops about 2× over it and centres it above the card; the rest dims. Close returns to planet level.</td></tr>
      <tr><td>After an encounter</td><td>Back</td><td>Region keeps the orange marker and “you were here” until another is chosen.</td></tr>
      <tr><td>Any level</td><td>Back pill</td><td>Goes exactly one level up and names that level.</td></tr>
      <tr><td>Search</td><td>Type</td><td>On-device only. Results ranked best first; Enter or tap flies to the place; Back returns to where you were looking.</td></tr>
      <tr><td>List view</td><td>Orbit dial</td><td>Touch the system row to open the wheel; turn to browse; let go to choose. The planet at the top of the dial grows; tap it to land.</td></tr>
      <tr><td>Simple drawing</td><td>Switch on</td><td>The tab becomes two plain lists: systems with planets, then countries in a planet. Positions and names stay the same.</td></tr>
      <tr><td>Friend visit</td><td>Open a friend</td><td>Visitor bar replaces the title, Leave first. Only search; no Lately, stations or ships. Only what they share.</td></tr>
      <tr><td>Offline</td><td>No connection</td><td>Stars keep drifting; message with Refresh map and Go to Explore. Same layout for “no longer available” and “couldn’t draw”.</td></tr>
      <tr><td>New place fails</td><td>Formation can’t load</td><td>A quiet notice above the chips with one Refresh; the map stays usable.</td></tr>
      <tr><td>Desktop</td><td>Keys</td><td>Arrows pan · + − zoom · / search · Esc back up a level. Picks dock in the panel instead of covering the map.</td></tr></table>
    <h2>Transitions</h2><table class="spec"><tr><th>Step</th><th>Animation</th><th>Lands on</th></tr>
      <tr><td>First time the account opens the tab</td><td>First open (once per account, ever)</td><td>U01 Empty</td></tr>
      <tr><td>Open a system</td><td>Enter a system</td><td>U02 System</td></tr>
      <tr><td>Tap a planet in U02</td><td>Enter a planet; Enter a ringed planet when it has rings or a moon</td><td>U03 Planet</td></tr>
      <tr><td>Tap the globe in U03</td><td>Enter a world</td><td>U04 map at planet level, nothing highlighted</td></tr>
      <tr><td>Tap a region on the map</td><td>U04 region drop (camera about 2× over it)</td><td>U04 Region card</td></tr>
      <tr><td>Back</td><td>Not designed yet: a 0.3 s cross-fade</td><td>One level up</td></tr></table>
    <h2>States</h2><table class="spec"><tr><th>State</th><th>How it shows</th></tr>
      <tr><td>Current tab</td><td>White on a 13% white fill (tab bar) · bold word + yellow dot (desktop rail, plain menus)</td></tr>
      <tr><td>Picked</td><td>Soft pulsing yellow glow on the map; Paper 2 row in lists; card docked or open</td></tr>
      <tr><td>Where you are</td><td>“You are here” on the system heading (desktop), Looking-here row in outlines</td></tr>
      <tr><td>Where you were</td><td>Orange dot and marker on maps and planet rows; highlight row with rippling red dot in simple views</td></tr>
      <tr><td>Search match</td><td>Matched letters on Highlight; best match on Paper 2</td></tr>
      <tr><td>Quiet</td><td>Calm systems under Lately: glow × .22, labels 50%</td></tr></table></div>` },

  { id: 'animations', group: 'Guidelines', name: 'Animations', render: () => `<div class="doc"><span class="kick">Guidelines</span><h1>Animations</h1>
    <p class="lede">Five finished animations: the first time the tab opens, and the three ways down (into a system, into a planet, into its world), with a version of the planet entry for planets that have rings or a moon. Each one starts on a final screen and ends exactly on the next one, so in the app it is a camera move between two screens you already build, not a separate scene. Every value below is the one in the finalized file; open the file to scrub it frame by frame (each has a scrubber, slow motion, a storyboard and a beats table).</p>

    <h2>At a glance</h2><table class="spec"><tr><th>Animation</th><th>When it plays</th><th>From → to</th><th>Length</th><th>File</th></tr>
      <tr><td><b>First open</b></td><td>The very first time the account opens the Universe tab. Once in the lifetime of the account.</td><td>Black → U01 Empty</td><td>21.2 s, Skip always there</td><td><a href="animations/open-finalized.html" target="_blank"><code>animations/open-finalized.html</code></a></td></tr>
      <tr><td><b>Enter a system</b></td><td>Opening a system: Open system on the system card, or choosing a system in search or the orbit dial.</td><td>U01 Overview → U02 System</td><td>5.3 s (chrome in by 5.1)</td><td><a href="animations/enter-system-finalized.html" target="_blank"><code>animations/enter-system-finalized.html</code></a></td></tr>
      <tr><td><b>Enter a planet</b></td><td>Tapping a planet in U02 (or choosing a planet while its system is on screen).</td><td>U02 System → U03 Planet</td><td>4.0 s (glide 3.0 s)</td><td><a href="animations/enter-planet-finalized.html" target="_blank"><code>animations/enter-planet-finalized.html</code></a></td></tr>
      <tr><td><b>Enter a ringed planet</b></td><td>Same as Enter a planet, when the planet has rings or a moon (Hardware, Storage, Queues; any moon).</td><td>U02 System → U03 Planet with its ring and moon</td><td>4.0 s (glide 3.0 s)</td><td><a href="animations/enter-planet-rings-finalized.html" target="_blank"><code>animations/enter-planet-rings-finalized.html</code></a></td></tr>
      <tr><td><b>Enter a world</b></td><td>Tapping the globe in U03.</td><td>U03 Planet → U04 map at planet level</td><td>3.2 s</td><td><a href="animations/enter-world-finalized.html" target="_blank"><code>animations/enter-world-finalized.html</code></a></td></tr></table>
    <p class="note" style="margin-top:10px">All five also play on the Screens page (last five tabs). In the files, add <code>#t=2.4</code> to the address to freeze on a moment.</p>

    <h2>Why they exist</h2><div class="grid g3">
      <div class="card"><b>The universe begins</b><p>First open: dust gathers into a star that bursts, and you travel through a newborn universe into your own empty one. It explains the idea without words: this place grows from what you watch and read.</p></div>
      <div class="card"><b>Going down is travel</b><p>Each step down is a journey, not a cut, so you always know where you came from: a ship flies you into a system, you glide down onto a planet, and the planet opens out into its world.</p></div>
      <div class="card"><b>The next view comes into focus</b><p>The destination is never swapped in at the end. It is already there on the way and gets clearer as you arrive, then the chrome rises in on top.</p></div></div>

    <h2>Rules for all of them</h2><table class="spec"><tr><th>Rule</th><th>Detail</th></tr>
      <tr><td>A pure function of time</td><td>Every value (camera, objects, chrome) is computed from one time value <code>t</code>, never stepped frame by frame. That is what makes them scrubbable, testable and frame-rate independent. Advance <code>t</code> by real elapsed time (clamped to 0.1 s per frame so a hitch never jumps the story).</td></tr>
      <tr><td>Start and end exactly on the screens</td><td>The first frame is the screen you tapped on (same camera, same drift, same stars); the last frame is the destination screen exactly as finalized. Hand over to the live screen with no visible change.</td></tr>
      <tr><td>The tab bar never moves</td><td>It stays, untouched, through every animation. Everything else fades out in about 0.3 s at the start.</td></tr>
      <tr><td>Destination chrome rises in last</td><td>Header first, then title, then the bottom actions, each 0.45–0.6 s, 0.1 s apart, rising 8–10 px (the card rises 26 px). Labels in the scene fade in, they do not move.</td></tr>
      <tr><td>Tap ring</td><td>The tap that starts a transition shows one ring where you touched: 30 px, 2 px Paper outline, scale 1 → 3.2 with ease-out, opacity .9 → 0 over 0.5–0.6 s. It tracks the tapped object.</td></tr>
      <tr><td>Input while playing</td><td>Not designed as interruptible. Recommended: ignore taps while a transition plays; Back (or the system back gesture) jumps to the end frame and then goes back as normal. First open has its own Skip.</td></tr>
      <tr><td>Reduced motion</td><td>With prefers-reduced-motion (or the OS setting), none of them play: show the destination screen straight away.</td></tr>
      <tr><td>Simple drawing</td><td>In Simple drawing mode (slow devices) there is no 3D and no animation: plain lists only.</td></tr>
      <tr><td>Frame rate</td><td>One render loop, at most every 33 ms (30 fps), as everywhere in the tab. Pixel ratio capped at 1.5.</td></tr>
      <tr><td>Easing</td><td>Smooth starts and smooth stops only: smoothstep and smootherstep (6x⁵ − 15x⁴ + 10x³), ease-out cubic for things that appear. Distances that shrink a lot move on a log curve (d₀ · (d₁ / d₀)^e) so speed feels even from far to near. No springs, no bounce.</td></tr>
      <tr><td>No sound, no haptics</td><td>None were designed.</td></tr></table>

    <h2>1 · First open</h2>
    <p><b>When:</b> once in the lifetime of the account: the first time that account ever opens the Universe tab, on any device. Keep the seen flag on the account (synced across devices, kept through reinstalls) and set it when it starts, so a crash or a closed app never replays it; Skip and finishing both count as seen. <b>Ends on:</b> U01 Empty, camera (0, 4, 30) looking at the origin, sky seed <code>skyempty</code>, drift 1.6.</p>
    <table class="spec"><tr><th>Time</th><th>Beat</th><th>What happens</th></tr>
      <tr><td>0–4.9 s</td><td>Dust streams in</td><td>14,000 candy grains (pink, violet, a few warm) stream in from off screen along the five Emerging spiral arms. The camera starts 46 units out and creeps to 26 while circling about 18°, so it reads in depth.</td></tr>
      <tr><td>1.6–4.9 s</td><td>The star forms</td><td>The star grows with the share of dust that has arrived: a painted orange ball (moving cells, limb darkening, key light) inside the approved atmosphere rim, glow and bloom. It floats. 2,600 four-point sparkles appear at an increasing rate.</td></tr>
      <tr><td>4.9–5.9 s</td><td>About to blow</td><td>A gentle tremble that builds (camera shake ≤ .05), then a squeeze in the last 0.22 s.</td></tr>
      <tr><td>5.9 s</td><td>Bang</td><td>Warm flash (0.6 s), two shock rings (warm, then pink), dust and sparkles burst outwards, the stars switch on.</td></tr>
      <tr><td>6.0–13.9 s</td><td>Travel</td><td>A long cruise with 14 pass-bys: 5 planets, 4 galaxies, 3 asteroid belts, the pink nebula, 2 systems. Stars stretch into short streaks.</td></tr>
      <tr><td>13.9–16.9 s</td><td>Towards light speed</td><td>A smooth 3 s build: 1,500 streaks with bright heads come straight at you; the field of view widens to +34°.</td></tr>
      <tr><td>16.9–17.5 s</td><td>Light speed</td><td>Hold.</td></tr>
      <tr><td>17.5–20.0 s</td><td>Drop out</td><td>A smooth stop: speed × f(u) = (1 − u)³(1 + 3u), and streak speed and field of view follow the same curve. A faint radial blink (.22).</td></tr>
      <tr><td>19.6–21.2 s</td><td>Empty universe</td><td>Lands exactly on U01 Empty; title, line and Go to Explore rise in. Skip (top right) fades out just before.</td></tr></table>
    <p class="note" style="margin-top:10px">Build: one 3D scene, camera on one straight path of 2,765 units; speed is integrated from the speed curve so the path ends exactly on the U01 Empty camera. The pass-bys use the approved builders (makePlanet, makeSystem, halo, toonNebula). Skip jumps to 0.05 s before arrival.</p>

    <h2>2 · Enter a system</h2>
    <p><b>When:</b> a system is opened from your universe. <b>Why:</b> a little ship takes you there, so going down a level feels like a trip. <b>Ends on:</b> U02 System, camera (0, 34, 52) → (0, −.6, 0), drift .6, with the U02 ship parked by its planet.</p>
    <table class="spec"><tr><th>Time</th><th>Beat</th><th>What happens</th></tr>
      <tr><td>0–0.4 s</td><td>Tap</td><td>Tap ring on the system; overview header, chips and names fade (0.05–0.45 s).</td></tr>
      <tr><td>0.4–1.45 s</td><td>Launch</td><td>A small rocket rises in from under the bottom edge, close to the camera, engine lit, and leads the way; the camera starts to swing after it.</td></tr>
      <tr><td>1.45–2.25 s</td><td>Closer look</td><td>The overview drawing cross-fades to the detailed U02 drawing. They line up because U02 is the overview scaled about the system (K = U02 sun radius ÷ overview sun radius, 1.7 ÷ .78 = 2.18 for Machine learning), so the sun stays the same size and place.</td></tr>
      <tr><td>2.25–4.4 s</td><td>Swing in</td><td>From 2.55 s the rocket pulls ahead and parks beside the planet where U02 keeps its ship; the camera swings round and settles.</td></tr>
      <tr><td>4.35–5.3 s</td><td>U02 System</td><td>The rocket swaps for the U02 ship (0.3 s scale cross-over). Back chip, title and List view rise in (4.35–5.1 s); planet names fade in (4.3–4.9 s).</td></tr></table>
    <table class="spec" style="margin-top:14px"><tr><th>Part</th><th>Values</th></tr>
      <tr><td>Camera</td><td>On a sphere round the system, from the overview pose to the U02 pose: radius r₀ · (r₁/r₀)^e, elevation lerp − .14 · sin(πe), yaw lerp − .5 · sin(πe), e = smootherstep over 0.35–4.6 s. Field of view 38 + 4 · sin(πe). Drift blends from overview (.9 × K) to U02 (.6).</td></tr>
      <tr><td>Rocket</td><td>Primitives with the planet shader (so it is lit like the worlds): white body #FAF8F0, orange nose, band and three fins #FF8A3D, blue window #3D8BEA with a #EDE6D6 rim, nozzle #566962. About 1 unit long, drawn at .42 world units. A key light sits up and to the left of the camera so the ship always reads.</td></tr>
      <tr><td>Rocket path</td><td>Rises in camera space from (.34, −1.85, −2.7) to (.06, −.42, −4.6) over 1.1 s (ease-out) with a small bob, seen three-quarters from behind. From 2.55 s it follows a cubic Bézier to the dock (planet + (.75, .6, 0)), progress smoothstep^0.7 (eases off, then a long glide in). Drawn up to 2.5× larger mid-flight so it stays readable, back to true size when parked.</td></tr>
      <tr><td>Exhaust</td><td>Two short additive cones out of the nozzle, no trail: outer flame r .10 → .02, length .72 ship lengths, orange → soft pink tip; hot core r .062 → .01, length .40, white → yellow. Dense at the nozzle, fading to the tip. A little physics: calm flicker (±3.5 %), length grows with thrust and forward acceleration, the tip leans a little on turns (sideways acceleration, capped at .1). Dims and shortens as it parks.</td></tr>
      <tr><td>Two renders</td><td>Overview scene and U02 scene render separately and cross-fade (overview on top, fading out). Draw only the one(s) visible.</td></tr></table>

    <h2>3 · Enter a planet</h2>
    <p><b>When:</b> a planet is tapped in U02. <b>Why:</b> one calm glide down to the planet, and on the way it turns into its world. <b>Ends on:</b> U03 Planet: globe centred at y 372, radius 146 px, back pill, name, hint and chips.</p>
    <table class="spec"><tr><th>Time</th><th>Beat</th><th>What happens</th></tr>
      <tr><td>0–0.15 s</td><td>Tap</td><td>Tap ring on the planet; system header, chips and names fade (0.03–0.3 s).</td></tr>
      <tr><td>0.15–1.05 s</td><td>Set off</td><td>The camera turns onto the planet and glides in; the sun, the station and the other worlds slide away. The parked U02 ship shrinks away (first 0.6 s), or it would be a spike up close.</td></tr>
      <tr><td>1.05–3.06 s</td><td>Coming into focus</td><td>Still gliding. The U03 globe fades in exactly on the 3D planet (same place, same size), blurred at first and sharper as you near it; the planet’s atmosphere and the sun’s bloom ease down; near the end the U03 starfield comes in.</td></tr>
      <tr><td>3.06–3.15 s</td><td>Land</td><td>Soft landing, globe sharp, exactly where U03 has it.</td></tr>
      <tr><td>3.05–4.0 s</td><td>U03 Planet</td><td>Back pill, name, hint and chips rise in. Then it is the live globe.</td></tr></table>
    <table class="spec" style="margin-top:14px"><tr><th>Part</th><th>Values</th></tr>
      <tr><td>Glide</td><td>Progress x over 0.15–3.15 s. Distance to the planet d₀ · (D / d₀)^e with e = smootherstep(x^0.82) (soft landing). The view direction turns from the U02 one to the final one with smootherstep(1.6x); the aim turns onto the planet with smootherstep(1.35x). Field of view 38 + 4 · sin²(πe).</td></tr>
      <tr><td>Final framing</td><td>D = 8.455 × planet radius, looking .0408 · D below the planet centre. That puts the planet at y 372 with a 146 px radius at field of view 38 on a 390 × 844 screen, which is exactly the U03 globe. View line: normalize(.7 · toward the sun + .45 · up + .55 · side), so the planet is mostly lit, a little from above.</td></tr>
      <tr><td>Globe overlay</td><td>Every frame: project the planet centre and radius; place the U03 globe there, scaled by projected radius ÷ 146. Opacity smoothstep(.3, .97, x); blur 6 px × (1 − opacity), on the 292 px globe only. U03 stars: smoothstep(.72, 1, x).</td></tr>
      <tr><td>Close-up</td><td>As the camera nears (log of distance from 30 to D): atmosphere strength 1.15 → .32, sun bloom × .25, sun inner glow × .4. Otherwise the planet washes out up close.</td></tr></table>

    <h2>3b · Enter a planet with rings or a moon</h2>
    <p><b>When:</b> instead of Enter a planet, whenever the tapped planet has rings, a moon, or both (in the sample universe: Hardware has both; Storage and Queues have rings; Attention and Tactics have a moon). <b>Why:</b> the 3D ring and moon do not look like the flat U03 ring and moon (the 3D ring is wider, banded and tilted differently; the 3D moon is bigger and orbits on its own). A plain cross-fade looked like the planet lost its rings and kept a small one, and the 3D moon slipped behind the planet at random. So the 3D ones are turned into the U03 ones on the way in, and only hand over once they match. <b>Ends on:</b> U03 Planet with its rings (back and front) and its moon on the U03 orbit.</p>
    <table class="spec"><tr><th>Time</th><th>Beat</th><th>What happens</th></tr>
      <tr><td>0–3.15 s</td><td>The glide</td><td>Exactly as Enter a planet: same camera, same timings, same globe coming into focus, same chrome.</td></tr>
      <tr><td>0.15–1.5 s</td><td>Moon to its place</td><td>From the start of the glide the 3D moon leaves its own orbit and heads for the spot where the U03 moon will be, always on the near side of the planet, so it never ducks behind it.</td></tr>
      <tr><td>0.8–2.8 s</td><td>Ring turns into the U03 ring</td><td>The 3D ring’s band narrows to the U03 ring’s width and it tilts to the U03 angle, following the camera; the U03 ring fades in on top of it, blurred to sharp, with the globe.</td></tr>
      <tr><td>2.55–3.06 s</td><td>Hand over</td><td>The 3D ring and moon, now lying on the U03 ones, fade out; the moon has shrunk to the U03 size.</td></tr>
      <tr><td>3.05–4.0 s</td><td>U03 Planet</td><td>Chrome rises in as in Enter a planet. The U03 moon carries on round its orbit (behind the globe on the far side).</td></tr></table>
    <table class="spec" style="margin-top:14px"><tr><th>Part</th><th>Values</th></tr>
      <tr><td>Ring band</td><td>The ring shader’s inner and outer radii go from 1.4 / 2.4 planet radii to 1.42 / 1.56 (the U03 ring: a 13 px stroke at 215 px, plus its thin outer and inner strokes, over a 146 px globe). Weight w = smootherstep over glide progress .22–.88.</td></tr>
      <tr><td>Ring tilt</td><td>Its world orientation slerps from its own to the U03 ring held in camera space: normal (0, .975, .223) turned 14° anticlockwise about the view axis. That is the U03 ellipse: seen 13° from edge-on (48 / 215), near half at the bottom, rising to the right.</td></tr>
      <tr><td>U03 ring and moon</td><td>Placed every frame like the globe: projected planet centre, scale = projected radius ÷ 146, same opacity and blur as the globe. The moon orbit: angle (4 + t) / 9 + .2, offset (200 cos a, 52 sin a) turned −.24 rad, behind the globe (opacity .7) when sin a &lt; 0.</td></tr>
      <tr><td>3D moon</td><td>Moves towards the U03 moon’s screen spot at 1.6 planet radii in front of the planet centre, weight smootherstep(progress ÷ .45); size 1 → .40 (U03 moon radius 15.6 px ÷ 146 ÷ .27) on the ring weight.</td></tr>
      <tr><td>Hand over</td><td>The 3D ring and moon fade over progress .8–.97 (a fade term added to their shaders). Never earlier: they must already match.</td></tr>
      <tr><td>The parked ship</td><td>Stays where it is unless it is parked by the planet being entered; then it shrinks away in the first 0.6 s as in Enter a planet.</td></tr></table>

    <h2>4 · Enter a world</h2>
    <p><b>When:</b> the globe is tapped in U03. <b>Why:</b> the round world flattens into the map you can walk around. Entering highlights nothing: no region is picked, dimmed or marked. <b>Ends on:</b> the U04 map at planet level, every region with its plain name, top pill “Machine learning · Planet”, the same two chips as U03.</p>
    <table class="spec"><tr><th>Time</th><th>Beat</th><th>What happens</th></tr>
      <tr><td>0–0.15 s</td><td>Tap</td><td>Tap ring on the globe; back pill, name and hint fade (0.04–0.35 s). The chips stay (the map has the same ones).</td></tr>
      <tr><td>0.15–1.1 s</td><td>Lean in</td><td>The globe grows to 1.32×. Inside its circle the flat map fades up (0.45–1.1 s) under the globe’s own shading and atmosphere rim while the globe fades out (0.55–1.2 s): the same round world, drawn flat.</td></tr>
      <tr><td>1.0–2.45 s</td><td>Open out</td><td>The circle opens until it fills the screen (radius 146 × 1.32 → 560, log curve) while the map grows to its landed size (scale .45 × 1.32 → 1) and its centre moves from y 372 to 440. The shading and rim fade, the stars go. No clouds on the way in.</td></tr>
      <tr><td>2.45–3.2 s</td><td>Landed</td><td>The live map fades in on top of the moving picture (2.45–2.7 s). Names and the planet pill come in (2.45–2.9 s), then the map’s clouds drift in round the edges (2.55–3.05 s).</td></tr></table>
    <table class="spec" style="margin-top:14px"><tr><th>Part</th><th>Values</th></tr>
      <tr><td>Smoothness</td><td>While it moves, the map is one still picture of the same drawing (the map SVG rendered to an image with sea to spare round it: viewBox −200 −100 790 1044), moved with transforms and clipped with a circle. No CSS blur anywhere: blurring the full-screen map dropped frames in round 01. The live map takes over once landed; underneath they are identical.</td></tr>
      <tr><td>Left out of the picture</td><td>Names (web fonts do not load inside SVG images, so they come in live at the end) and every cloud puff (they drift in after landing).</td></tr>
      <tr><td>Map</td><td>The U04 map at planet level as drawn by <code>mapSVG(P, 'here')</code>, minus the “you were here” marker and pill; the last region gets a plain name like the others.</td></tr></table>

    <h2>Edge cases and open questions</h2><table class="spec"><tr><th>Case</th><th>Status</th></tr>
      <tr><td>How often First open plays</td><td><span class="flag" style="background:rgba(79,224,184,.14);color:#4fe0b8">Decided</span> Once in the lifetime of the account: the first time that account ever opens the Universe tab, on any device. Keep the flag on the account (synced, so a new device or a reinstall never replays it). Not decided: where it ends if that account already has places by then; it is drawn ending on U01 Empty.</td></tr>
      <tr><td>Enter a system for other systems</td><td><span class="flag" style="background:rgba(79,224,184,.14);color:#4fe0b8">Decided</span> For this version every system uses the same animation, nearer ones included (Football, Backend systems): the path is built from the tapped system (K from its sun radii, the start pose from the overview camera relative to that system, the dock beside its planet with the ship slot, or its first planet). No special path for near systems.</td></tr>
      <tr><td>Planets with rings or a moon</td><td><span class="flag" style="background:rgba(79,224,184,.14);color:#4fe0b8">Decided</span> Enter a ringed planet (3b above): the 3D ring and moon turn into the U03 ones on the way in, then hand over. <a href="animations/enter-planet-rings-finalized.html" target="_blank"><code>animations/enter-planet-rings-finalized.html</code></a></td></tr>
      <tr><td>U03 hint text</td><td><span class="flag" style="background:rgba(79,224,184,.14);color:#4fe0b8">Decided</span> The hint now reads “Drag to rotate · tap to land”: a tap on the globe enters the world at planet level; choosing a region happens on the map (U04 region drop, unchanged).</td></tr>
      <tr><td>Going back up</td><td><span class="flag">Open</span> No reverse animations were designed. Back goes up one level; until designed, use a short cross-fade (0.3 s), not the forward animation backwards.</td></tr>
      <tr><td>Friend visits, search and orbit dial jumps</td><td>Use the same animation for the same step down (system, planet, world). Long jumps across levels (search to a region) are not designed: go straight to the destination.</td></tr>
      <tr><td>Desktop</td><td>Not designed for desktop (D02 docks picks in the panel instead of going down levels).</td></tr></table>
  </div>` },

  { id: 'rules', group: 'Guidelines', name: 'Rules', render: () => `<div class="doc"><span class="kick">Guidelines</span><h1>Rules</h1>
    <p class="lede">Decisions made while designing this tab, with the reason behind each. Treat them as fixed unless the design changes on purpose.</p>
    <h2>Space</h2><div class="dodont"><div class="dd do"><h4>Do</h4><ul>
      <li>Keep the sky black with plain stars. <span>Colour belongs to the worlds, not the sky.</span></li>
      <li>Make every sun orange and bigger than its planets. <span>The sun organises the system.</span></li>
      <li>Keep planets tiny and far apart. <span>True-to-scale reads calmer and fits a big universe.</span></li>
      <li>Let planets revolve, inner ones faster. <span>Motion is how you know it is alive.</span></li>
      <li>Draw Emerging dust as a pink and violet five-arm cartoon nebula.</li></ul></div>
      <div class="dd dont"><h4>Don’t</h4><ul><li>Draw orbit lines, yellow lines or dashed route lines, on any screen.</li><li>Use photoreal textures, glitter, sparkles or flashy extras.</li>
      <li>Give a sun any colour but orange.</li><li>Imitate the 3D look in 2D (flat haze sprites, CSS suns). <span>Reuse the approved scene code.</span></li></ul></div></div>
    <h2>Worlds</h2><div class="dodont"><div class="dd do"><h4>Do</h4><ul><li>Give each planet several continents with natural coasts and irregular region borders.</li>
      <li>Show every continent in full saturated colour on the globe; clouds with volume.</li><li>Keep landing in the globe’s palette so it reads as the same planet.</li>
      <li>Never repeat a planet type inside one universe.</li></ul></div>
      <div class="dd dont"><h4>Don’t</h4><ul><li>Use grey land, mountain or tree glyphs on the globe.</li><li>Build blocky, polygonal, stacked or over-smoothed land.</li><li>Use too many colours in one world.</li></ul></div></div>
    <h2>Chrome and lists</h2><div class="dodont"><div class="dd do"><h4>Do</h4><ul><li>Write menus plainly: words, thin lines, bold plus a yellow dot for the current item.</li>
      <li>Make system names prominent headings in lists.</li><li>Mark where you were with a highlight row (no outline) and one rippling red dot.</li>
      <li>Dock picked cards in the desktop panel.</li><li>Put the primary action first: Open, Land, Refresh, Leave.</li><li>Use one tab bar and one paper and ink pair everywhere.</li></ul></div>
      <div class="dd dont"><h4>Don’t</h4><ul><li>Write anything about uncharted places: no tags, no counts, no rows. <span>They unlock on their own; the land just stays grey.</span></li>
      <li>Put drawings in Simple view. <span>It is plain lists for easy viewing.</span></li><li>Outline the current row with a black ring.</li><li>Use glyph tiles, glass or outlined boxes in menus and dropdowns.</li></ul></div></div>
    <h2>Animations</h2><div class="dodont"><div class="dd do"><h4>Do</h4><ul>
      <li>Start and end exactly on the final screens. <span>An animation is a camera move between screens you already build.</span></li>
      <li>Let the next view come into focus on the way in. <span>Never swap it in at the end.</span></li>
      <li>Build speed up slowly and wind it down smoothly. <span>Long, gentle stops read best.</span></li>
      <li>Draw everything with the approved scene code and colours.</li>
      <li>Keep the rocket’s exhaust a short, dense cone at the nozzle with only a little movement.</li>
      <li>Keep the tab bar still; fade the rest of the chrome first and bring the new chrome in last.</li>
      <li>When a 3D thing and its flat version differ (rings, moons), turn the 3D one into the flat one first, then hand over. <span>Same shape, same tilt, same place, then fade.</span></li>
      <li>Keep a moon on the near side of its planet on the way in.</li></ul></div>
      <div class="dd dont"><h4>Don’t</h4><ul><li>Go full white, open with an iris, or fade flat white over black. <span>It read as sloppy, goofy, and as grey fog.</span></li>
      <li>Shake hard, jump to light speed, or stop with a jolt.</li><li>Make anything glow from nowhere. <span>The star forms from its dust.</span></li>
      <li>Draw a trail along the path or any line across the sky. <span>It read as janky and as a route line.</span></li>
      <li>Use stepped zooms or punch-ins. <span>A GTA-style switch was too long and unnecessary.</span></li>
      <li>Fly through clouds on the way into a world, or highlight a region when entering it.</li>
      <li>Blur full-screen layers while they move. <span>It drops frames; move a still picture instead.</span></li>
      <li>Cross-fade two different-looking versions of the same thing. <span>The rings looked lost, with a small one left behind.</span></li>
      <li>Let a moon keep its own orbit during an entry. <span>It slipped behind the planet at random.</span></li></ul></div></div>
    <h2>Settled</h2><p>Inconsistencies found while building this file, now resolved across every final screen.</p>
    <table class="spec"><tr><th>Item</th><th>Was</th><th>Now</th></tr>
      <tr><td>Route line</td><td>Dashed route between planets on U02 (phone)</td><td>Removed everywhere: no orbit lines, no route lines.</td></tr>
      <tr><td>Uncharted</td><td>“3 uncharted” on O3, Uncharted tags on U04 maps</td><td>Never written. Land not reached yet stays grey under cloud, unlabelled.</td></tr>
      <tr><td>Tab bar</td><td>Navy with accent pill on space screens, glass elsewhere</td><td>One glass tab bar on every phone screen.</td></tr>
      <tr><td>Paper and ink</td><td>#FFFBF0 with #111111, and #FFFDF2 with #15302A</td><td>One pair: Paper #FFFDF2, Ink #15302A, Ink 2 #566962.</td></tr></table></div>` },

  { id: 'handoff', group: 'Handoff', name: 'Build notes', render: () => `<div class="doc"><span class="kick">Handoff</span><h1>Build notes</h1>
    <p class="lede">How the final screens are made, so they can be rebuilt in the app without guessing.</p>
    <h2>Scene builders</h2><table class="spec"><tr><th>Builder</th><th>Makes</th><th>Source</th></tr>
      <tr><td><code>makeSystem(def)</code></td><td>halo + sun + planets on pivots; planets revolve (speed, Kepler 1.5)</td><td>universe-drafts-finalized</td></tr>
      <tr><td><code>makeSun(r)</code></td><td>shader core, inner glow ×4.2, bloom ×22, breathing 1.3 rad/s</td><td>universe-drafts-finalized</td></tr>
      <tr><td><code>halo(r, family)</code></td><td>family haze plane under the system</td><td>universe-drafts-finalized</td></tr>
      <tr><td><code>makePlanet(genome)</code></td><td>painted textures, atmosphere, clouds, rings, moon</td><td>universe-drafts-finalized</td></tr>
      <tr><td><code>toonNebula(R, n)</code></td><td>Emerging dust, five arms</td><td>universe-drafts-finalized</td></tr>
      <tr><td><code>genome(id, family)</code></td><td>planet type (never repeats in a universe), size, tilt, spin, rings, moon</td><td>universe-drafts-finalized</td></tr>
      <tr><td><code>mapWorld / globeWorld</code></td><td>continents, regions, uncharted land from noise contours</td><td>world-views-finalized</td></tr>
      <tr><td><code>surfaceBand / mapSVG</code></td><td>U03 globe surface and U04 map with camera, labels in screen space</td><td>world-views-finalized</td></tr></table>
    <h2>Cameras</h2><table class="spec"><tr><th>Scene</th><th>Position</th><th>Target</th><th>Drift</th></tr>
      ${[['Empty', '0, 4, 30', '0, 0, 0', '1.6'], ['Emerging', '0, 17, 19', '0, −.8, 0', '.7'], ['Overview / Lately', '0, 22, 46', '0, 0, 2', '.9'], ['Far', '0, 34, 76', '0, 0, −4', '1.2'], ['System', '0, 34, 52', '0, −.6, 0', '.6'], ['Desktop system', '0, 19, 29', '0, −.8, 1.2', '.6']].map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>
    <p class="note" style="margin-top:10px">Perspective 38°, near .1, far 3000. Pixel ratio capped at 1.5. Fog ranges per scene (46–150).</p>
    <h2>Data shape</h2><table class="spec"><tr><th>Level</th><th>Fields</th></tr>
      <tr><td>System</td><td>name · family · planets[] · rooms · quiet (for Lately)</td></tr>
      <tr><td>Planet</td><td>id · name · type · system · regions[] · sel (last region) · route · rings · moon · encounter</td></tr>
      <tr><td>Region (country)</td><td>name · loops (shape) · at (label point) · explored or not yet reached (drawn grey, never labelled or counted)</td></tr>
      <tr><td>Room</td><td>name · system</td></tr></table>
    <h2>Accessibility</h2><div class="grid g3"><div class="card"><b>Targets</b><p>44 minimum. Chips 42–44, buttons 48, icon buttons 48.</p></div>
      <div class="card"><b>Order</b><p>Leave first on visits; Cancel next to the search field; primary action before secondary.</p></div>
      <div class="card"><b>Contrast</b><p>Ink and Deep ink on Paper and Cream; labels over space carry a double black shadow.</p></div></div>
    <h2>Animations</h2><table class="spec"><tr><th>Piece</th><th>How</th></tr>
      <tr><td>Clock</td><td>One time value t per animation; every property (camera, objects, opacity, chrome) is a function of t. Advance by elapsed time, at most 0.1 s per frame. This gives scrubbing, tests by timestamp and frame-rate independence.</td></tr>
      <tr><td>Two scenes, one hand-over</td><td>Enter a system renders the overview and U02 scenes and cross-fades them (1.45–2.25 s). Both cameras keep the same pose relative to the system, because U02 is the overview scaled by K about it.</td></tr>
      <tr><td>3D into 2D</td><td>Enter a planet projects the 3D planet every frame and lays the 2D U03 globe on it (centre, radius ÷ 146), fading and sharpening it in.</td></tr>
      <tr><td>3D shape into 2D shape</td><td>Enter a ringed planet animates the 3D ring’s radii (shader uniforms) and orientation towards the flat ring held in camera space, and moves the 3D moon to the flat moon’s spot (unprojected, in front of the planet), then fades them out under the flat ones.</td></tr>
      <tr><td>2D into 2D</td><td>Enter a world moves a still image of the map SVG, clipped to a circle; the live SVG takes over once it has landed.</td></tr>
      <tr><td>Reused builders</td><td>3D: makeSystem, makeSun, makePlanet, halo, makeSky, toonNebula, makeStation, makeShip. 2D: screenPlanet, mapSVG, screenMap, cloudPuff. New: the rocket and its exhaust; the dust, sparkles, rocks and streaks of the first open.</td></tr>
      <tr><td>Hand-over to live</td><td>On the end frame, mount the live screen with the same camera and time so nothing jumps, then let its own loops (drift, spin, revolve) carry on.</td></tr>
      <tr><td>Seen flag</td><td>First open sets a flag on the account (not the device) when it starts; it never plays again for that account, on any device.</td></tr></table>
    <p class="note" style="margin-top:10px">Every timing and value: Guidelines → Animations.</p>
    <h2>Files</h2><table class="spec"><tr><th>Set</th><th>File</th></tr>${INVENTORY.map(([a, , c]) => `<tr><td>${a}</td><td><a href="${c}" target="_blank"><code>${c}</code></a></td></tr>`).join('')}</table></div>` },

  { id: 'changelog', group: 'Handoff', name: 'Changelog', render: () => `<div class="doc"><span class="kick">Handoff</span><h1>Changelog</h1>
    <p class="lede">How the design got here.</p><table class="spec" style="margin-top:24px"><tr><th>Date</th><th>Area</th><th>Decision</th></tr>
      ${[['2026-10-27', 'Space views', 'Round 05 approved: No Man’s Sky style but cartoony, black sky, orange suns, tiny planets, no orbit lines.'],
        ['2026-10-27', 'Planet views', 'Round 04 approved: saturated globe palette carried to the landed map; region card and You were here.'],
        ['2026-10-27', 'Search', 'Search and empty search approved over the live universe.'],
        ['2026-10-28', 'Orbit dial', 'List view becomes the orbit dial with a system wheel; systems drawn with the real scene code.'],
        ['2026-10-28', 'Simple views', 'Two plain lists; uncharted never shown; system names as headings; highlight row with rippling red dot.'],
        ['2026-10-28', 'Misc', 'Friend visit, Offline and Formation notice in the space look.'],
        ['2026-10-28', 'Desktop', 'Rail, live map and panel; no dashed route; picks dock in the panel.'],
        ['2026-10-28', 'Menus', 'Menus written plainly across search, orbit dial, simple views and desktop.'],
        ['2026-10-28', 'File', 'New Universe design file assembled.'],
        ['2026-10-28', 'Consistency', 'One glass tab bar; one paper and ink (#FFFDF2 / #15302A); no route line on U02; uncharted never written.'],
        ['2026-10-28', 'Animations', 'First open finalized after six rounds: dust spirals into a star that bursts, a long trip, a slow build to light speed, a smooth stop on U01 Empty.'],
        ['2026-10-29', 'Animations', 'Enter a system finalized: a rocket leads the camera into the system and parks where U02 keeps its ship; a short dense exhaust cone instead of a trail.'],
        ['2026-10-29', 'Animations', 'Enter a planet finalized: the GTA-style stepped zoom was dropped for one slow glide, with the U03 globe coming into focus on the way.'],
        ['2026-10-30', 'Animations', 'Enter a world finalized: the globe flattens into the map inside its circle and opens out; nothing highlighted, no clouds on the way in.'],
        ['2026-10-30', 'File', 'Animations added: their own page, Motion tokens, transitions in Behaviour, rules, build notes, and the four files on the Screens page.'],
        ['2026-10-30', 'Decisions', 'First open plays once in the lifetime of the account. Enter a system stays the same for every system in this version. U03 hint now reads Drag to rotate · tap to land. Entering ringed planets is being prototyped.'],
        ['2026-10-30', 'Animations', 'Enter a ringed planet finalized after three rounds: a plain fade lost the rings, then the moon slipped behind; now the 3D ring narrows and tilts into the U03 ring and the moon heads for its U03 place on the near side.']].map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>` },
];

/* ===================== shell ===================== */
const pagesEl = document.getElementById('pages'), canvas = document.getElementById('canvas'), insp = document.getElementById('inspect'), crumb = document.getElementById('crumb');
let lastGroup = '';
pagesEl.innerHTML = PAGES.map(p => { const h = p.group !== lastGroup ? `<h6>${p.group}</h6>` : ''; lastGroup = p.group; return `${h}<button data-p="${p.id}"><i></i>${p.name}</button>`; }).join('');
const emptyInsp = `<h5>Inspect</h5><p class="empty">Click a swatch, a type style, an icon or a component to see its properties here.</p>`;
function inspect(o) {
  if (!o) { insp.innerHTML = emptyInsp; return; }
  const val = v => /^#[0-9a-f]{3,8}$/i.test(v) || /^rgba?\(/.test(v) ? `<span class="sw2" style="background:${v}"></span>${v}` : String(v).split(' ').every(x => /^#[0-9a-f]{6}$/i.test(x)) ? String(v).split(' ').map(x => `<span class="sw2" style="background:${x}"></span>`).join('') + `<br><span class="mono">${v}</span>` : v;
  insp.innerHTML = `<h5>Inspect</h5><div class="nm">${o.name}</div>${o.desc ? `<p class="ds">${o.desc}</p>` : ''}<table>${Object.entries(o.props || {}).map(([k, v]) => `<tr><td>${k}</td><td>${val(v)}</td></tr>`).join('')}</table>`;
}
let current = null, frameIdx = 0;
function go(id) {
  const p = PAGES.find(x => x.id === id) || PAGES[0]; current = p.id;
  pagesEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.p === p.id));
  crumb.textContent = p.group + ' / ' + p.name; canvas.className = 'canvas' + (p.frame ? ' frame' : ''); canvas.innerHTML = p.render(); canvas.scrollTop = 0; inspect(null);
  if (p.id === 'screens') mountScreens();
  history.replaceState(null, '', '#' + p.id + (p.id === 'screens' ? '/' + frameIdx : ''));
}
canvas.addEventListener('click', e => {
  const c = e.target.closest('[data-comp]');
  if (c) { canvas.querySelectorAll('.spec-card').forEach(x => x.classList.toggle('on', x === c)); const d = COMPONENTS.find(x => x.id === c.dataset.comp); inspect({ name: d.name, desc: 'Used in ' + d.where + '.', props: d.props }); return; }
  const t = e.target.closest('[data-insp]');
  if (t) { canvas.querySelectorAll('.sel').forEach(x => x.classList.remove('sel')); t.classList.add('sel'); inspect(JSON.parse(t.dataset.insp)); }
});
pagesEl.onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.p); };

/* screens: one finalized file at a time, so only one set of 3D scenes runs */
function mountScreens() {
  const bar = document.getElementById('sbar'), view = document.getElementById('view'), info = document.getElementById('sinfo'), meta = document.getElementById('smeta');
  const show = i => { frameIdx = i; const s = SCREENS[i];
    bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
    info.innerHTML = `Source <a href="${s.path}" target="_blank">${s.path}</a>`;
    const inv = INVENTORY.find(x => x[2] === s.path); meta.innerHTML = `<span><b>${s.name}</b></span><span>${inv ? inv[1] : ''}</span>`;
    view.srcdoc = s.html; history.replaceState(null, '', '#screens/' + i);
    inspect({ name: s.name, desc: inv ? inv[1] : '', props: { Source: s.path, Frames: s.path.startsWith('desktop') ? '1440 × 900' : '390 × 844', Status: 'Final' } }); };
  bar.onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); };
  view.addEventListener('load', () => { const check = () => { try { const er = view.contentWindow.document.getElementById('err'); if (er && er.textContent.trim()) { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = SCREENS[frameIdx].name + ': ' + er.textContent; } } catch (x) {} };
    setTimeout(check, 1500); setTimeout(check, 5000); });
  show(Math.min(SCREENS.length - 1, frameIdx));
}
const [h0, h1] = location.hash.slice(1).split('/'); if (h1) frameIdx = +h1 || 0;
go(h0 || 'cover');
</script>
