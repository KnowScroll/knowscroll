ated palette as the globe in U03, so landing reads as the same planet up close.\n   The world is drawn in map units and moved by a camera; names, markers and Uncharted tags are drawn\n   afterwards in screen space so they never scale with the camera and stay clear of the chrome. */\nconst SAFE = { card: { top: 112, bottom: 520 }, here: { top: 112, bottom: 680 } };\nconst pillLabel = (x, y, text, { fill = '#fffdf2', ink = '#15302a', dot, size = 13 } = {}) => {\n  const wd = text.length * size * .56 + (dot ? 40 : 26), px = Math.min(390 - wd / 2 - 14, Math.max(wd / 2 + 14, x));\n  return `<g transform=\"translate(${f1(px)} ${f1(y)})\"><rect x=\"${f1(-wd / 2)}\" y=\"-15\" width=\"${f1(wd)}\" height=\"30\" rx=\"15\" fill=\"${fill}\" stroke=\"#15302a\" stroke-width=\"2\"/>\n    ${dot ? `<circle cx=\"${f1(-wd / 2 + 15)}\" cy=\"0\" r=\"4.5\" fill=\"${dot}\"/>` : ''}<text x=\"${dot ? 7 : 0}\" y=\"${f1(size * .36)}\" text-anchor=\"middle\" font-family=\"Instrument Sans\" font-weight=\"700\" font-size=\"${size}\" fill=\"${ink}\">${text}<\/text><\/g>`;\n};\nfunction mapSVG(P, mode) {\n  const th = T[P.type], B = BIO[P.type], g4 = B.globe, r = rng(P.id + 'map'), id = P.id + mode, w = mapWorld(P), safe = SAFE[mode];\n  const sel = w.regions[P.sel];\n  // camera: the card view drops low over the chosen region and centres it above the card\n  const sp = sel.loops.reduce((a, l) => l.length > a.length ? l : a, []), xs = sp.map(p => p[0]), ys = sp.map(p => p[1]);\n  const bx0 = Math.min(...xs), bx1 = Math.max(...xs), by0 = Math.min(...ys), by1 = Math.max(...ys);\n  const z = mode === 'card' ? clamp(Math.min(300 / (bx1 - bx0), 330 / (by1 - by0)), 1.6, 2.1) : 1;\n  const tx = mode === 'card' ? 195 - (bx0 + bx1) / 2 * z : 0, ty = mode === 'card' ? (safe.top + safe.bottom) / 2 + 6 - (by0 + by1) / 2 * z : 0;\n  const S = (x, y) => [x * z + tx, y * z + ty], seen = (x, y, m = 0) => x > m && x < 390 - m && y > safe.top && y < safe.bottom;\n  const expB = w.regions.flatMap(g => g.loops.flat()), ex0 = Math.min(...expB.map(p => p[0])), ex1 = Math.max(...expB.map(p => p[0])), ey0 = Math.min(...expB.map(p => p[1])), ey1 = Math.max(...expB.map(p => p[1]));\n  const nearExp = (x, y, pad) => x > ex0 - pad && x < ex1 + pad && y > ey0 - pad && y < ey1 + pad;\n  let ground = '', detail = '', defs = `<filter id=\"glow${id}\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\"><feDropShadow dx=\"0\" dy=\"0\" stdDeviation=\"${f1(5 / z)}\" flood-color=\"#fff\" flood-opacity=\".9\"/><\/filter>\n    <filter id=\"soft${id}\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"120%\"><feGaussianBlur stdDeviation=\"3\"/><\/filter><filter id=\"shadow${id}\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"130%\"><feGaussianBlur stdDeviation=\"6\"/><\/filter>`;\n  if (th.detail === 'bands') {\n    defs += `<linearGradient id=\"sky${id}\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">${B.bands.map((c, i) => `<stop offset=\"${i / (B.bands.length - 1)}\" stop-color=\"${c}\"/>`).join('')}<\/linearGradient>`;\n    ground = `<rect x=\"-400\" y=\"-400\" width=\"1200\" height=\"1700\" fill=\"url(#sky${id})\"/><g class=\"band-drift\" filter=\"url(#soft${id})\">${Array.from({ length: 22 }, (_, i) => { const y = -200 + i * 60, c = B.bands[i % B.bands.length];\n      return `<path d=\"M-400 ${y} ${Array.from({ length: 14 }, (_, k) => `Q${-400 + k * 120 + 60} ${y + (k % 2 ? 14 : -14)} ${-400 + k * 120 + 120} ${y}`).join(' ')} V${y + 34} H-400Z\" fill=\"${c}\" opacity=\".7\"/>`; }).join('')}<\/g>`;\n    detail += `<g fill=\"none\" stroke=\"${th.current}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"14 22\" class=\"current-a\"><path d=\"M-20 140 Q120 110 260 150 T420 130\"/><path d=\"M-20 640 Q130 610 260 650 T420 630\"/><\/g>`;\n  } else {\n    defs += `<radialGradient id=\"sea${id}\" gradientUnits=\"userSpaceOnUse\" cx=\"195\" cy=\"380\" r=\"640\"><stop offset=\"0\" stop-color=\"${g4[1]}\"/><stop offset=\".45\" stop-color=\"${g4[2]}\"/><stop offset=\"1\" stop-color=\"${g4[3]}\"/><\/radialGradient>`;\n    ground = `<rect x=\"-400\" y=\"-400\" width=\"1200\" height=\"1700\" fill=\"url(#sea${id})\"/>`;\n    const paths = '<path class=\"current-a\" d=\"M-20 110 Q120 50 260 100 T420 140\"/><path class=\"current-b\" d=\"M-20 720 Q140 680 260 740 T420 710\"/><path class=\"current-a\" d=\"M372 220 Q410 420 362 580\"/><path class=\"current-b\" d=\"M20 230 Q-16 420 30 600\"/>';\n    detail += th.detail === 'lava'\n      ? `<g fill=\"none\" stroke=\"${th.current}\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"11 26\" filter=\"url(#soft${id})\">${paths}<\/g><g fill=\"none\" stroke=\"#ffc08a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"11 26\">${paths}<\/g>`\n      : `<g fill=\"none\" stroke=\"${th.current}\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-dasharray=\"11 26\">${paths}<\/g>`;\n    for (let gy = -60; gy < 900; gy += 54) for (let gx = -40; gx < 430; gx += 54) {\n      if (r() > .62) continue; const x = gx + r() * 70, y = gy + r() * 70; if (w.landAt(x, y) > -.14) continue; const k = 7 + r() * 5, rot = f1(r() * 22 - 11);\n      if (th.detail === 'waves') detail += `<path d=\"M0 0 q${f1(k / 2)} ${f1(-k * .55)} ${f1(k)} 0 t${f1(k)} 0\" transform=\"translate(${f1(x)} ${f1(y)}) rotate(${rot})\" fill=\"none\" stroke=\"${th.wave}\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>`;\n      else if (th.detail === 'floes') { const s = 5 + r() * 8; detail += `<ellipse cx=\"${f1(x)}\" cy=\"${f1(y)}\" rx=\"${f1(s)}\" ry=\"${f1(s * .6)}\" transform=\"rotate(${rot} ${f1(x)} ${f1(y)})\" fill=\"#eef8ff\" opacity=\".85\"/>`; }\n      else if (th.detail === 'lava') detail += r() < .5 ? `<circle class=\"bubble\" style=\"animation-delay:-${f1(r() * 3.6)}s\" cx=\"${f1(x)}\" cy=\"${f1(y)}\" r=\"${f1(2 + r() * 3)}\" fill=\"#ff9a4a\"/>`\n        : `<path d=\"M0 0 q8 6 16 0 t16 0\" transform=\"translate(${f1(x)} ${f1(y)}) rotate(${rot})\" fill=\"none\" stroke=\"rgba(255,138,61,.5)\" stroke-width=\"2\" stroke-linecap=\"round\"/>`;\n      else if (th.detail === 'craters') { const rr = 5 + r() * 12; detail += `<circle cx=\"${f1(x)}\" cy=\"${f1(y)}\" r=\"${f1(rr)}\" fill=\"rgba(30,20,44,.28)\"/><path d=\"M${f1(x - rr)} ${f1(y)} a${f1(rr)} ${f1(rr)} 0 0 1 ${f1(rr * 2)} 0\" fill=\"none\" stroke=\"rgba(245,232,255,.3)\" stroke-width=\"2\"/>`; }\n    }\n  }\n  // land, as on the globe: soft shallows, a foam edge, flat saturated regions with biome patches, dashed region borders, an inked coast\n  const all = toD(w.land), regLoops = toD(w.regions.flatMap(g => g.loops));\n  let land = `<path d=\"${toD(w.shallow2)}\" fill=\"${th.shallow}\" opacity=\".3\" fill-rule=\"evenodd\" filter=\"url(#soft${id})\"/><path d=\"${toD(w.shallow1)}\" fill=\"${B.foam}\" opacity=\".28\" fill-rule=\"evenodd\" filter=\"url(#soft${id})\"/>`;\n  land += `<path d=\"${all}\" fill=\"${th.shadow}\" opacity=\".45\" fill-rule=\"evenodd\" transform=\"translate(0 8)\" filter=\"url(#shadow${id})\"/>`;\n  if (th.glowCoast) land += `<path d=\"${regLoops}\" fill=\"none\" stroke=\"#ffb03a\" stroke-width=\"8\" opacity=\".7\" filter=\"url(#soft${id})\"/>`;\n  land += `<path d=\"${regLoops}\" fill=\"none\" stroke=\"${B.foam}\" stroke-width=\"4\" stroke-linejoin=\"round\" opacity=\".85\"/>`;\n  land += w.regions.map((g, i) => `<path d=\"${toD(g.loops)}\" fill=\"${B.land[i % 4]}\" fill-rule=\"evenodd\"/>`).join('');\n  defs += `<clipPath id=\"exp${id}\"><path d=\"${regLoops}\" clip-rule=\"evenodd\"/><\/clipPath>`;\n  land += `<g clip-path=\"url(#exp${id})\"><path d=\"${toD(w.lo)}\" fill=\"${B.lo}\" opacity=\".5\" fill-rule=\"evenodd\"/><path d=\"${toD(w.hi)}\" fill=\"${B.hi}\" opacity=\".55\" fill-rule=\"evenodd\"/><\/g>`;\n  land += w.regions.map(g => `<path d=\"${toD(g.loops)}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".5\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/>`).join('');\n  land += `<path d=\"${regLoops}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".75\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/>`;\n  // uncharted: flat grey, no detail\n  const LK = LOCK[P.type];\n  land += w.locked.map(g => `<path d=\"${toD(g.loops)}\" fill=\"${LK[1]}\" fill-rule=\"evenodd\" transform=\"translate(0 4)\"/><path d=\"${toD(g.loops)}\" fill=\"${LK[0]}\" fill-rule=\"evenodd\"/><path d=\"${toD(g.loops)}\" fill=\"none\" stroke=\"${LK[2]}\" stroke-opacity=\".6\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/>`).join('');\n  // the chosen region: everything else dims, the region keeps full colour under a white glow\n  let focus = '';\n  if (mode === 'card') focus = `<path d=\"M-400 -400H800V1300H-400Z${toD(sel.loops)}\" fill=\"#03121e\" opacity=\".42\" fill-rule=\"evenodd\"/>\n    <path d=\"${toD(sel.loops)}\" fill=\"none\" stroke=\"#fff\" stroke-width=\"${f1(3 / z)}\" stroke-linejoin=\"round\" filter=\"url(#glow${id})\"/>`;\n  // a frame of puffy cloud at the edge of what's charted\n  let clouds = ''; const rc = rng(P.id + 'cloud');\n  const ring = (x0, x1, y0, y1, s1, s2, lo, hi) => { const pts = []; for (let x = x0; x <= x1; x += s1) pts.push([x, y0], [x, y1]); for (let y = y0 + s2; y < y1 - s2 * .5; y += s2) pts.push([x0, y], [x1, y]);\n    pts.forEach(([px2, py2]) => { const x = px2 + rc() * 30 - 15, y = py2 + rc() * 30 - 15; if (y < 66 || nearExp(x, y, 18) || (x > 50 && x < 340 && y > 150 && y < 760)) return; clouds += cloudPuff(rc, x, y, lo + rc() * (hi - lo), th); }); };\n  ring(-30, 420, 0, 900, 80, 95, .9, 1.4);\n  // uncharted veils in map space\n  const rv = rng(P.id + 'veil'); let veils = '';\n  defs += `<radialGradient id=\"veil${id}\" cx=\"50%\" cy=\"50%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".42\"/><stop offset=\".62\" stop-color=\"#eef6fb\" stop-opacity=\".26\"/><stop offset=\"1\" stop-color=\"#e2eef8\" stop-opacity=\"0\"/><\/radialGradient>`;\n  w.locked.forEach((g, i) => { const c = w.conts[w.conts.length - w.locked.length + i], [ax, ay] = g.at;\n    veils += `<ellipse cx=\"${f1(ax)}\" cy=\"${f1(ay)}\" rx=\"${f1(c.s * 1.1)}\" ry=\"${f1(c.s * .9)}\" fill=\"url(#veil${id})\"/>`;\n    for (let q = 0; q < 2; q++) veils += cloudPuff(rv, ax + (rv() - .5) * c.s * 1.4, ay + (rv() - .5) * c.s, .5 + rv() * .35, th); });\n  // ---- screen space: names and markers (uncharted land is never labelled) ----\n  let ui = '';\n  const [sx, sy] = S(sel.at[0], sel.at[1]);\n  w.regions.forEach((g, i) => { const [x, y] = S(g.at[0], g.at[1]);\n    if (i === P.sel) return;\n    if (mode === 'card') { if (seen(x, y, P.regions[i].length * 4.3 + 10)) ui += `<g opacity=\".8\">${textLabel(x, y + 5, P.regions[i], th, 14)}<\/g>`; return; }\n    ui += textLabel(x, y + 5, P.regions[i], th, 15); });\n  if (mode === 'card') ui += pillLabel(sx, sy, P.regions[P.sel], { fill: '#FFE44D', ink: '#15302a', size: 15 });\n  else ui += `<g transform=\"translate(${f1(sx)} ${f1(sy - 22)})\"><circle class=\"port-ping\" r=\"13\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"/><circle r=\"13\" fill=\"var(--orange)\" stroke=\"#fff\" stroke-width=\"2.5\"/><circle r=\"4.5\" fill=\"#fff\"/><\/g>`\n    + pillLabel(sx, sy + 14, `${P.regions[P.sel]} · you were here`, { dot: 'var(--orange)' });\n  return `<svg viewBox=\"0 0 390 844\"><defs>${defs}<\/defs><g transform=\"translate(${f1(tx)} ${f1(ty)}) scale(${f1(z)})\">${ground}${detail}${land}${focus}${veils}${clouds}<\/g>${ui}<\/svg>`;\n}\nfunction screenMap(P, mode) {\n  const th = T[P.type], E = P.enc;\n  const top = `<div class=\"map-top\"><div class=\"pill\">${backIcon}${mode === 'card' ? P.name : P.system}<span class=\"level-chip\">${mode === 'card' ? 'Region' : 'Planet'}<\/span><\/div><\/div>`;\n  const bottom = mode === 'card'\n    ? `<div class=\"map-card\" style=\"--accent-c:${th.accent};--mc:${th.mc}\"><div class=\"mc-top\"><span class=\"mc-kind\">${E.kind} · in ${P.regions[P.sel]}<\/span><span class=\"mc-x\">✕<\/span><\/div><h1>${E.title}<\/h1><p>${E.sum}<\/p>\n        <div class=\"mc-acts\"><span class=\"go\">Open<\/span><span class=\"ghost\">Close<\/span><\/div><\/div>`\n    : `<div class=\"chips\">${P.route ? `<span class=\"chip light\">Route to ${P.route}${fwdIcon}<\/span>` : ''}<span class=\"chip dark\">${listIcon}List view<\/span><\/div>`;\n  return `<div class=\"phone\" data-anim><div class=\"map\">${mapSVG(P, mode)}<\/div>${top}${bottom}${tabbar()}<div class=\"statusbar\"><span>9:41<\/span><i><\/i><\/div><\/div>`;\n}\n\n/* ===================== page ===================== */\nconst rows = document.getElementById('rows');\ndocument.getElementById('jump').innerHTML = PLANETS.map(P => `<a href=\"#p-${P.id}\">${P.name} · ${T[P.type].label}<\/a>`).join('') + '<button id=\"pause\">Pause motion<\/button>';\nrows.innerHTML = PLANETS.map(P => `<section class=\"planet-row\" id=\"p-${P.id}\"><header><h2>${P.name}<\/h2><span>${T[P.type].label} · in ${P.system}<\/span><\/header><div class=\"phones\">\n  <figure>${screenPlanet(P)}<figcaption><b>U03 · Planet (approved, for reference)<\/b><span>A planet as a place<\/span><small>From orbit: every continent in full, saturated colour with flat cartoon biomes and foam coasts. Cumulus with real volume drifts over and casts soft shadows. Explored regions carry their names.<\/small><\/figcaption><\/figure>\n  <figure>${screenMap(P, 'card')}<figcaption><b>U04 · Region card<\/b><span>Region chosen, card open<\/span><small>The camera drops about 2× over ${P.regions[P.sel]} and centres it above the card. The rest of the map dims, the region keeps full colour under a white glow, and its name sits in the yellow selected pill. The card offers one encounter.<\/small><\/figcaption><\/figure>\n  <figure>${screenMap(P, 'here')}<figcaption><b>U04 · You were here<\/b><span>Back from an encounter<\/span><small>Camera back at planet level, same colours as the globe. ${P.regions[P.sel]} carries the orange marker and “you were here” until it’s chosen again. Continents not reached yet stay grey under cloud, with no label.<\/small><\/figcaption><\/figure>\n<\/div><\/section>`).join('');\n\nconst moons = [...document.querySelectorAll('[data-moon]')];\nlet paused = false;\ndocument.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Play motion' : 'Pause motion'; document.querySelectorAll('[data-anim]').forEach(p => p.classList.toggle('paused', paused)); };\nconst reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\nfunction frame(now) {\n  if (!paused) moons.forEach((m, i) => { const a = (reduce ? 1 : now / 9000) + i * 1.7, x = Math.cos(a) * 200, y = Math.sin(a) * 52, c = Math.cos(-.24), s = Math.sin(-.24);\n    m.style.transform = `translate(${195 + x * c - y * s}px, ${372 + x * s + y * c}px)`; m.classList.toggle('behind', Math.sin(a) < 0); });\n  if (!reduce) requestAnimationFrame(frame);\n}\nrequestAnimationFrame(frame);\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "Search", "path": "world-internals/finalized-search.html", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Finalized Search<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<!--\n  FINALIZED: U08 Search, empty query and U08 Search (typed). Approved as drawn in world-internals-01.html.\n  Search sits over the live 3D universe (universe-drafts-05.html); chrome in the goScroll language of the world views.\n  Menus written plainly (approved 2026-10-28, from test.html): text rows, hairlines, no glyph tiles, no glass, no outlined boxes. See #plain-menus.\n  Consistency pass (2026-10-28): one tab bar (glass), one paper/ink pair (#FFFDF2 / #15302A), no dashed route on U02, uncharted never written.\n-->\n<style>\n\n:root{\n  --paper:#FFFDF2; --cream:#fffdf2; --ink:#15302A; --ink2:#566962; --accent:#2C46E8; --orange:#ff684c; --focus:#FFE44D;\n  --f-display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;\n  --f-text:'Instrument Sans',system-ui,sans-serif;\n  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;\n  --page:#0C0C0E; --page-ink:#F2EEE3; --page-ink2:#A29C8E; --page-edge:rgba(242,238,227,.16);\n}\n:root[data-theme=\"light\"]{ --page:#E9E4D6; --page-ink:#111111; --page-ink2:#5B5649; --page-edge:rgba(21,48,42,.18); }\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:var(--page);color:var(--page-ink);font-family:var(--f-text);padding:32px 16px 80px}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer}\n.intro{max-width:1240px;margin:0 auto 18px}\n.intro .kicker{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--page-ink2)}\n.intro h1{font:800 36px/40px var(--f-display);letter-spacing:-.02em;margin-top:6px}\n.intro p{color:var(--page-ink2);font-size:15px;line-height:22px;margin-top:8px;max-width:860px}\n.jump{max-width:1240px;margin:16px auto 30px;display:flex;flex-wrap:wrap;gap:8px}\n.jump a,.jump button{border:1.5px solid var(--page-edge);border-radius:999px;padding:8px 14px;font:600 13px/1 var(--f-text);color:var(--page-ink);text-decoration:none}\n.planet-row{max-width:1300px;margin:0 auto 56px;content-visibility:auto;contain-intrinsic-size:1000px}\n.planet-row>header{margin:0 0 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}\n.planet-row h2{font:800 24px/28px var(--f-display);letter-spacing:-.01em}\n.planet-row header span{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--page-ink2)}\n.phones{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}\nfigure{display:flex;flex-direction:column;gap:10px;width:390px}\nfigcaption b{font:500 11px/14px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;display:block;color:var(--page-ink2)}\nfigcaption span{font:700 16px/21px var(--f-display);display:block;margin-top:2px}\nfigcaption small{font-size:12.5px;line-height:18px;color:var(--page-ink2);display:block;margin-top:3px}\n\n/* ---------- phone ---------- */\n.phone{width:390px;height:844px;position:relative;overflow:hidden;border-radius:38px;background:#000;\n  box-shadow:0 0 0 8px #050505,0 0 0 9px #26272b,0 30px 60px -24px rgba(0,0,0,.8);isolation:isolate;color:var(--cream)}\n.paused *{animation-play-state:paused!important}\n.statusbar{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 34px;font:600 15px/1 var(--f-text);z-index:40;pointer-events:none}\n.statusbar i{width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px;display:inline-block;position:relative}\n.statusbar i:after{content:\"\";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px}\n.starfield{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#0a0d14 0,#000 70%)}\n.starfield svg{position:absolute;inset:0}\n\n/* top bar: goScroll pill */\n.map-top{position:absolute;z-index:30;left:14px;right:14px;top:56px;display:flex;align-items:center;gap:8px}\n.pill{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 10px;border:1px solid rgba(21,48,42,.2);border-radius:15px;background:rgba(255,253,242,.94);\n  color:#15302a;font:800 14px/1 var(--f-text);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}\n.pill svg{width:17px;height:17px}\n.level-chip{padding:4px 8px;border-radius:99px;background:var(--orange);color:#fff;font:800 10px/1 var(--f-text);letter-spacing:.11em;text-transform:uppercase}\n\n/* ---------- U03: the globe ---------- */\n.globe-wrap{position:absolute;z-index:5;left:50%;top:372px;width:292px;height:292px;transform:translate(-50%,-50%)}\n.atmosphere{position:absolute;inset:-12px;border-radius:50%;border:1px solid var(--atmo-line);box-shadow:0 0 26px var(--atmo-glow),inset 0 0 18px var(--atmo-glow)}\n.globe{position:absolute;inset:0;overflow:hidden;border-radius:50%;border:2px solid var(--rim);background:var(--globe-bg);\n  box-shadow:0 28px 58px rgba(0,0,0,.52),inset -28px -16px 52px rgba(2,10,20,.45)}\n.globe .surface{position:absolute;left:0;top:50%;margin-top:-180px;width:960px;height:360px;animation:spin 70s linear infinite}\n@keyframes spin{to{transform:translateX(-480px)}}\n.cloudband{animation:cloudspin 46s linear infinite}\n@keyframes cloudspin{to{transform:translateX(-480px)}}\n.globe .caps{position:absolute;inset:0;pointer-events:none}\n.shade{position:absolute;inset:-1px;border-radius:50%;background:radial-gradient(circle at 31% 24%,transparent 0 42%,rgba(5,15,30,.1) 56%,rgba(3,8,20,.74) 95%);pointer-events:none}\n.glint{position:absolute;inset:5% 34% 48% 11%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 72%);transform:rotate(-26deg);filter:blur(8px);pointer-events:none}\n.ring{position:absolute;left:50%;top:372px;width:470px;height:470px;transform:translate(-50%,-50%);pointer-events:none}\n.ring.back{z-index:4}.ring.front{z-index:6}\n.moon{position:absolute;z-index:6;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;pointer-events:none;will-change:transform}\n.moon svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 12px rgba(255,249,226,.3))}\n.moon.behind{z-index:4;opacity:.7}\n.caption{position:absolute;z-index:10;left:24px;right:24px;top:556px;display:flex;flex-direction:column;gap:6px}\n.caption .eyebrow{font:500 11px/14px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,253,242,.7)}\n.caption h1{font:800 32px/36px var(--f-display);letter-spacing:-.02em}\n.hint{display:flex;align-items:center;gap:8px;margin-top:4px;color:#b8e2e3;font:700 13px/1 var(--f-text)}\n.hint span{display:grid;width:26px;height:26px;place-items:center;border:1px solid rgba(255,255,255,.2);border-radius:50%;font-size:13px}\n\n/* ---------- U04: the landed map ---------- */\n.map{position:absolute;inset:0}\n.map svg{position:absolute;inset:0;width:390px;height:844px;display:block}\n.current-a{animation:current-drift 9s linear infinite}\n.current-b{animation:current-drift 14s linear infinite;opacity:.7}\n@keyframes current-drift{to{stroke-dashoffset:-37}}\n.cloud{animation:cloud-drift var(--d,12s) ease-in-out infinite alternate}\n@keyframes cloud-drift{from{transform:translateX(calc(var(--dx,6px)*-1))}to{transform:translateX(var(--dx,6px))}}\n.band-drift{animation:band 60s linear infinite}\n@keyframes band{to{transform:translateX(-390px)}}\n.bubble{animation:bubble 3.6s ease-in-out infinite}\n@keyframes bubble{0%,100%{opacity:.2}50%{opacity:1}}\n.port-ping{animation:ping 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}\n@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}\n.storm{animation:storm 40s linear infinite;transform-box:fill-box;transform-origin:center}\n@keyframes storm{to{transform:rotate(360deg)}}\n\n/* goScroll map card, with the app's actions */\n.map-card{position:absolute;z-index:30;left:14px;right:14px;bottom:106px;padding:15px 16px 14px;border:1px solid rgba(255,255,255,.15);border-radius:24px;\n  background:rgba(6,26,38,.74);color:#fff;box-shadow:0 20px 46px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3)}\n.mc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}\n.mc-kind{display:flex;align-items:center;gap:8px;color:var(--mc,#8edbe0);font:800 11px/1 var(--f-text);letter-spacing:.14em;text-transform:uppercase}\n.mc-kind::before{content:\"\";width:8px;height:8px;border-radius:50%;background:var(--accent-c);box-shadow:0 0 10px var(--accent-c)}\n.mc-x{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff}\n.map-card h1{margin:9px 0 5px;font:800 23px/27px var(--f-display);letter-spacing:-.02em}\n.map-card p{color:rgba(214,238,245,.75) (b - a) * t;\nfunction grad(h, x, y, z) { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14) ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }\nfunction noise(x, y, z) {\n  let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z); x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;\n  const u = fade(x), v = fade(y), w = fade(z), A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z, B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;\n  return lerp(lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u), lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),\n    lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u), lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);\n}\nfunction fbm(x, y, z, o) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * noise(x * f, y * f, z * f); f *= 2.03; a *= .5; } return s; }\n\n/* ===================== contours: marching squares, chained and smoothed ===================== */\nconst SEG = { 1: [['L', 'B']], 2: [['B', 'R']], 3: [['L', 'R']], 4: [['T', 'R']], 6: [['T', 'B']], 7: [['T', 'L']], 8: [['T', 'L']], 9: [['T', 'B']], 11: [['T', 'R']], 12: [['L', 'R']], 13: [['R', 'B']], 14: [['L', 'B']] };\nfunction contours(G, iso = 0, passes = 2) {\n  const { W, H, v, x0, y0, cell } = G, pts = new Map(), adj = new Map();\n  const val = (i, j) => (i <= 0 || j <= 0 || i >= W - 1 || j >= H - 1) ? -1 : v[j * W + i] - iso;\n  const key = (e, i, j) => e === 'T' ? `h${i},${j}` : e === 'B' ? `h${i},${j + 1}` : e === 'L' ? `v${i},${j}` : `v${i + 1},${j}`;\n  const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };\n  for (let j = 0; j < H - 1; j++) for (let i = 0; i < W - 1; i++) {\n    const a = val(i, j), b = val(i + 1, j), c = val(i + 1, j + 1), d = val(i, j + 1);\n    const idx = (a > 0 ? 8 : 0) | (b > 0 ? 4 : 0) | (c > 0 ? 2 : 0) | (d > 0 ? 1 : 0); if (idx === 0 || idx === 15) continue;\n    const P = { T: [i + a / (a - b), j], R: [i + 1, j + b / (b - c)], B: [i + d / (d - c), j + 1], L: [i, j + a / (a - d)] };\n    let segs = SEG[idx];\n    if (idx === 5) segs = (a + b + c + d) / 4 > 0 ? [['T', 'L'], ['R', 'B']] : [['T', 'R'], ['L', 'B']];\n    if (idx === 10) segs = (a + b + c + d) / 4 > 0 ? [['T', 'R'], ['L', 'B']] : [['T', 'L'], ['R', 'B']];\n    for (const [e1, e2] of segs) { const k1 = key(e1, i, j), k2 = key(e2, i, j); pts.set(k1, P[e1]); pts.set(k2, P[e2]); link(k1, k2); }\n  }\n  const seen = new Set(), loops = [];\n  for (const start of adj.keys()) { if (seen.has(start)) continue;\n    const loop = []; let prev = null, cur = start;\n    while (cur && !seen.has(cur)) { seen.add(cur); const p = pts.get(cur); loop.push([x0 + p[0] * cell, y0 + p[1] * cell]); const n = adj.get(cur); const next = n.find(k => k !== prev && !seen.has(k)); prev = cur; cur = next; }\n    if (loop.length > 5) loops.push(passes > 1 ? chaikin(chaikin(loop.filter((_, i) => i % 2 === 0))) : chaikin(loop)); }\n  return loops;\n}\nfunction chaikin(p) { const o = []; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; o.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]); } return o; }\nconst toD = loops => loops.map(l => 'M' + l.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') + 'Z').join('');\nfunction grid(x0, y0, x1, y1, cell, fn) { const W = Math.ceil((x1 - x0) / cell) + 1, H = Math.ceil((y1 - y0) / cell) + 1, v = new Float32Array(W * H);\n  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) v[j * W + i] = fn(x0 + i * cell, y0 + j * cell); return { W, H, v, x0, y0, cell }; }\nconst derive = (G, fn) => ({ ...G, v: G.v.map((val, k) => fn(val, G.x0 + (k % G.W) * G.cell, G.y0 + Math.floor(k / G.W) * G.cell, k)) });\n\n/* ===================== the planets ===================== */\nconst PLANETS = [\n  { id: 'inference', name: 'Inference & serving', type: 'lush', system: 'Machine learning', regions: ['Batching', 'Deployment', 'Latency', 'Cost'], sel: 1, route: 'Attention',\n    enc: { kind: 'A Reel', title: 'Where should the model run?', sum: 'Close to the people asking, or close to the hardware, and what each one costs.' } },\n  { id: 'attention', name: 'Attention', type: 'barren', system: 'Machine learning', regions: ['Context windows', 'Saliency', 'Heads', 'Memory'], sel: 0, route: 'Inference & serving', moon: true,\n    enc: { kind: 'A Scroll', title: 'Why long prompts get forgetful', sum: 'What happens to the middle of a very long context, and the tricks that help.' } },\n  { id: 'hardware', name: 'Hardware', type: 'scorched', system: 'Machine learning', regions: ['GPUs', 'Memory bandwidth', 'Interconnect', 'Cooling'], sel: 1, route: 'Inference & serving', rings: true, moon: true,\n    enc: { kind: 'A Reel', title: 'Why GPUs wait on memory', sum: 'Compute got fast. Moving the numbers around did not. Where the time really goes.' } },\n  { id: 'queues', name: 'Queues', type: 'gas', system: 'Backend systems', regions: ['Backpressure', 'Retries', 'Ordering', 'Dead letters'], sel: 0, route: 'Storage', rings: true,\n    enc: { kind: 'A Scroll', title: 'When consumers fall behind', sum: 'Buffers fill, latency climbs and something has to give. Backpressure decides what.' } },\n  { id: 'storage', name: 'Storage', type: 'frozen', system: 'Backend systems', regions: ['Replication', 'Indexes', 'Caching', 'Backups'], sel: 0, route: 'Queues', rings: true,\n    enc: { kind: 'A Reel', title: 'Leaders, followers and the lag', sum: 'Why a read can miss a write you just made, and how replicas catch up.' } },\n  { id: 'tactics', name: 'Tactics', type: 'ocean', system: 'Football', regions: ['Pressing', 'Formations', 'Set pieces', 'Counters'], sel: 0, moon: true,\n    enc: { kind: 'A Reel', title: 'Why teams press high', sum: 'Winning the ball near the goal is worth more than winning it anywhere else.' } },\n];\n\n/* ===================== one look per planet type: flat colour, soft edges ===================== */\nconst T = {\n  lush:     { label: 'Lush world', sea: ['#1d7d97', '#0f5670', '#052c41'], shallow: '#4fc3c9', globe: ['#7fd9d6', '#3fa8bd', '#1c6f93', '#0d3f5e'],\n              land: ['#6fd27f', '#a6e58a', '#4fb878', '#93d6a8'], hi: '#e9d9a0', lo: '#2f8f5c', coast: '#1e5a4a', cloud: ['#f6fcff', '#9dc0d4'], atmo: '#83f2ea', rim: '#b9fff2',\n              accent: '#33c4b4', mc: '#8edbe0', wave: 'rgba(203,245,255,.26)', current: 'rgba(196,242,255,.32)', grat: 'rgba(190,240,255,.1)', detail: 'waves', cover: .1, shadow: '#04283a' },\n  ocean:    { label: 'Ocean world', sea: ['#33a7ea', '#1667b6', '#0a2f6a'], shallow: '#7fd8f7', globe: ['#8fdcff', '#3d9fe0', '#1a63b4', '#0b3270'],\n              land: ['#7ee08e', '#5fcf7c', '#a5e88a', '#4fc06e'], hi: '#ffe7a8', lo: '#2f9a62', coast: '#1d5a4c', cloud: ['#ffffff', '#a7cbe6'], atmo: '#9fe0ff', rim: '#d4f4ff',\n              accent: '#ffd058', mc: '#ffe39a', wave: 'rgba(225,246,255,.34)', current: 'rgba(225,246,255,.36)', grat: 'rgba(210,240,255,.12)', detail: 'waves', archipelago: true, cover: -.1, shadow: '#082a5e' },\n  frozen:   { label: 'Frozen world', sea: ['#4f8fcf', '#24599a', '#0c2a52'], shallow: '#8fc4ef', globe: ['#bfe3fb', '#7fb2e2', '#3e78b8', '#173f72'],\n              land: ['#f4fbff', '#dcefff', '#c4e2ff', '#e8f6ff'], hi: '#ffffff', lo: '#a9cdee', coast: '#4a77a8', cloud: ['#ffffff', '#b2c8de'], atmo: '#c8ecff', rim: '#f0fbff',\n              accent: '#7fc8ff', mc: '#bfe4ff', wave: 'rgba(235,248,255,.3)', current: 'rgba(225,244,255,.3)', grat: 'rgba(220,240,255,.12)', detail: 'floes', caps: true, cover: .14, shadow: '#08203f' },\n  scorched: { label: 'Scorched world', sea: ['#5c1a2a', '#360b1a', '#17040b'], shallow: '#9a2c2c', globe: ['#c4503f', '#8a2232', '#55122a', '#2a0812'],\n              land: ['#ff8a5b', '#ff6b4d', '#ffa766', '#ea5a43'], hi: '#ffc48a', lo: '#b8402f', coast: '#ff9a4a', border: '#6a1a1f', cloud: ['#efdde0', '#a08088'], atmo: '#ff9a7a', rim: '#ffc2aa',\n              accent: '#ff6a4a', mc: '#ffb49a', wave: 'rgba(255,160,90,.3)', current: '#ff8a3d', grat: 'rgba(255,150,120,.08)', detail: 'lava', glowCoast: true, cover: .12, shadow: '#0b0105' },\n  barren:   { label: 'Barren world', sea: ['#8a7a9c', '#5a4c6c', '#2c2338'], shallow: '#a596b8', globe: ['#b9a6cc', '#8a76a2', '#5c4b76', '#2f2440'],\n              land: ['#f2d49c', '#e4bf80', '#d6aa6c', '#f7e2b6'], hi: '#fff0cf', lo: '#b98c58', coast: '#7a5a3a', cloud: ['#f5edf8', '#bba9cb'], atmo: '#dcc6ff', rim: '#f2e8ff',\n              accent: '#e8b86a', mc: '#f2d4a0', wave: 'rgba(240,226,255,.22)', current: 'rgba(240,226,255,.26)', grat: 'rgba(240,230,255,.08)', detail: 'craters', cover: .16, shadow: '#1c1428' },\n  gas:      { label: 'Gas giant', bands: ['#ffb48c', '#f592b0', '#c294e0', '#ffd8a6', '#ee86a4'], shallow: '#ffd9e6', globe: ['#ffe2c8', '#f6a2b6', '#b884d8', '#5c3a86'],\n              land: ['#fff5ea', '#ffe3d0', '#ffd3df', '#f2e0ff'], hi: '#ffffff', lo: '#f3c6dc', coast: '#c98aa8', cloud: ['#ffffff', '#e0bcd0'], atmo: '#ffb8d6', rim: '#ffe4ef',\n              accent: '#ff7aa8', mc: '#ffc2d8', wave: 'rgba(255,255,255,.3)', current: 'rgba(255,255,255,.34)', grat: 'rgba(255,240,250,.08)', detail: 'bands', soft: true, cover: .08, shadow: '#7a3a6a' },\n};\n\n/* ===================== world builder: several continents, explored ones split into regions, the rest locked ===================== */\nconst LOCK = { lush: ['#7b8d97', '#55666f', '#2a3a42'], ocean: ['#8496a6', '#5a6b7c', '#2c3c4c'], frozen: ['#9eacbb', '#76869a', '#3a4a5e'],\n  scorched: ['#6a565c', '#4a383e', '#251a1e'], barren: ['#8e869a', '#686076', '#363044'], gas: ['#cdbccc', '#a8949f', '#6e5a68'] };\nfunction placeConts(r, sizes, b, periodic) {\n  const dist = (a, c) => { let dx = Math.abs(a.x - c.x); if (periodic) dx = Math.min(dx, periodic - dx); return Math.hypot(dx, a.y - c.y); };\n  for (let loosen = 1; loosen > .4; loosen -= .1) {\n    const out = []; let guard = 0;\n    while (out.length < sizes.length && guard++ < 3000) { const s = sizes[out.length], c = { x: b.x0 + r() * (b.x1 - b.x0), y: b.y0 + r() * (b.y1 - b.y0), s, rot: r() * Math.PI, sx: .7 + r() * .6 };\n      if (out.some(o => dist(o, c) < (o.s + s) * loosen)) continue; out.push(c); }\n    if (out.length === sizes.length) return out;\n  }\n  return sizes.map((s, i) => ({ x: b.x0 + (i + .5) / sizes.length * (b.x1 - b.x0), y: (b.y0 + b.y1) / 2, s, rot: 0, sx: 1 }));\n}\nfunction buildWorld(P, o) {\n  const th = T[P.type], r = rng(P.id + o.tag), oz = r() * 50, N = o.noise;\n  const conts = placeConts(r, o.sizes, o.bounds, o.period), nExp = o.explored;\n  const dxOf = (x, c) => { let dx = x - c.x; if (o.period) { dx = ((dx % o.period) + o.period * 1.5) % o.period - o.period / 2; } return dx; };\n  const bump = (c, x, y) => { const dx = dxOf(x, c), dy = y - c.y, cs = Math.cos(c.rot), sn = Math.sin(c.rot), u = (dx * cs + dy * sn) / (c.s * c.sx), v = (-dx * sn + dy * cs) / (c.s / c.sx); return 1 - Math.hypot(u, v); };\n  const landFn = (x, y) => {\n    const wx = x + N(x, y, 110, oz + 1.1) * 48, wy = y + N(x, y, 110, oz + 2.3) * 48;\n    const base = Math.max(...conts.map(c => bump(c, wx, wy)));\n    const det = th.soft ? N(wx, wy, 80, oz + 3) * .35 + N(wx, wy, 34, oz + 4) * .14\n      : N(wx, wy, 70, oz + 3) * .42 + N(wx, wy, 30, oz + 4) * .26 + N(wx, wy, 13, oz + 5) * .16 + N(wx, wy, 6, oz + 6) * .09;\n    return base + det - .12;\n  };\n  const G = grid(o.x0, o.y0, o.x1, o.y1, o.cell, landFn);\n  // seeds: explored continents carry the planet's regions; each locked continent is one grey mass\n  const seeds = [], owner = [];\n  const perCont = o.perCont(P.regions.length, nExp);\n  conts.slice(0, nExp).forEach((c, ci) => { const k = perCont[ci], a0 = r() * TAU;\n    for (let q = 0; q < k; q++) { const a = a0 + q * TAU / k, d = k > 1 ? c.s * .45 : 0; seeds.push([c.x + Math.cos(a) * d * c.sx, c.y + Math.sin(a) * d / c.sx]); owner.push('region'); } });\n  conts.slice(nExp).forEach(c => { seeds.push([c.x, c.y]); owner.push('locked'); });\n  const warp = (x, y) => [N(x, y, 60, 9.1 + oz) * o.warp + N(x, y, 22, 5.5 + oz) * o.warp * .35, N(x, y, 60, 4.7 + oz) * o.warp + N(x, y, 22, 6.6 + oz) * o.warp * .35];\n  const D = []; for (let k = 0; k < G.v.length; k++) { const x = G.x0 + (k % G.W) * G.cell, y = G.y0 + Math.floor(k / G.W) * G.cell, [wx, wy] = warp(x, y);\n    D.push(seeds.map(s => { let dx = Math.abs(x + wx - s[0]); if (o.period) dx = Math.min(dx, o.period - dx); return Math.hypot(dx, y + wy - s[1]); })); }\n  const field = idx => derive(G, (val, x, y, k) => { const d = D[k]; let mine = Infinity, other = Infinity;\n    d.forEach((v, j) => { if (idx.includes(j)) mine = Math.min(mine, v); else other = Math.min(other, v); }); return Math.min(val, (other - mine) / 30); });\n  const deepest = F => { // a point well inside the region, close to its middle\n    let mx = -9, sx = 0, sy = 0, n = 0; F.v.forEach((v, k) => { if (v > mx) mx = v; if (v > 0) { sx += (k % F.W); sy += Math.floor(k / F.W); n++; } });\n    if (!n) return [F.x0, F.y0]; const cx = sx / n, cy = sy / n; let bk = 0, bd = Infinity;\n    F.v.forEach((v, k) => { if (v < mx * .35) return; const d = Math.hypot((k % F.W) - cx, Math.floor(k / F.W) - cy); if (d < bd) { bd = d; bk = k; } });\n    return [F.x0 + (bk % F.W) * F.cell, F.y0 + Math.floor(bk / F.W) * F.cell]; };\n  const regions = [], locked = [];\n  seeds.forEach((s, i) => { const F = field([i]); (owner[i] === 'region' ? regions : locked).push({ loops: contours(F, 0, 1), at: deepest(F), seed: s }); });\n  // keep names apart: push overlapping labels vertically, sized by the length of each name\n  for (let pass = 0; pass < 6; pass++) regions.forEach((g, i) => regions.forEach((h, j) => { if (j >= i) return;\n    const half = (P.regions[i].length + P.regions[j].length) * 4.3 + 8, dx = g.at[0] - h.at[0], dy = g.at[1] - h.at[1];\n    if (Math.abs(dx) < half && Math.abs(dy) < 24) { const push = (24 - Math.abs(dy)) / 2 + 1, sgn = dy >= 0 ? 1 : -1; g.at = [g.at[0], g.at[1] + push * sgn]; h.at = [h.at[0], h.at[1] - push * sgn]; } }));\n  const regIdx = owner.map((w, i) => w === 'region' ? i : -1).filter(i => i >= 0);\n  const explored = field(regIdx);\n  const pb = o.patchAll ? G : explored;\n  const hi = derive(pb, (val, x, y) => Math.min(val - .06, N(x, y, 90, 3.3 + oz) - .16)), lo = derive(pb, (val, x, y) => Math.min(val - .04, -N(x, y, 80, 7.9 + oz) - .2));\n  const landAt = (x, y) => { const i = Math.round((x - G.x0) / G.cell), j = Math.round((y - G.y0) / G.cell); return i < 0 || j < 0 || i >= G.W || j >= G.H ? -1 : G.v[j * G.W + i]; };\n  return { landAt, peaks: o.patchAll ? contours(G, .3, 1) : [], land: contours(G, 0, 1), shallow1: contours(G, -.07), shallow2: contours(G, -.15), regions, locked, conts, hi: contours(hi), lo: contours(lo) };\n}\nconst MAPC = new Map();\nfunction mapWorld(P) {\n  if (MAPC.has(P.id)) return MAPC.get(P.id);\n  const th = T[P.type], arch = th.archipelago;\n  const w = buildWorld(P, { tag: 'map', x0: -30, y0: -30, x1: 420, y1: 880, cell: 4, warp: arch ? 14 : 34,\n    noise: (x, y, s, z) => noise(x / s, y / s, z), bounds: { x0: 70, x1: 320, y0: 190, y1: 730 },\n    sizes: arch ? [62, 58, 56, 52, 50, 46, 44] : [118, 86, 84, 72, 64], explored: arch ? 4 : 2,\n    perCont: (n, e) => arch ? Array(e).fill(1) : [n - 1, 1] });\n  MAPC.set(P.id, w); return w;\n}\nconst GLOBEC = new Map();\nfunction globeWorld(P) { // a 480-unit band that wraps: noise is sampled on a cylinder, so the seam is invisible\n  if (GLOBEC.has(P.id)) return GLOBEC.get(P.id);\n  const th = T[P.type], k = 480 / TAU, arch = th.archipelago;\n  const N = (x, y, s, z) => { const u = x / 480 * TAU; return noise(Math.cos(u) * k / s + z * 3, Math.sin(u) * k / s + z, y / s); };\n  const w = buildWorld(P, { tag: 'globe', patchAll: true, x0: -60, y0: 0, x1: 540, y1: 360, cell: 3, warp: 20, period: 480, noise: N, bounds: { x0: 0, x1: 480, y0: 100, y1: 2 (.4 + Math.pow(r(), 3) * 1.4)}\" fill=\"#fffdf2\" opacity=\"${f1(.2 + r() * .7)}\"/>`).join('')}<\/svg><\/div>`; }\nfunction cloudPuff(r, x, y, sc, th) {\n  const lobes = 4 + ((r() * 3) | 0); let cx = 0, d = '';\n  for (let j = 0; j < lobes; j++) { const rr = 13 + r() * 13; d += `<circle cx=\"${f1(cx)}\" cy=\"${f1(-rr * .42 + r() * 4)}\" r=\"${f1(rr)}\"/>`; cx += rr * (.75 + r() * .35); }\n  d += `<rect x=\"-8\" y=\"-12\" width=\"${f1(cx + 16)}\" height=\"24\" rx=\"12\"/>`;\n  const flip = r() < .5 ? -1 : 1, anim = r() > .5 ? ` class=\"cloud\" style=\"--d:${f1(9 + r() * 9)}s;--dx:${f1(4 + r() * 6)}px\"` : '';\n  return `<g transform=\"translate(${f1(x)} ${f1(y)}) scale(${f1(sc * flip)} ${f1(sc)}) translate(${f1(-cx / 2)} 0)\"><g${anim}><g fill=\"${th.cloud[1]}\" transform=\"translate(0 5)\">${d}<\/g><g fill=\"${th.cloud[0]}\">${d}<\/g><\/g><\/g>`;\n}\nconst textLabel = (x, y, name, th, size = 15) => `<text x=\"${f1(x)}\" y=\"${f1(y)}\" text-anchor=\"middle\" font-family=\"Bricolage Grotesque\" font-weight=\"800\" font-size=\"${size}\" fill=\"#15302a\" paint-order=\"stroke\" stroke=\"#fffdf2\" stroke-width=\"5\" stroke-linejoin=\"round\">${name}<\/text>`;\n\n\n/* the planet view: saturated, flat cartoon biomes (every continent in full colour) */\nconst BIO = {\n  lush:     { globe: ['#a4f5ee', '#43c9d6', '#178cba', '#0a4f7e'], land: ['#5fd36f', '#8ee25c', '#3fbf6a', '#b5ea6a'], lo: '#2a9a55', hi: '#f2d57e', peak: '#9a8460', ink: '#14402e', foam: '#e9fffb', trees: '#1f8a4a', forms: 'mountains' },\n  ocean:    { globe: ['#b8f4ff', '#3fb4f0', '#1670cc', '#0a3a80'], land: ['#7ee06a', '#5fd07a', '#a6ec6a', '#4fc36e'], lo: '#2f9e55', hi: '#ffe08a', peak: '#8a9a6a', ink: '#12403a', foam: '#f2fdff', trees: '#228a4c', forms: 'mountains' },\n  frozen:   { globe: ['#e6f8ff', '#8fcaf5', '#3c86d0', '#163f80'], land: ['#f6fcff', '#d8efff', '#c2e6ff', '#e9f8ff'], lo: '#9fd2f5', hi: '#ffffff', peak: '#7894bb', ink: '#24497a', foam: '#ffffff', forms: 'mountains' },\n  scorched: { glo 0%\"><feGaussianBlur stdDeviation=\".9\"/><\/filter><filter id=\"cshadow${id}\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\"><feGaussianBlur stdDeviation=\"3\"/><\/filter>`;\n  return `<svg class=\"surface\" viewBox=\"0 0 960 360\"><defs>${defs}<clipPath id=\"slice${id}\"><rect x=\"0\" y=\"0\" width=\"480\" height=\"360\"/><\/clipPath>\n    <g id=\"band${id}\"><g clip-path=\"url(#slice${id})\">${body}<\/g><\/g><g id=\"cl${id}\"><g clip-path=\"url(#slice${id})\">${clouds}<\/g><\/g><g id=\"nm${id}\"><g clip-path=\"url(#slice${id})\">${names}<\/g><\/g><\/defs>\n    <use href=\"#band${id}\" x=\"0\"/><use href=\"#band${id}\" x=\"480\"/><g class=\"cloudband\"><use href=\"#cl${id}\" x=\"0\"/><use href=\"#cl${id}\" x=\"480\"/><use href=\"#cl${id}\" x=\"960\"/><\/g><use href=\"#nm${id}\" x=\"0\"/><use href=\"#nm${id}\" x=\"480\"/><\/svg>`;\n}\nfunction ringSVG(th, front) {\n  const rx = 215, ry = 48, arc = front ? `M${-rx} 0 A${rx} ${ry} 0 0 0 ${rx} 0` : `M${-rx} 0 A${rx} ${ry} 0 0 1 ${rx} 0`;\n  return `<svg class=\"ring ${front ? 'front' : 'back'}\" viewBox=\"-235 -235 470 470\"><g transform=\"rotate(-14)\" fill=\"none\" stroke-linecap=\"round\">\n    <path d=\"${arc}\" stroke=\"${th.land[2]}\" stroke-width=\"13\" opacity=\".9\"/><path d=\"${arc}\" stroke=\"${th.land[1]}\" stroke-width=\"4\" transform=\"scale(1.05 1.07)\" opacity=\".8\"/><path d=\"${arc}\" stroke=\"${th.hi}\" stroke-width=\"2\" transform=\"scale(.95 .93)\" opacity=\".7\"/><\/g><\/svg>`;\n}\nconst MOON = `<svg viewBox=\"0 0 40 40\"><circle cx=\"20\" cy=\"20\" r=\"15.6\" fill=\"#f1ead6\"/><path d=\"M20 4.4A15.6 15.6 0 0 1 20 35.6 20.5 20.5 0 0 0 20 4.4Z\" fill=\"#cbc3aa\"/>\n  <circle cx=\"14.6\" cy=\"15\" r=\"4.1\" fill=\"#ddd5bd\"/><circle cx=\"24.4\" cy=\"24.6\" r=\"2.7\" fill=\"#ddd5bd\"/><circle cx=\"15.8\" cy=\"26.4\" r=\"2.1\" fill=\"#ddd5bd\"/><\/svg>`;\nfunction screenPlanet(P) {\n  const th = T[P.type], g = BIO[P.type].globe;\n  const bg = `radial-gradient(circle at 38% 32%, ${g[0]} 0, ${g[1]} 35%, ${g[2]} 72%, ${g[3]} 100%)`;\n  const caps = th.caps ? `<svg class=\"caps\" viewBox=\"0 0 292 292\"><defs><filter id=\"capb${P.id}\"><feGaussianBlur stdDeviation=\"3\"/><\/filter><\/defs><g filter=\"url(#capb${P.id})\" fill=\"#fff\">\n    <path d=\"M30 46 Q90 20 146 30 Q210 18 262 46 Q230 70 190 62 Q160 78 120 66 Q80 76 30 46Z\" opacity=\".9\"/><path d=\"M40 252 Q100 236 146 246 Q200 232 252 252 Q200 290 146 286 Q90 292 40 252Z\" opacity=\".85\"/><\/g><\/svg>` : '';\n  return `<div class=\"phone\" data-anim style=\"--atmo-line:${th.atmo}aa;--atmo-glow:${th.atmo}66;--rim:${th.rim};--globe-bg:${bg}\">\n    ${stars(P.id)}\n    <div class=\"map-top\"><div class=\"pill\">${backIcon}${P.system}<\/div><\/div>\n    ${P.rings ? ringSVG(th, false) : ''}\n    <div class=\"globe-wrap\"><div class=\"atmosphere\"><\/div><div class=\"globe soft\">${surfaceBand(P, th)}${caps}<div class=\"shade\"><\/div><div class=\"glint\"><\/div><\/div><\/div>\n    ${P.rings ? ringSVG(th, true) : ''}\n    ${P.moon ? `<div class=\"moon\" data-moon>${MOON}<\/div>` : ''}\n    <div class=\"caption\"><span class=\"eyebrow\">A planet in ${P.system}<\/span><h1>${P.name}<\/h1><div class=\"hint\"><span>↔<\/span>Drag to rotate · tap to land<\/div><\/div>\n    <div class=\"chips\">${P.route ? `<span class=\"chip light\">Route to ${P.route}${fwdIcon}<\/span>` : ''}<span class=\"chip dark\">${listIcon}List view<\/span><\/div>\n    ${tabbar()}<div class=\"statusbar\"><span>9:41<\/span><i><\/i><\/div><\/div>`;\n}\n\n/* ===================== U04: landed on the map ===================== */\n/* Same saturated palette as the globe in U03, so landing reads as the same planet up close.\n   The world is drawn in map units and moved by a camera; names, markers and Uncharted tags are drawn\n   afterwards in screen space so they never scale with the camera and stay clear of the chrome. */\nconst SAFE = { card: { top: 112, bottom: 520 }, here: { top: 112, bottom: 680 } };\nconst pillLabel = (x, y, text, { fill = '#fffdf2', ink = '#15302a', dot, size = 13 } = {}) => {\n  const wd = text.length * size * .56 + (dot ? 40 : 26), px = Math.min(390 - wd / 2 - 14, Math.max(wd / 2 + 14, x));\n  return `<g transform=\"translate(${f1(px)} ${f1(y)})\"><rect x=\"${f1(-wd / 2)}\" y=\"-15\" width=\"${f1(wd)}\" height=\"30\" rx=\"15\" fill=\"${fill}\" stroke=\"#15302a\" stroke-width=\"2\"/>\n    ${dot ? `<circle cx=\"${f1(-wd / 2 + 15)}\" cy=\"0\" r=\"4.5\" fill=\"${dot}\"/>` : ''}<text x=\"${dot ? 7 : 0}\" y=\"${f1(size * .36)}\" text-anchor=\"middle\" font-family=\"Instrument Sans\" font-weight=\"700\" font-size=\"${size}\" fill=\"${ink}\">${text}<\/text><\/g>`;\n};\nfunction mapSVG(P, mode) {\n  const th = T[P.type], B = BIO[P.type], g4 = B.globe, r = rng(P.id + 'map'), id = P.id + mode, w = mapWorld(P), safe = SAFE[mode];\n  const sel = w.regions[P.sel];\n  // camera: the card view drops low over the chosen region and centres it above the card\n  const sp = sel.loops.reduce((a, l) => l.length > a.length ? l : a, []), xs = sp.map(p => p[0]), ys = sp.map(p => p[1]);\n  const bx0 = Math.min(...xs), bx1 = Math.max(...xs), by0 = Math.min(...ys), by1 = Math.max(...ys);\n  const z = mode === 'card' ? clamp(Math.min(300 / (bx1 - bx0), 330 / (by1 - by0)), 1.6, 2.1) : 1;\n  const tx = mode === 'card' ? 195 - (bx0 + bx1) / 2 * z : 0, ty = mode === 'card' ? (safe.top + safe.bottom) / 2 + 6 - (by0 + by1) / 2 * z : 0;\n  const S = (x, y) => [x * z + tx, y * z + ty], seen = (x, y, m = 0) => x > m && x < 390 - m && y > safe.top && y < safe.bottom;\n  const expB = w.regions.flatMap(g => g.loops.flat()), ex0 = Math.min(...expB.map(p => p[0])), ex1 = Math.max(...expB.map(p => p[0])), ey0 = Math.min(...expB.map(p => p[1])), ey1 = Math.max(...expB.map(p => p[1]));\n  const nearExp = (x, y, pad) => x > ex0 - pad && x < ex1 + pad && y > ey0 - pad && y < ey1 + pad;\n  let ground = '', detail = '', defs = `<filter id=\"glow${id}\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\"><feDropShadow dx=\"0\" dy=\"0\" stdDeviation=\"${f1(5 / z)}\" flood-color=\"#fff\" flood-opacity=\".9\"/><\/filter>\n    <filter id=\"soft${id}\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"120%\"><feGaussianBlur stdDeviation=\"3\"/><\/filter><filter id=\"shadow${id}\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"130%\"><feGaussianBlur stdDeviation=\"6\"/><\/filter>`;\n  if (th.detail === 'bands') {\n    defs += `<linearGradient id=\"sky${id}\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">${B.bands.map((c, i) => `<stop offset=\"${i / (B.bands.length - 1)}\" stop-color=\"${c}\"/>`).join('')}<\/linearGradient>`;\n    ground = `<rect x=\"-400\" y=\"-400\" width=\"1200\" height=\"1700\" fill=\"url(#sky${id})\"/><g class=\"band-drift\" filter=\"url(#soft${id})\">${Array.from({ length: 22 }, (_, i) => { const y = -200 + i * 60, c = B.bands[i % B.bands.length];\n      return `<path d=\"M-400 ${y} ${Array.from({ length: 14 }, (_, k) => `Q${-400 + k * 120 + 60} ${y + (k % 2 ? 14 : -14)} ${-400 + k * 120 + 120} ${y}`).join(' ')} V${y + 34} H-400Z\" fill=\"${c}\" opacity=\".7\"/>`; }).join('')}<\/g>`;\n    detail += `<g fill=\"none\" stroke=\"${th.current}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"14 22\" class=\"current-a\"><path d=\"M-20 140 Q120 110 260 150 T420 130\"/><path d=\"M-20 640 Q130 610 260 650 T420 630\"/><\/g>`;\n  } else {\n    defs += `<radialGradient id=\"sea${id}\" gradientUnits=\"userSpaceOnUse\" cx=\"195\" cy=\"380\" r=\"640\"><stop offset=\"0\" stop-color=\"${g4[1]}\"/><stop offset=\".45\" stop-color=\"${g4[2]}\"/><stop offset=\"1\" stop-color=\"${g4[3]}\"/><\/radialGradient>`;\n    ground = `<rect x=\"-400\" y=\"-400\" width=\"1200\" height=\"1700\" fill=\"url(#sea${id})\"/>`;\n    const paths = '<path class=\"current-a\" d=\"M-20 110 Q120 50 260 100 T420 140\"/><path class=\"current-b\" d=\"M-20 720 Q140 680 260 740 T420 710\"/><path class=\"current-a\" d=\"M372 220 Q410 420 362 580\"/><path class=\"current-b\" d=\"M20 230 Q-16 420 30 600\"/>';\n    detail += th.detail === 'lava'\n      ? `<g fill=\"none\" stroke=\"${th.current}\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"11 26\" filter=\"url(#soft${id})\">${paths}<\/g><g fill=\"none\" stroke=\"#ffc08a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"11 26\">${paths}<\/g>`\n      : `<g fill=\"none\" stroke=\"${th.current}\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-dasharray=\"11 26\">${paths}<\/g>`;\n    for (let gy = -60; gy < 900; gy += 54) for (let gx = -40; gx < 430; gx += 54) {\n      if (r() > .62) continue; const x = gx + r() * 70, y = gy + r() * 70; if (w.landAt(x, y) > -.14) continue; const k = 7 + r() * 5, rot = f1(r() * 22 - 11);\n      if (th.detail === 'waves') detail += `<path d=\"M0 0 q${f1(k / 2)} ${f1(-k * .55)} ${f1(k)} 0 t${f1(k)} 0\" transform=\"translate(${f1(x)} ${f1(y)}) rotate(${rot})\" fill=\"none\" stroke=\"${th.wave}\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>`;\n      else if (th.detail === 'floes') { const s = 5 + r() * 8; detail += `<ellipse cx=\"${f1(x)}\" cy=\"${f1(y)}\" rx=\"${f1(s)}\" ry=\"${f1(s * .6)}\" transform=\"rotate(${rot} ${f1(x)} ${f1(y)})\" fill=\"#eef8ff\" opacity=\".85\"/>`; }\n      else if (th.detail === 'lava') detail += r() < .5 ? `<circle class=\"bubble\" style=\"animation-delay:-${f1(r() * 3.6)}s\" cx=\"${f1(x)}\" cy=\"${f1(y)}\" r=\"${f1(2 + r() * 3)}\" fill=\"#ff9a4a\"/>`\n        : `<path d=\"M0 0 q8 6 16 0 t16 0\" transform=\"translate(${f1(x)} ${f1(y)}) rotate(${rot})\" fill=\"none\" stroke=\"rgba(255,138,61,.5)\" stroke-width=\"2\" stroke-linecap=\"round\"/>`;\n      else if (th.detail === 'craters') { const rr = 5 + r() * 12; detail += `<circle cx=\"${f1(x)}\" cy=\"${f1(y)}\" r=\"${f1(rr)}\" fill=\"rgba(30,20,44,.28)\"/><path d=\"M${f1(x - rr)} ${f1(y)} a${f1(rr)} ${f1(rr)} 0 0 1 ${f1(rr * 2)} 0\" fill=\"none\" stroke=\"rgba(245,232,255,.3)\" stroke-width=\"2\"/>`; }\n    }\n  }\n  // land, as on the globe: soft shallows, a foam edge, flat saturated regions with biome patches, dashed region borders, an inked coast\n  const all = toD(w.land), regLoops = toD(w.regions.flatMap(g => g.loops));\n  let land = `<path d=\"${toD(w.shallow2)}\" fill=\"${th.shallow}\" opacity=\".3\" fill-rule=\"evenodd\" filter=\"url(#soft${id})\"/><path d=\"${toD(w.shallow1)}\" fill=\"${B.foam}\" opacity=\".28\" fill-rule=\"evenodd\" filter=\"url(#soft${id})\"/>`;\n  land += `<path d=\"${all}\" fill=\"${th.shadow}\" opacity=\".45\" fill-rule=\"evenodd\" transform=\"translate(0 8)\" filter=\"url(#shadow${id})\"/>`;\n  if (th.glowCoast) land += `<path d=\"${regLoops}\" fill=\"none\" stroke=\"#ffb03a\" stroke-width=\"8\" opacity=\".7\" filter=\"url(#soft${id})\"/>`;\n  land += `<path d=\"${regLoops}\" fill=\"none\" stroke=\"${B.foam}\" stroke-width=\"4\" stroke-linejoin=\"round\" opacity=\".85\"/>`;\n  land += w.regions.map((g, i) => `<path d=\"${toD(g.loops)}\" fill=\"${B.land[i % 4]}\" fill-rule=\"evenodd\"/>`).join('');\n  defs += `<clipPath id=\"exp${id}\"><path d=\"${regLoops}\" clip-rule=\"evenodd\"/><\/clipPath>`;\n  land += `<g clip-path=\"url(#exp${id})\"><path d=\"${toD(w.lo)}\" fill=\"${B.lo}\" opacity=\".5\" fill-rule=\"evenodd\"/><path d=\"${toD(w.hi)}\" fill=\"${B.hi}\" opacity=\".55\" fill-rule=\"evenodd\"/><\/g>`;\n  land += w.regions.map(g => `<path d=\"${toD(g.loops)}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".5\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/>`).join('');\n  land += `<path d=\"${regLoops}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".75\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/>`;\n  // uncharted: flat grey, no detail\n  const LK = LOCK[P.type];\n  land += w.locked.map(g => `<path d=\"${toD(g.loops)}\" fill=\"${LK[1]}\" fill-rule=\"evenodd\" transform=\"translate(0 4)\"/><path d=\"${toD(g.loops)}\" fill=\"${LK[0]}\" fill-rule=\"evenodd\"/><path d=\"${toD(g.loops)}\" fill=\"none\" stroke=\"${LK[2]}\" stroke-opacity=\".6\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/>`).join('');\n  // the chosen region: everything else dims, the region keeps full colour under a white glow\n  let focus = '';\n  if (mode === 'card') focus = `<path d=\"M-400 -400H800V1300H-400Z${toD(sel.loops)}\" fill=\"#03121e\" opacity=\".42\" fill-rule=\"evenodd\"/>\n    <path d=\"${toD(sel.loops)}\" fill=\"none\" stroke=\"#fff\" stroke-width=\"${f1(3 / z)}\" stroke-linejoin=\"round\" filter=\"url(#glow${id})\"/>`;\n  // a frame of puffy cloud at the edge of what's charted\n  let clouds = ''; const rc = rng(P.id + 'cloud');\n  const ring = (x0, x1, y0, y1, s1, s2, lo, hi) => { const pts = []; for (let x = x0; x <= x1; x += s1) pts.push([x, y0], [x, y1]); for (let y = y0 + s2; y < y1 - s2 * .5; y += s2) pts.push([x0, y], [x1, y]);\n    pts.forEach(([px2, py2]) => { const x = px2 + rc() * 30 - 15, y = py2 + rc() * 30 - 15; if (y < 66 || nearExp(x, y, 18) || (x > 50 && x < 340 && y > 150 && y < 760)) return; clouds += cloudPuff(rc, x, y, lo + rc() * (hi - lo), th); }); };\n  ring(-30, 420, 0, 900, 80, 95, .9, 1.4);\n  // uncharted veils in map space\n  const rv = rng(P.id + 'veil'); let veils = '';\n  defs += `<radialGradient id=\"veil${id}\" cx=\"50%\" cy=\"50%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".42\"/><stop offset=\".62\" stop-color=\"#eef6fb\" stop-opacity=\".26\"/><stop offset=\"1\" stop-color=\"#e2eef8\" stop-opacity=\"0\"/><\/radialGradient>`;\n  w.locked.forEach((g, i) => { const c = w.conts[w.conts.length - w.locked.length + i], [ax, ay] = g.at;\n    veils += `<ellipse cx=\"${f1(ax)}\" cy=\"${f1(ay)}\" rx=\"${f1(c.s * 1.1)}\" ry=\"${f1(c.s * .9)}\" fill=\"url(#veil${id})\"/>`;\n    for (let q = 0; q < 2; q++) veils += cloudPuff(rv, ax + (rv() - .5) * c.s * 1.4, ay + (rv() - .5) * c.s, .5 + rv() * .35, th); });\n  // ---- screen space: names and markers (uncharted land is never labelled) ----\n  let ui = '';\n  const [sx, sy] = S(sel.at[0], sel.at[1]);\n  w.regions.forEach((g, i) => { const [x, y] = S(g.at[0], g.at[1]);\n    if (i === P.sel) return;\n    if (mode === 'card') { if (seen(x, y, P.regions[i].length * 4.3 + 10)) ui += `<g opacity=\".8\">${textLabel(x, y + 5, P.regions[i], th, 14)}<\/g>`; return; }\n    ui += textLabel(x, y + 5, P.regions[i], th, 15); });\n  if (mode === 'card') ui += pillLabel(sx, sy, P.regions[P.sel], { fill: '#FFE44D', ink: '#15302a', size: 15 });\n  else ui += `<g transform=\"translate(${f1(sx)} ${f1(sy - 22)})\"><circle class=\"port-ping\" r=\"13\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"/><circle r=\"13\" fill=\"var(--orange)\" stroke=\"#fff\" stroke-width=\"2.5\"/><circle r=\"4.5\" fill=\"#fff\"/><\/g>`\n    + pillLabel(sx, sy + 14, `${P.regions[P.sel]} · you were here`, { dot: 'var(--orange)' });\n  return `<svg viewBox=\"0 0 390 844\"><defs>${defs}<\/defs><g transform=\"translate(${f1(tx)} ${f1(ty)}) scale(${f1(z)})\">${ground}${detail}${land}${focus}${veils}${clouds}<\/g>${ui}<\/svg>`;\n}\nfunction screenMap(P, mode) {\n  const th = T[P.type], E = P.enc;\n  const top = `<div class=\"map-top\"><div class=\"pill\">${backIcon}${mode === 'card' ? P.name : P.system}<span class=\"level-chip\">${mode === 'card' ? 'Region' : 'Planet'}<\/span><\/div><\/div>`;\n  const bottom = mode === 'card'\n    ? `<div class=\"map-card\" style=\"--accent-c:${th.accent};--mc:${th.mc}\"><div class=\"mc-top\"><span class=\"mc-kind\">${E.kind} · in ${P.regions[P.sel]}<\/span><span class=\"mc-x\">✕<\/span><\/div><h1>${E.title}<\/h1><p>${E.sum}<\/p>\n        <div class=\"mc-acts\"><span class=\"go\">Open<\/span><span class=\"ghost\">Close<\/span><\/div><\/div>`\n    : `<div class=\"chips\">${P.route ? `<span class=\"chip light\">Route to ${P.route}${fwdIcon}<\/span>` : ''}<span class=\"chip dark\">${listIcon}List view<\/span><\/div>`;\n  return `<div class=\"phone\" data-anim><div class=\"map\">${mapSVG(P, mode)}<\/div>${top}${bottom}${tabbar()}<div class=\"statusbar\"><span>9:41<\/span><i><\/i><\/div><\/div>`;\n}\n\n\n/* ===================== the internals: search, outline, simple drawing ===================== */\nconst ICON = {\n  search: '<circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M20 20l-4-4\"/>', close: '<path d=\"M6 6l12 12M18 6L6 18\"/>', fwd: '<path d=\"M9 5l7 7-7 7\"/>', down: '<path d=\"M5 9l7 7 7-7\"/>',\n  arrow: '<path d=\"M5 12h14\"/><path d=\"M13 6l6 6-6 6\"/>', device: '<rect x=\"6\" y=\"2.5\" width=\"12\" height=\"19\" rx=\"3\"/><path d=\"M11 18.5h2\"/>',\n};\nconst ic = (n, sw = 2.4) => `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"${sw}\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${ICON[n]}<\/svg>`;\nconst byId = id => PLANETS.find(p => p.id === id);\n\n/* glyphs: a sun for a system, a tiny painted planet, a patch of land for a region, the station for a room */\nconst sunGlyph = (s = 18) => `<span class=\"g-sun\" style=\"width:${s}px;height:${s}px\"><\/span>`;\nfunction planetGlyph(type, s = 20, ringed) {\n  const g = BIO[type].globe, bg = type === 'gas' ? `linear-gradient(170deg, ${BIO.gas.bands.join(',')})` : `radial-gradient(circle at 34% 30%, ${g[0]}, ${g[1]} 42%, ${g[2]} 78%, ${g[3]})`;\n  return `<span class=\"g-planet${ringed ? ' ringed' : ''}\" style=\"width:${s}px;height:${s}px;background:${bg};--ring:${T[type].land[1]}\"><\/span>`;\n}\nconst BLOBS = ['M-8 -2Q-8 -7-3 -6Q0 -10 4 -7Q9 -6 7 -1Q9 3 6 5Q2 4 1 7Q-3 9-5 5Q-9 4-8 -2Z', 'M-6 -7Q-1 -9 2 -6Q6 -9 8 -4Q6 0 8 3Q7 8 2 7Q-1 5-3 8Q-8 7-7 2Q-10 -3-6 -7Z',\n  'M-5 -8Q0 -6 3 -8Q9 -7 7 -2Q4 1 8 4Q6 9 1 7Q-3 9-6 6Q-9 2-6 -1Q-9 -6-5 -8Z', 'M-8 0Q-9 -6-3 -6Q0 -10 5 -7Q9 -3 6 1Q8 6 3 7Q0 5-3 8Q-8 7-6 3Q-9 2-8 0Z'];\nconst regionGlyph = (type, i, s = 18) => `<svg class=\"g-region\" width=\"${s}\" height=\"${s}\" viewBox=\"-10 -10 20 20\"><path d=\"${BLOBS[i % 4]}\" fill=\"${BIO[type].land[i % 4]}\" stroke=\"${BIO[type].ink}\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><\/svg>`;\nconst roomGlyph = (s = 22) => `<svg width=\"${s}\" height=\"${s}\" viewBox=\"-16 -10 32 20\" aria-hidden=\"true\"><rect x=\"-7\" y=\"-4\" n  mk(46, () => ({ p: [camPos.x + (r() - .5) * 26, camPos.y + (r() - .5) * 18 - 2, camPos.z - 6 - r() * 22], size: 3 + r() * 6, c: [.55, .6, .8].map(v => v * (.25 + r() * .3)) }), { atten: 6, wob: .8, opacity: .8 });\n}\nconst CANDY = ['#FF7AD9', '#C58BFF', '#EBAAFF'];\nfunction toonNebula(R, n, seed, ctx, o = {}) {\n  const r = rng(seed), arms = 5, geo = new THREE.BufferGeometry(), F = k => new Float32Array(n * k);\n  const rho = F(1), arm = F(1), jit = F(1), size = F(1), hh = F(1), col = F(3);\n  for (let i = 0; i < n; i++) { rho[i] = r(); arm[i] = (r() * arms) | 0; jit[i] = (r() - .5) * (r() < .88 ? .32 : 1.6); size[i] = .7 + Math.pow(r(), 3) * 3.2; hh[i] = (r() - .5) * .14;\n    col.set(hexV(CANDY[(r() * CANDY.length) | 0]).toArray(), i * 3); }\n  geo.setAttribute('position', new THREE.BufferAttribute(F(3), 3));\n  [['aRho', rho, 1], ['aArm', arm, 1], ['aJit', jit, 1], ['aSize', size, 1], ['aH', hh, 1], ['aCol', col, 3]].forEach(([k, a, w]) => geo.setAttribute(k, new THREE.BufferAttribute(a, w)));\n  const pts = new THREE.Points(geo, new THREE.ShaderMaterial({ vertexShader: TOON_DUST_VS, fragmentShader: TOON_DUST_FS, transparent: true, depthWrite: false,\n    uniforms: { time: ctx.time, R: { value: R }, pr: { value: PR }, arms: { value: arms } } }));\n  pts.frustumCulled = false; const g = new THREE.Group(); g.add(halo(R * 1.15, 'pink', ctx, .35), pts);\n  const puffs = Array.from({ length: o.puffs ?? 22 }, () => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: PUFF, color: new THREE.Color(CANDY[(r() * 2) | 0]), opacity: .34, ...add }));\n    sp.material.rotation = r() * TAU; g.add(sp); return { sp, rho: .22 + r() * .6, arm: (r() * arms) | 0, jit: (r() - .5) * .12, s: (.12 + r() * .12) * R }; });\n  const core = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: new THREE.Color(1, .92, .98), opacity: 1, ...add }));\n  const bloom = new THREE.Sprite(new THREE.SpriteMaterial({ map: BLOOM, color: new THREE.Color(1, .45, .85), opacity: .8, ...add })); g.add(bloom, core);\n  g.userData.tick = t => {\n    const spin = t * .2;\n    for (const p of puffs) { const a = p.arm * TAU / arms + Math.log(p.rho / .05) * 1.25 + spin + p.jit; p.sp.position.set(Math.cos(a) * p.rho * R, 0, Math.sin(a) * p.rho * R); p.sp.scale.setScalar(p.s * (1 + .06 * Math.sin(t + p.rho * 9))); }\n    const b = 1 + .12 * Math.sin(t * 2.2); core.scale.setScalar(R * .24 * b); bloom.scale.setScalar(R * .9 * (2 - b));\n  };\n  g.userData.tick(0); return g;\n}\nfunction dustDisc(R, n, seed, ctx, pal) {\n  const r = rng(seed), A = () => new THREE.BufferAttribute(new Float32Array(n), 1), geo = new THREE.BufferGeometry();\n  const attrs = { aRho: A(), aArm: A(), aJit: A(), aSize: A(), aH: A() }; geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));\n  for (let i = 0; i < n; i++) { attrs.aRho.array[i] = r(); attrs.aArm.array[i] = (r() * 2) | 0; attrs.aJit.array[i] = (r() - .5) * .9; attrs.aSize.array[i] = .8 + Math.pow(r(), 2) * 2.4; attrs.aH.array[i] = (r() - .5) * .12; }\n  Object.entries(attrs).forEach(([k, v]) => geo.setAttribute(k, v));\n  const pts = new THREE.Points(geo, new THREE.ShaderMaterial({ vertexShader: DUST_VS, fragmentShader: DUST_FS, ...add,\n    uniforms: { time: ctx.time, R: { value: R }, pr: { value: PR }, cIn: { value: hexV(pal[0]) }, cMid: { value: hexV(pal[1]) }, cOut: { value: hexV(pal[2]) } } }));\n  pts.frustumCulled = false; const g = new THREE.Group(); g.add(pts, halo(R * 1.1, 'pink', ctx, .3));\n  const core = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: new THREE.Color(1, .7, .92), opacity: .95, ...add })); g.add(core);\n  g.userData.tick = t => core.scale.setScalar(R * .35 * (1 + .1 * Math.sin(t * 2))); g.userData.tick(0);\n  return g;\n}\nfunction solidMat(hex, ctx, calm = 0) { const c = hexV(hex).toArray().map(v => v * 255); return new THREE.ShaderMaterial({ vertexShader: WORLD_VS, fragmentShader: PLANET_FS,\n  uniforms: { map: { value: dataTex(new Uint8Array([...c, 255]), 1, 1) }, sun: { value: ctx.light }, atmo: { value: new THREE.Vector3(.4, .5, .8) }, cloudLayer: { value: 0 }, ...hazeU(ctx.fogR, calm) } }); }\nfunction makeStation(ctx, calm) {\n  const g = new THREE.Group();\n  g.add(new THREE.Mesh(new THREE.SphereGeometry(.2, 20, 12), solidMat('#EDE6D6', ctx, calm)));\n  const ring = new THREE.Mesh(new THREE.TorusGeometry(.32, .04, 8, 32), solidMat('#FFB347', ctx, calm)); ring.rotation.x = Math.PI / 2; g.add(ring);\n  for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(.46, .02, .2), solidMat('#3D8BEA', ctx, calm)); p.position.x = s * .58; g.add(p); }\n  const light = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: new THREE.Color(1, .5, .7), opacity: 1, ...add })); light.position.y = .27; light.scale.setScalar(.26); g.add(light);\n  g.userData.tick = t => { g.rotation.y = t * .15; light.material.opacity = calm ? .1 : Math.sin(t * 2.6) > .4 ? 1 : .12; };\n  return g;\n}\nfunction makeShip(ctx, scale = 1) {\n  const g = new THREE.Group(), body = new THREE.Mesh(new THREE.ConeGeometry(.09 * scale, .32 * scale, 12), solidMat('#FAF8F0', ctx));\n  const flame = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: new THREE.Color(1, .55, .15), opacity: .95, ...add }));\n  const dir = new THREE.Vector3(.5, .8, -.3).normalize(); body.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); flame.position.copy(dir.clone().multiplyScalar(-.2 * scale));\n  g.add(body, flame);\n  g.userData.tick = t => flame.scale.setScalar(.24 * scale * (1 + .18 * Math.sin(t * 19)));\n  return g;\n}\n\n/* ===================== scenes ===================== */\nconst CAMS = {\n  empty: { pos: [0, 4, 30], target: [0, 0, 0], drift: 1.6, fogR: [60, 140] },\n  emerging: { pos: [0, 17, 19], target: [0, -.8, 0], drift: .7, fogR: [60, 140] },\n  overview: { pos: [0, 22, 46], target: [0, 0, 2], drift: .9, fogR: [46, 105] },\n  lately: { pos: [0, 22, 46], target: [0, 0, 2], drift: .9, fogR: [46, 105] },\n  far: { pos: [0, 34, 76], target: [0, 0, -4], drift: 1.2, fogR: [62, 150] },\n  system: { pos: [0, 34, 52], target: [0, -.6, 0], drift: .6, fogR: [70, 150] },\n};\nconst OV = [\n  { name: 'Machine learning', x: -2.3, z: -10, family: 'teal', sunR: .78, planetR: .3, speed: .16, planets: [{ id: 'attention', R: 2.1, ang: Math.PI * 1.02 }, { id: 'inference', R: 3.3, ang: .3 }] },\n  { name: 'Backend systems', x: 2.9, z: 10, family: 'cobalt', sunR: .72, planetR: .28, speed: .16, quiet: true, planets: [{ id: 'queues', R: 1.9, ang: -.4 }, { id: 'storage', R: 3, ang: 2.55 }] },\n  { name: 'Football', x: -3.2, z: 15, family: 'coral', sunR: .7, planetR: .28, speed: .16, quiet: true, planets: [{ id: 'tactics', R: 2.1, ang: -.2 }] },\n];\nconst FAR = [['Economics', -16, -22, 'amber', 4], ['Machine learning', 7, -30, 'teal', 4.8], ['Astronomy', -21, 0, 'violet', 3.6], ['Backend systems', 18, -8, 'cobalt', 4.4],\n  ['Football', -6, 10, 'coral', 4], ['Climate', 18, 16, 'teal', 3.6], ['Predictive history', -18, 22, 'pink', 3.6]];\nconst V = (x, y, z) => new THREE.Vector3(x, y, z);\n\nclass Scene3D {\n  constructor(canvas, labelsEl, key) {\n    this.key = key; this.labelsEl = labelsEl; this.labels = []; this.ticks = []; this.visible = true;\n    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'low-power' });\n    this.renderer.setPixelRatio(PR); this.renderer.setSize(W, H, false); this.renderer.outputColorSpace = THREE.LinearSRGBColorSpace; this.renderer.setClearColor(0x020308);\n    const C = CAMS[key]; this.base = V(...C.pos); this.target = V(...C.target); this.drift = C.drift;\n    this.camera = new THREE.PerspectiveCamera(38, W / H, .1, 3000); this.scene = new THREE.Scene(); this.time = { value: 0 }; this.pointer = new THREE.Vector2(); this.pSmooth = new THREE.Vector2(); this.fly = null;\n    const ctx = { time: this.time, fogR: C.fogR, calm: 0, light: V(-30, 40, -20) };\n    makeSky(this.scene, 'sky' + key, ctx, this.base);\n    this.build(key, ctx);\n  }\n  label(text, pos, o = {}) { const el = document.createElement('div'); el.className = 'lbl' + (o.sm ? ' sm' : '') + (o.calm ? ' calm' : ''); el.textContent = text; this.labelsEl.appendChild(el); this.labels.push({ el, pos, dy: o.dy ?? 10 }); }\n  addSys(def, calm) { const s = makeSystem({ ...def, calm }, { time: this.time, fogR: CAMS[this.key].fogR }); this.scene.add(s); this.ticks.push(s.userData.tick); return s; }\n  build(key, ctx) {\n    const live = obj => () => obj.getWorldPosition(new THREE.Vector3());\n    if (key === 'emerging') { const d = toonNebula(4.6, 4200, 'dust', ctx); d.position.set(0, 0, 0); this.scene.add(d); this.ticks.push(d.userData.tick); }\n    if (key === 'overview' || key === 'lately') {\n      const lately = key === 'lately', systems = OV.map(d => this.addSys(d, lately && d.quiet));\n      const cue = toonNebula(2.6, 700, 'cue', ctx, { puffs: 6 }); cue.position.set(8.7, 1, -30); this.scene.add(cue); this.ticks.push(cue.userData.tick);\n      const st = makeStation({ ...ctx, light: V(-2.3, 0, -10) }, lately ? 1 : 0); st.position.set(2.4, .7, 0); this.scene.add(st); this.ticks.push(st.userData.tick);\n      if (!lately) { const att = systems[0].userData.planets[0], sh = makeShip({ ...ctx, light: systems[0].position }); sh.position.set(.45, .5, 0); att.add(sh); this.ticks.push(sh.userData.tick); }\n      systems.forEach((s, i) => this.label(OV[i].name, s.position.clone(), { calm: lately && OV[i].quiet, dy: 26 }));\n      this.label('Model serving room', st.position.clone().add(V(0, -.3, 0)), { sm: true, calm: lately, dy: 10 });\n      this.flyTo = systems[0].position.clone();\n    }\n    if (key === 'far') {\n      FAR.forEach(([name, x, z, family, R], i) => {\n        const g = new THREE.Group(); g.position.set(x * .42, 0, z); g.add(halo(R, family, ctx, .65)); const sun = makeSun(.55, ctx); g.add(sun); this.scene.add(g); this.ticks.push(sun.userData.tick);\n        if (i === 1) { const pick = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: new THREE.Color(1, .9, .35), opacity: .55, ...add })); g.add(pick);\n          this.ticks.push(t => { const k = .5 + .5 * Math.sin(t * 2.2); pick.scale.setScalar(R * (1.1 + .25 * k)); pick.material.opacity = .3 + .3 * k; }); }\n        this.label(name, g.position.clone().add(V(0, 0, R * .45)), { dy: i === 1 ? 16 : 6, sm: i !== 1 });\n      });\n    }\n    if (key === 'system') {\n      const s = this.addSys({ name: 'Machine learning', x: 0, z: 0, family: 'teal', sunR: 1.7, planetR: .55, speed: .07, kepler: .5, glow: .4,\n        planets: [{ id: 'attention', R: 3.8, ang: Math.PI * .95 }, { id: 'inference', R: 6.3, ang: .35 }, { id: 'hardware', R: 8.8, ang: -1.75 }] }, false);\n      const [a, b, c] = s.userData.planets, route = dashLine([V(0, 0, 0), V(1, 0, 0)], V(1, .98, .92), ctx, { speed: .7, dash: .14, gap: .3, opacity: .7 }); this.scene.add(route);\n      this.ticks.push(() => { const pa = a.getWorldPosition(V()), pb = b.getWorldPosition(V()), mid = pa.clone().lerp(pb, .5).add(V(0, 1.8, 0));\n        route.geometry.setFromPoints(new THREE.QuadraticBezierCurve3(pa, mid, pb).getPoints(60)); route.computeLineDistances(); });\n      const st = makeStation({ ...ctx, light: V() }, 0); st.position.set(-3.6, -.5, 6.6); st.scale.setScalar(1.3); this.scene.add(st); this.ticks.push(st.userData.tick);\n      const sh = makeShip({ ...ctx, light: V() }, 1.3); sh.position.set(.75, .6, 0); b.add(sh); this.ticks.push(sh.userData.tick);\n      [['Attention', a, 24], ['Inference & serving', b, 24], ['Hardware', c, 34]].forEach(([n, p, dy]) => this.label(n, live(p), { dy }));\n      this.label('Model serving room', st.position.clone().add(V(0, -.45, 0)), { sm: true, dy: 10 });\n    }\n  }\n  startFly() { if (!this.flyTo || this.fly) return; this.fly = { t0: this.time.value }; }\n  render(t) {\n    this.time.value = t; this.ticks.forEach(f => f(t)); this.pSmooth.lerp(this.pointer, .06);\n    let pos = this.base.clone().add(V(Math.sin(t * .11) * .6 * this.drift + this.pSmooth.x * 1.6, Math.sin(t * .07) * .4 * this.drift - this.pSmooth.y * 1.1, Math.sin(t * .05) * .5 * this.drift));\n    let target = this.target.clone(), fov = 38;\n    if (this.fly) { const e = t - this.fly.t0, k = e < 2.4 ? e / 2.4 : e < 4.6 ? 1 : e < 6.8 ? 1 - (e - 4.6) / 2.2 : 0, s = k * k * (3 - 2 * k);\n      if (e > 6.8) this.fly = null;\n      pos = pos.lerp(this.flyTo.clone().add(V(0, 4.2, 8.5)), s); target = target.lerp(this.flyTo, s); fov = 38 + Math.sin(s * Math.PI) * 9; }\n    this.camera.position.copy(pos); this.camera.fov = fov; this.camera.updateProjectionMatrix(); this.camera.lookAt(target);\n    this.renderer.render(this.scene, this.camera);\n    for (const l of this.labels) { const v = (typeof l.pos === 'function' ? l.pos() : l.pos.clone()).project(this.camera); if (v.z > 1) { l.el.style.display = 'none'; continue; }\n      l.el.style.display = ''; l.el.style.transform = `translate(${(v.x * .5 + .5) * W}px, ${(-v.y * .5 + .5) * H + l.dy}px) translate(-50%, 0)`; }\n  }\n}\n\n\n/* ===================== mount the 3D scenes behind search ===================== */\nconst scenes = [], reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\ndocument.querySelectorAll('[data-scene]').forEach(ph => {\n  const sc = new Scene3D(ph.querySelector('canvas'), ph.querySelector('.labels'), ph.dataset.scene);\n  ph.addEventListener('pointermove', e => { const b = ph.getBoundingClientRect(); sc.pointer.set((e.clientX - b.left) / b.width * 2 - 1, (e.clientY - b.top) / b.height * 2 - 1); });\n  ph.addEventListener('pointerleave', () => sc.pointer.set(0, 0));\n  sc.render(4); scenes.push(sc);\n});\nlet last = 0;\nfunction loop(now) { requestAnimationFrame(loop); if (window.__paused || reduce || now - last < 33) return; last = now; const t = 4 + now / 1000; scenes.forEach(sc => sc.render(t)); }\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "Orbit dial", "path": "world-internals/finalized-orbit-dial.html", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Finalized Orbit Dial<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<!--\n  FINALIZED: List view as the orbit dial (O1 system wheel turning, O2 system search and filter, O3 dial at rest, O4 planet search).\n  Approved as drawn in world-internals-05.html. Systems are rendered by the U08 Far / U02 System 3D code from universe-drafts-05.html,\n  with the sun glow a fifth dimmer and the colour haze a little fuller. The round-01 outline sheet stays the List view when Simple drawing is on.\n  Menus written plainly (approved 2026-10-28, from test.html): text rows, hairlines, no glyph tiles, no glass, no outlined boxes. See #plain-menus.\n  Consistency pass (2026-10-28): one tab bar (glass), one paper/ink pair (#FFFDF2 / #15302A), no dashed route on U02, uncharted never written.\n-->\n<style>\n\n:root{\n  --paper:#FFFDF2; --cream:#fffdf2; --ink:#15302A; --ink2:#566962; --accent:#2C46E8; --orange:#ff684c; --focus:#FFE44D;\n  --f-display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;\n  --f-text:'Instrument Sans',system-ui,sans-serif;\n  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;\n  --page:#0C0C0E; --page-ink:#F2EEE3; --page-ink2:#A29C8E; --page-edge:rgba(242,238,227,.16);\n}\n:root[data-theme=\"light\"]{ --page:#E9E4D6; --page-ink:#111111; --page-ink2:#5B5649; --page-edge:rgba(21,48,42,.18); }\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:var(--page);color:var(--page-ink);font-family:var(--f-text);padding:32px 16px 80px}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer}\n.intro{max-width:1240px;margin:0 auto 18px}\n.intro .kicke
