aphicCamera(-W / 2, W / 2, H / 2, -H / 2, 1, 6000);\n  cam.position.set(0, Math.sin(ELEV) * 3000, Math.cos(ELEV) * 3000); cam.lookAt(0, 0, 0);\n  const time = { value: 0 }, ticks = [], ctx = { time, fogR: [1e5, 2e5] };\n  spots.forEach(el => {\n    const S = +el.dataset.s, sx = +el.dataset.x, sy = +el.dataset.y, fam = el.dataset.fam, list = JSON.parse(el.dataset.planets), outer = S / 3;\n    list.forEach(p => { if (!G[p.id]) { G[p.id] = genome(p.id, fam); G[p.id].type = p.type; G[p.id].rings = p.type === 'gas'; } });\n    const sys = makeSystem({ x: sx - W / 2, z: -(H / 2 - sy) / Math.sin(ELEV), family: fam, sunR: Math.max(2.4, S * .075), planetR: Math.max(1.8, S * .032), speed: .16, glow: 1.5,\n      planets: list.map((p, i) => ({ id: p.id, R: outer * (.5 + .5 * (i + 1) / list.length), ang: i * 2.2 + .6 })) }, ctx);\n    const haloMesh = sys.children[0]; haloMesh.material.fragmentShader = HALO_FULL; haloMesh.material.needsUpdate = true;\n    sys.traverse(o => { if (o.isSprite) o.material.opacity *= SUN_DIM; });\n    if (el.dataset.pick) { const R = outer * 1.5, pick = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: new THREE.Color(1, .9, .35), opacity: .5, ...add })); sys.add(pick);\n      ticks.push(t => { const k = .5 + .5 * Math.sin(t * 2.2); pick.scale.setScalar(R * 2 * (.9 + .2 * k)); pick.material.opacity = .22 + .22 * k; }); }\n    scene.add(sys); ticks.push(sys.userData.tick);\n  });\n  return t => { time.value = t; ticks.forEach(f => f(t)); renderer.render(scene, cam); };\n}\nconst wheels = [...document.querySelectorAll('[data-wheel]')].map(mountWheel).filter(Boolean);\nwheels.forEach(w => w(4));\nlet last2 = 0;\nfunction wheelLoop(now) { requestAnimationFrame(wheelLoop); if (window.__paused || reduce || now - last2 < 33) return; last2 = now; const t = 4 + now / 1000; wheels.forEach(w => w(t)); }\nrequestAnimationFrame(wheelLoop);\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "Simple views", "path": "world-internals/simple-views-finalized.html", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Simple Views Finalized<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<!--\n  Simple views, FINALIZED (from round 04, approved 2026-10-28). Do not change.\n  Round 04: the row where you were is a plain yellow fill (no outline or ring) with a small red dot sending out single ripples.\n  Round 03: only places you can visit are listed; system names are headings.\n  Simple drawing on means plain lists, no drawings.\n  Two screens: 1) Your universe, systems with the planets inside them. 2) A planet, the countries (regions) inside it.\n  Chrome follows the U08 outline sheet: cream paper, ink text, mono labels, yellow for where you are.\n  Menus written plainly (approved 2026-10-28, from test.html): text rows, hairlines, no glyph tiles, no glass, no outlined boxes. See #plain-menus.\n  Consistency pass (2026-10-28): one tab bar (glass), one paper/ink pair (#FFFDF2 / #15302A), no dashed route on U02, uncharted never written.\n-->\n<style>\n:root{\n  --paper:#fffdf2; --paper2:#f4edd8; --ink:#15302a; --ink2:rgba(21,48,42,.62); --line:rgba(21,48,42,.1); --orange:#ff684c; --focus:#FFE44D;\n  --f-display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;\n  --f-text:'Instrument Sans',system-ui,sans-serif;\n  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;\n  --page:#0C0C0E; --page-ink:#F2EEE3; --page-ink2:#A29C8E;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:var(--page);color:var(--page-ink);font-family:var(--f-text);padding:32px 16px 80px}\n.intro{max-width:1000px;margin:0 auto 32px}\n.intro .kicker{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--page-ink2)}\n.intro h1{font:800 36px/40px var(--f-display);letter-spacing:-.02em;margin-top:6px}\n.intro p{color:var(--page-ink2);font-size:15px;line-height:22px;margin-top:8px;max-width:760px}\n.phones{display:flex;flex-wrap:wrap;gap:40px 28px;justify-content:center}\nfigure{display:flex;flex-direction:column;gap:10px;width:390px}\nfigcaption b{font:500 11px/14px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;display:block;color:var(--page-ink2)}\nfigcaption span{font:700 16px/21px var(--f-display);display:block;margin-top:2px}\nfigcaption small{font-size:12.5px;line-height:18px;color:var(--page-ink2);display:block;margin-top:3px}\n\n/* ---------- phone ---------- */\n.phone{width:390px;height:844px;position:relative;overflow:hidden;border-radius:38px;background:var(--paper);color:var(--ink);\n  box-shadow:0 0 0 8px #050505,0 0 0 9px #26272b,0 30px 60px -24px rgba(0,0,0,.8)}\n.statusbar{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 34px;font:600 15px/1 var(--f-text);z-index:40;background:var(--paper)}\n.statusbar i{width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px;display:inline-block;position:relative}\n.statusbar i:after{content:\"\";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px}\n.scroll{position:absolute;inset:47px 0 0;overflow:hidden;padding:10px 16px 120px}\n\n/* header */\n.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}\n.top h1{font:800 30px/34px var(--f-display);letter-spacing:-.02em}\n.ib{width:42px;height:42px;border-radius:50%;background:rgba(21,48,42,.08);display:grid;place-items:center;flex:none}\n.ib svg{width:19px;height:19px}\n.back{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 8px;border-radius:14px;background:rgba(21,48,42,.08);font:800 14px/1 var(--f-text)}\n.back svg{width:17px;height:17px}\n.title{margin-top:14px}\n.title h1{font:800 30px/34px var(--f-display);letter-spacing:-.02em}\n.title p{font:500 14px/20px var(--f-text);color:var(--ink2);margin-top:4px}\n.sub{font:500 14px/20px var(--f-text);color:var(--ink2);margin-top:2px}\n\n/* simple toggle */\n.mode{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 12px 10px 14px;border-radius:16px;background:var(--paper2)}\n.mode b{display:block;font:800 14px/18px var(--f-text)}\n.mode small{display:block;font:500 12px/16px var(--f-text);color:var(--ink2)}\n.sw{width:40px;height:24px;border-radius:12px;background:#14C79B;position:relative;flex:none}\n.sw::after{content:\"\";position:absolute;top:3px;left:19px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}\n\n/* a system: its name is the heading */\n.sys{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:26px 4px 10px}\n.sys h2{font:800 23px/27px var(--f-display);letter-spacing:-.015em;color:var(--ink)}\n.sys span{font:600 13px/1 var(--f-text);color:var(--ink2);white-space:nowrap}\n.sys.first{padding-top:20px}\n\n/* grouped list */\n.label{display:flex;justify-content:space-between;gap:10px;padding:22px 6px 8px;font:500 11px/14px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(21,48,42,.58)}\n.group{border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}\n.row{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px 8px 16px;border-top:1px solid var(--line)}\n.row:first-child{border-top:0}\n.row .tx{flex:1;min-width:0}\n.row .t{display:block;font:700 16px/21px var(--f-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.row .m{display:flex;align-items:center;gap:6px;font:500 13px/17px var(--f-text);color:var(--ink2)}\n.row .m i{width:7px;height:7px;border-radius:50%;background:var(--orange);flex:none}\n.row .ch{width:18px;height:18px;color:rgba(21,48,42,.4);flex:none}\n.row.cur{background:#FFEC7A;border-top-color:transparent}\n.row.cur + .row{border-top-color:transparent}\n.row.cur .m{color:var(--ink)}\n.row.muted .t{color:var(--ink2)}\n.row .lk{width:18px;height:18px;color:var(--ink2);flex:none}\n/* where you were: a small red dot that sends out one ring at a time */\n.pulse{position:relative;width:8px;height:8px;margin-right:10px;flex:none}\n.pulse b,.pulse i{position:absolute;inset:0;border-radius:50%}\n.pulse b{background:#ff3b30;z-index:1}\n.pulse i{border:1.5px solid #ff3b30;animation:ripple 2.2s ease-out infinite}\n@keyframes ripple{0%{transform:scale(1);opacity:.9}65%{transform:scale(3.6);opacity:0}100%{transform:scale(3.6);opacity:0}}\n@media (prefers-reduced-motion:reduce){.pulse i{animation:none;opacity:0}}\n.here{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:var(--ink);color:var(--focus);font:800 10px/1 var(--f-text);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}\n\n/* tab bar, solid */\n.worldnav{position:absolute;z-index:35;left:14px;right:14px;bottom:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border-radius:24px;background:#141a22;box-shadow:0 12px 30px rgba(0,0,0,.25)}\n.nav-tab{display:grid;gap:5px;justify-items:center;padding:9px 4px 8px;color:rgba(255,255,255,.6);border-radius:17px;font:800 11px/1 var(--f-text)}\n.nav-tab svg{width:21px;height:21px}\n.nav-tab.is-active{color:#fff;background:rgba(255,255,255,.13)}\n.fade{position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(rgba(255,253,242,0),var(--paper) 45%);z-index:30;pointer-events:none}\n#err{position:fixed;left:12px;bottom:12px;max-width:600px;background:#B23A0B;color:#fff;font:12px/16px var(--f-mono);padding:10px;border-radius:8px;display:none;white-space:pre-wrap;z-index:99}\n@media (max-width:440px){figure{width:100%}.phone{transform:scale(.86);transform-origin:top left;margin-bottom:-118px}}\n<\/style>\n<style id=\"plain-menus\">\n/* Menus written plainly, like the original app (approved 2026-10-28): search dropdowns, filters, lists, side menu and panel. Bottom tab bar unchanged. */\n.group{background:none!important;box-shadow:none!important;border-radius:0!important;overflow:visible!important}\n.row{padding:10px 4px!important;min-height:52px!important;border-top:1px solid rgba(21,48,42,.12)!important}\n.row:first-child{border-top:0!important}\n.row .ch{display:none!important}\n.row.cur{margin:0 -12px!important;padding:10px 16px!important;border-radius:12px!important}\n.mode{background:none!important;padding:0 4px!important;border-top:1px solid rgba(21,48,42,.12);border-bottom:1px solid rgba(21,48,42,.12);border-radius:0!important;padding:10px 4px!important}\n.back,.ib{background:none!important}\n.back{padding:0!important}\n<\/style>\n<\/head>\n<body>\n<header class=\"intro\">\n  <span class=\"kicker\">KnowScroll · Universe · Simple views · finalized<\/span>\n  <h1>Simple view: just the lists<\/h1>\n  <p>With Simple drawing on, the Universe tab becomes two plain lists. No pictures, no motion. 1) Your universe: each system with the planets inside it. 2) A planet: the countries (regions) inside it. Tap a planet to open its countries; tap a country to land.<\/p>\n<\/header>\n<main class=\"phones\" id=\"grid\"><\/main>\n<div id=\"err\"><\/div>\n<script>window.addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += (e.message || 'error') + '\\n'; });<\/script>\n<script>\nconst ICON = {\n  search: '<circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M20 20l-4-4\"/>', fwd: '<path d=\"M9 5l7 7-7 7\"/>', back: '<path d=\"M15 5l-7 7 7 7\"/>',\n};\nconst ic = (n, cls = '', sw = 2.4) => `<svg class=\"${cls}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"${sw}\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${ICON[n]}<\/svg>`;\nconst plural = (n, w) => `${n} ${n === 1 ? w : w.endsWith('y') ? w.slice(0, -1) + 'ies' : w + 's'}`;\nconst statusbar = '<div class=\"statusbar\"><span>9:41<\/span><i><\/i><\/div>';\nconst tabbar = () => `<nav class=\"worldnav\">${[\n  ['Explore', '<rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"3\"/><path d=\"M8 3l4 4 4-4\"/>'],\n  ['Universe', '<circle cx=\"12\" cy=\"12\" r=\"3.5\"/><ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4.5\" transform=\"rotate(-20 12 12)\"/>', 1],\n  ['Talk', '<path d=\"M4 5h16v11H9l-5 4z\"/>'], ['Keep', '<path d=\"M6 3h12v18l-6-4-6 4z\"/>']].map(([l, d, on]) =>\n  `<div class=\"nav-tab${on ? ' is-active' : ''}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${d}<\/svg><span>${l}<\/span><\/div>`).join('')}<\/nav>`;\n\n/* the same universe as every other round */\nconst SYSTEMS = [\n  { name: 'Machine learning', planets: [\n    { name: 'Attention', regions: 4 },\n    { name: 'Inference & serving', regions: 4, here: 'Deployment' },\n    { name: 'Hardware', regions: 4 }] },\n  { name: 'Backend systems', planets: [{ name: 'Queues', regions: 4 }, { name: 'Storage', regions: 4 }] },\n  { name: 'Football', planets: [{ name: 'Tactics', regions: 4 }] },\n];\nconst ROOMS = [{ name: 'Model serving room', where: 'Machine learning' }];\nconst PLANET = { name: 'Inference & serving', system: 'Machine learning', regions: ['Batching', 'Deployment', 'Latency', 'Cost'], sel: 1 };\n\nconst row = (t, m, o = {}) => `<div class=\"row${o.cur ? ' cur' : ''}${o.muted ? ' muted' : ''}\"><span class=\"tx\"><span class=\"t\">${t}<\/span>${m ? `<span class=\"m\">${m}<\/span>` : ''}<\/span>${o.tail ?? ic('fwd', 'ch')}<\/div>`;\n\n/* 1 · Your universe: systems, with their planets inside */\nfunction screenUniverse() {\n  const groups = SYSTEMS.map((s, i) => `<div class=\"sys${i ? '' : ' first'}\"><h2>${s.name}<\/h2><span>${plural(s.planets.length, 'planet')}<\/span><\/div>\n    <div class=\"group\">${s.planets.map(p => row(p.name, p.here ? `<i><\/i>You were here · ${p.here}` : plural(p.regions, 'country'))).join('')}<\/div>`).join('');\n  return `<div class=\"phone\">${statusbar}<div class=\"scroll\">\n    <div class=\"top\"><h1>Your universe<\/h1><span class=\"ib\">${ic('search')}<\/span><\/div>\n    <p class=\"sub\">${plural(SYSTEMS.length, 'system')} · ${plural(SYSTEMS.reduce((a, s) => a + s.planets.length, 0), 'planet')}<\/p>\n    <div class=\"mode\"><div><b>Simple view<\/b><small>Plain lists, for slow devices<\/small><\/div><span class=\"sw\"><\/span><\/div>\n    ${groups}\n    <div class=\"label\"><span>Rooms<\/span><span>${ROOMS.length}<\/span><\/div>\n    <div class=\"group\">${ROOMS.map(r => row(r.name, `In ${r.where}`)).join('')}<\/div>\n  <\/div><div class=\"fade\"><\/div>${tabbar()}<\/div>`;\n}\n\n/* 2 · A planet: the countries inside it */\nfunction screenPlanet() {\n  const P = PLANET;\n  const rows = P.regions.map((r, i) => i === P.sel ? row(r, 'Last place you visited', { cur: 1, tail: '<span class=\"pulse\" title=\"You were here\"><i><\/i><b><\/b><\/span>' }) : row(r)).join('');\n  return `<div class=\"phone\">${statusbar}<div class=\"scroll\">\n    <div class=\"top\"><span class=\"back\">${ic('back')}Your universe<\/span><span class=\"ib\">${ic('search')}<\/span><\/div>\n    <div class=\"title\"><h1>${P.name}<\/h1><p>A planet in ${P.system} · ${plural(P.regions.length, 'country')}<\/p><\/div>\n    <div class=\"label\"><span>Countries<\/span><span>Tap to land<\/span><\/div>\n    <div class=\"group\">${rows}<\/div>\n  <\/div><div class=\"fade\"><\/div>${tabbar()}<\/div>`;\n}\n\nconst fig = (html, code, title, note) => `<figure>${html}<figcaption><b>${code}<\/b><span>${title}<\/span><small>${note}<\/small><\/figcaption><\/figure>`;\ndocument.getElementById('grid').innerHTML =\n  fig(screenUniverse(), 'Simple view · 1', 'Your universe', 'Each system’s name is a heading, its planets are the rows under it, with how many countries each holds. The orange dot marks where you were. Rooms at the end. The switch turns Simple view off.') +\n  fig(screenPlanet(), 'Simple view · 2', 'Countries inside a planet', 'Opened by tapping Inference & serving. Every country in one list; the yellow row with the rippling red dot is where you were.');\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "Misc", "path": "misc/misc-finalized.html", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Misc Finalized<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<!--\n  Misc screens, FINALIZED (from round 01, approved 2026-10-28). Do not change.\n  Round 01: U06 Friend visit, Error Offline, Notice Formation unavailable.\n  Built on the approved space look: the three.js scene code from universe-above/universe-drafts-05.html (makeSystem, makeSun, halo,\n  makeSky, toonNebula, station, ship), unchanged. Only the scenes, chrome and screen list are new.\n  Consistency pass (2026-10-28): one tab bar (glass), one paper/ink pair (#FFFDF2 / #15302A), no dashed route on U02, uncharted never written.\n-->\n<script type=\"importmap\">{ \"imports\": { \"three\": \"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js\" } }<\/script>\n<style>\n:root{\n  --paper:#FFFDF2; --ink:#15302A; --ink2:#566962; --accent:#2C46E8; --focus:#FFE44D; --fresh:#14C79B;\n  --label:#FFFDF2; --label2:rgba(255,253,242,.72);\n  --f-display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;\n  --f-text:'Instrument Sans',system-ui,sans-serif;\n  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;\n  --page:#0C0C0E; --page-ink:#F2EEE3; --page-ink2:#A29C8E; --page-edge:rgba(242,238,227,.16);\n}\n:root[data-theme=\"light\"]{ --page:#E9E4D6; --page-ink:#111111; --page-ink2:#5B5649; --page-edge:rgba(21,48,42,.18); }\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:var(--page);color:var(--page-ink);font-family:var(--f-text);padding:32px 16px 80px}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer}\n.intro{max-width:1240px;margin:0 auto 18px}\n.intro .kicker{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--page-ink2)}\n.intro h1{font:800 36px/40px var(--f-display);letter-spacing:-.02em;margin-top:6px}\n.intro p{color:var(--page-ink2);font-size:15px;line-height:22px;margin-top:8px;max-width:840px}\n.tools{max-width:1240px;margin:0 auto 26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.tools button{border:1.5px solid var(--page-edge);border-radius:999px;padding:8px 14px;font:600 13px/1 var(--f-text)}\n.tools .hint{font-size:12.5px;color:var(--page-ink2)}\n.grid{display:flex;flex-wrap:wrap;gap:40px 28px;justify-content:center;max-width:1760px;margin:0 auto}\nfigure{display:flex;flex-direction:column;gap:12px;width:390px}\nfigcaption b{font:500 11px/14px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;display:block;color:var(--page-ink2)}\nfigcaption span{font:700 17px/22px var(--f-display);display:block;margin-top:2px}\nfigcaption small{font-size:12.5px;line-height:18px;color:var(--page-ink2);display:block;margin-top:4px}\n.genomes{max-width:1240px;margin:28px auto 0;display:flex;flex-wrap:wrap;gap:8px}\n.genomes span{font:500 12px/16px var(--f-mono);border:1px solid var(--page-edge);border-radius:999px;padding:6px 10px;color:var(--page-ink2)}\n#err{position:fixed;left:12px;bottom:12px;max-width:600px;background:#B23A0B;color:#fff;font:12px/16px var(--f-mono);padding:10px;border-radius:8px;display:none;white-space:pre-wrap;z-index:99}\n\n.phone{width:390px;height:844px;position:relative;overflow:hidden;border-radius:38px;background:#020308;\n  box-shadow:0 0 0 8px #050505,0 0 0 9px #26272b,0 30px 60px -24px rgba(0,0,0,.8);isolation:isolate}\n.phone canvas{position:absolute;inset:0;width:390px;height:844px;display:block}\n.labels{position:absolute;inset:0;pointer-events:none;z-index:1}\n.lbl{position:absolute;left:0;top:0;font:700 14px/18px var(--f-display);color:var(--label);white-space:nowrap;text-shadow:0 0 6px rgba(0,0,0,.95),0 0 2px #000;will-change:transform}\n.lbl.sm{font-size:12.5px} .lbl.calm{opacity:.5}\n.chrome{position:absolute;inset:0;z-index:2;color:var(--label);pointer-events:none}\n.chrome .chip,.chrome .ib,.chrome .card,.chrome .note,.chrome .tabbar,.chrome .btn{pointer-events:auto}\n.statusbar{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 34px;font:600 15px/1 var(--f-text);color:var(--label);z-index:5;pointer-events:none}\n.statusbar i{width:26px;height:12px;border:1.5px solid var(--label);border-radius:4px;display:inline-block;position:relative}\n.statusbar i:after{content:\"\";position:absolute;inset:1.5px;right:5px;background:var(--label);border-radius:1.5px}\n.top{position:absolute;top:0;left:0;right:0;padding:59px 16px 0;display:flex;flex-direction:column;gap:10px}\n.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 16px 104px;display:flex;flex-direction:column;gap:12px}\n.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}\n.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.title{font:800 28px/32px var(--f-display);letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.6)}\n.eyebrow{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--label2);display:block}\n.sub{font:400 16px/22px var(--f-text);color:var(--label2);margin-top:-4px}\n.avatar{width:40px;height:40px;border-radius:999px;background:var(--focus);color:var(--ink);font:800 16px/1 var(--f-display);display:flex;align-items:center;justify-content:center;flex:none}\n.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font:600 14px/18px var(--f-text);white-space:nowrap;border:1px solid rgba(255,253,242,.5);background:rgba(2,3,8,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}\n.chip.solid{background:var(--paper);color:var(--ink);border-color:var(--paper)}\n.chip .dot{width:8px;height:8px;border-radius:4px;border:1px solid currentColor}\n.chip .dot.on{background:var(--fresh);border-color:var(--fresh)}\n.ib{width:48px;height:48px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:rgba(255,253,242,.94);color:var(--ink)}\n.card{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;width:100%}\n.card .head{display:flex;align-items:center;justify-content:space-between}\n.card .eyebrow{color:var(--ink2)}\n.card h2{font:700 22px/28px var(--f-display);letter-spacing:-.02em}\n.card .acts{display:flex;gap:8px;margin-top:8px}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;min-height:48px;padding:0 20px;font:600 15px/20px var(--f-text);white-space:nowrap;border:2px solid var(--ink)}\n.btn.ink{background:var(--ink);color:var(--paper)} .btn.ghost{color:var(--ink)} .btn.space{background:var(--paper);color:var(--ink);border-color:var(--paper)}\n.note{display:flex;align-items:center;gap:4px;align-self:center;background:var(--paper);color:var(--ink);border-radius:18px;padding:0 4px 0 16px}\n.note span{font:500 15px/22px var(--f-text);padding:12px 0}\n.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 36px;text-align:center}\n.center h2{font:800 28px/32px var(--f-display);letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.7)}\n.center p{font:400 17px/25px var(--f-text);color:var(--label2)}\n.tabbar{position:absolute;z-index:4;left:14px;right:14px;bottom:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border:1px solid rgba(255,255,255,.15);border-radius:24px;background:rgba(10,20,28,.42);box-shadow:0 18px 40px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35)}\n.tab{display:grid;gap:5px;justify-items:center;padding:9px 4px 8px;color:rgba(255,255,255,.6);border-radius:17px;font:800 11px/1 var(--f-text)}\n.tab svg{width:21px;height:21px;stroke-width:1.9}\n.tab.cur{color:#fff;background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}\n/* ---------- misc round 01 ---------- */\n.visit{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);border-radius:999px;padding:6px;box-shadow:0 12px 28px -12px #000;pointer-events:auto}\n.visit .av{width:40px;height:40px;border-radius:999px;background:#FF8A5B;color:var(--ink);font:800 16px/1 var(--f-display);display:flex;align-items:center;justify-content:center;flex:none}\n.visit .tx{flex:1;min-width:0;display:flex;flex-direction:column}\n.visit .tx b{font:700 15px/19px var(--f-text)}\n.visit .tx small{font:500 12.5px/16px var(--f-text);color:var(--ink2)}\n.visit .btn{min-height:42px;padding:0 18px}\n.chip.quiet{border-color:rgba(255,253,242,.3);color:var(--label2);min-height:38px;padding:0 14px;font-size:13px}\n.notice{display:flex;align-items:center;gap:12px;background:var(--paper);color:var(--ink);border-radius:20px;padding:10px 10px 10px 12px;box-shadow:0 14px 30px -14px #000;pointer-events:auto}\n.notice .nic{width:34px;height:34px;border-radius:999px;background:rgba(21,48,42,.07);display:flex;align-items:center;justify-content:center;flex:none}\n.notice .msg{flex:1;font:500 14.5px/20px var(--f-text)}\n.notice .btn{min-height:40px;padding:0 16px;font-size:14px}\n.btn.outline{color:var(--label);border-color:rgba(255,253,242,.5);background:rgba(2,3,8,.45)}\n.off-ic{width:64px;height:64px;border-radius:999px;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,253,242,.35);color:var(--label);margin-bottom:6px;background:rgba(2,3,8,.5)}\n@media (max-width:440px){ figure{width:100%} .phone{transform:scale(.86);transform-origin:top left;margin-bottom:-118px} }\n<\/style>\n<\/head>\n<body>\n<header class=\"intro\">\n  <span class=\"kicker\">KnowScroll · Universe · Misc · finalized<\/span>\n  <h1>Visiting, offline, and a quiet notice<\/h1>\n  <p>Three screens that sit around the Universe map, drawn in the approved space look: visiting a friend’s universe, the offline state when there is no map to draw,\n     and the quiet notice shown over your map when the new-place view can’t load.<\/p>\n<\/header>\n<div class=\"tools\"><button id=\"pause\">Pause motion<\/button><button id=\"theme\">Light page<\/button><span class=\"hint\">Move the pointer over a phone to feel the depth.<\/span><\/div>\n<main class=\"grid\" id=\"grid\"><\/main>\n<div class=\"genomes\" id=\"genomes\" style=\"display:none\"><\/div>\n<div id=\"err\"><\/div>\n\n<script>window.addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += (e.message || 'error') + '\\n'; });<\/script>\n<script type=\"module\">\nimport * as THREE from 'three';\n\nconst W = 390, H = 844, PR = Math.min(1.5, window.devicePixelRatio || 1), TAU = Math.PI * 2;\nconst clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst smooth = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };\nconst mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];\nfunction rng(seed) { let h = 2166136261; for (const ch of String(seed)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);\n  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> * f, z * f); f *= 2.03; a *= .5; } return s; }\n\n/* ===================== planet genomes: a type never repeats in a universe ===================== */\nconst TYPES = ['lush', 'toxic', 'frozen', 'scorched', 'barren', 'exotic', 'gas', 'ocean'];\nconst FAMILY_SHIFT = { teal: 0, cobalt: 18, coral: -18, amber: -10, pink: 25, violet: 30 };\nconst used = new Set();\nfunction genome(id, family) {\n  const r = rng(id), order = [...TYPES]; for (let i = order.length - 1; i > 0; i--) { const j = (r() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]]; }\n  const type = order.find(t => !used.has(t)) || order[0]; used.add(type);\n  return { id, type, d: FAMILY_SHIFT[family] + (r() - .5) * 30, size: .8 + r() * .5, tilt: (r() - .5) * .7, spin: .12 + r() * .12, rings: type === 'gas' || (type === 'frozen' && r() < .5), moon: r() < .45 };\n}\nconst G = {\n  attention: genome('attention', 'teal'), inference: genome('inference', 'teal'), hardware: genome('hardware', 'teal'),\n  queues: genome('queues', 'cobalt'), storage: genome('storage', 'cobalt'), tactics: genome('tactics', 'coral'),\n};\nG.hardware.rings = true; // the system screen shows one ringed world\nused.clear(); // a friend's universe is its own: types only stay unique inside it\nObject.assign(G, { bebop: genome('bebop', 'amber'), swing: genome('swing', 'amber'), prompts: genome('prompts', 'teal'), sourdough: genome('sourdough', 'pink') });\ndocument.getElementById('genomes').innerHTML = Object.entries(G).map(([k, g]) => `<span>${k}: ${g.type}${g.rings ? ' · rings' : ''}${g.moon ? ' · moon' : ''}<\/span>`).join('');\n\n/* ===================== painted textures ===================== */\nconst STYLE = d => ({\n  lush:     { ramp: [hsl(200 + d, 70, 34), hsl(185 + d, 75, 48), hsl(120 + d, 55, 46), hsl(95 + d, 65, 56), hsl(70 + d, 70, 68)], sea: .5, atmo: hsl(190 + d, 95, 68), clouds: .8 },\n  toxic:    { ramp: [hsl(290 + d, 45, 32), hsl(80 + d, 70, 38), hsl(68 + d, 85, 52), hsl(55 + d, 95, 66)], atmo: hsl(80 + d, 95, 62), clouds: .4 },\n  frozen:   { ramp: [hsl(215 + d, 50, 52), hsl(205 + d, 55, 70), hsl(195 + d, 50, 84), hsl(190 + d, 40, 95)], atmo: hsl(195 + d, 95, 78), clouds: .5 },\n  scorched: { ramp: [hsl(345 + d, 55, 24), hsl(355 + d, 65, 36), hsl(10 + d, 75, 48), hsl(22 + d, 80, 58)], atmo: hsl(335 + d, 90, 68) },\n  barren:   { ramp: [hsl(275 + d, 25, 34), hsl(30 + d, 35, 46), hsl(28 + d, 40, 60), hsl(35 + d, 45, 74)], atmo: hsl(275 + d, 70, 72) },\n  exotic:   { ramp: [hsl(300 + d, 70, 38), hsl(320 + d, 85, 58), hsl(195 + d, 85, 56), hsl(175 + d, 90, 72)], atmo: hsl(185 + d, 100, 70), clouds: .35 },\n  gas:      { bands: [hsl(20 + d, 80, 62), hsl(345 + d, 70, 66), hsl(285 + d, 50, 56), hsl(38 + d, 85, 76), hsl(10 + d, 70, 52)], atmo: hsl(335 + d, 95, 72) },\n  ocean:    { ramp: [hsl(225 + d, 75, 26), hsl(210 + d, 80, 42), hsl(195 + d, 85, 56), hsl(160 + d, 70, 60)], sea: .8, atmo: hsl(205 + d, 100, 70), clouds: .9 },\n});\nconst TEXC = new Map();\nfunction dataTex(data, w, h) { const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat); t.wrapS = THREE.RepeatWrapping; t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true; return t; }\nfunction planetTextures(g) {\n  if (TEXC.has(g.id)) return TEXC.get(g.id);\n  const S = STYLE(g.d)[g.type], TW = 192, TH = 96, map = new Uint8Array(TW * TH * 4), cl = S.clouds ? new Uint8Array(TW * TH * 4) : null;\n  const r = rng(g.id + 'tex'), ox = r() * 40, oy = r() * 40, oz = r() * 40;\n  for (let j = 0; j < TH; j++) {\n    const lat = -Math.PI / 2 + (j + .5) / TH * Math.PI, y = Math.sin(lat), c0 = Math.cos(lat);\n    for (let i = 0; i < TW; i++) {\n      const lon = (i + .5) / TW * TAU, x = c0 * Math.cos(lon), z = c0 * Math.sin(lon), k = (j * TW + i) * 4;\n      let c;\n      if (g.type === 'gas') { const w = fbm(x * 1.1 + ox, y * 1.1 + oy, z * 1.1 + oz, 2); const v = y * 2.4 + w * .45; c = ramp(S.bands, .5 + .5 * Math.sin(v * 4.2)); c = mix3(c, ramp(S.bands, .5 + .5 * Math.sin(v * 2.1 + 1.7)), .35);\n        let dl = lon - 1.4; dl = Math.atan2(Math.sin(dl), Math.cos(dl)); const e = Math.pow(dl * c0 / .34, 2) + Math.pow((lat + .3) / .15, 2); if (e < 1) c = mix3(c, hsl(15 + g.d, 90, 82), smooth(1, .4, e)); }\n      else {\n        const w = fbm(x * .9 + ox, y * .9 + oy, z * .9 + oz, 2), v = .5 + fbm(x * 1.3 + ox + w, y * 1.3 + oy + w, z * 1.3 + oz, 3) * 1.1;\n        if (S.sea) { const sea = S.sea * .5 + .2; c = v < sea ? ramp(S.ramp.slice(0, 2), v / sea) : ramp(S.ramp.slice(1), (v - sea) / (1 - sea) * .9 + .1); if (Math.abs(v - sea) < .03) c = mix3(c, S.ramp[1], .5); }\n        else c = ramp(S.ramp, v);\n        const cap = smooth(.82, .9, Math.abs(y) + w * .1); if (g.type !== 'scorched' && cap > 0) c = mix3(c, [244, 248, 255], cap * .9);\n      }\n      map[k] = c[0]; map[k + 1] = c[1]; map[k + 2] = c[2]; map[k + 3] = 255;\n      if (cl) { const cv = fbm(x * 1.6 + oz, y * 3 + ox, z * 1.6 + oy, 3); cl[k] = cl[k + 1] = cl[k + 2] = 255; cl[k + 3] = smooth(.04, .3, cv) * 230 * S.clouds; }\n    }\n  }\n  const out = { map: dataTex(map, TW, TH), cloud: cl ? dataTex(cl, TW, TH) : null, atmo: S.atmo };\n  if (g.rings) { const rw = 128, rd = new Uint8Array(rw * 4), c1 = hsl(30 + g.d, 70, 78), c2 = hsl(330 + g.d, 55, 70);\n    for (let i = 0; i < rw; i++) { const u = i / rw, c = mix3(c1, c2, .5 + .5 * Math.sin(u * 9)), a = (u > .55 && u < .6 ? .15 : 1) * smooth(0, .12, u) * smooth(1, .85, u) * (.55 + .3 * Math.sin(u * 23));\n      rd[i * 4] = c[0]; rd[i * 4 + 1] = c[1]; rd[i * 4 + 2] = c[2]; rd[i * 4 + 3] = a * 255; }\n    out.ring = dataTex(rd, rw, 1); }\n  TEXC.set(g.id, out); return out;\n}\nfunction glowTexture(stops) {\n  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);\n  stops.forEach(([o, a]) => gr.addColorStop(o, `rgba(255,255,255,${a})`)); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);\n}\nfunction puffTexture() {\n  const c = document.createE ur universe as usual, still live. A small paper notice sits above the chips with one Refresh button; the map stays usable around it.'],\n];\n\n/* ===================== mount + loop ===================== */\nconst grid = document.getElementById('grid'), scenes = [];\nconst reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\nlet paused = false;\ngrid.innerHTML = SCREENS.map(([k, code, title, note]) => `<figure data-k=\"${k}\"><div class=\"phone\"><canvas><\/canvas><div class=\"labels\"><\/div><div class=\"chrome\">${CHROME[k]}${tabbar}<\/div>\n  <div class=\"statusbar\"><span>9:41<\/span><i><\/i><\/div><\/div><figcaption><b>${code}<\/b><span>${title}<\/span><small>${note}<\/small><\/figcaption><\/figure>`).join('');\nconst io = new IntersectionObserver(es => es.forEach(en => { const s = scenes.find(x => x.fig === en.target); if (s) s.sc.visible = en.isIntersecting; }), { rootMargin: '150px' });\ngrid.querySelectorAll('figure').forEach(fig => {\n  const phone = fig.querySelector('.phone'), sc = new Scene3D(fig.querySelector('canvas'), fig.querySelector('.labels'), fig.dataset.k);\n  phone.addEventListener('pointermove', e => { const b = phone.getBoundingClientRect(); sc.pointer.set((e.clientX - b.left) / b.width * 2 - 1, (e.clientY - b.top) / b.height * 2 - 1); });\n  phone.addEventListener('pointerleave', () => sc.pointer.set(0, 0));\n  if (fig.dataset.k === 'overview') phone.addEventListener('click', () => sc.startFly());\n  scenes.push({ fig, sc }); io.observe(fig); sc.render(4);\n});\ndocument.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Play motion' : 'Pause motion'; };\ndocument.getElementById('theme').onclick = e => { const r = document.documentElement, l = r.dataset.theme === 'light'; r.dataset.theme = l ? 'dark' : 'light'; e.target.textContent = l ? 'Light page' : 'Dark page'; };\nlet last = 0;\nfunction loop(now) { requestAnimationFrame(loop); if (paused || reduce || now - last < 33) return; last = now; const t = 4 + now / 1000; for (const { sc } of scenes) if (sc.visible) sc.render(t); }\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "Desktop", "path": "desktop/desktop-finalized.html", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Desktop Finalized<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<!--\n  Desktop, FINALIZED (from round 03, approved 2026-10-28). Do not change.\n  Round 03: side menu and panel written plainly (see #plain-menus).\n  Round 02: no dashed route line between planets on the map.\n  Round 01: D02 Universe at 1440 x 900.\n  Map = the approved U02 System scene from universe-above/universe-drafts-finalized.html (three.js scene code unchanged; Scene3D now takes a size).\n  Panel = the outline, always open, in the list style of world-internals/simple-views-finalized.html; picked cards dock at its top.\n  Menus written plainly (approved 2026-10-28, from test.html): text rows, hairlines, no glyph tiles, no glass, no outlined boxes. See #plain-menus.\n  Consistency pass (2026-10-28): one tab bar (glass), one paper/ink pair (#FFFDF2 / #15302A), no dashed route on U02, uncharted never written.\n-->\n<script type=\"importmap\">{ \"imports\": { \"three\": \"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js\" } }<\/script>\n<style>\n:root{\n  --paper:#FFFDF2; --ink:#15302A; --ink2:#566962; --accent:#2C46E8; --focus:#FFE44D; --fresh:#14C79B;\n  --label:#FFFDF2; --label2:rgba(255,253,242,.72);\n  --f-display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;\n  --f-text:'Instrument Sans',system-ui,sans-serif;\n  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;\n  --page:#0C0C0E; --page-ink:#F2EEE3; --page-ink2:#A29C8E; --page-edge:rgba(242,238,227,.16);\n}\n:root[data-theme=\"light\"]{ --page:#E9E4D6; --page-ink:#111111; --page-ink2:#5B5649; --page-edge:rgba(21,48,42,.18); }\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:var(--page);color:var(--page-ink);font-family:var(--f-text);padding:32px 16px 80px}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer}\n.intro{max-width:1240px;margin:0 auto 18px}\n.intro .kicker{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--page-ink2)}\n.intro h1{font:800 36px/40px var(--f-display);letter-spacing:-.02em;margin-top:6px}\n.intro p{color:var(--page-ink2);font-size:15px;line-height:22px;margin-top:8px;max-width:840px}\n.tools{max-width:1240px;margin:0 auto 26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.tools button{border:1.5px solid var(--page-edge);border-radius:999px;padding:8px 14px;font:600 13px/1 var(--f-text)}\n.tools .hint{font-size:12.5px;color:var(--page-ink2)}\n.grid{display:flex;flex-wrap:wrap;gap:40px 28px;justify-content:center;max-width:1760px;margin:0 auto}\nfigure{display:flex;flex-direction:column;gap:12px;width:390px}\nfigcaption b{font:500 11px/14px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;display:block;color:var(--page-ink2)}\nfigcaption span{font:700 17px/22px var(--f-display);display:block;margin-top:2px}\nfigcaption small{font-size:12.5px;line-height:18px;color:var(--page-ink2);display:block;margin-top:4px}\n.genomes{max-width:1240px;margin:28px auto 0;display:flex;flex-wrap:wrap;gap:8px}\n.genomes span{font:500 12px/16px var(--f-mono);border:1px solid var(--page-edge);border-radius:999px;padding:6px 10px;color:var(--page-ink2)}\n#err{position:fixed;left:12px;bottom:12px;max-width:600px;background:#B23A0B;color:#fff;font:12px/16px var(--f-mono);padding:10px;border-radius:8px;display:none;white-space:pre-wrap;z-index:99}\n\n.phone{width:390px;height:844px;position:relative;overflow:hidden;border-radius:38px;background:#020308;\n  box-shadow:0 0 0 8px #050505,0 0 0 9px #26272b,0 30px 60px -24px rgba(0,0,0,.8);isolation:isolate}\n.phone canvas{position:absolute;inset:0;width:390px;height:844px;display:block}\n.labels{position:absolute;inset:0;pointer-events:none;z-index:1}\n.lbl{position:absolute;left:0;top:0;font:700 14px/18px var(--f-display);color:var(--label);white-space:nowrap;text-shadow:0 0 6px rgba(0,0,0,.95),0 0 2px #000;will-change:transform}\n.lbl.sm{font-size:12.5px} .lbl.calm{opacity:.5}\n.chrome{position:absolute;inset:0;z-index:2;color:var(--label);pointer-events:none}\n.chrome .chip,.chrome .ib,.chrome .card,.chrome .note,.chrome .tabbar,.chrome .btn{pointer-events:auto}\n.statusbar{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 34px;font:600 15px/1 var(--f-text);color:var(--label);z-index:5;pointer-events:none}\n.statusbar i{width:26px;height:12px;border:1.5px solid var(--label);border-radius:4px;display:inline-block;position:relative}\n.statusbar i:after{content:\"\";position:absolute;inset:1.5px;right:5px;background:var(--label);border-radius:1.5px}\n.top{position:absolute;top:0;left:0;right:0;padding:59px 16px 0;display:flex;flex-direction:column;gap:10px}\n.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 16px 104px;display:flex;flex-direction:column;gap:12px}\n.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}\n.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.title{font:800 28px/32px var(--f-display);letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.6)}\n.eyebrow{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--label2);display:block}\n.sub{font:400 16px/22px var(--f-text);color:var(--label2);margin-top:-4px}\n.avatar{width:40px;height:40px;border-radius:999px;background:var(--focus);color:var(--ink);font:800 16px/1 var(--f-display);display:flex;align-items:center;justify-content:center;flex:none}\n.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font:600 14px/18px var(--f-text);white-space:nowrap;border:1px solid rgba(255,253,242,.5);background:rgba(2,3,8,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}\n.chip.solid{background:var(--paper);color:var(--ink);border-color:var(--paper)}\n.chip .dot{width:8px;height:8px;border-radius:4px;border:1px solid currentColor}\n.chip .dot.on{background:var(--fresh);border-color:var(--fresh)}\n.ib{width:48px;height:48px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:rgba(255,253,242,.94);color:var(--ink)}\n.card{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;width:100%}\n.card .head{display:flex;align-items:center;justify-content:space-between}\n.card .eyebrow{color:var(--ink2)}\n.card h2{font:700 22px/28px var(--f-display);letter-spacing:-.02em}\n.card .acts{display:flex;gap:8px;margin-top:8px}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;min-height:48px;padding:0 20px;font:600 15px/20px var(--f-text);white-space:nowrap;border:2px solid var(--ink)}\n.btn.ink{background:var(--ink);color:var(--paper)} .btn.ghost{color:var(--ink)} .btn.space{background:var(--paper);color:var(--ink);border-color:var(--paper)}\n.note{display:flex;align-items:center;gap:4px;align-self:center;background:var(--paper);color:var(--ink);border-radius:18px;padding:0 4px 0 16px}\n.note span{font:500 15px/22px var(--f-text);padding:12px 0}\n.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 36px;text-align:center}\n.center h2{font:800 28px/32px var(--f-display);letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.7)}\n.center p{font:400 17px/25px var(--f-text);color:var(--label2)}\n.tabbar{position:absolute;z-index:4;left:14px;right:14px;bottom:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border:1px solid rgba(255,255,255,.15);border-radius:24px;background:rgba(10,20,28,.42);box-shadow:0 18px 40px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35)}\n.tab{display:grid;gap:5px;justify-items:center;padding:9px 4px 8px;color:rgba(255,255,255,.6);border-radius:17px;font:800 11px/1 var(--f-text)}\n.tab svg{width:21px;height:21px;stroke-width:1.9}\n.tab.cur{color:#fff;background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}\n/* ---------- desktop, round 01 ---------- */\n.desk-wrap{max-width:100%;overflow-x:auto;padding:4px 0 20px}\n.desk{width:1440px;height:900px;margin:0 auto;display:flex;position:relative;overflow:hidden;border-radius:18px;background:#020308;isolation:isolate;\n  box-shadow:0 0 0 1px #26272b,0 40px 80px -30px #000}\n.rail{width:88px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0;background:#070a12;box-shadow:inset -1px 0 0 rgba(255,253,242,.1);color:var(--label);z-index:3}\n.rail .logo{width:44px;height:44px;border-radius:14px;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;font:800 20px/1 var(--f-display);margin-bottom:18px}\n.rail .ri{width:68px;height:62px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:600 11px/13px var(--f-text);color:rgba(255,253,242,.7)}\n.rail .ri.cur{background:var(--accent);color:var(--paper)}\n.rail .sp{flex:1}\n.map{flex:1;position:relative;overflow:hidden}\n.map canvas{position:absolute;inset:0;width:974px;height:900px;display:block}\n.map .chrome .top{padding:22px 24px 0}\n.zoom{position:absolute;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}\n.zoom .ib{width:44px;height:44px}\n.keys{position:absolute;left:24px;bottom:22px;display:flex;flex-wrap:wrap;gap:18px;font:500 12.5px/1 var(--f-text);color:var(--label2)}\n.keys span{display:flex;align-items:center;gap:8px}\n.kbd{min-width:26px;height:24px;padding:0 7px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,253,242,.35);background:rgba(2,3,8,.5);\n  font:500 11.5px/1 var(--f-mono);color:var(--label)}\n.panel{width:378px;flex:none;background:#fffdf2;color:#15302a;display:flex;flex-direction:column;position:relative;z-index:3;box-shadow:-1px 0 0 rgba(0,0,0,.4)}\n.p-in{flex:1;overflow:hidden;padding:22px 18px 0}\n.p-head{display:flex;align-items:baseline;justify-content:space-between}\n.p-head h2{font:800 24px/28px var(--f-display);letter-spacing:-.02em}\n.p-head span{font:500 13px/1 var(--f-text);color:rgba(21,48,42,.62)}\n.pfield{display:flex;align-items:center;gap:10px;height:46px;margin-top:14px;padding:0 10px 0 14px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px rgba(21,48,42,.14);font:500 15px/1 var(--f-text);color:rgba(21,48,42,.55)}\n.pfield .kbd{margin-left:auto;color:#15302a;background:#f4edd8;border-color:rgba(21,48,42,.18)}\n.dock{margin-top:14px;background:#fffdf2;border:2px solid #15302a;border-radius:20px;padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 rgba(21,48,42,.18)}\n.dock .head{display:flex;align-items:center;justify-content:space-between}\n.dock .eyebrow{color:rgba(21,48,42,.62)}\n.dock h3{font:800 22px/26px var(--f-display);letter-spacing:-.02em}\n.dock p{font:500 14px/20px var(--f-text);color:rgba(21,48,42,.72)}\n.dock p i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange,#ff684c);margin-right:6px;vertical-align:1px}\n.dock .acts{display:flex;gap:8px;margin-top:6px}\n.dock .btn{min-height:44px;padding:0 18px;font-size:14.5px;border-color:#15302a}\n.dock .btn.ink{background:#15302a;color:#fffdf2}\n.dock .btn.ghost{color:#15302a}\n.dock .x{width:32px;height:32px;border-radius:50%;background:rgba(21,48,42,.08);display:flex;align-items:center;justify-content:center}\n.ptogs{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:14px}\n.ptog{white-space:nowrap;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:14px;background:#f4edd8;font:800 13.5px/1 var(--f-text)}\n.sw{width:36px;height:22px;border-radius:11px;background:rgba(21,48,42,.22);position:relative;flex:none}\n.sw::after{content:\"\";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}\n/* the list: same style as the finalized simple views */\n.sys{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:20px 4px 8px}\n.sys h4{font:800 20px/24px var(--f-display);letter-spacing:-.015em}\n.sys span{font:600 12.5px/1 var(--f-text);color:rgba(21,48,42,.62);white-space:nowrap}\n.sys.here h4::after{content:\"You are here\";margin-left:8px;vertical-align:3px;display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;background:#15302a;color:var(--focus);font:800 9.5px/20px var(--f-text);letter-spacing:.08em;text-transform:uppercase}\n.group{border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px rgba(21,48,42,.1);overflow:hidden}\n.prow{display:flex;align-items:center;gap:10px;min-height:52px;padding:7px 12px 7px 16px;border-top:1px solid rgba(21,48,42,.1)}\n.prow:first-child{border-top:0}\n.prow .tx{flex:1;min-width:0}\n.prow .t{display:block;font:700 15px/20px var(--f-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.prow .m{display:flex;align-items:center;gap:6px;font:500 12.5px/16px var(--f-text);color:rgba(21,48,42,.62)}\n.prow .m i{width:7px;height:7px;border-radius:50%;background:#ff684c;flex:none}\n.prow .ch{width:17px;height:17px;color:rgba(21,48,42,.4);flex:none}\n.prow.pick{background:#f4edd8;border-top-color:transparent}\n.prow.pick + .prow{border-top-color:transparent}\n.prow .pk{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#15302a}\n.pfade{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(rgba(255,253,242,0),#fffdf2 70%);pointer-events:none}\n@media (max-width:440px){ figure{width:100%} .phone{transform:scale(.86);transform-origin:top left;margin-bottom:-118px} }\n<\/style>\n<style id=\"plain-menus\">\n/* Menus written plainly, like the original app (approved 2026-10-28): search dropdowns, filters, lists, side menu and panel. Bottom tab bar unchanged. */\n.dock{border:0!important;box-shadow:none!important;background:#f4edd8!important}\n.dock .x{background:none!important}\n.dock .btn.ghost{border-color:transparent!important;padding:0 6px!important}\n.ptogs{display:flex!important;gap:24px!important;padding:12px 2px!important;border-bottom:1px solid rgba(21,48,42,.12)}\n.ptog{background:none!important;padding:0!important}\n.group{background:none!important;box-shadow:none!important;border-radius:0!important;overflow:visible!important}\n.prow{padding:8px 2px!important;min-height:50px!important;border-top:1px solid rgba(21,48,42,.12)!important}\n.prow:first-child{border-top:0!important}\n.prow .ch{display:none!important}\n.prow.pick{margin:0 -10px!important;padding:8px 12px!important;border-radius:12px!important}\n.sys.here h4::after{background:none!important;color:rgba(21,48,42,.55)!important;padding:0!important;font:500 10.5px/20px var(--f-mono)!important;letter-spacing:.08em}\n.rail{background:#06080d!important;gap:2px!important;padding:26px 0!important}\n.rail .logo{background:none!important;width:auto!important;height:auto!important;color:#FFE44D!important;font:800 24px/1 var(--f-display)!important;margin-bottom:30px!important}\n.rail .ri{width:auto!important;height:auto!important;padding:12px 0! = Math.imul(h ^ ch.charCodeAt(0), 16777619);\n  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nfunction hsl(h, s, l) { h = ((h % 360) + 360) % 360 / 360; s /= 100; l /= 100;\n  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return 255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))); };\n  return [f(0), f(8), f(4)]; }\nconst v3 = c => new THREE.Vector3(c[0] / 255, c[1] / 255, c[2] / 255);\nconst hexV = h => v3([parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);\nfunction ramp(stops, t) { t = clamp(t) * (stops.length - 1); const i = Math.min(stops.length - 2, t | 0); const k = t - i; return mix3(stops[i], stops[i + 1], k * k * (3 - 2 * k)); }\n\n/* ===================== smooth noise (low frequency only: painted, not photographic) ===================== */\nconst perm = new Uint8Array(512);\n(() => { const p = [...Array(256).keys()], r = rng('knowscroll'); for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; })();\nconst fade = t => t * t * t * (t * (t * 6 - 15) + 10);\nfunction grad(h, x, y, z) { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14) ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }\nfunction noise(x, y, z) {\n  let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z); x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;\n  const u = fade(x), v = fade(y), w = fade(z), A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z, B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;\n  return lerp(lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u), lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),\n    lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u), lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);\n}\nfunction fbm(x, y, z, o = 3) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * noise(x * f, y * f, z * f); f *= 2.03; a *= .5; } return s; }\n\n/* ===================== planet genomes: a type never repeats in a universe ===================== */\nconst TYPES = ['lush', 'toxic', 'frozen', 'scorched', 'barren', 'exotic', 'gas', 'ocean'];\nconst FAMILY_SHIFT = { teal: 0, cobalt: 18, coral: -18, amber: -10, pink: 25, violet: 30 };\nconst used = new Set();\nfunction genome(id, family) {\n  const r = rng(id), order = [...TYPES]; for (let i = order.length - 1; i > 0; i--) { const j = (r() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]]; }\n  const type = order.find(t => !used.has(t)) || order[0]; used.add(type);\n  return { id, type, d: FAMILY_SHIFT[family] + (r() - .5) * 30, size: .8 + r() * .5, tilt: (r() - .5) * .7, spin: .12 + r() * .12, rings: type === 'gas' || (type === 'frozen' && r() < .5), moon: r() < .45 };\n}\nconst G = {\n  attention: genome('attention', 'teal'), inference: genome('inference', 'teal'), hardware: genome('hardware', 'teal'),\n  queues: genome('queues', 'cobalt'), storage: genome('storage', 'cobalt'), tactics: genome('tactics', 'coral'),\n};\nG.hardware.rings = true; // the system screen shows one ringed world\n\n/* ===================== painted textures ===================== */\nconst STYLE = d => ({\n  lush:     { ramp: [hsl(200 + d, 70, 34), hsl(185 + d, 75, 48), hsl(120 + d, 55, 46), hsl(95 + d, 65, 56), hsl(70 + d, 70, 68)], sea: .5, atmo: hsl(190 + d, 95, 68), clouds: .8 },\n  toxic:    { ramp: [hsl(290 + d, 45, 32), hsl(80 + d, 70, 38), hsl(68 + d, 85, 52), hsl(55 + d, 95, 66)], atmo: hsl(80 + d, 95, 62), clouds: .4 },\n  frozen:   { ramp: [hsl(215 + d, 50, 52), hsl(205 + d, 55, 70), hsl(195 + d, 50, 84), hsl(190 + d, 40, 95)], atmo: hsl(195 + d, 95, 78), clouds: .5 },\n  scorched: { ramp: [hsl(345 + d, 55, 24), hsl(355 + d, 65, 36 * .9 + ox, y * .9 + oy, z * .9 + oz, 2), v = .5 + fbm(x * 1.3 + ox + w, y * 1.3 + oy + w, z * 1.3 + oz, 3) * 1.1;\n        if (S.sea) { const sea = S.sea * .5 + .2; c = v < sea ? ramp(S.ramp.slice(0, 2), v / sea) : ramp(S.ramp.slice(1), (v - sea) / (1 - sea) * .9 + .1); if (Math.abs(v - sea) < .03) c = mix3(c, S.ramp[1], .5); }\n        else c = ramp(S.ramp, v);\n        const cap = smooth(.82, .9, Math.abs(y) + w * .1); if (g.type !== 'scorched' && cap > 0) c = mix3(c, [244, 248, 255], cap * .9);\n      }\n      map[k] = c[0]; map[k + 1] = c[1]; map[k + 2] = c[2]; map[k + 3] = 255;\n      if (cl) { const cv = fbm(x * 1.6 + oz, y * 3 + ox, z * 1.6 + oy, 3); cl[k] = cl[k + 1] = cl[k + 2] = 255; cl[k + 3] = smooth(.04, .3, cv) * 230 * S.clouds; }\n    }\n  }\n  const out = { map: dataTex(map, TW, TH), cloud: cl ? dataTex(cl, TW, TH) : null, atmo: S.atmo };\n  if (g.rings) { const rw = 128, rd = new Uint8Array(rw * 4), c1 = hsl(30 + g.d, 70, 78), c2 = hsl(330 + g.d, 55, 70);\n    for (let i = 0; i < rw; i++) { const u = i / rw, c = mix3(c1, c2, .5 + .5 * Math.sin(u * 9)), a = (u > .55 && u < .6 ? .15 : 1) * smooth(0, .12, u) * smooth(1, .85, u) * (.55 + .3 * Math.sin(u * 23));\n      rd[i * 4] = c[0]; rd[i * 4 + 1] = c[1]; rd[i * 4 + 2] = c[2]; rd[i * 4 + 3] = a * 255; }\n    out.ring = dataTex(rd, rw, 1); }\n  TEXC.set(g.id, out); return out;\n}\nfunction glowTexture(stops) {\n  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);\n  stops.forEach(([o, a]) => gr.addColorStop(o, `rgba(255,255,255,${a})`)); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);\n}\nfunction puffTexture() {\n  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), r = rng('puff');\n  for (let i = 0; i < 9; i++) { const x = 64 + (r() - .5) * 52, y = 64 + (r() - .5) * 30, rad = 18 + r() * 22, gr = g.createRadialGradient(x, : .32);\n  gl_FragColor = vec4(haze(col, vW), cloudLayer > .5 ? tx.a * (.3 + .7 * lit) : 1.0);\n}`;\nconst ATMO_FS = `uniform vec3 color; uniform vec3 sun; uniform float strength; uniform float calm; uniform vec3 fogCol; uniform vec2 fogR; varying vec3 vN; varying vec3 vW;\nvoid main(){ vec3 N = normalize(vN), V = normalize(cameraPosition - vW); float x = 1.0 - max(dot(N, V), 0.0);\n  float g = smoothstep(.02, .32, x) * (1.0 - smoothstep(.32, 1.0, x)); float s = .3 + .7 * smoothstep(-.5, .6, dot(N, normalize(sun - vW)));\n  float f = 1.0 - smoothstep(fogR.x, fogR.y, length(cameraPosition - vW)) * .6;\n  gl_FragColor = vec4(color * g * s * strength * (1.0 - calm * .9) * f, 1.0); }`;\nconst SUN_FS = `varying vec2 vUv; varying vec3 vN; varying vec3 vW; ${HAZE}\nvoid main(){ vec3 N = normalize(vN), V = normalize(cameraPosition - vW); float nv = max(dot(N, V), 0.0);\n  vec3 col = mix(vec3(1.0, .42, .08), vec3(1.0, .7, .3), smoothstep(0.0, .5, nv)); col = mix(col, vec3(1.0, .93, .78), smoothstep(.55, .95, nv));\n  gl_FragColor = vec4(haze(col * 1.08, vW), 1.0); }`;\nconst HALO_FS = `uniform vec3 c1; uniform vec3 c2; uniform float strength; uniform float calm; uniform float time; varying vec2 vUv;\nvoid main(){ vec2 p = vUv * 2.0 - 1.0; float r = length(p); if (r > 1.0) discard; float a = atan(p.y, p.x);\n  float arms = .5 + .5 * cos(2.0 * (a + log(r + .05) * 2.2) - time * .15);\n  float i = pow(1.0 - r, 2.2) * (.55 + .45 * arms * smoothstep(.1, .6, r));\n  vec3 col = mix(c1, c2, smoothstep(.1, .9, r)); float g = dot(col, vec3(.3,.59,.11)); col = mix(col, vec3(g) * .5, calm);\n  gl_FragColor = vec4(col * i * strength * (1.0 - calm * .7), 1.0); }`;\nconst DASH_VS = `attribute float lineDistance; varying float vD; void main(){ vD = lineDistance; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;\nconst DASH_FS = `uniform vec3 color; uniform float time; uniform float speed; uniform float dash; uniform float gap; uniform float opacity; varying float vD !--\n  Animations: the first time someone opens the Universe tab. FINALIZED 2026-10-28 (copy of open-06.html). Never change it.\n  Round 04 feedback: the rush to light speed was too fast; build it slowly and smoothly (longer is fine).\n  Round 05 feedback: no full white and no iris reveal; keep the slow build, then the round-03 drop out (soft blink, streaks back into stars) into U01 Empty.\n  Round 06 feedback: the drop out was too fast and jumpy; come to a smooth stop, a little slower.\n  Round 03 feedback: the spiral must not pop in (dust streams in from off screen along the arms); the star must look 3D and float\n  (painted ball + approved atmosphere rim, slow camera orbit); much softer shake; longer travel; light-speed rush of incoming stars before U01 Empty.\n  Round 02 feedback: no purple clouds at the start; more dust; the star forms from the dust as it spirals in (no glow from nowhere);\n  sparkles multiply until it blows; the star shakes and vibrates before the bang; the first part runs at half the old speed (bang at 5.9 s).\n  Story: dust gathers from every side and spirals in, compacts into one bright point, bursts (big bang),\n  then we travel fast through the newborn universe (asteroids, planets, galaxies, a nebula, over a whole system)\n  and slow down into U01 Empty, exactly as finalized (same camera, same stars, same chrome).\n  Scene code is copied from universe-above/universe-drafts-finalized.html (makeSun, makePlanet, makeSystem, halo,\n  makeSky, toonNebula, planet textures and shaders); only the timeline, the burst dust, rocks and speed streaks are new.\n  Add #t=4.2 to the URL to freeze on a moment.\n-->\n<script type=\"importmap\">{ \"imports\": { \"three\": \"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js\" } }<\/script>\n<style>\n:root{\n  --paper:#FFFDF2; --ink:#15302A; --ink2:#566962; --focus:#FFE44D; --fresh:#14C79B;\n  --label:#FFFDF2; --label2:rgba(255,253,242,.72);\n  --f-display:'Bricolage Grotesque','Instrument Sans t b{font:500 11px/14px var(--f-mono);color:var(--page-ink2)}\n.shot span{font:600 13px/17px var(--f-text)}\n.beats{width:100%;border-collapse:collapse;font-size:13.5px;line-height:19px}\n.beats td{padding:9px 10px 9px 0;border-top:1px solid var(--page-edge);vertical-align:top}\n.beats td:first-child{font:500 12px/19px var(--f-mono);color:var(--page-ink2);white-space:nowrap;width:94px}\n.beats td b{font-weight:700}\n.beats tr.cur td{color:#FFE44D}\n\n.phone{width:390px;height:844px;position:relative;overflow:hidden;border-radius:38px;background:#020308;flex:none;\n  box-shadow:0 0 0 8px #050505,0 0 0 9px #26272b,0 30px 60px -24px rgba(0,0,0,.8);isolation:isolate}\n.phone canvas{position:absolute;inset:0;width:390px;height:844px;display:block}\n.flash{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,#FFF8E8 0,rgba(255,222,160,.9) 30%,rgba(255,150,70,.35) 62%,rgba(255,115,31,0) 100%)}\n.flash2{background:radial-gradient(circle at 50% 50%,#FFFFFF 0,rgba(225,235,255,.7) 40%,rgba(200,215,255,0) 100%)}\n.chrome{position:absolute;inset:0;z-index:2;color:var(--label);pointer-events:none}\n.chrome .chip,.chrome .tabbar,.chrome .btn{pointer-events:auto}\n.statusbar{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 34px;font:600 15px/1 var(--f-text);color:var(--label);z-index:5;pointer-events:none}\n.statusbar i{width:26px;height:12px;border:1.5px solid var(--label);border-radius:4px;display:inline-block;position:relative}\n.statusbar i:after{content:\"\";position:absolute;inset:1.5px;right:5px;background:var(--label);border-radius:1.5px}\n.top{position:absolute;top:0;left:0;right:0;padding:59px 16px 0;display:flex;flex-direction:column;gap:10px}\n.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}\n.title{font:800 28px/32px var(--f-display);letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.6)}\n.avatar{width:40px;height:40px;border-radius:999px;background:var(--focus);color:var(--ink);font:800 16px/1 var(--f-display);display:flex;align-items:center;justify-content:center;flex:none}\n.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font:600 14px/18px var(--f-text);white-space:nowrap;border:1px solid rgba(255,253,242,.5);background:rgba(2,3,8,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}\n.skip{position:absolute;top:61px;right:16px}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;min-height:48px;padding:0 20px;font:600 15px/20px var(--f-text);white-space:nowrap;border:2px solid var(--ink)}\n.btn.space{background:var(--paper);color:var(--ink);border-color:var(--paper)}\n.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 36px;text-align:center}\n.center h2{font:800 28px/32px var(--f-display);letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.7)}\n.center p{font:400 17px/25px var(--f-text);color:var(--label2)}\n.tabbar{position:absolute;z-index:4;left:14px;right:14px;bottom:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border:1px solid rgba(255,255,255,.15);border-radius:24px;background:rgba(10,20,28,.42);box-shadow:0 18px 40px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35)}\n.tab{display:grid;gap:5px;justify-items:center;padding:9px 4px 8px;color:rgba(255,255,255,.6);border-radius:17px;font:800 11px/1 var(--f-text)}\n.tab svg{width:21px;height:21px;stroke-width:1.9}\n.tab.cur{color:#fff;background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}\n@media (max-width:440px){ .phone{transform:scale(.86);transform-origin:top left;margin-bottom:-118px} }\n<\/style>\n<\/head>\n<body>\n<header class=\"intro\">\n  <span class=\"kicker\">KnowScroll · Universe · Animations · First open · Final<\/span>\n  <h1>Your universe begins<\/h1>\n  <p>Plays once, the first time someone opens the Universe tab. Dust streams in from off screen along five spiral arms, and the star builds up out of it from a tiny ember: a floating ball with a turning painted surface. Sparkles keep multiplying around it, it trembles, squeezes, and bursts.\n     Then a long trip through the newborn universe, past asteroids, planets, galaxies and two systems, a slow, smooth build to light speed with stars coming straight at us, and a soft drop out of light speed into the empty universe exactly as it is finalized.\n     Everything is drawn with the approved scene code. Skip is always there until the end.<\/p>\n<\/header>\n<div class=\"tools\"><button id=\"replay\">Replay<\/button><button id=\"pause\">Pause<\/button><button id=\"slow\">Slow ×0.25<\/button>\n  <input type=\"range\" id=\"scrub\" min=\"0\" max=\"13.6\" step=\"0.01\" value=\"0\"><span class=\"tc\" id=\"tc\">0.00 s<\/span><\/div>\n<div class=\"stage\">\n  <div class=\"phone\" id=\"phone\"><canvas id=\"c\"><\/canvas><div class=\"flash\" id=\"flash\"><\/div><div class=\"flash flash2\" id=\"flash2\"><\/div>\n    <div class=\"chrome\" id=\"chrome\"><\/div>\n    <div class=\"statusbar\"><span>9:41<\/span><i><\/i><\/div><\/div>\n  <div class=\"side\">\n    <div><h3>Storyboard · click a frame to jump there<\/h3><\/div>\n    <div class=\"shots\" id=\"shots\"><\/div>\n    <div><h3>Beats<\/h3><\/div>\n    <table class=\"beats\" id=\"beats\"><\/table>\n  <\/div>\n<\/div>\n<div id=\"err\"><\/div>\n\n<script>window.addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += (e.message || 'error') + '\\n'; });<\/script>\n<script type=\"module\">\nimport * as THREE from 'three';\n\n/* ===================== copied verbatim from universe-above/universe-drafts-finalized.html ===================== */\nconst W = 390, H = 844, PR = Math.min(1.5, window.devicePixelRatio || 1), TAU = Math.PI * 2;\nconst clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst smooth = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };\nconst mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];\nfunction rng(seed) { let h = 2166136261; for (const ch of String(seed)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);\n  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nfunction hsl(h, s, l) { h = ((h % 360) + 360) % 360 / 360; s /= 100; l /= 100;\n  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return 255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))); };\n  return [f(0), f(8), f(4)]; }\nconst v3 = c => new THREE.Vector3(c[0] / 255, c[1] / 255, c[2] / 255);\nconst hexV = h => v3([parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);\nfunction ramp(stops, t) { t = clamp(t) * (stops.length - 1); const i = Math.min(stops.length - 2, t | 0); const k = t - i; return mix3(stops[i], stops[i + 1], k * k * (3 - 2 * k)); }\n\n/* ===================== smooth noise (low frequency only: painted, not photographic) ===================== */\nconst perm = new Uint8Array(512);\n(() => { const p = [...Array(256).keys()], r = rng('knowscroll'); for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; })();\nconst fade = t => t * t * t * (t * (t * 6 - 15) + 10);\nfunction grad(h, x, y, z) { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14) ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }\nfunction noise(x, y, z) {\n  let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z); x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;\n  const u = fade(x), v = fade(y), w = fade(z), A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z, B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;\n  return lerp(lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u), lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),\n    lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u), lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);\n}\nfunction fbm(x, y, z, o = 3) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * noise(x * f, y * f, z * f); f *= 2.03; a *= .5; } return s; }\n\n/* ===================== painted textures ===================== */\nconst STYLE = d => ({\n  lush:     { ramp: [hsl(200 + d, 70, 34), hsl(185 + d, 75, 48), hsl(120 + d, 55, 46), hsl(95 + d, 65, 56), hsl(70 + d, 70, 68)], sea: .5, atmo: hsl(190 + d, 95, 68), clouds: .8 },\n  toxic:    { ramp: [hsl(290 + d, 45, 32), hsl(80 + d, 70, 38), hsl(68 + d, 85, 52), hsl(55 + d, 95, 66)], atmo: hsl(80 + d, 95, 62), clouds: .4 },\n  frozen:   { ramp: [hsl(215 + d, 50, 52), hsl(205 + d, 55, 70), hsl(195 + d, 50, 84), hsl(190 + d, 40, 95)], atmo: hsl(195 + d, 95, 78), clouds: .5 },\n  scorched: { ramp: [hsl(345 + d, 55, 24), hsl(355 + d, 65, 36), hsl(10 + d, 75, 48), hsl(22 + d, 80, 58)], atmo: hsl(335 + d, 90, 68) },\n  barren:   { ramp: [hsl(275 + d, 25, 34), hsl(30 + d, 35, 46), hsl(28 + d, 40, 60), hsl(35 + d, 45, 74)], atmo: hsl(275 + d, 70, 72) },\n  exotic:   { ramp: [hsl(300 + d, 70, 38), hsl(320 + d, 85, 58), hsl(195 + d, 85, 56), hsl(175 + d, 90, 72)], atmo: hsl(185 + d, 100, 70), clouds: .35 },\n  gas:      { bands: [hsl(20 + d, 80, 62), hsl(345 + d, 70, 66), hsl(285 + d, 50, 56), hsl(38 + d, 85, 76), hsl(10 + d, 70, 52)], atmo: hsl(335 + d, 95, 72) },\n  ocean:    { ramp: [hsl(225 + d, 75, 26), hsl(210 + d, 80, 42), hsl(195 + d, 85, 56), hsl(160 + d, 70, 60)], sea: .8, atmo: hsl(205 + d, 100, 70), clouds: .9 },\n});\nconst TEXC = new Map();\nfunction dataTex(data, w, h) { const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat); t.wrapS = THREE.RepeatWrapping; t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true; return t; }\nfunction planetTextures(g) {\n  if (TEXC.has(g.id)) return TEXC.get(g.id);\n  const S = STYLE(g.d)[g.type], TW = 192, TH = 96, map = new Uint8Array(TW * TH * 4), cl = S.clouds ? new Uint8Array(TW * TH * 4) : null;\n  const r = rng(g.id + 'tex'), ox = r() * 40, oy = r() * 40, oz = r() * 40;\n  for (let j = 0; j < TH; j++) {\n    const lat = -Math.PI / 2 + (j + .5) / TH * Math.PI, y = Math.sin(lat), c0 = Math.cos(lat);\n    for (let i = 0; i < TW; i++) {\n      const lon = (i + .5) / TW * TAU, x = c0 * Math.cos(lon), z = c0 * Math.sin(lon), k = (j * TW + i) * 4;\n      let c;\n      if (g.type === 'gas') { const w = fbm(x * 1.1 + ox, y * 1.1 + oy, z * 1.1 + oz, 2); const v = y * 2.4 + w * .45; c = ramp(S.bands, .5 + .5 * Math.sin(v * 4.2)); c = mix3(c, ramp(S.bands, .5 + .5 * Math.sin(v * 2.1 + 1.7)), .35);\n        let dl = lon - 1.4; dl = Math.atan2(Math.sin(dl), Math.cos(dl)); const e = Math.pow(dl * c0 / .34, 2) + Math.pow((lat + .3) / .15, 2); if (e < 1) c = mix3(c, hsl(15 + g.d, 90, 82), smooth(1, .4, e)); }\n      else {\n        const w = fbm(x * .9 + ox, y * .9 + oy, z * .9 + oz, 2), v = .5 + fbm(x * 1.3 + ox + w, y * 1.3 + oy + w, z * 1.3 + oz, 3) * 1.1;\n        if (S.sea) { const sea = S.sea * .5 + .2; c = v < sea ? ramp(S.ramp.slice(0, 2), v / sea) : ramp(S.ramp.slice(1), (v - sea) / (1 - sea) * .9 + .1); if (Math.abs(v - sea) < .03) c = mix3(c, S.ramp[1], .5); }\n        else c = ramp(S.ramp, v);\n        const cap = smooth(.82, .9, Math.abs(y) + w * .1); if (g.type !== 'scorched' && cap > 0) c = mix3(c, [244, 248, 255], cap * .9);\n      }\n      map[k] = c[0]; map[k + 1] = c[1]; map[k + 2] = c[2]; map[k + 3] = 255;\n      if (cl) { const cv = fbm(x * 1.6 + oz, y * 3 + ox, z * 1.6 + oy, 3); cl[ speed: .4, kepler: .8, glow: .55, planets: [{ id: 'sys-d', R: 7.5, ang: 2.2 }] });\nbelt(1310, 20, 'beltC', 80);\ngalaxy('pink', 55, 1400, 18, -40, [1.2, .2, .7]);\n\n/* ---------- speed: stars stretch into streaks while we move; at light speed many more rush at us, then we drop out ---------- */\nconst SN = 1500, SN0 = 560, sPos = new Float32Array(SN * 6), sCol = new Float32Array(SN * 6), hPos = new Float32Array(SN * 3), hCol = new Float32Array(SN * 3), SD = [];\n{ const r = rng('streaks'); for (let i = 0; i < SN; i++) { const a = r() * TAU, d = i < SN0 ? 2.2 + Math.pow(r(), .65) * 42 : 3 + Math.pow(r(), 1.3) * 26, k = r(), b = .45 + r() * .55;\n    SD.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, z0: r() * 340, lf: .5 + r() * .9, c: (k < .15 ? [1, .86, .7] : k < .3 ? [.75, .85, 1] : [1, 1, 1]).map(v => v * b) }); } }\nconst sGeo = new THREE.BufferGeometry(); sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3)); sGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));\nconst streak = new THREE.LineSegments(sGeo, new THREE.LineBasicMaterial({ vertexColors: true, ...add })); streak.frustumCulled = false;\nconst HEAD_VS = `attribute vec3 color; uniform float pr; varying vec3 vC; void main(){ vC = color; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = clamp(60.0 / -mv.z, 1.5, 5.0) * pr; gl_Position = projectionMatrix * mv; }`;\nconst HEAD_FS = `varying vec3 vC; void main(){ float d = length(gl_PointCoord - .5); gl_FragColor = vec4(vC * smoothstep(.5, .1, d), 1.0); }`;\nconst hGeo = new THREE.BufferGeometry(); hGeo.setAttribute('position', new THREE.BufferAttribute(hPos, 3)); hGeo.setAttribute('color', new THREE.BufferAttribute(hCol, 3));\nconst heads = new THREE.Points(hGeo, new THREE.ShaderMaterial({ vertexShader: HEAD_VS, fragmentShader: HEAD_FS, ...add, uniforms: { pr: { value: PR } } })); heads.frustumCulled = false;\nconst rush = new THREE.Group(); rush.add(streak, heads); scene.add(rush); rush.quaternion.setFromUnitVectors(V(0, 0, -1), DIR);\nfunction streaks(T, base) {\n  rush.position.copy(base); const s = lookup(SCUM, T) * VMAX, v = svel(T), w = warpK(T);\n  const vis = smooth(T_BANG + .1, T_BANG + .85, T) * (1 - smooth(T_EXIT + .8, T_ARRIVE - .2, T)), more = smooth(T_WARP, T_FULL - .5, T);\n  rush.visible = vis > 0;\n  SD.forEach((q, i) => { const z = -334 + ((q.z0 + s) % 340), len = Math.min(160, v * 26 * q.lf), f = vis * smooth(-334, -240, z) * (i < SN0 ? 1 : more) * (1 + .25 * w), k = i * 6, h = i * 3;\n    sPos[k] = sPos[k + 3] = hPos[h] = q.x; sPos[k + 1] = sPos[k + 4] = hPos[h + 1] = q.y; sPos[k + 2] = hPos[h + 2] = z; sPos[k + 5] = z - len;\n    sCol[k] = q.c[0] * f; sCol[k + 1] = q.c[1] * f; sCol[k + 2] = q.c[2] * f; sCol[k + 3] = sCol[k + 4] = sCol[k + 5] = 0;\n    hCol[h] = sCol[k] * w; hCol[h + 1] = sCol[k + 1] * w; hCol[h + 2] = sCol[k + 2] * w; });\n  sGeo.attributes.position.needsUpdate = sGeo.attributes.color.needsUpdate = hGeo.attributes.position.needsUpdate = hGeo.attributes.color.needsUpdate = true;\n}\n\n/* ---------- camera ---------- */\nconst pointer = new THREE.Vector2(), pSmooth = new THREE.Vector2();\nfunction frame(T) {\n  const t = 4 + T, e = T - T_BANG, born = e >= 0; time.value = t; pSmooth.lerp(pointer, .06);\n  world.visible = born && T < T_WARP + 1.5; ticks.forEach(f => f(t));\n  let base, target;\n  if (!born) {   // circle slowly round the forming star (about 18°) while creeping closer, so the spiral and the star read in depth\n    const yaw = -.32 * (1 - smooth(0, T_BANG - .2, T));\n    base = CORE.clone().add(DIR.clone().negate().applyAxisAngle(UP, yaw).multiplyScalar(26 + 20 * (1 - smooth(0, T_BANG, T)))); target = CORE;\n  } else { base = at(dist(T)); target = base.clone().addScaledVector(DIR, LOOK); }\n  const shake = born ? .1 * Math.exp(-e * 5) : .05 * Math.pow(smooth(T_SHAKE, T_BANG, T), 2);\n  const pos = base.clone().addScaledVector(RIGHT, Math.sin(T * 47) * shake).addScaledVector(UP, Math.cos(T * 41) * shake);\n  const b = smooth(T_ARRIVE,
