<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  KnowScroll · Universe tab: the design file. One place for every final screen and the system behind it:
  foundations (colour, type, layout, radius, elevation, motion, icons), components with their properties, every finalized screen live,
  behaviour, the five animations, rules, handoff and the changelog. Screens and animations are copies of the finalized files, loaded one at a time; the files themselves are the source of truth.
-->
<style>
:root{
  --bg:#0B0B0D; --canvas:#111114; --panel:#16161A; --panel2:#1C1C21; --edge:rgba(242,238,227,.1); --edge2:rgba(242,238,227,.18);
  --tx:#F2EEE3; --tx2:#A29C8E; --tx3:#6E695F; --sel:#2C46E8; --hi:#FFE44D;
  --paper:#FFFDF2; --cream:#fffdf2; --paper2:#f4edd8; --ink:#15302A; --deep:#15302a; --ink2:#566962; --accent:#2C46E8; --focus:#FFE44D; --orange:#ff684c; --fresh:#14C79B;
  --label:#FFFDF2; --label2:rgba(255,253,242,.72);
  --f-display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif; --f-text:'Instrument Sans',system-ui,sans-serif; --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--f-text);display:grid;grid-template-rows:48px 1fr;grid-template-columns:248px 1fr 300px;overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- app frame: top bar, pages, canvas, inspector ---------- */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--edge);background:var(--panel)}
.topbar .logo{width:26px;height:26px;border-radius:8px;background:var(--paper);color:var(--ink);display:grid;place-items:center;font:800 14px/1 var(--f-display)}
.topbar .file{font:700 14px/1 var(--f-text)}
.topbar .crumb{font:500 13px/1 var(--f-text);color:var(--tx2)}
.topbar .sp{flex:1}
.topbar .badge{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:6px;background:rgba(20,199,155,.14);color:#4fe0b8}
.topbar .meta{font:500 12px/1 var(--f-mono);color:var(--tx3)}
.pages{background:var(--panel);border-right:1px solid var(--edge);overflow:auto;padding:14px 10px 30px}
.pages h6{font:500 10.5px/14px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding:14px 10px 6px}
.pages button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font:500 13.5px/18px var(--f-text);color:var(--tx2)}
.pages button:hover{background:var(--panel2);color:var(--tx)}
.pages button.on{background:var(--panel2);color:var(--tx);font-weight:700}
.pages button i{width:6px;height:6px;border-radius:50%;background:transparent;flex:none}
.pages button.on i{background:var(--hi)}
.canvas{overflow:auto;background:var(--canvas);position:relative}
.canvas.frame{overflow:hidden;display:flex;flex-direction:column}
.inspect{background:var(--panel);border-left:1px solid var(--edge);overflow:auto;padding:16px 16px 40px}
.inspect h5{font:500 10.5px/14px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-bottom:10px}
.inspect .nm{font:800 18px/22px var(--f-display);margin-bottom:4px}
.inspect .ds{font:500 13px/19px var(--f-text);color:var(--tx2);margin-bottom:14px}
.inspect table{width:100%;border-collapse:collapse;font-size:12.5px}
.inspect td{padding:7px 0;border-top:1px solid var(--edge);vertical-align:top}
.inspect td:first-child{color:var(--tx3);width:42%;padding-right:8px;font:500 11.5px/16px var(--f-mono)}
.inspect td:last-child{font:500 12.5px/17px var(--f-text);word-break:break-word}
.inspect .sw2{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.inspect .empty{font:500 13px/19px var(--f-text);color:var(--tx3)}

/* ---------- doc content ---------- */
.doc{max-width:1180px;margin:0 auto;padding:40px 44px 120px}
.doc .kick{font:500 11px/14px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.doc h1{font:800 40px/44px var(--f-display);letter-spacing:-.02em;margin-top:8px}
.doc .lede{font:400 16px/25px var(--f-text);color:var(--tx2);margin-top:12px;max-width:820px}
.doc h2{font:800 24px/28px var(--f-display);letter-spacing:-.01em;margin:46px 0 6px}
.doc h2 + p,.doc .note{font:400 14px/21px var(--f-text);color:var(--tx2);max-width:820px;margin-bottom:18px}
.doc h3{font:700 16px/20px var(--f-display);margin:26px 0 10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g6{grid-template-columns:repeat(6,1fr)}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px}
.card b{display:block;font:700 15px/20px var(--f-text)}
.card p{font:400 13.5px/20px var(--f-text);color:var(--tx2);margin-top:6px}
.stat{font:800 34px/1 var(--f-display)}
.stat + span{display:block;font:500 12px/16px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin-top:8px}
table.spec{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel);border:1px solid var(--edge);border-radius:14px;overflow:hidden}
table.spec th{text-align:left;font:500 10.5px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);padding:12px 14px;background:var(--panel2)}
table.spec td{padding:11px 14px;border-top:1px solid var(--edge);vertical-align:top;line-height:19px}
table.spec td code,.doc code{font:500 12px/1 var(--f-mono);background:rgba(242,238,227,.07);padding:3px 6px;border-radius:5px;color:#e8e2d2;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12px}

/* swatches */
.swatch{border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--edge);cursor:pointer}
.swatch .chipc{height:84px;position:relative}
.swatch .chipc.split{display:flex}
.swatch .chipc.split span{flex:1}
.swatch .lab{padding:10px 12px 12px}
.swatch .lab b{display:block;font:700 13.5px/18px var(--f-text)}
.swatch .lab span{display:block;font:500 11.5px/16px var(--f-mono);color:var(--tx2);margin-top:2px}
.swatch .lab small{display:block;font:400 12px/17px var(--f-text);color:var(--tx3);margin-top:4px}
.ramp{display:flex;height:46px;border-radius:10px;overflow:hidden;margin-top:8px}
.ramp span{flex:1}
.pal{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:14px;cursor:pointer}
.pal header{display:flex;justify-content:space-between;align-items:baseline}
.pal header b{font:700 15px/20px var(--f-text)}
.pal header span{font:500 11px/14px var(--f-mono);color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.pal .row{display:flex;gap:6px;margin-top:8px}
.pal .row i{flex:1;height:30px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.pal .rl{font:500 10px/12px var(--f-mono);color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-top:10px}

/* type specimens */
.type{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:center;padding:16px 18px;border-top:1px solid var(--edge);cursor:pointer}
.type:first-child{border-top:0}
.type:hover,.sel{background:rgba(44,70,232,.08)}
.type .k b{display:block;font:700 13.5px/18px var(--f-text)}
.type .k span{display:block;font:500 11.5px/16px var(--f-mono);color:var(--tx3);margin-top:3px}
.families{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fam{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:18px}
.fam .big{font-size:54px;line-height:1;margin:6px 0 12px}
.fam .abc{font-size:15px;line-height:22px;color:var(--tx2);word-break:break-all}

/* layout diagrams */
.diagram{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:22px;display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.phoneD{width:195px;height:422px;border-radius:22px;background:#020308;position:relative;box-shadow:0 0 0 4px #050505,0 0 0 5px #26272b;flex:none;overflow:hidden}
.phoneD .z{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;font:500 9.5px/12px var(--f-mono);color:#fff;text-align:center}
.deskD{width:720px;height:450px;border-radius:12px;background:#020308;display:flex;overflow:hidden;box-shadow:0 0 0 1px #26272b;flex:none}
.deskD>div{display:flex;align-items:center;justify-content:center;font:500 11px/15px var(--f-mono);text-align:center}

/* motion */
.mo{display:flex;align-items:center;gap:16px}
.mo .demo{width:90px;height:60px;border-radius:10px;background:#020308;display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
@keyframes mpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes mripple{0%{transform:scale(1);opacity:.9}65%{transform:scale(3.6);opacity:0}100%{transform:scale(3.6);opacity:0}}
@keyframes mblink{50%{opacity:0}}
@keyframes mglow{0%,100%{opacity:.3;transform:scale(1.1)}50%{opacity:.6;transform:scale(1.35)}}
@keyframes morbit{to{transform:rotate(360deg)}}
@keyframes mping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes mspin{to{background-position:-90px 0}}
@keyframes mtap{0%{transform:scale(1);opacity:.9}45%{transform:scale(3.2);opacity:0}100%{transform:scale(3.2);opacity:0}}

/* ---------- component specimens (values copied from the finalized files) ---------- */
.specimens{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.spec-card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.spec-card.on{box-shadow:0 0 0 2px var(--sel)}
.spec-card .stage{min-height:150px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:24px 18px;position:relative}
.stage.space{background:radial-gradient(circle at 50% 40%,#0b0f1a,#020308 70%)}
.stage.paper{background:#fffdf2}
.stage.map{background:radial-gradient(circle at 50% 50%,#43c9d6,#178cba 55%,#0a4f7e)}
.spec-card .cap{padding:12px 14px 14px;border-top:1px solid var(--edge)}
.spec-card .cap b{font:700 14px/18px var(--f-text)}
.spec-card .cap span{display:block;font:500 11.5px/16px var(--f-mono);color:var(--tx3);margin-top:3px}
.x-tabbar{display:flex;gap:4px;padding:6px;border-radius:26px;background:rgba(11,26,46,.82);box-shadow:0 0 0 1px rgba(255,251,240,.18),0 12px 28px -10px #000}
.x-tab{width:74px;height:56px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 11px/13px var(--f-text);color:rgba(255,251,240,.75)}
.x-tab.cur{background:var(--accent);color:var(--paper)}
.x-worldnav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border:1px solid rgba(255,255,255,.15);border-radius:24px;background:rgba(10,20,28,.42);width:362px;
  box-shadow:0 18px 40px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(22px) saturate(1.35)}
.x-navtab{display:grid;gap:5px;justify-items:center;padding:9px 4px 8px;color:rgba(255,255,255,.6);border-radius:17px;font:800 11px/1 var(--f-text)}
.x-navtab.on{color:#fff;background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.x-rail{width:88px;height:300px;background:#06080d;display:flex;flex-direction:column;align-items:center;gap:2px;padding:20px 0;border-radius:10px}
.x-rail .lg{color:#FFE44D;font:800 24px/1 var(--f-display);margin-bottom:22px}
.x-rail span{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;font:600 14px/18px var(--f-text);color:rgba(255,251,240,.5)}
.x-rail span::after{content:"";width:5px;height:5px;border-radius:50%;background:transparent}
.x-rail span.cur{color:#fffdf2;font-weight:800}
.x-rail span.cur::after{background:#FFE44D}
.x-chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font:600 14px/18px var(--f-text);white-space:nowrap;border:1px solid rgba(255,251,240,.5);background:rgba(2,3,8,.45);color:var(--label)}
.x-chip.solid{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.x-chip .dot{width:8px;height:8px;border-radius:4px;border:1px solid currentColor}
.x-chip .dot.on{background:var(--fresh);border-color:var(--fresh)}
.x-ib{width:48px;height:48px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,251,240,.94);color:var(--ink)}
.x-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;min-height:48px;padding:0 20px;font:600 15px/20px var(--f-text);white-space:nowrap;border:2px solid var(--ink)}
.x-btn.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)} .x-btn.ghost{color:var(--ink);background:transparent} .x-btn.space{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.x-btn.outline{color:var(--label);border-color:rgba(255,251,240,.5);background:rgba(2,3,8,.45)}
.x-card{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;width:330px}
.x-card .ey{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.x-card h4{font:700 22px/28px var(--f-display);letter-spacing:-.02em}
.x-pill{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 10px;border:1px solid rgba(21,48,42,.2);border-radius:15px;background:rgba(255,253,242,.94);color:#15302a;font:800 14px/1 var(--f-text);box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
.x-level{padding:4px 8px;border-radius:99px;background:var(--orange);color:#fff;font:800 10px/1 var(--f-text);letter-spacing:.11em;text-transform:uppercase}
.x-chipL{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 15px;border-radius:999px;font:800 14px/1 var(--f-text);background:rgba(255,253,242,.94);color:#15302a;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.x-chipD{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 15px;border-radius:999px;font:800 14px/1 var(--f-text);background:rgba(6,20,30,.6);color:#fff;border:1px solid rgba(255,255,255,.2)}
.x-mapcard{width:350px;padding:15px 16px 14px;border:1px solid rgba(255,255,255,.15);border-radius:24px;background:rgba(6,26,38,.74);color:#fff;box-shadow:0 20px 46px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(1.3)}
.x-mapcard .k{display:flex;align-items:center;gap:8px;color:#8edbe0;font:800 11px/1 var(--f-text);letter-spacing:.14em;text-transform:uppercase}
.x-mapcard .k::before{content:"";width:8px;height:8px;border-radius:50%;background:#33c4b4;box-shadow:0 0 10px #33c4b4}
.x-mapcard h4{margin:9px 0 5px;font:800 23px/27px var(--f-display);letter-spacing:-.02em}
.x-mapcard p{color:rgba(214,238,245,.75);font:500 14px/20px var(--f-text)}
.x-mapcard .a{display:flex;gap:8px;margin-top:13px}
.x-go{flex:1;display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 8px 0 16px;border-radius:15px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);font:800 15px/1 var(--f-text)}
.x-go::after{content:"→";display:grid;width:32px;height:32px;place-items:center;border-radius:10px;background:#33c4b4;color:#0b2028}
.x-ghost{display:flex;align-items:center;height:48px;padding:0 18px;border-radius:15px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);font:800 15px/1 var(--f-text)}
.x-field{width:270px;height:50px;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;border-radius:16px;background:rgba(255,253,242,.97);color:#15302a;font:600 16px/1 var(--f-text);box-shadow:0 0 0 2px var(--focus),0 10px 24px -10px rgba(0,0,0,.7)}
.x-field i{width:2px;height:22px;background:#15302a;animation:mblink 1.05s steps(1) infinite}
.x-cancel{height:50px;display:flex;align-items:center;padding:0 16px;border-radius:16px;background:rgba(6,20,30,.6);border:1px solid rgba(255,255,255,.2);color:#fff;font:800 14px/1 var(--f-text)}
.x-results{width:340px;background:#fffdf2;color:#15302a;border-radius:16px;padding:6px;box-shadow:0 18px 40px -18px rgba(0,0,0,.8)}
.x-results .h{display:flex;justify-content:space-between;padding:10px 12px 8px;font:500 10.5px/13px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(21,48,42,.6)}
.x-res{padding:11px 12px}
.x-res + .x-res{border-top:1px solid rgba(21,48,42,.1)}
.x-res.top{background:#f4edd8;border-radius:10px}
.x-res.top + .x-res{border-top-color:transparent}
.x-res b{display:block;font:700 16px/21px var(--f-text)}
.x-res b mark{background:#FFEC7A;color:#15302a;border-radius:3px;padding:0 1px}
.x-res span{display:block;font:500 10.5px/13px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:rgba(21,48,42,.6);margin-top:4px}
.x-filters{display:flex;gap:20px}
.x-filters span{display:flex;flex-direction:column;align-items:center;gap:5px;color:rgba(255,253,242,.6);font:700 14px/1 var(--f-text)}
.x-filters span::after{content:"";width:5px;height:5px;border-radius:50%;background:transparent}
.x-filters span.on{color:#fffdf2;font-weight:800}
.x-filters span.on::after{background:#FFE44D}
.x-list{width:340px;color:#15302a}
.x-list .hd{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 8px}
.x-list .hd b{font:800 23px/27px var(--f-display);letter-spacing:-.015em}
.x-list .hd span{font:600 13px/1 var(--f-text);color:rgba(21,48,42,.62)}
.x-row{display:flex;align-items:center;gap:10px;padding:10px 4px;min-height:52px;border-top:1px solid rgba(21,48,42,.12)}
.x-row:first-of-type{border-top:0}
.x-row .t{display:block;font:700 16px/21px var(--f-text)}
.x-row .m{display:flex;align-items:center;gap:6px;font:500 13px/17px var(--f-text);color:rgba(21,48,42,.62)}
.x-row .m i{width:7px;height:7px;border-radius:50%;background:var(--orange)}
.x-row.cur{background:#FFEC7A;border-radius:12px;margin:0 -12px;padding:10px 16px;border-top-color:transparent}
.x-row.cur + .x-row{border-top-color:transparent}
.x-row .tx{flex:1}
.x-pulse{position:relative;width:8px;height:8px;margin-right:10px;flex:none}
.x-pulse b,.x-pulse i{position:absolute;inset:0;border-radius:50%}
.x-pulse b{background:#ff3b30;z-index:1}
.x-pulse i{border:1.5px solid #ff3b30;animation:mripple 2.2s ease-out infinite}
.x-sw{width:40px;height:24px;border-radius:12px;background:rgba(21,48,42,.22);position:relative;flex:none}
.x-sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.x-sw.on{background:#14C79B}.x-sw.on::after{left:19px}
.x-visit{width:350px;display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);border-radius:999px;padding:6px}
.x-visit .av{width:40px;height:40px;border-radius:999px;background:#FF8A5B;display:grid;place-items:center;font:800 16px/1 var(--f-display)}
.x-visit .tx{flex:1;display:flex;flex-direction:column}
.x-visit .tx b{font:700 15px/19px var(--f-text)} .x-visit .tx small{font:500 12.5px/16px var(--f-text);color:var(--ink2)}
.x-notice{width:350px;display:flex;align-items:center;gap:12px;background:var(--paper);color:var(--ink);border-radius:20px;padding:10px 10px 10px 12px}
.x-notice .n{width:34px;height:34px;border-radius:999px;background:rgba(17,17,17,.07);display:grid;place-items:center}
.x-notice span{flex:1;font:500 14.5px/20px var(--f-text)}
.x-dock{width:340px;background:#f4edd8;color:#15302a;border-radius:20px;padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:6px}
.x-dock .ey{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(21,48,42,.62)}
.x-dock h4{font:800 22px/26px var(--f-display);letter-spacing:-.02em}
.x-dock p{font:500 14px/20px var(--f-text);color:rgba(21,48,42,.72)}
.x-kbd{min-width:26px;height:24px;padding:0 7px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,251,240,.35);background:rgba(2,3,8,.5);font:500 11.5px/1 var(--f-mono);color:var(--label)}
.x-keys{display:flex;gap:18px;font:500 12.5px/1 var(--f-text);color:var(--label2)}
.x-keys span{display:flex;align-items:center;gap:8px}
.x-tag{height:30px;display:inline-flex;align-items:center;padding:0 10px;border-radius:10px;border:1px solid rgba(255,253,242,.35);font:800 10px/1 var(--f-text);letter-spacing:.11em;text-transform:uppercase;color:#fffdf2;background:#141a22}
.x-lbl{font:700 14px/18px var(--f-display);color:var(--label);text-shadow:0 0 6px rgba(0,0,0,.95),0 0 2px #000}
.x-yh{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:#15302a;color:#FFE44D;font:800 10px/1 var(--f-text);letter-spacing:.08em;text-transform:uppercase}

/* flow */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.flow .n{background:var(--panel);border:1px solid var(--edge2);border-radius:12px;padding:10px 12px;font:700 13px/17px var(--f-text)}
.flow .n small{display:block;font:500 10.5px/14px var(--f-mono);color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.flow .a{color:var(--tx3);font:500 12px/16px var(--f-mono);display:flex;flex-direction:column;align-items:center}
.flow .a::before{content:"→";font-size:18px;color:var(--tx2)}
.dodont{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dd{border-radius:14px;padding:16px 18px;background:var(--panel);border:1px solid var(--edge)}
.dd h4{font:800 13px/1 var(--f-text);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.dd.do h4{color:#4fe0b8} .dd.dont h4{color:#ff8a7a}
.dd li{font:400 14px/21px var(--f-text);color:var(--tx);margin:0 0 8px 18px}
.dd li span{color:var(--tx2)}
.flag{display:inline-block;font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:rgba(255,138,122,.14);color:#ff9d8f;margin-right:6px}

/* screens page */
.screenbar{display:flex;align-items:center;gap:22px;padding:12px 22px;border-bottom:1px solid var(--edge);background:var(--panel);flex-wrap:wrap}
.screenbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 14px/20px var(--f-text);color:var(--tx2)}
.screenbar button::after{content:"";width:5px;height:5px;border-radius:50%;background:transparent}
.screenbar button.on{color:var(--tx);font-weight:800}
.screenbar button.on::after{background:var(--hi)}
.screenbar .info{margin-left:auto;font:500 12px/16px var(--f-mono);color:var(--tx3)}
.screenbar .info a{color:var(--tx2)}
.screenmeta{display:flex;gap:24px;padding:10px 22px;border-bottom:1px solid var(--edge);font:500 12.5px/18px var(--f-text);color:var(--tx2);flex-wrap:wrap}
.screenmeta b{color:var(--tx)}
iframe#view{flex:1;width:100%;border:0;background:#0C0C0E}
#err{position:fixed;left:12px;bottom:12px;max-width:600px;background:#B23A0B;color:#fff;font:12px/16px var(--f-mono);padding:10px;border-radius:8px;display:none;white-space:pre-wrap;z-index:99}
@media (max-width:1100px){body{grid-template-columns:200px 1fr}.inspect{display:none}.g4,.g6{grid-template-columns:repeat(2,1fr)}.specimens{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<script>
/* ===================== the finalized screens (copies; the files are the source of truth) ===================== */
const SCREENS = [{"name": "Space views", "path": "universe-above/universe-drafts-finalized.html", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Universe Drafts 05<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<!--\n  Universe redesign drafts, round 05. Reference: No Man's Sky (stylised 3D, saturated colour, soft painted planets,\n  big glowing atmospheres, bright small suns with bloom). Feedback applied: no realistic textures, no orbit lines,\n  planets revolve around their sun, true-to-scale feel (tiny planets, wide spacing), black sky with stars.\n  Same six screens: U01 Empty, Emerging, Overview, Lately, U08 Far + card, U02 System.\n  Consistency pass (2026-10-28): one tab bar (glass), one paper/ink pair (#FFFDF2 / #15302A), no dashed route on U02, uncharted never written.\n-->\n<script type=\"importmap\">{ \"imports\": { \"three\": \"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js\" } }<\/script>\n<style>\n:root{\n  --paper:#FFFDF2; --ink:#15302A; --ink2:#566962; --accent:#2C46E8; --focus:#FFE44D; --fresh:#14C79B;\n  --label:#FFFDF2; --label2:rgba(255,253,242,.72);\n  --f-display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;\n  --f-text:'Instrument Sans',system-ui,sans-serif;\n  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;\n  --page:#0C0C0E; --page-ink:#F2EEE3; --page-ink2:#A29C8E; --page-edge:rgba(242,238,227,.16);\n}\n:root[data-theme=\"light\"]{ --page:#E9E4D6; --page-ink:#111111; --page-ink2:#5B5649; --page-edge:rgba(21,48,42,.18); }\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:var(--page);color:var(--page-ink);font-family:var(--f-text);padding:32px 16px 80px}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer}\n.intro{max-width:1240px;margin:0 auto 18px}\n.intro .kicker{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--page-ink2)}\n.intro h1{font:800 36px/40px var(--f-display);letter-spacing:-.02em;margin-top:6px}\n.intro p{color:var(--page-ink2);font-size:15px;line-height:22px;margin-top:8px;max-width:840px}\n.tools{max-width:1240px;margin:0 auto 26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.tools button{border:1.5px solid var(--page-edge);border-radius:999px;padding:8px 14px;font:600 13px/1 var(--f-text)}\n.tools .hint{font-size:12.5px;color:var(--page-ink2)}\n.grid{display:flex;flex-wrap:wrap;gap:40px 28px;justify-content:center;max-width:1760px;margin:0 auto}\nfigure{display:flex;flex-direction:column;gap:12px;width:390px}\nfigcaption b{font:500 11px/14px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;display:block;color:var(--page-ink2)}\nfigcaption span{font:700 17px/22px var(--f-display);display:block;margin-top:2px}\nfigcaption small{font-size:12.5px;line-height:18px;color:var(--page-ink2);display:block;margin-top:4px}\n.genomes{max-width:1240px;margin:28px auto 0;display:flex;flex-wrap:wrap;gap:8px}\n.genomes span{font:500 12px/16px var(--f-mono);border:1px solid var(--page-edge);border-radius:999px;padding:6px 10px;color:var(--page-ink2)}\n#err{position:fixed;left:12px;bottom:12px;max-width:600px;background:#B23A0B;color:#fff;font:12px/16px var(--f-mono);padding:10px;border-radius:8px;display:none;white-space:pre-wrap;z-index:99}\n\n.phone{width:390px;height:844px;position:relative;overflow:hidden;border-radius:38px;background:#020308;\n  box-shadow:0 0 0 8px #050505,0 0 0 9px #26272b,0 30px 60px -24px rgba(0,0,0,.8);isolation:isolate}\n.phone canvas{position:absolute;inset:0;width:390px;height:844px;display:block}\n.labels{position:absolute;inset:0;pointer-events:none;z-index:1}\n.lbl{position:absolute;left:0;top:0;font:700 14px/18px var(--f-display);color:var(--label);white-space:nowrap;text-shadow:0 0 6px rgba(0,0,0,.95),0 0 2px #000;will-change:transform}\n.lbl.sm{font-size:12.5px} .lbl.calm{opacity:.5}\n.chrome{position:absolute;inset:0;z-index:2;color:var(--label);pointer-events:none}\n.chrome .chip,.chrome .ib,.chrome .card,.chrome .note,.chrome .tabbar,.chrome .btn{pointer-events:auto}\n.statusbar{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 34px;font:600 15px/1 var(--f-text);color:var(--label);z-index:5;pointer-events:none}\n.statusbar i{width:26px;height:12px;border:1.5px solid var(--label);border-radius:4px;display:inline-block;position:relative}\n.statusbar i:after{content:\"\";position:absolute;inset:1.5px;right:5px;background:var(--label);border-radius:1.5px}\n.top{position:absolute;top:0;left:0;right:0;padding:59px 16px 0;display:flex;flex-direction:column;gap:10px}\n.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 16px 104px;display:flex;flex-direction:column;gap:12px}\n.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}\n.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.title{font:800 28px/32px var(--f-display);letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.6)}\n.eyebrow{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--label2);display:block}\n.sub{font:400 16px/22px var(--f-text);color:var(--label2);margin-top:-4px}\n.avatar{width:40px;height:40px;border-radius:999px;background:var(--focus);color:var(--ink);font:800 16px/1 var(--f-display);display:flex;align-items:center;justify-content:center;flex:none}\n.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font:600 14px/18px var(--f-text);white-space:nowrap;border:1px solid rgba(255,253,242,.5);background:rgba(2,3,8,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}\n.chip.solid{background:var(--paper);color:var(--ink);border-color:var(--paper)}\n.chip .dot{width:8px;height:8px;border-radius:4px;border:1px solid currentColor}\n.chip .dot.on{background:var(--fresh);border-color:var(--fresh)}\n.ib{width:48px;height:48px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:rgba(255,253,242,.94);color:var(--ink)}\n.card{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;width:100%}\n.card .head{display:flex;align-items:center;justify-content:space-between}\n.card .eyebrow{color:var(--ink2)}\n.card h2{font:700 22px/28px var(--f-display);letter-spacing:-.02em}\n.card .acts{display:flex;gap:8px;margin-top:8px}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;min-height:48px;padding:0 20px;font:600 15px/20px var(--f-text);white-space:nowrap;border:2px solid var(--ink)}\n.btn.ink{background:var(--ink);color:var(--paper)} .btn.ghost{color:var(--ink)} .btn.space{background:var(--paper);color:var(--ink);border-color:var(--paper)}\n.note{display:flex;align-items:center;gap:4px;align-self:center;background:var(--paper);color:var(--ink);border-radius:18px;padding:0 4px 0 16px}\n.note span{font:500 15px/22px var(--f-text);padding:12px 0}\n.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 36px;text-align:center}\n.center h2{font:800 28px/32px var(--f-display);letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.7)}\n.center p{font:400 17px/25px var(--f-text);color:var(--label2)}\n.tabbar{position:absolute;z-index:4;left:14px;right:14px;bottom:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border:1px solid rgba(255,255,255,.15);border-radius:24px;background:rgba(10,20,28,.42);box-shadow:0 18px 40px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35)}\n.tab{display:grid;gap:5px;justify-items:center;padding:9px 4px 8px;color:rgba(255,255,255,.6);border-radius:17px;font:800 11px/1 var(--f-text)}\n.tab svg{width:21px;height:21px;stroke-width:1.9}\n.tab.cur{color:#fff;background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}\n@media (max-width:440px){ figure{width:100%} .phone{transform:scale(.86);transform-origin:top left;margin-bottom:-118px} }\n<\/style>\n<\/head>\n<body>\n<header class=\"intro\">\n  <span class=\"kicker\">KnowScroll · Universe · Drafts round 05 · No Man's Sky style<\/span>\n  <h1>Painted worlds, real motion, real scale<\/h1>\n  <p>Stylised like No Man's Sky: saturated, smoothly painted planets with soft day and night sides, a warm twilight band and big glowing atmospheres. Each sun is a small, bright orange ball with a wide bloom.\n     There are no orbit lines: planets revolve around their sun, inner ones faster. Planets are tiny next to the distances between them, so a big universe stays readable.\n     The sky stays black with stars, with only a faint colour haze around each system. Click the Overview phone to fly in.<\/p>\n<\/header>\n<div class=\"tools\"><button id=\"fly\">Play fly-in<\/button><button id=\"pause\">Pause motion<\/button><button id=\"theme\">Light page<\/button><span class=\"hint\">Move the pointer over a phone to feel the depth.<\/span><\/div>\n<main class=\"grid\" id=\"grid\"><\/main>\n<div class=\"genomes\" id=\"genomes\"><\/div>\n<div id=\"err\"><\/div>\n\n<script>window.addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += (e.message || 'error') + '\\n'; });<\/script>\n<script type=\"module\">\nimport * as THREE from 'three';\n\nconst W = 390, H = 844, PR = Math.min(1.5, window.devicePixelRatio || 1), TAU = Math.PI * 2;\nconst clamp = (x, a = 0, b = 1) => cale.setScalar(R * (1.1 + .25 * k)); pick.material.opacity = .3 + .3 * k; }); }\n        this.label(name, g.position.clone().add(V(0, 0, R * .45)), { dy: i === 1 ? 16 : 6, sm: i !== 1 });\n      });\n    }\n    if (key === 'system') {\n      const s = this.addSys({ name: 'Machine learning', x: 0, z: 0, family: 'teal', sunR: 1.7, planetR: .55, speed: .07, kepler: .5, glow: .4,\n        planets: [{ id: 'attention', R: 3.8, ang: Math.PI * .95 }, { id: 'inference', R: 6.3, ang: .35 }, { id: 'hardware', R: 8.8, ang: -1.75 }] }, false);\n      const [a, b, c] = s.userData.planets;\n      const st = makeStation({ ...ctx, light: V() }, 0); st.position.set(-3.6, -.5, 6.6); st.scale.setScalar(1.3); this.scene.add(st); this.ticks.push(st.userData.tick);\n      const sh = makeShip({ ...ctx, light: V() }, 1.3); sh.position.set(.75, .6, 0); b.add(sh); this.ticks.push(sh.userData.tick);\n      [['Attention', a, 24], ['Inference & serving', b, 24], ['Hardware', c, 34]].forEach(([n, p, dy]) => this.label(n, live(p), { dy }));\n      this.label('Model serving room', st.position.clone().add(V(0, -.45, 0)), { sm: true, dy: 10 });\n    }\n  }\n  startFly() { if (!this.flyTo || this.fly) return; this.fly = { t0: this.time.value }; }\n  render(t) {\n    this.time.value = t; this.ticks.forEach(f => f(t)); this.pSmooth.lerp(this.pointer, .06);\n    let pos = this.base.clone().add(V(Math.sin(t * .11) * .6 * this.drift + this.pSmooth.x * 1.6, Math.sin(t * .07) * .4 * this.drift - this.pSmooth.y * 1.1, Math.sin(t * .05) * .5 * this.drift));\n    let target = this.target.clone(), fov = 38;\n    if (this.fly) { const e = t - this.fly.t0, k = e < 2.4 ? e / 2.4 : e < 4.6 ? 1 : e < 6.8 ? 1 - (e - 4.6) / 2.2 : 0, s = k * k * (3 - 2 * k);\n      if (e > 6.8) this.fly = null;\n      pos = pos.lerp(this.flyTo.clone().add(V(0, 4.2, 8.5)), s); target = target.lerp(this.flyTo, s); fov = 38 + Math.sin(s * Math.PI) * 9; }\n    this.camera.position.copy(pos); this.camera.fov = fov; this.camera.updateProjectionMatrix(); this.camera.lookAt(target);\n    this.renderer.render(this.scene, this.camera);\n    for (const l of this.labels) { const v = (typeof l.pos === 'function' ? l.pos() : l.pos.clone()).project(this.camera); if (v.z > 1) { l.el.style.display = 'none'; continue; }\n      l.el.style.display = ''; l.el.style.transform = `translate(${(v.x * .5 + .5) * W}px, ${(-v.y * .5 + .5) * H + l.dy}px) translate(-50%, 0)`; }\n  }\n}\n\n/* ===================== chrome ===================== */\nconst ICONS = {\n  explore: '<rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"3\"/><path d=\"M8 3l4 4 4-4\"/>', universe: '<circle cx=\"12\" cy=\"12\" r=\"3.5\"/><ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4.5\" transform=\"rotate(-20 12 12)\"/>',\n  talk: '<path d=\"M4 5h16v11H9l-5 4z\"/>', keep: '<path d=\"M6 3h12v18l-6-4-6 4z\"/>', back: '<path d=\"M15 5l-7 7 7 7\"/>', arrowRight: '<path d=\"M5 12h14\"/><path d=\"M13 6l6 6-6 6\"/>',\n  close: '<path d=\"M6 6l12 12M18 6L6 18\"/>', search: '<circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M20 20l-4-4\"/>', list: '<path d=\"M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01\"/>',\n};\nconst icon = (n, s = 20) => `<svg width=\"${s}\" height=\"${s}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"${s >= 20 ? 2 : 2.4}\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${ICONS[n]}<\/svg>`;\nconst chip = (l, o = {}) => `<span class=\"chip ${o.solid ? 'solid' : ''}\">${o.ic ? icon(o.ic, 16) : ''}${o.dot !== undefined ? `<span class=\"dot ${o.dot ? 'on' : ''}\"><\/span>` : ''}${l}<\/span>`;\nconst tabbar = `<nav class=\"tabbar\">${[['explore', 'Explore'], ['universe', 'Universe'], ['talk', 'Talk'], ['keep', 'Keep']].map(([k, l]) => `<div class=\"tab ${k === 'universe' ? 'cur' : ''}\">${icon(k, 22)}<span>${l}<\/span><\/div>`).join('')}<\/nav>`;\nconst titleRow = `<div class=\"row\"><h1 class=\"title\">Your universe<\/h1><div class=\"avatar\">U<\/div><\/div>`;\nconst headerRoot = (o = {}) => `<div class=\"top\">${titleRow}${o.absent ? '<p class=\"sub\">Everything is where you left it.<\/p>' : ''}<div class=\"actions\"><span class=\"ib\">${icon('search', 22)}<\/span>${chip('Lately', { dot: !!o.lately, solid: !!o.lately })}<\/div><\/div>`;\nconst closeBtn = `<span style=\"width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center\">${icon('close', 22)}<\/span>`;\nconst CHROME = {\n  empty: `<div class=\"top\">${titleRow}<\/div><div class=\"center\"><h2>Your universe starts quiet.<\/h2><p>It takes shape from what you watch and read.<\/p><span class=\"btn space\" style=\"margin-top:8px\">${icon('explore', 20)}Go to Explore<\/span><\/div>`,\n  emerging: `${headerRoot()}<div class=\"bottom\"><div class=\"note\"><span>Recent explorations are gathering here.<\/span>${closeBtn}<\/div><\/div>`,\n  overview: `${headerRoot()}<div class=\"bottom\"><div class=\"actions\">${chip('Return to Attention', { solid: true, ic: 'arrowRight' })}${chip('List view', { ic: 'list' })}<\/div><\/div>`,\n  lately: `${headerRoot({ lately: true, absent: true })}<div class=\"bottom\"><div class=\"actions\">${chip('List view', { ic: 'list' })}<\/div><\/div>`,\n  far: `${headerRoot()}<div class=\"bottom\"><div class=\"card\"><div class=\"head\"><span class=\"eyebrow\">A system<\/span>${closeBtn}<\/div><h2>Machine learning<\/h2><div class=\"acts\"><span class=\"btn ink\">Open system<\/span><span class=\"btn ghost\">Close<\/span><\/div><\/div><\/div>`,\n  system: `<div class=\"top\"><div class=\"row\">${chip('Universe', { solid: true, ic: 'back' })}${chip('Lately', { dot: false })}<\/div><div style=\"padding-top:6px\"><h1 class=\"title\" style=\"font-size:30px;line-height:34px\">Machine learning<\/h1><span class=\"eyebrow\" style=\"margin-top:4px\">A system<\/span><\/div><\/div><div class=\"bottom\"><div class=\"actions\">${chip('List view', { ic: 'list' })}<\/div><\/div>`,\n};\nconst SCREENS = [\n  ['empty', 'U01 · Empty', 'First visit, nothing explored', 'Black, deep space with three layers of stars that drift against each other as the camera breathes.'],\n  ['emerging', 'U01 · Emerging', 'Only dust, tapped', 'A cartoon nebula in pink and violet: thousands of dots and puffy clouds spiral inward along five arms toward a pulsing core.'],\n  ['overview', 'U01 · Overview', 'Your universe, map root (click it)', 'Small bright suns with wide blooms and tiny painted planets revolving around them. Nearer systems are bigger, far ones hazier. Click to fly in.'],\n  ['lately', 'U01 · Lately on', 'Lately lens + back after a while', 'Quiet systems go grey: no bloom, no atmosphere glow. They keep turning.'],\n  ['far', 'U08 · Far + system card', 'Zoomed out, a system picked', 'Each system is a sun in its own colour haze. The picked one gets a soft, pulsing warm glow.'],\n  ['system', 'U02 · System', 'One system, organised by its star', 'A large sun with three small, unlike worlds on clearly separate orbits, spread around it. Hardware has rings and a moon. No orbit lines and no route lines.'],\n];\n\n/* ===================== mount + loop ===================== */\nconst grid = document.getElementById('grid'), scenes = [];\nconst reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\nlet paused = false;\ngrid.innerHTML = SCREENS.map(([k, code, title, note]) => `<figure data-k=\"${k}\"><div class=\"phone\"><canvas><\/canvas><div class=\"labels\"><\/div><div class=\"chrome\">${CHROME[k]}${tabbar}<\/div>\n  <div class=\"statusbar\"><span>9:41<\/span><i><\/i><\/div><\/div><figcaption><b>${code}<\/b><span>${title}<\/span><small>${note}<\/small><\/figcaption><\/figure>`).join('');\nconst io = new IntersectionObserver(es => es.forEach(en => { const s = scenes.find(x => x.fig === en.target); if (s) s.sc.visible = en.isIntersecting; }), { rootMargin: '150px' });\ngrid.querySelectorAll('figure').forEach(fig => {\n  const phone = fig.querySelector('.phone'), sc = new Scene3D(fig.querySelector('canvas'), fig.querySelector('.labels'), fig.dataset.k);\n  phone.addEventListener('pointermove', e => { const b = phone.getBoundingClientRect(); sc.pointer.set((e.clientX - b.left) / b.width * 2 - 1, (e.clientY - b.top) / b.height * 2 - 1); });\n  phone.addEventListener('pointerleave', () => sc.pointer.set(0, 0));\n  if (fig.dataset.k === 'overview') phone.addEventListener('click', () => sc.startFly());\n  scenes.push({ fig, sc }); io.observe(fig); sc.render(4);\n});\ndocument.getElementById('fly').onclick = () => { const s = scenes.find(x => x.fig.dataset.k === 'overview'); s.fig.scrollIntoView({ behavior: 'smooth', block: 'center' }); s.sc.startFly(); };\ndocument.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Play motion' : 'Pause motion'; };\ndocument.getElementById('theme').onclick = e => { const r = document.documentElement, l = r.dataset.theme === 'light'; r.dataset.theme = l ? 'dark' : 'light'; e.target.textContent = l ? 'Light page' : 'Dark page'; };\nlet last = 0;\nfunction loop(now) { requestAnimationFrame(loop); if (paused || reduce || now - last < 33) return; last = now; const t = 4 + now / 1000; for (const { sc } of scenes) if (sc.visible) sc.render(t); }\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "Planet views", "path": "world-views/world-views-finalized.html", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>World Views 04<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<!--\n  World views, round 04 (landing): U04 Region card and U04 You were here, redrawn in the approved round-03 globe palette. U03 kept for reference.\n  Look and feel from goScroll-mobile.html: the cartoon orbit globe (scrolling surface band, stacked inked land,\n  cloud strokes, atmosphere ring, glint) and the landed map (ocean with graticule, shelves, waves and currents,\n  stacked continents split into regions, puffy cloud frontier, dark glass card).\n  One row per planet type in the universe (lush, barren, scorched, gas, frozen, ocean).\n  Consistency pass (2026-10-28): one tab bar (glass), one paper/ink pair (#FFFDF2 / #15302A), no dashed route on U02, uncharted never written.\n-->\n<style>\n:root{\n  --paper:#FFFDF2; --cream:#fffdf2; --ink:#15302A; --ink2:#566962; --accent:#2C46E8; --orange:#ff684c; --focus:#FFE44D;\n  --f-display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;\n  --f-text:'Instrument Sans',system-ui,sans-serif;\n  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;\n  --page:#0C0C0E; --page-ink:#F2EEE3; --page-ink2:#A29C8E; --page-edge:rgba(242,238,227,.16);\n}\n:root[data-theme=\"light\"]{ --page:#E9E4D6; --page-ink:#111111; --page-ink2:#5B5649; --page-edge:rgba(21,48,42,.18); }\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:var(--page);color:var(--page-ink);font-family:var(--f-text);padding:32px 16px 80px}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer}\n.intro{max-width:1240px;margin:0 auto 18px}\n.intro .kicker{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--page-ink2)}\n.intro h1{font:800 36px/40px var(--f-display);letter-spacing:-.02em;margin-top:6px}\n.intro p{color:var(--page-ink2);font-size:15px;line-height:22px;margin-top:8px;max-width:860px}\n.jump{max-width:1240px;margin:16px auto 30px;display:flex;flex-wrap:wrap;gap:8px}\n.jump a,.jump button{border:1.5px solid var(--page-edge);border-radius:999px;padding:8px 14px;font:600 13px/1 var(--f-text);color:var(--page-ink);text-decoration:none}\n.planet-row{max-width:1300px;margin:0 auto 56px;content-visibility:auto;contain-intrinsic-size:1000px}\n.planet-row>header{margin:0 0 16px;display 14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}\n.pill svg{width:17px;height:17px}\n.level-chip{padding:4px 8px;border-radius:99px;background:var(--orange);color:#fff;font:800 10px/1 var(--f-text);letter-spacing:.11em;text-transform:uppercase}\n\n/* ---------- U03: the globe ---------- */\n.globe-wrap{position:absolute;z-index:5;left:50%;top:372px;width:292px;height:292px;transform:translate(-50%,-50%)}\n.atmosphere{position:absolute;inset:-12px;border-radius:50%;border:1px solid var(--atmo-line);box-shadow:0 0 26px var(--atmo-glow),inset 0 0 18px var(--atmo-glow)}\n.globe{position:absolute;inset:0;overflow:hidden;border-radius:50%;border:2px solid var(--rim);background:var(--globe-bg);\n  box-shadow:0 28px 58px rgba(0,0,0,.52),inset -28px -16px 52px rgba(2,10,20,.45)}\n.globe .surface{position:absolute;left:0;top:50%;margin-top:-180px;width:960px;height:360px;animation:spin 70s linear infinite}\n@keyframes spin{to{transform:translateX(-480px)}}\n.cloudband{animation:cloudspin 46s linear infinite}\n@keyframes cloudspin{to{transform:translateX(-480px)}}\n.globe .caps{position:absolute;inset:0;pointer-events:none}\n.shade{position:absolute;inset:-1px;border-radius:50%;background:radial-gradient(circle at 31% 24%,transparent 0 42%,rgba(5,15,30,.1) 56%,rgba(3,8,20,.74) 95%);pointer-events:none}\n.glint{position:absolute;inset:5% 34% 48% 11%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 72%);transform:rotate(-26deg);filter:blur(8px);pointer-events:none}\n.ring{position:absolute;left:50%;top:372px;width:470px;height:470px;transform:translate(-50%,-50%);pointer-events:none}\n.ring.back{z-index:4}.ring.front{z-index:6}\n.moon{position:absolute;z-index:6;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;pointer-events:none;will-change:transform}\n.moon svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 12px rgba(255,249,226,.3))}\n.moon.behind{z-index:4;opacity:.7}\n.caption{position:absolute;z-index:10;left:24px;right:24px;top:556px;display:flex;flex-direction:column;gap:6px}\n.caption .eyebrow{font:500 11px/14px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,253,242,.7)}\n.caption h1{font:800 32px/36px var(--f-display);letter-spacing:-.02em}\n.hint{display:flex;align-items:center;gap:8px;margin-top:4px;color:#b8e2e3;font:700 13px/1 var(--f-text)}\n.hint span{display:grid;width:26px;height:26px;place-items:center;border:1px solid rgba(255,255,255,.2);border-radius:50%;font-size:13px}\n\n/* ---------- U04: the landed map ---------- */\n.map{position:absolute;inset:0}\n.map svg{position:absolute;inset:0;width:390px;height:844px;display:block}\n.current-a{animation:current-drift 9s linear infinite}\n.current-b{animation:current-drift 14s linear infinite;opacity:.7}\n@keyframes current-drift{to{stroke-dashoffset:-37}}\n.cloud{animation:cloud-drift var(--d,12s) ease-in-out infinite alternate}\n@keyframes cloud-drift{from{transform:translateX(calc(var(--dx,6px)*-1))}to{transform:translateX(var(--dx,6px))}}\n.band-drift{animation:band 60s linear infinite}\n@keyframes band{to{transform:translateX(-390px)}}\n.bubble{animation:bubble 3.6s ease-in-out infinite}\n@keyframes bubble{0%,100%{opacity:.2}50%{opacity:1}}\n.port-ping{animation:ping 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}\n@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}\n.storm{animation:storm 40s linear infinite;transform-box:fill-box;transform-origin:center}\n@keyframes storm{to{transform:rotate(360deg)}}\n\n/* goScroll map card, with the app's actions */\n.map-card{position:absolute;z-index:30;left:14px;right:14px;bottom:106px;padding:15px 16px 14px;border:1px solid rgba(255,255,255,.15);border-radius:24px;\n  background:rgba(6,26,38,.74);color:#fff;box-shadow:0 20px 46px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur  b ? b : x;\n\n/* ===================== noise ===================== */\nconst perm = new Uint8Array(512);\n(() => { const p = [...Array(256).keys()], r = rng('knowscroll-world'); for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; })();\nconst fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + (b - a) * t;\nfunction grad(h, x, y, z) { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14) ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }\nfunction noise(x, y, z) {\n  let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z); x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;\n  const u = fade(x), v = fade(y), w = fade(z), A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z, B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;\n  return lerp(lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u), lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),\n    lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u), lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);\n}\nfunction fbm(x, y, z, o) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * noise(x * f, y * f, z * f); f *= 2.03; a *= .5; } return s; }\n\n/* ===================== contours: marching squares, chained and smoothed ===================== */\nconst SEG = { 1: [['L', 'B']], 2: [['B', 'R']], 3: [['L', 'R']], 4: [['T', 'R']], 6: [['T', 'B']], 7: [['T', 'L']], 8: [['T', 'L']], 9: [['T', 'B']], 11: [['T', 'R']], 12: [['L', 'R']], 13: [['R', 'B']], 14: [['L', 'B']] };\nfunction contours(G, iso = 0, passes = 2) {\n  const { W, H, v, x0, y0, cell } = G, pts = new Map(), adj = new Map();\n  const val = (i, j) => (i <= 0 || j <= 0 || i >= W - 1 || j >= H - 1) ? -1 : v[j * W + i] - iso;\n  const key = (e, i, j) => e === 'T' ? `h${i},${j}` : e === 'B' ? `h${i},${j + 1}` : e === 'L' ? `v${i},${j}` : `v${i + 1},${j}`;\n  const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };\n  for (let j = 0; j < H - 1; j++) for (let i = 0; i < W - 1; i++) {\n    const a = val(i, j), b = val(i + 1, j), c = val(i + 1, j + 1), d = val(i, j + 1);\n    const idx = (a > 0 ? 8 : 0) | (b > 0 ? 4 : 0) | (c > 0 ? 2 : 0) | (d > 0 ? 1 : 0); if (idx === 0 || idx === 15) continue;\n    const P = { T: [i + a / (a - b), j], R: [i + 1, j + b / (b - c)], B: [i + d / (d - c), j + 1], L: [i, j + a / (a - d)] };\n    let segs = SEG[idx];\n    if (idx === 5) segs = (a + b + c + d) / 4 > 0 ? [['T', 'L'], ['R', 'B']] : [['T', 'R'], ['L', 'B']];\n    if (idx === 10) segs = (a + b + c + d) / 4 > 0 ? [['T', 'R'], ['L', 'B']] : [['T', 'L'], ['R', 'B']];\n    for (const [e1, e2] of segs) { const k1 = key(e1, i, j), k2 = key(e2, i, j); pts.set(k1, P[e1]); pts.set(k2, P[e2]); link(k1, k2); }\n  }\n  const seen = new Set(), loops = [];\n  for (const start of adj.keys()) { if (seen.has(start)) continue;\n    const loop = []; let prev = null, cur = start;\n    while (cur && !seen.has(cur)) { seen.add(cur); const p = pts.get(cur); loop.push([x0 + p[0] * cell, y0 + p[1] * cell]); const n = adj.get(cur); const next = n.find(k => k !== prev && !seen.has(k)); prev = cur; cur = next; }\n    if (loop.length > 5) loops.push(passes > 1 ? chaikin(chaikin(loop.filter((_, i) => i % 2 === 0))) : chaikin(loop)); }\n  return loops;\n}\nfunction chaikin(p) { const o = []; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; o.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]); } return o; }\nconst toD = loops => loops.map(l => 'M' + l.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') + 'Z').join('');\nfunction grid(x0, y0, x1, y1, cell, fn) { const W = Math.ceil((x1 - x0) / cell) + 1, H = Math.ceil((y1 - y0) / cell) + 1, v = new Float32Array(W * H);\n  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) v[j * W + i] = fn(x0 + i * cell, y0 + j * cell); return { W, H, v, x0, y0, cell }; }\nconst derive = (G, fn) => ({ ...G, v: G.v.map((val, k) => fn(val, G.x0 + (k % G.W) * G.cell, G.y0 + Math.floor(k / G.W) * G.cell, k)) });\n\n/* ===================== the planets ===================== */\nconst PLANETS = [\n  { id: 'inference', name: 'Inference & serving', type: 'lush', system: 'Machine learning', regions: ['Batching', 'Deployment', 'Latency', 'Cost'], sel: 1, route: 'Attention',\n    enc: { kind: 'A Reel', title: 'Where should the model run?', sum: 'Close to the people asking, or close to the hardware, and what each one costs.' } },\n  { id: 'attention', name: 'Attention', type: 'barren', system: 'Machine learning', regions: ['Context windows', 'Saliency', 'Heads', 'Memory'], sel: 0, route: 'Inference & serving', moon: true,\n    enc: { kind: 'A Scroll', title: 'Why long prompts get forgetful', sum: 'What happens to the middle of a very long context, and the tricks that help.' } },\n  { id: 'hardware', name: 'Hardware', type: 'scorched', system: 'Machine learning', regions: ['GPUs', 'Memory bandwidth', 'Interconnect', 'Cooling'], sel: 1, route: 'Inference & serving', rings: true, moon: true,\n    enc: { kind: 'A Reel', title: 'Why GPUs wait on memory', sum: 'Compute got fast. Moving the numbers around did not. Where the time really goes.' } },\n  { id: 'queues', name: 'Queues', type: 'gas', system: 'Backend systems', regions: ['Backpressure', 'Retries', 'Ordering', 'Dead letters'], sel: 0, route: 'Storage', rings: true,\n    enc: { kind: 'A Scroll', title: 'When consumers fall behind', sum: 'Buffers fill, latency climbs and something has to give. Backpressure decides what.' } },\n  { id: 'storage', name: 'Storage', type: 'frozen', system: 'Backend systems', regions: ['Replication', 'Indexes', 'Caching', 'Backups'], sel: 0, route: 'Queues', rings: true,\n    enc: { kind: 'A Reel', title: 'Leaders, followers and the lag', sum: 'Why a read can miss a write you just made, and how replicas catch up.' } },\n  { id: 'tactics', name: 'Tactics', type: 'ocean', system: 'Football', regions: ['Pressing', 'Formations', 'Set pieces', 'Counters'], sel: 0, moon: true,\n    enc: { kind: 'A Reel', title: 'Why teams press high', sum: 'Winning the ball near the goal is worth more than winning it anywhere else.' } },\n];\n\n/* ===================== one look per planet type: flat colour, soft edges ===================== */\nconst T = {\n  lush:     { label: 'Lush world', sea: ['#1d7d97', '#0f5670', '#052c41'], shallow: '#4fc3c9', globe: ['#7fd9d6', '#3fa8bd', '#1c6f93', '#0d3f5e'],\n              land: ['#6fd27f', '#a6e58a', '#4fb878', '#93d6a8'], hi: '#e9d9a0', lo: '#2f8f5c', coast: '#1e5a4a', cloud: ['#f6fcff', '#9dc0d4'], atmo: '#83f2ea', rim: '#b9fff2',\n              accent: '#33c4b4', mc: '#8edbe0', wave: 'rgba(203,245,255,.26)', current: 'rgba(196,242,255,.32)', grat: 'rgba(190,240,255,.1)', detail: 'waves', cover: .1, shadow: '#04283a' },\n  ocean:    { label: 'Ocean world', sea: ['#33a7ea', '#1667b6', '#0a2f6a'], shallow: '#7fd8f7', globe: ['#8fdcff', '#3d9fe0', '#1a63b4', '#0b3270'],\n              land: ['#7ee08e', '#5fcf7c', '#a5e88a', '#4fc06e'], hi: '#ffe7a8', lo: '#2f9a62', coast: '#1d5a4c', cloud: ['#ffffff', '#a7cbe6'], atmo: '#9fe0ff', rim: '#d4f4ff',\n              accent: '#ffd058', mc: '#ffe39a', wave: 'rgba(225,246,255,.34)', current: 'rgba(225,246,255,.36)', grat: 'rgba(210,240,255,.12)', detail: 'waves', archipelago: true, cover: -.1, shadow: '#082a5e' },\n  frozen:   { label: 'Frozen world', sea: ['#4f8fcf', '#24599a', '#0c2a52'], shallow: '#8fc4ef', globe: ['#bfe3fb', '#7fb2e2', '#3e78b8', '#173f72'],\n              land: ['#f4fbff', '#dcefff', '#c4e2ff', '#e8f6ff'], hi: '#ffffff', lo: '#a9cdee', coast: '#4a77a8', cloud: ['#ffffff', '#b2c8de'], atmo: '#c8ecff', rim: '#f0fbff',\n              accent: '#7fc8ff', mc: '#bfe4ff', wave: 'rgba(235, #2c3c4c'], frozen: ['#9eacbb', '#76869a', '#3a4a5e'],\n  scorched: ['#6a565c', '#4a383e', '#251a1e'], barren: ['#8e869a', '#686076', '#363044'], gas: ['#cdbccc', '#a8949f', '#6e5a68'] };\nfunction placeConts(r, sizes, b, periodic) {\n  const dist = (a, c) => { let dx = Math.abs(a.x - c.x); if (periodic) dx = Math.min(dx, periodic - dx); return Math.hypot(dx, a.y - c.y); };\n  for (let loosen = 1; loosen > .4; loosen -= .1) {\n    const out = []; let guard = 0;\n    while (out.length < sizes.length && guard++ < 3000) { const s = sizes[out.length], c = { x: b.x0 + r() * (b.x1 - b.x0), y: b.y0 + r() * (b.y1 - b.y0), s, rot: r() * Math.PI, sx: .7 + r() * .6 };\n      if (out.some(o => dist(o, c) < (o.s + s) * loosen)) continue; out.push(c); }\n    if (out.length === sizes.length) return out;\n  }\n  return sizes.map((s, i) => ({ x: b.x0 + (i + .5) / sizes.length * (b.x1 - b.x0), y: (b.y0 + b.y1) / 2, s, rot: 0, sx: 1 }));\n}\nfunction buildWorld(P, o) {\n  const th = T[P.type], r = rng(P.id + o.tag), oz = r() * 50, N = o.noise;\n  const conts = placeConts(r, o.sizes, o.bounds, o.period), nExp = o.explored;\n  const dxOf = (x, c) => { let dx = x - c.x; if (o.period) { dx = ((dx % o.period) + o.period * 1.5) % o.period - o.period / 2; } return dx; };\n  const bump = (c, x, y) => { const dx = dxOf(x, c), dy = y - c.y, cs = Math.cos(c.rot), sn = Math.sin(c.rot), u = (dx * cs + dy * sn) / (c.s * c.sx), v = (-dx * sn + dy * cs) / (c.s / c.sx); return 1 - Math.hypot(u, v); };\n  const landFn = (x, y) => {\n    const wx = x + N(x, y, 110, oz + 1.1) * 48, wy = y + N(x, y, 110, oz + 2.3) * 48;\n    const base = Math.max(...conts.map(c => bump(c, wx, wy)));\n    const det = th.soft ? N(wx, wy, 80, oz + 3) * .35 + N(wx, wy, 34, oz + 4) * .14\n      : N(wx, wy, 70, oz + 3) * .42 + N(wx, wy, 30, oz + 4) * .26 + N(wx, wy, 13, oz + 5) * .16 + N(wx, wy, 6, oz + 6) * .09;\n    return base + det - .12;\n  };\n  const G = grid(o.x0, o.y0, o.x1, o.y1, o.cell, landFn);\n  // seeds: explored continents carry the planet's regions; each locked continent is one grey mass\n  const seeds = [], owner = [];\n  const perCont = o.perCont(P.regions.length, nExp);\n  conts.slice(0, nExp).forEach((c, ci) => { const k = perCont[ci], a0 = r() * TAU;\n    for (let q = 0; q < k; q++) { const a = a0 + q * TAU / k, d = k > 1 ? c.s * .45 : 0; seeds.push([c.x + Math.cos(a) * d * c.sx, c.y + Math.sin(a) * d / c.sx]); owner.push('region'); } });\n  conts.slice(nExp).forEach(c => { seeds.push([c.x, c.y]); owner.push('locked'); });\n  const warp = (x, y) => [N(x, y, 60, 9.1 + oz) * o.warp + N(x, y, 22, 5.5 + oz) * o.warp * .35, N(x, y, 60, 4.7 + oz) * o.warp + N(x, y, 22, 6.6 + oz) * o.warp * .35];\n  const D = []; for (let k = 0; k < G.v.length; k++) { const x = G.x0 + (k % G.W) * G.cell, y = G.y0 + Math.floor(k / G.W) * G.cell, [wx, wy] = warp(x, y);\n    D.push(seeds.map(s => { let dx = Math.abs(x + wx - s[0]); if (o.period) dx = Math.min(dx, o.period - dx); return Math.hypot(dx, y + wy - s[1]); })); }\n  const field = idx => derive(G, (val, x, y, k) => { const d = D[k]; let mine = Infinity, other = Infinity;\n    d.forEach((v, j) => { if (idx.includes(j)) mine = Math.min(mine, v); else other = Math.min(other, v); }); return Math.min(val, (other - mine) / 30); });\n  const deepest = F => { // a point well inside the region, close to its middle\n    let mx = -9, sx = 0, sy = 0, n = 0; F.v.forEach((v, k) => { if (v > mx) mx = v; if (v > 0) { sx += (k % F.W); sy += Math.floor(k / F.W); n++; } });\n    if (!n) return [F.x0, F.y0]; const cx = sx / n, cy = sy / n; let bk = 0, bd = Infinity;\n    F.v.forEach((v, k) => { if (v < mx * .35) return; const d = Math.hypot((k % F.W) - cx, Math.floor(k / F.W) - cy); if (d < bd) { bd = d; bk = k; } });\n    return [F.x0 + (bk % F.W) * F.cell, F.y0 + Math.floor(bk / F.W) * F.cell]; };\n  const regions = [], locked = [];\n  seeds.forEach((s, i) => { const F = field([i]); (owner[i] === 'region' ? regions : locked).push({ loops: contours(F, 0, 1), at: deepest(F), seed: s }); });\n  // keep names apart: push overlapping labels vertically, sized by the length of each name\n  for (let pass = 0; pass < 6; pass++) regions.forEach((g, i) => regions.forEach((h, j) => { if (j >= i) return;\n    const half = (P.regions[i].length + P.regions[j].length) * 4.3 + 8, dx = g.at[0] - h.at[0], dy = g.at[1] - h.at[1];\n    if (Math.abs(dx) < half && Math.abs(dy) < 24) { const push = (24 - Math.abs(dy)) / 2 + 1, sgn = dy >= 0 ? 1 : -1; g.at = [g.at[0], g.at[1] + push * sgn]; h.at = [h.at[0], h.at[1] - push * sgn]; } }));\n  const regIdx = owner.map((w, i) => w === 'region' ? i : -1).filter(i => i >= 0);\n  const explored = field(regIdx);\n  const pb = o.patchAll ? G : explored;\n  const hi = derive(pb, (val, x, y) => Math.min(val - .06, N(x, y, 90, 3.3 + oz) - .16)), lo = derive(pb, (val, x, y) => Math.min(val - .04, -N(x, y, 80, 7.9 + oz) - .2));\n  const landAt = (x, y) => { const i = Math.round((x - G.x0) / G.cell), j = Math.round((y - G.y0) / G.cell); return i < 0 || j < 0 || i >= G.W || j >= G.H ? -1 : G.v[j * G.W + i]; };\n  return { landAt, peaks: o.patchAll ? contours(G, .3, 1) : [], land: contours(G, 0, 1), shallow1: contours(G, -.07), shallow2: contours(G, -.15), regions, locked, conts, hi: contours(hi), lo: contours(lo) };\n}\nconst MAPC = new Map();\nfunction mapWorld(P) {\n  if (MAPC.has(P.id)) return MAPC.get(P.id);\n  const th = T[P.type], arch = th.archipelago;\n  const w = buildWorld(P, { tag: 'map', x0: -30, y0: -30, x1: 420, y1: 880, cell: 4, warp: arch ? 14 : 34,\n    noise: (x, y, s, z) => noise(x / s, y / s, z), bounds: { x0: 70, x1: 320, y0: 190, y1: 730 },\n    sizes: arch ? [62, 58, 56, 52, 50, 46, 44] : [118, 86, 84, 72, 64], explored: arch ? 4 : 2,\n    perCont: (n, e) => arch ? Array(e).fill(1) : [n - 1, 1] });\n  MAPC.set(P.id, w); return w;\n}\nconst GLOBEC = new Map();\nfunction globeWorld(P) { // a 480-unit band that wraps: noise is sampled on a cylinder, so the seam is invisible\n  if (GLOBEC.has(P.id)) return GLOBEC.get(P.id);\n  const th = T[P.type], k = 480 / TAU, arch = th.archipelago;\n  const N = (x, y, s, z) => { const u = x / 480 * TAU; return noise(Math.cos(u) * k / s + z * 3, Math.sin(u) * k / s + z, y / s); };\n  const w = buildWorld(P, { tag: 'globe', patchAll: true, x0: -60, y0: 0, x1: 540, y1: 360, cell: 3, warp: 20, period: 480, noise: N, bounds: { x0: 0, x1: 480, y0: 100, y1: 260 },\n    sizes: arch ? [40, 38, 36, 34, 34, 30, 30] : [68, 52, 50, 44, 40], explored: arch ? 4 : 2, perCont: (n, e) => arch ? Array(e).fill(1) : [n - 1, 1] });\n  const r = rng(P.id + 'clouds'), cz = r() * 9;\n  const CG = grid(-60, 0, 540, 360, 4, (x, y) => N(x, y, 50, cz) * .9 + N(x, y, 20, cz + 4) * .35 + N(x, y, 8, cz + 7) * .12 - .32);\n  w.clouds = contours(CG); w.cloudsMid = contours(CG, .1); w.cloudsCore = contours(CG, .2);\n  GLOBEC.set(P.id, w); return w;\n}\n\n/* ===================== chrome ===================== */\nconst tabbar = () => `<nav class=\"worldnav\">${[\n  ['Explore', '<rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"3\"/><path d=\"M8 3l4 4 4-4\"/>'],\n  ['Universe', '<circle cx=\"12\" cy=\"12\" r=\"3.5\"/><ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4.5\" transform=\"rotate(-20 12 12)\"/>', 1],\n  ['Talk', '<path d=\"M4 5h16v11H9l-5 4z\"/>'], ['Keep', '<path d=\"M6 3h12v18l-6-4-6 4z\"/>']].map(([l, d, on]) =>\n  `<div class=\"nav-tab${on ? ' is-active' : ''}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${d}<\/svg><span>${l}<\/span><\/div>`).join('')}<\/nav>`;\nconst backIcon = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/><\/svg>';\nconst listIcon = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01\"/><\/svg>';\nconst fwdIcon = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5l7 7-7 7\"/><\/svg>';\nfunction stars(seed) { const r = rng(seed); return `<div class=\"starfield\"><svg viewBox=\"0 0 390 844\">${Array.from({ length: 140 }, () =>\n  `<circle cx=\"${f1(r() * 390)}\" cy=\"${f1(r() * 844)}\" r=\"${f1(.4 + Math.pow(r(), 3) * 1.4)}\" fill=\"#fffdf2\" opacity=\"${f1(.2 + r() * .7)}\"/>`).join('')}<\/svg><\/div>`; }\nfunction cloudPuff(r, x, y, sc, th) {\n  const lobes = 4 + ((r() * 3) | 0); let cx = 0, d = '';\n  for (let j = 0; j < lobes; j++) { const rr = 13 + r() * 13; d += `<circle cx=\"${f1(cx)}\" cy=\"${f1(-rr * .42 + r() * 4)}\" r=\"${f1(rr)}\"/>`; cx += rr * (.75 + r() * .35); }\n  d += `<rect x=\"-8\" y=\"-12\" width=\"${f1(cx + 16)}\" height=\"24\" rx=\"12\"/>`;\n  const flip = r() < .5 ? -1 : 1, anim = r() > .5 ? ` class=\"cloud\" style=\"--d:${f1(9 + r() * 9)}s;--dx:${f1(4 + r() * 6)}px\"` : '';\n  return `<g transform=\"translate(${f1(x)} ${f1(y)}) scale(${f1(sc * flip)} ${f1(sc)}) translate(${f1(-cx / 2)} 0)\"><g${anim}><g fill=\"${th.cloud[1]}\" transform=\"translate(0 5)\">${d}<\/g><g fill=\"${th.cloud[0]}\">${d}<\/g><\/g><\/g>`;\n}\nconst textLabel = (x, y, name, th, size = 15) => `<text x=\"${f1(x)}\" y=\"${f1(y)}\" text-anchor=\"middle\" font-family=\"Bricolage Grotesque\" font-weight=\"800\" font-size=\"${size}\" fill=\"#15302a\" paint-order=\"stroke\" stroke=\"#fffdf2\" stroke-width=\"5\" stroke-linejoin=\"round\">${name}<\/text>`;\n\n\n/* the planet view: saturated, flat cartoon biomes (every continent in full colour) */\nconst BIO = {\n  lush:     { globe: ['#a4f5ee', '#43c9d6', '#178cba', '#0a4f7e'], land: ['#5fd36f', '#8ee25c', '#3fbf6a', '#b5ea6a'], lo: '#2a9a55', hi: '#f2d57e', peak: '#9a8460', ink: '#14402e', foam: '#e9fffb', trees: '#1f8a4a', forms: 'mountains' },\n  ocean:    { globe: ['#b8f4ff', '#3fb4f0', '#1670cc', '#0a3a80'], l city=\".35\" fill-rule=\"evenodd\" filter=\"url(#soft${id})\"/>`;\n  if (th.glowCoast) body += `<path d=\"${all}\" fill=\"none\" stroke=\"#ffb03a\" stroke-width=\"6\" opacity=\".8\" filter=\"url(#soft${id})\"/>`;\n  body += `<path d=\"${all}\" fill=\"none\" stroke=\"${B.foam}\" stroke-width=\"3.6\" stroke-linejoin=\"round\" opacity=\".85\"/>`;\n  // every continent in full colour: explored regions and the rest alike\n  body += w.regions.map((g, i) => `<path d=\"${toD(g.loops)}\" fill=\"${B.land[i % 4]}\" fill-rule=\"evenodd\"/>`).join('');\n  body += w.locked.map((g, i) => `<path d=\"${toD(g.loops)}\" fill=\"${B.land[(i + 1) % 4]}\" fill-rule=\"evenodd\"/>`).join('');\n  // flat cartoon biomes: lowland, bright patches, highlands\n  body += `<path d=\"${toD(w.lo)}\" fill=\"${B.lo}\" opacity=\".6\" fill-rule=\"evenodd\"/><path d=\"${toD(w.hi)}\" fill=\"${B.hi}\" opacity=\".62\" fill-rule=\"evenodd\"/>`;\n  body += w.regions.map(g => `<path d=\"${toD(g.loops)}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".45\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>`).join('');\n  body += `<path d=\"${all}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".7\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/>`;\n  const names = w.regions.map((g, i) => textLabel(g.at[0], g.at[1] + 5, P.regions[i], th, 14)).join('');\n  // cumulus seen from orbit: a cast shadow on the ground, a cool underside, a white body, brighter inner puffs and a sunlit core\n  const cb = toD(w.clouds), cm = toD(w.cloudsMid), cc = toD(w.cloudsCore);\n  const clouds = `<path d=\"${cb}\" fill=\"#06182a\" opacity=\".22\" fill-rule=\"evenodd\" transform=\"translate(4 7)\" filter=\"url(#cshadow${id})\"/>`\n    + `<path d=\"${cb}\" fill=\"#a9bcd2\" opacity=\".9\" fill-rule=\"evenodd\" transform=\"translate(0 2)\" filter=\"url(#csoft${id})\"/>`\n    + `<path d=\"${cb}\" fill=\"#e6eef7\" fill-rule=\"evenodd\" filter=\"url(#csoft${id})\"/>`\n    + `<path d=\"${cm}\" fill=\"#f6f9fd\" fill-rule=\"evenodd\" transform=\"translate(-.6 -1)\" filter=\"url(#csoft${id})\"/>`\n    + `<path d=\"${cc}\" fill=\"#ffffff\" fill-rule=\"evenodd\" transform=\"translate(-1.2 -2)\" filter=\"url(#csoft${id})\"/>`;\n  const defs = `<filter id=\"soft${id}\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\"><feGaussianBlur stdDeviation=\"1.6\"/><\/filter>`\n    + `<filter id=\"csoft${id}\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\"><feGaussianBlur stdDeviation=\".9\"/><\/filter><filter id=\"cshadow${id}\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\"><feGaussianBlur stdDeviation=\"3\"/><\/filter>`;\n  return `<svg class=\"surface\" viewBox=\"0 0 960 360\"><defs>${defs}<clipPath id=\"slice${id}\"><rect x=\"0\" y=\"0\" width=\"480\" height=\"360\"/><\/clipPath>\n    <g id=\"band${id}\"><g clip-path=\"url(#slice${id})\">${body}<\/g><\/g><g id=\"cl${id}\"><g clip-path=\"url(#slice${id})\">${clouds}<\/g><\/g><g id=\"nm${id}\"><g clip-path=\"url(#slice${id})\">${names}<\/g><\/g><\/defs>\n    <use href=\"#band${id}\" x=\"0\"/><use href=\"#band${id}\" x=\"480\"/><g class=\"cloudband\"><use href=\"#cl${id}\" x=\"0\"/><use href=\"#cl${id}\" x=\"480\"/><use href=\"#cl${id}\" x=\"960\"/><\/g><use href=\"#nm${id}\" x=\"0\"/><use href=\"#nm${id}\" x=\"480\"/><\/svg>`;\n}\nfunction ringSVG(th, front) {\n  const rx = 215, ry = 48, arc = front ? `M${-rx} 0 A${rx} ${ry} 0 0 0 ${rx} 0` : `M${-rx} 0 A${rx} ${ry} 0 0 1 ${rx} 0`;\n  return `<svg class=\"ring ${front ? 'front' : 'back'}\" viewBox=\"-235 -235 470 470\"><g transform=\"rotate(-14)\" fill=\"none\" stroke-linecap=\"round\">\n    <path d=\"${arc}\" stroke=\"${th.land[2]}\" stroke-width=\"13\" opacity=\".9\"/><path d=\"${arc}\" stroke=\"${th.land[1]}\" stroke-width=\"4\" transform=\"scale(1.05 1.07)\" opacity=\".8\"/><path d=\"${arc}\" stroke=\"${th.hi}\" stroke-width=\"2\" transform=\"scale(.95 .93)\" opacity=\".7\"/><\/g><\/svg>`;\n}\nconst MOON = `<svg viewBox=\"0 0 40 40\"><circle cx=\"20\" cy=\"20\" r=\"15.6\" fill=\"#f1ead6\"/><path d=\"
