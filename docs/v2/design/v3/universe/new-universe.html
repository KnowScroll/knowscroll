textContent += (e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + '\\n'; });<\/script>\n<script>\n\nconst TAU = Math.PI * 2;\nconst rng = seed => { let h = 2166136261; for (const c of String(seed)) h = Math.imul(h ^ c.charCodeAt(0), 16777619);\n  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };\nconst f1 = n => n.toFixed(1);\nconst clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;\n\n/* ===================== noise ===================== */\nconst perm = new Uint8Array(512);\n(() => { const p = [...Array(256).keys()], r = rng('knowscroll-world'); for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; })();\nconst fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + (b - a) * t;\nfunction grad(h, x, y, z) { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14) ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }\nfunction noise(x, y, z) {\n  let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z); x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;\n  const u = fade(x), v = fade(y), w = fade(z), A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z, B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;\n  return lerp(lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u), lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),\n    lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u), lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);\n}\nfunction fbm(x, y, z, o) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * noise(x * f, y * f, z * f); f *= 2.03; a *= .5; } return s; }\n\n/* ===================== contours: marching squares, chained and smoothed ===================== */\nconst SEG = { 1: [['L', 'B']], 2: [['B', 'R']], 3: [['L', 'R']], 4: [['T', 'R']], 6: [['T', 'B']], 7: [['T', 'L']], 8: [['T', 'L']], 9: [['T', 'B']], 11: [['T', 'R']], 12: [['L', 'R']], 13: [['R', 'B']], 14: [['L', 'B']] };\nfunction contours(G, iso = 0, passes = 2) {\n  const { W, H, v, x0, y0, cell } = G, pts = new Map(), adj = new Map();\n  const val = (i, j) => (i <= 0 || j <= 0 || i >= W - 1 || j >= H - 1) ? -1 : v[j * W + i] - iso;\n  const key = (e, i, j) => e === 'T' ? `h${i},${j}` : e === 'B' ? `h${i},${j + 1}` : e === 'L' ? `v${i},${j}` : `v${i + 1},${j}`;\n  const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };\n  for (let j = 0; j < H - 1; j++) for (let i = 0; i < W - 1; i++) {\n    const a = val(i, j), b = val(i + 1, j), c = val(i + 1, j + 1), d = val(i, j + 1);\n    const idx = (a > 0 ? 8 : 0) | (b > 0 ? 4 : 0) | (c > 0 ? 2 : 0) | (d > 0 ? 1 : 0); if (idx === 0 || idx === 15) continue;\n    const P = { T: [i + a / (a - b), j], R: [i + 1, j + b / (b - c)], B: [i + d / (d - c), j + 1], L: [i, j + a / (a - d)] };\n    let segs = SEG[idx];\n    if (idx === 5) segs = (a + b + c + d) / 4 > 0 ? [['T', 'L'], ['R', 'B']] : [['T', 'R'], ['L', 'B']];\n    if (idx === 10) segs = (a + b + c + d) / 4 > 0 ? [['T', 'R'], ['L', 'B']] : [['T', 'L'], ['R', 'B']];\n    for (const [e1, e2] of segs) { const k1 = key(e1, i, j), k2 = key(e2, i, j); pts.set(k1, P[e1]); pts.set(k2, P[e2]); link(k1, k2); }\n  }\n  const seen = new Set(), loops = [];\n  for (const start of adj.keys()) { if (seen.has(start)) continue;\n    const loop = []; let prev = null, cur = start;\n    while (cur && !seen.has(cur)) { seen.add(cur); const p = pts.get(cur); loop.push([x0 + p[0] * cell, y0 + p[1] * cell]); const n = adj.get(cur); const next = n.find(k => k !== prev && !seen.has(k)); prev = cur; cur = next; }\n    if (loop.length > 5) loops.push(passes > 1 ? chaikin(chaikin(loop.filter((_, i) => i % 2 === 0))) : chaikin(loop)); }\n  return loops;\n}\nfunction chaikin(p) { const o = []; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; o.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]); } return o; }\nconst toD = loops => loops.map(l => 'M' + l.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') + 'Z').join('');\nfunction grid(x0, y0, x1, y1, cell, fn) { const W = Math.ceil((x1 - x0) / cell) + 1, H = Math.ceil((y1 - y0) / cell) + 1, v = new Float32Array(W * H);\n  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) v[j * W + i] = fn(x0 + i * cell, y0 + j * cell); return { W, H, v, x0, y0, cell }; }\nconst derive = (G, fn) => ({ ...G, v: G.v.map((val, k) => fn(val, G.x0 + (k % G.W) * G.cell, G.y0 + Math.floor(k / G.W) * G.cell, k)) });\n\n/* ===================== the planets ===================== */\nconst PLANETS = [\n  { id: 'inference', name: 'Inference & serving', type: 'lush', system: 'Machine learning', regions: ['Batching', 'Deployment', 'Latency', 'Cost'], sel: 1, route: 'Attention',\n    enc: { kind: 'A Reel', title: 'Where should the model run?', sum: 'Close to the people asking, or close to the hardware, and what each one costs.' } },\n  { id: 'attention', name: 'Attention', type: 'barren', system: 'Machine learning', regions: ['Context windows', 'Saliency', 'Heads', 'Memory'], sel: 0, route: 'Inference & serving', moon: true,\n    enc: { kind: 'A Scroll', title: 'Why long prompts get forgetful', sum: 'What happens to the middle of a very long context, and the tricks that help.' } },\n  { id: 'hardware', name: 'Hardware', type: 'scorched', system: 'Machine learning', regions: ['GPUs', 'Memory bandwidth', 'Interconnect', 'Cooling'], sel: 1, route: 'Inference & serving', rings: true, moon: true,\n    enc: { kind: 'A Reel', title: 'Why GPUs wait on memory', sum: 'Compute got fast. Moving the numbers around did not. Where the time really goes.' } },\n  { id: 'queues', name: 'Queues', type: 'gas', system: 'Backend systems', regions: ['Backpressure', 'Retries', 'Ordering', 'Dead letters'], sel: 0, route: 'Storage', rings: true,\n    enc: { kind: 'A Scroll', title: 'When consumers fall behind', sum: 'Buffers fill, latency climbs and something has to give. Backpressure decides what.' } },\n  { id: 'storage', name: 'Storage', type: 'frozen', system: 'Backend systems', regions: ['Replication', 'Indexes', 'Caching', 'Backups'], sel: 0, route: 'Queues', rings: true,\n    enc: { kind: 'A Reel', title: 'Leaders, followers and the lag', sum: 'Why a read can miss a write you just made, and how replicas catch up.' } },\n  { id: 'tactics', name: 'Tactics', type: 'ocean', system: 'Football', regions: ['Pressing', 'Formations', 'Set pieces', 'Counters'], sel: 0, moon: true,\n    enc: { kind: 'A Reel', title: 'Why teams press high', sum: 'Winning the ball near the goal is worth more than winning it anywhere else.' } },\n];\n\n/* ===================== one look per planet type: flat colour, soft edges ===================== */\nconst T = {\n  lush:     { label: 'Lush world', sea: ['#1d7d97', '#0f5670', '#052c41'], shallow: '#4fc3c9', globe: ['#7fd9d6', '#3fa8bd', '#1c6f93', '#0d3f5e'],\n              land: ['#6fd27f', '#a6e58a', '#4fb878', '#93d6a8'], hi: '#e9d9a0', lo: '#2f8f5c', coast: '#1e5a4a', cloud: ['#f6fcff', '#9dc0d4'], atmo: '#83f2ea', rim: '#b9fff2',\n              accent: '#33c4b4', mc: '#8edbe0', wave: 'rgba(203,245,255,.26)', current: 'rgba(196,242,255,.32)', grat: 'rgba(190,240,255,.1)', detail: 'waves', cover: .1, shadow: '#04283a' },\n  ocean:    { label: 'Ocean world', sea: ['#33a7ea', '#1667b6', '#0a2f6a'], shallow: '#7fd8f7', globe: ['#8fdcff', '#3d9fe0', '#1a63b4', '#0b3270'],\n              land: ['#7ee08e', '#5fcf7c', '#a5e88a', '#4fc06e'], hi: '#ffe7a8', lo: '#2f9a62', coast: '#1d5a4c', cloud: ['#ffffff', '#a7cbe6'], atmo: '#9fe0ff', rim: '#d4f4ff',\n              accent: '#ffd058', mc: '#ffe39a', wave: 'rgba(225,246,255,.34)', cu f3c6dc', coast: '#c98aa8', cloud: ['#ffffff', '#e0bcd0'], atmo: '#ffb8d6', rim: '#ffe4ef',\n              accent: '#ff7aa8', mc: '#ffc2d8', wave: 'rgba(255,255,255,.3)', current: 'rgba(255,255,255,.34)', grat: 'rgba(255,240,250,.08)', detail: 'bands', soft: true, cover: .08, shadow: '#7a3a6a' },\n};\n\n/* ===================== world builder: several continents, explored ones split into regions, the rest locked ===================== */\nconst LOCK = { lush: ['#7b8d97', '#55666f', '#2a3a42'], ocean: ['#8496a6', '#5a6b7c', '#2c3c4c'], frozen: ['#9eacbb', '#76869a', '#3a4a5e'],\n  scorched: ['#6a565c', '#4a383e', '#251a1e'], barren: ['#8e869a', '#686076', '#363044'], gas: ['#cdbccc', '#a8949f', '#6e5a68'] };\nfunction placeConts(r, sizes, b, periodic) {\n  const dist = (a, c) => { let dx = Math.abs(a.x - c.x); if (periodic) dx = Math.min(dx, periodic - dx); return Math.hypot(dx, a.y - c.y); };\n  for (let loosen = 1; loosen > .4; loosen -= .1) {\n    const out = []; let guard = 0;\n    while (out.length < sizes.length && guard++ < 3000) { const s = sizes[out.length], c = { x: b.x0 + r() * (b.x1 - b.x0), y: b.y0 + r() * (b.y1 - b.y0), s, rot: r() * Math.PI, sx: .7 + r() * .6 };\n      if (out.some(o => dist(o, c) < (o.s + s) * loosen)) continue; out.push(c); }\n    if (out.length === sizes.length) return out;\n  }\n  return sizes.map((s, i) => ({ x: b.x0 + (i + .5) / sizes.length * (b.x1 - b.x0), y: (b.y0 + b.y1) / 2, s, rot: 0, sx: 1 }));\n}\nfunction buildWorld(P, o) {\n  const th = T[P.type], r = rng(P.id + o.tag), oz = r() * 50, N = o.noise;\n  const conts = placeConts(r, o.sizes, o.bounds, o.period), nExp = o.explored;\n  const dxOf = (x, c) => { let dx = x - c.x; if (o.period) { dx = ((dx % o.period) + o.period * 1.5) % o.period - o.period / 2; } return dx; };\n  const bump = (c, x, y) => { const dx = dxOf(x, c), dy = y - c.y, cs = Math.cos(c.rot), sn = Math.sin(c.rot), u = (dx * cs + dy * sn) / (c.s * c.sx), v = (-dx * sn + dy * cs) / (c.s / c.sx); return 1 - Math.hypot(u, v); };\n  const landFn = (x, y) => {\n    const wx = x + N(x, y, 110, oz + 1.1) * 48, wy = y + N(x, y, 110, oz + 2.3) * 48;\n    const base = Math.max(...conts.map(c => bump(c, wx, wy)));\n    const det = th.soft ? N(wx, wy, 80, oz + 3) * .35 + N(wx, wy, 34, oz + 4) * .14\n      : N(wx, wy, 70, oz + 3) * .42 + N(wx, wy, 30, oz + 4) * .26 + N(wx, wy, 13, oz + 5) * .16 + N(wx, wy, 6, oz + 6) * .09;\n    return base + det - .12;\n  };\n  const G = grid(o.x0, o.y0, o.x1, o.y1, o.cell, landFn);\n  // seeds: explored continents carry the planet's regions; each locked continent is one grey mass\n  const seeds = [], owner = [];\n  const perCont = o.perCont(P.regions.length, nExp);\n  conts.slice(0, nExp).forEach((c, ci) => { const k = perCont[ci], a0 = r() * TAU;\n    for (let q = 0; q < k; q++) { const a = a0 + q * TAU / k, d = k > 1 ? c.s * .45 : 0; seeds.push([c.x + Math.cos(a) * d * c.sx, c.y + Math.sin(a) * d / c.sx]); owner.push('region'); } });\n  conts.slice(nExp).forEach(c => { seeds.push([c.x, c.y]); owner.push('locked'); });\n  const warp = (x, y) => [N(x, y, 60, 9.1 + oz) * o.warp + N(x, y, 22, 5.5 + oz) * o.warp * .35, N(x, y, 60, 4.7 + oz) * o.warp + N(x, y, 22, 6.6 + oz) * o.warp * .35];\n  const D = []; for (let k = 0; k < G.v.length; k++) { const x = G.x0 + (k % G.W) * G.cell, y = G.y0 + Math.floor(k / G.W) * G.cell, [wx, wy] = warp(x, y);\n    D.push(seeds.map(s => { let dx = Math.abs(x + wx - s[0]); if (o.period) dx = Math.min(dx, o.period - dx); return Math.hypot(dx, y + wy - s[1]); })); }\n  const field = idx => derive(G, (val, x, y, k) => { const d = D[k]; let mine = Infinity, other = Infinity;\n    d.forEach((v, j) => { if (idx.includes(j)) mine = Math.min(mine, v); else other = Math.min(other, v); }); return Math.min(val, (other - mine) / 30); });\n  const deepest = F => { // a point well inside the region, close to its middle\n    let mx = -9, sx = 0, sy = 0, n = 0; F.v.forEach((v, k) => { if (v > mx) mx = v; if (v > 0) { sx += (k % F.W); sy += Math.floor(k / F.W); n++; } });\n    if (!n) return [F.x0, F.y0]; const cx = sx / n, cy = sy / n; let bk = 0, bd = Infinity;\n    F.v.forEach((v, k) => { if (v < mx * .35) return; const d = Math.hypot((k % F.W) - cx, Math.floor(k / F.W) - cy); if (d < bd) { bd = d; bk = k; } });\n    return [F.x0 + (bk % F.W) * F.cell, F.y0 + Math.floor(bk / F.W) * F.cell]; };\n  const regions = [], locked = [];\n  seeds.forEach((s, i) => { const F = field([i]); (owner[i] === 'region' ? regions : locked).push({ loops: contours(F, 0, 1), at: deepest(F), seed: s }); });\n  // keep names apart: push overlapping labels vertically, sized by the length of each name\n  for (let pass = 0; pass < 6; pass++) regions.forEach((g, i) => regions.forEach((h, j) => { if (j >= i) return;\n    const half = (P.regions[i].length + P.regions[j].length) * 4.3 + 8, dx = g.at[0] - h.at[0], dy = g.at[1] - h.at[1];\n    if (Math.abs(dx) < half && Math.abs(dy) < 24) { const push = (24 - Math.abs(dy)) / 2 + 1, sgn = dy >= 0 ? 1 : -1; g.at = [g.at[0], g.at[1] + push * sgn]; h.at = [h.at[0], h.at[1] - push * sgn]; } }));\n  const regIdx = owner.map((w, i) => w === 'region' ? i : -1).filter(i => i >= 0);\n  const explored = field(regIdx);\n  const pb = o.patchAll ? G : explored;\n  const hi = derive(pb, (val, x, y) => Math.min(val - .06, N(x, y, 90, 3.3 + oz) - .16)), lo = derive(pb, (val, x, y) => Math.min(val - .04, -N(x, y, 80, 7.9 + oz) - .2));\n  const landAt = (x, y) => { const i = Math.round((x - G.x0) / G.cell), j = Math.round((y - G.y0) / G.cell); return i < 0 || j < 0 || i >= G.W || j >= G.H ? -1 : G.v[j * G.W + i]; };\n  return { landAt, peaks: o.patchAll ? contours(G, .3, 1) : [], land: contours(G, 0, 1), shallow1: contours(G, -.07), shallow2: contours(G, -.15), regions, locked, conts, hi: contours(hi), lo: contours(lo) };\n}\nconst MAPC = new Map();\nfunction mapWorld(P) {\n  if (MAPC.has(P.id)) return MAPC.get(P.id);\n  const th = T[P.type], arch = th.archipelago;\n  const w = buildWorld(P, { tag: 'map', x0: -30, y0: -30, x1: 420, y1: 880, cell: 4, warp: arch ? 14 : 34,\n    noise: (x, y, s, z) => noise(x / s, y / s, z), bounds: { x0: 70, x1: 320, y0: 190, y1: 730 },\n    sizes: arch ? [62, 58, 56, 52, 50, 46, 44] : [118, 86, 84, 72, 64], explored: arch ? 4 : 2,\n    perCont: (n, e) => arch ? Array(e).fill(1) : [n - 1, 1] });\n  MAPC.set(P.id, w); return w;\n}\nconst GLOBEC = new Map();\nfunction globeWorld(P) { // a 480-unit band that wraps: noise is sampled on a cylinder, so the seam is invisible\n  if (GLOBEC.has(P.id)) return GLOBEC.get(P.id);\n  const th = T[P.type], k = 480 / TAU, arch = th.archipelago;\n  const N = (x, y, s, z) => { const u = x / 480 * TAU; return noise(Math.cos(u) * k / s + z * 3, Math.sin(u) * k / s + z, y / s); };\n  const w = buildWorld(P, { tag: 'globe', patchAll: true, x0: -60, y0: 0, x1: 540, y1: 360, cell: 3, warp: 20, period: 480, noise: N, bounds: { x0: 0, x1: 480, y0: 100, y1: 260 },\n    sizes: arch ? [40, 38, 36, 34, 34, 30, 30] : [68, 52, 50, 44, 40], explored: arch ? 4 : 2, perCont: (n, e) => arch ? Array(e).fill(1) : [n - 1, 1] });\n  const r = rng(P.id + 'clouds'), cz = r() * 9;\n  const CG = grid(-60, 0, 540, 360, 4, (x, y) => N(x, y, 50, cz) * .9 + N(x, y, 20, cz + 4) * .35 + N(x, y, 8, cz + 7) * .12 - .32);\n  w.clouds = contours(CG); w.cloudsMid = contours(CG, .1); w.cloudsCore = contours(CG, .2);\n  GLOBEC.set(P.id, w); return w;\n}\n\n/* ===================== chrome ===================== */\nconst tabbar = () => `<nav class=\"worldnav\">${[\n  ['Explore', '<rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"3\"/><path d=\"M8 3l4 4 4-4\"/>'],\n  ['Universe', '<circle cx=\"12\" cy=\"12\" r=\"3.5\"/><ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4.5\" transform=\"rotate(-20 12 12)\"/>', 1],\n  ['Talk', '<path d=\"M4 5h16v11H9l-5 4z\"/>'], ['Keep', '<path d=\"M6 3h12v18l-6-4-6 4z\"/>']].map(([l, d, on]) =>\n  `<div class=\"nav-tab${on ? ' is-active' : ''}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${d}<\/svg><span>${l}<\/span><\/div>`).join('')}<\/nav>`;\nconst backIcon = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/><\/svg>';\nconst listIcon = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01\"/><\/svg>';\nconst fwdIcon = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5l7 7-7 7\"/><\/svg>';\nfunction stars(seed) { const r = rng(seed); return `<div class=\"starfield\"><svg viewBox=\"0 0 390 844\">${Array.from({ length: 140 }, () =>\n  `<circle cx=\"${f1(r() * 390)}\" cy=\"${f1(r() * 844)}\" r=\"${f1(.4 + Math.pow(r(), 3) * 1.4)}\" fill=\"#fffdf2\" opacity=\"${f1(.2 + r() * .7)}\"/>`).join('')}<\/svg><\/div>`; }\nfunction cloudPuff(r, x, y, sc, th) {\n  const lobes = 4 + ((r() * 3) | 0); let cx = 0, d = '';\n  for (let j = 0; j < lobes; j++) { const rr = 13 + r() * 13; d += `<circle cx=\"${f1(cx)}\" cy=\"${f1(-rr * .42 + r() * 4)}\" r=\"${f1(rr)}\"/>`; cx += rr * (.75 + r() * .35); }\n  d += `<rect x=\"-8\" y=\"-12\" width=\"${f1(cx + 16)}\" height=\"24\" rx=\"12\"/>`;\n  const flip = r() < .5 ? -1 : 1, anim = r() > .5 ? ` class=\"cloud\" style=\"--d:${f1(9 + r() * 9)}s;--dx:${f1(4 + r() * 6)}px\"` : '';\n  return `<g transform=\"translate(${f1(x)} ${f1(y)}) scale(${f1(sc * flip)} ${f1(sc)}) translate(${f1(-cx / 2)} 0)\"><g${anim}><g fill=\"${th.cloud[1]}\" transform=\"translate(0 5)\">${d}<\/g><g fill=\"${th.cloud[0]}\">${d}<\/g><\/g><\/g>`;\n}\nconst textLabel = (x, y, name, th, size = 15) => `<text x=\"${f1(x)}\" y=\"${f1(y)}\" text-anchor=\"middle\" font-family=\"Bricolage Grotesque\" font-weight=\"800\" font-size=\"${size}\" fill=\"#15302a\" paint-order=\"stroke\" stroke=\"#fffdf2\" stroke-width=\"5\" stroke-linejoin=\"round\">${name}<\/text>`;\n\n\n/* the planet view: saturated, flat cartoon biomes (every continent in full colour) */\nconst BIO = {\n  lush:     { globe: ['#a4f5ee', '#43c9d6', '#178cba', '#0a4f7e'], land: ['#5fd36f', '#8ee25c', '#3fbf6a', '#b5ea6a'], lo: '#2a9a55', hi: '#f2d57e', peak: '#9a8460', ink: '#14402e', foam: '#e9fffb', trees: '#1f8a4a', forms: 'mountains' },\n  ocean:    { globe: ['#b8f4ff', '#3fb4f0', '#1670cc', '#0a3a80'], land: ['#7ee06a', '#5fd07a', '#a6ec6a', '#4fc36e'], lo: '#2f9e55', hi: '#ffe08a', peak: '#8a9a6a', ink: '#12403a', foam: '#f2fdff', trees: '#228a4c', forms: 'mountains' },\n  frozen:   { globe: ['#e6f8ff', '#8fcaf5', '#3c86d0', '#163f80'], land: ['#f6fcff', '#d8efff', '#c2e6ff', '#e9f8ff'], lo: '#9fd2f5', hi: '#ffffff', peak: '#7894bb', ink: '#24497a', foam: '#ffffff', forms: 'mountains' },\n  scorched: { globe: ['#ff9a6a', '#e0483e', '#8e1a36', '#3e0716'], land: ['#ff7a45', '#ff5a3c', '#ffa04a', '#f06a3a'], lo: '#8a2030', hi: '#ffd25a', peak: '#4a141c', ink: '#3a0a14', foam: '#ffd2a0', forms: 'volcanoes' },\n  barren:   { globe: ['#dcc6f2', '#9d82c4', '#60488a', '#2c1f48'], land: ['#f7cf86', '#eeb062', '#e39a52', '#f9dca0'], lo: '#c06a3a', hi: '#fff2cc', peak: '#7a4e2e', ink: '#4a2a18', foam: '#f4eaff', forms: 'mesas' },\n  gas:      { globe: ['#ffe2c0', '#ff9ab8', '#b07ae0', '#4e2a86'], land: ['#fff1e0', '#ffd6c0', '#ffc6da', '#ecd2ff'], lo: '#ff8fb6', hi: '#ffffff', peak: '#c070d0', ink: '#7a3a68', foam: '#ffffff', forms: 'swirls',\n              bands: ['#ffb07a', '#ff7fa6', '#b88aff', '#ffd27a', '#ff6f9a'] },\n};\n/* ===================== U03: the planet from orbit ===================== */\nfunction surfaceBand(P, th) {\n  const w = globeWorld(P), id = P.id;\n  let body = '';\n  if (th.detail === 'bands') {\n    for (let i = 0; i < 9; i++) { const y = i * 40, c = BIO.gas.bands[i % 5];\n      body += `<path d=\"M-60 ${y} ${Array.from({ length: 11 }, (_, k) => `Q${-60 + k * 60 + 30} ${y + (k % 2 ? 9 : -9)} ${-60 + k * 60 + 60} ${y}`).join(' ')} V${y + 44} H-60Z\" fill=\"${c}\"/>`; }\n    body = `<g filter=\"url(#soft${id})\">${body}<\/g>`;\n  }\n  const B = BIO[P.type], all = toD(w.land), rf = rng(P.id + 'forms');\n  // soft shallows, then a white foam edge just outside every coast\n  body += `<path d=\"${toD(w.shallow2)}\" fill=\"${th.shallow}\" opacity=\".35\" fill-rule=\"evenodd\" filter=\"url(#soft${id})\"/><path d=\"${toD(w.shallow1)}\" fill=\"${B.foam}\" opacity=\".35\" fill-rule=\"evenodd\" filter=\"url(#soft${id})\"/>`;\n  if (th.glowCoast) body += `<path d=\"${all}\" fill=\"none\" stroke=\"#ffb03a\" stroke-width=\"6\" opacity=\".8\" filter=\"url(#soft${id})\"/>`;\n  body += `<path d=\"${all}\" fill=\"none\" stroke=\"${B.foam}\" stroke-width=\"3.6\" stroke-linejoin=\"round\" opacity=\".85\"/>`;\n  // every continent in full colour: explored regions and the rest alike\n  body += w.regions.map((g, i) => `<path d=\"${toD(g.loops)}\" fill=\"${B.land[i % 4]}\" fill-rule=\"evenodd\"/>`).join('');\n  body += w.locked.map((g, i) => `<path d=\"${toD(g.loops)}\" fill=\"${B.land[(i + 1) % 4]}\" fill-rule=\"evenodd\"/>`).join('');\n  // flat cartoon biomes: lowland, bright patches, highlands\n  body += `<path d=\"${toD(w.lo)}\" fill=\"${B.lo}\" opacity=\".6\" fill-rule=\"evenodd\"/><path d=\"${toD(w.hi)}\" fill=\"${B.hi}\" opacity=\".62\" fill-rule=\"evenodd\"/>`;\n  body += w.regions.map(g => `<path d=\"${toD(g.loops)}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".45\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>`).join('');\n  body += `<path d=\"${all}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".7\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/>`;\n  const names = w.regions.map((g, i) => textLabel(g.at[0], g.at[1] + 5, P.regions[i], th, 14)).join('');\n  // cumulus seen from orbit: a cast shadow on the ground, a cool underside, a white body, brighter inner puffs and a sunlit core\n  const cb = toD(w.clouds), cm = toD(w.cloudsMid), cc = toD(w.cloudsCore);\n  const clouds = `<path d=\"${cb}\" fill=\"#06182a\" opacity=\".22\" fill-rule=\"evenodd\" transform=\"translate(4 7)\" filter=\"url(#cshadow${id})\"/>`\n    + `<path d=\"${cb}\" fill=\"#a9bcd2\" opacity=\".9\" fill-rule=\"evenodd\" transform=\"translate(0 2)\" filter=\"url(#csoft${id})\"/>`\n    + `<path d=\"${cb}\" fill=\"#e6eef7\" fill-rule=\"evenodd\" filter=\"url(#csoft${id})\"/>`\n    + `<path d=\"${cm}\" fill=\"#f6f9fd\" fill-rule=\"evenodd\" transform=\"translate(-.6 -1)\" filter=\"url(#csoft${id})\"/>`\n    + `<path d=\"${cc}\" fill=\"#ffffff\" fill-rule=\"evenodd\" transform=\"translate(-1.2 -2)\" filter=\"url(#csoft${id})\"/>`;\n  const defs = `<filter id=\"soft${id}\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\"><feGaussianBlur stdDeviation=\"1.6\"/><\/filter>`\n    + `<filter id=\"csoft${id}\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\"><feGaussianBlur stdDeviation=\".9\"/><\/filter><filter id=\"cshadow${id}\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\"><feGaussianBlur stdDeviation=\"3\"/><\/filter>`;\n  return `<svg class=\"surface\" viewBox=\"0 0 960 360\"><defs>${defs}<clipPath id=\"slice${id}\"><rect x=\"0\" y=\"0\" width=\"480\" height=\"360\"/><\/clipPath>\n    <g id=\"band${id}\"><g clip-path=\"url(#slice${id})\">${body}<\/g><\/g><g id=\"cl${id}\"><g clip-path=\"url(#slice${id})\">${clouds}<\/g><\/g><g id=\"nm${id}\"><g clip-path=\"url(#slice${id})\">${names}<\/g><\/g><\/defs>\n    <use href=\"#band${id}\" x=\"0\"/><use href=\"#band${id}\" x=\"480\"/><g class=\"cloudband\"><use href=\"#cl${id}\" x=\"0\"/><use href=\"#cl${id}\" x=\"480\"/><use href=\"#cl${id}\" x=\"960\"/><\/g><use href=\"#nm${id}\" x=\"0\"/><use href=\"#nm${id}\" x=\"480\"/><\/svg>`;\n}\nfunction ringSVG(th, front) {\n  const rx = 215, ry = 48, arc = front ? `M${-rx} 0 A${rx} ${ry} 0 0 0 ${rx} 0` : `M${-rx} 0 A${rx} ${ry} 0 0 1 ${rx} 0`;\n  return `<svg class=\"ring ${front ? 'front' : 'back'}\" viewBox=\"-235 -235 470 470\"><g transform=\"rotate(-14)\" fill=\"none\" stroke-linecap=\"round\">\n    <path d=\"${arc}\" stroke=\"${th.land[2]}\" stroke-width=\"13\" opacity=\".9\"/><path d=\"${arc}\" stroke=\"${th.land[1]}\" stroke-width=\"4\" transform=\"scale(1.05 1.07)\" opacity=\".8\"/><path d=\"${arc}\" stroke=\"${th.hi}\" stroke-width=\"2\" transform=\"scale(.95 .93)\" opacity=\".7\"/><\/g><\/svg>`;\n}\nconst MOON = `<svg viewBox=\"0 0 40 40\"><circle cx=\"20\" cy=\"20\" r=\"15.6\" fill=\"#f1ead6\"/><path d=\"M20 4.4A15.6 15.6 0 0 1 20 35.6 20.5 20.5 0 0 0 20 4.4Z\" fill=\"#cbc3aa\"/>\n  <circle cx=\"14.6\" cy=\"15\" r=\"4.1\" fill=\"#ddd5bd\"/><circle cx=\"24.4\" cy=\"24.6\" r=\"2.7\" fill=\"#ddd5bd\"/><circle cx=\"15.8\" cy=\"26.4\" r=\"2.1\" fill=\"#ddd5bd\"/><\/svg>`;\nfunction screenPlanet(P) {\n  const th = T[P.type], g = BIO[P.type].globe;\n  const bg = `radial-gradient(circle at 38% 32%, ${g[0]} 0, ${g[1]} 35%, ${g[2]} 72%, ${g[3]} 100%)`;\n  const caps = th.caps ? `<svg class=\"caps\" viewBox=\"0 0 292 292\"><defs><filter id=\"capb${P.id}\"><feGaussianBlur stdDeviation=\"3\"/><\/filter><\/defs><g filter=\"url(#capb${P.id})\" fill=\"#fff\">\n    <path d=\"M30 46 Q90 20 146 30 Q210 18 262 46 Q230 70 190 62 Q160 78 120 66 Q80 76 30 46Z\" opacity=\".9\"/><path d=\"M40 252 Q100 236 146 246 Q200 232 252 252 Q200 290 146 286 Q90 292 40 252Z\" opacity=\".85\"/><\/g><\/svg>` : '';\n  return `<div class=\"phone\" data-anim style=\"--atmo-line:${th.atmo}aa;--atmo-glow:${th.atmo}66;--rim:${th.rim};--globe-bg:${bg}\">\n    ${stars(P.id)}\n    <div class=\"map-top\"><div class=\"pill\">${backIcon}${P.system}<\/div><\/div>\n    ${P.rings ? ringSVG(th, false) : ''}\n    <div class=\"globe-wrap\"><div class=\"atmosphere\"><\/div><div class=\"globe soft\">${surfaceBand(P, th)}${caps}<div class=\"shade\"><\/div><div class=\"glint\"><\/div><\/div><\/div>\n    ${P.rings ? ringSVG(th, true) : ''}\n    ${P.moon ? `<div class=\"moon\" data-moon>${MOON}<\/div>` : ''}\n    <div class=\"caption\"><span class=\"eyebrow\">A planet in ${P.system}<\/span><h1>${P.name}<\/h1><div class=\"hint\"><span>↔<\/span>Drag to rotate · tap to land<\/div><\/div>\n    <div class=\"chips\">${P.route ? `<span class=\"chip light\">Route to ${P.route}${fwdIcon}<\/span>` : ''}<span class=\"chip dark\">${listIcon}List view<\/span><\/div>\n    ${tabbar()}<div class=\"statusbar\"><span>9:41<\/span><i><\/i><\/div><\/div>`;\n}\n\n/* ===================== U04: landed on the map ===================== */\n/* Same saturated palette as the globe in U03, so landing reads as the same planet up close.\n   The world is drawn in map units and moved by a camera; names, markers and Uncharted tags are drawn\n   afterwards in screen space so they never scale with the camera and stay clear of the chrome. */\nconst SAFE = { card: { top: 112, bottom: 520 }, here: { top: 112, bottom: 680 } };\nconst pillLabel = (x, y, text, { fill = '#fffdf2', ink = '#15302a', dot, size = 13 } = {}) => {\n  const wd = text.length * size * .56 + (dot ? 40 : 26), px = Math.min(390 - wd / 2 - 14, Math.max(wd / 2 + 14, x));\n  return `<g transform=\"translate(${f1(px)} ${f1(y)})\"><rect x=\"${f1(-wd / 2)}\" y=\"-15\" width=\"${f1(wd)}\" height=\"30\" rx=\"15\" fill=\"${fill}\" stroke=\"#15302a\" stroke-width=\"2\"/>\n    ${dot ? `<circle cx=\"${f1(-wd / 2 + 15)}\" cy=\"0\" r=\"4.5\" fill=\"${dot}\"/>` : ''}<text x=\"${dot ? 7 : 0}\" y=\"${f1(size * .36)}\" text-anchor=\"middle\" font-family=\"Instrument Sans\" font-weight=\"700\" font-size=\"${size}\" fill=\"${ink}\">${text}<\/text><\/g>`;\n};\nfunction mapSVG(P, mode) {\n  const th = T[P.type], B = BIO[P.type], g4 = B.globe, r = rng(P.id + 'map'), id = P.id + mode, w = mapWorld(P), safe = SAFE[mode];\n  const sel = w.regions[P.sel];\n  // camera: the card view drops low over the chosen region and centres it above the card\n  const sp = sel.loops.reduce((a, l) => l.length > a.length ? l : a, []), xs = sp.map(p => p[0]), ys = sp.map(p => p[1]);\n  const bx0 = Math.min(...xs), bx1 = Math.max(...xs), by0 = Math.min(...ys), by1 = Math.max(...ys);\n  const z = mode === 'card' ? clamp(Math.min(300 / (bx1 - bx0), 330 / (by1 - by0)), 1.6, 2.1) : 1;\n  const tx = mode === 'card' ? 195 - (bx0 + bx1) / 2 * z : 0, ty = mode === 'card' ? (safe.top + safe.bottom) / 2 + 6 - (by0 + by1) / 2 * z : 0;\n  const S = (x, y) => [x * z + tx, y * z + ty], seen = (x, y, m = 0) => x > m && x < 390 - m && y > safe.top && y < safe.bottom;\n  const expB = w.regions.flatMap(g => g.loops.flat()), ex0 = Math.min(...expB.map(p => p[0])), ex1 = Math.max(...expB.map(p => p[0])), ey0 = Math.min(...expB.map(p => p[1])), ey1 = Math.max(...expB.map(p => p[1]));\n  const nearExp = (x, y, pad) => x > ex0 - pad && x < ex1 + pad && y > ey0 - pad && y < ey1 + pad;\n  let ground = '', detail = '', defs = `<filter id=\"glow${id}\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\"><feDropShadow dx=\"0\" dy=\"0\" stdDeviation=\"${f1(5 / z)}\" flood-color=\"#fff\" flood-opacity=\".9\"/><\/filter>\n    <filter id=\"soft${id}\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"120%\"><feGaussianBlur stdDeviation=\"3\"/><\/filter><filter id=\"shadow${id}\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"130%\"><feGaussianBlur stdDeviation=\"6\"/><\/filter>`;\n  if (th.detail === 'bands') {\n    defs += `<linearGradient id=\"sky${id}\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">${B.bands.map((c, i) => `<stop offset=\"${i / (B.bands.length - 1)}\" stop-color=\"${c}\"/>`).join('')}<\/linearGradient>`;\n    ground = `<rect x=\"-400\" y=\"-400\" width=\"1200\" height=\"1700\" fill=\"url(#sky${id})\"/><g class=\"band-drift\" filter=\"url(#soft${id})\">${Array.from({ length: 22 }, (_, i) => { const y = -200 + i * 60, c = B.bands[i % B.bands.length];\n      return `<path d=\"M-400 ${y} ${Array.from({ length: 14 }, (_, k) => `Q${-400 + k * 120 + 60} ${y + (k % 2 ? 14 : -14)} ${-400 + k * 120 + 120} ${y}`).join(' ')} V${y + 34} H-400Z\" fill=\"${c}\" opacity=\".7\"/>`; }).join('')}<\/g>`;\n    detail += `<g fill=\"none\" stroke=\"${th.current}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"14 22\" class=\"current-a\"><path d=\"M-20 140 Q120 110 260 150 T420 130\"/><path d=\"M-20 640 Q130 610 260 650 T420 630\"/><\/g>`;\n  } else {\n    defs += `<radialGradient id=\"sea${id}\" gradientUnits=\"userSpaceOnUse\" cx=\"195\" cy=\"380\" r=\"640\"><stop offset=\"0\" stop-color=\"${g4[1]}\"/><stop offset=\".45\" stop-color=\"${g4[2]}\"/><stop offset=\"1\" stop-color=\"${g4[3]}\"/><\/radialGradient>`;\n    ground = `<rect x=\"-400\" y=\"-400\" width=\"1200\" height=\"1700\" fill=\"url(#sea${id})\"/>`;\n    const paths = '<path class=\"current-a\" d=\"M-20 110 Q120 50 260 100 T420 140\"/><path class=\"current-b\" d=\"M-20 720 Q140 680 260 740 T420 710\"/><path class=\"current-a\" d=\"M372 220 Q410 420 362 580\"/><path class=\"current-b\" d=\"M20 230 Q-16 420 30 600\"/>';\n    detail += th.detail === 'lava'\n      ? `<g fill=\"none\" stroke=\"${th.current}\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"11 26\" filter=\"url(#soft${id})\">${paths}<\/g><g fill=\"none\" stroke=\"#ffc08a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"11 26\">${paths}<\/g>`\n      : `<g fill=\"none\" stroke=\"${th.current}\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-dasharray=\"11 26\">${paths}<\/g>`;\n    for (let gy = -60; gy < 900; gy += 54) for (let gx = -40; gx < 430; gx += 54) {\n      if (r() > .62) continue; const x = gx + r() * 70, y = gy + r() * 70; if (w.landAt(x, y) > -.14) continue; const k = 7 + r() * 5, rot = f1(r() * 22 - 11);\n      if (th.detail === 'waves') detail += `<path d=\"M0 0 q${f1(k / 2)} ${f1(-k * .55)} ${f1(k)} 0 t${f1(k)} 0\" transform=\"translate(${f1(x)} ${f1(y)}) rotate(${rot})\" fill=\"none\" stroke=\"${th.wave}\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>`;\n      else if (th.detail === 'floes') { const s = 5 + r() * 8; detail += `<ellipse cx=\"${f1(x)}\" cy=\"${f1(y)}\" rx=\"${f1(s)}\" ry=\"${f1(s * .6)}\" transform=\"rotate(${rot} ${f1(x)} ${f1(y)})\" fill=\"#eef8ff\" opacity=\".85\"/>`; }\n      else if (th.detail === 'lava') detail += r() < .5 ? `<circle class=\"bubble\" style=\"animation-delay:-${f1(r() * 3.6)}s\" cx=\"${f1(x)}\" cy=\"${f1(y)}\" r=\"${f1(2 + r() * 3)}\" fill=\"#ff9a4a\"/>`\n        : `<path d=\"M0 0 q8 6 16 0 t16 0\" transform=\"translate(${f1(x)} ${f1(y)}) rotate(${rot})\" fill=\"none\" stroke=\"rgba(255,138,61,.5)\" stroke-width=\"2\" stroke-linecap=\"round\"/>`;\n      else if (th.detail === 'craters') { const rr = 5 + r() * 12; detail += `<circle cx=\"${f1(x)}\" cy=\"${f1(y)}\" r=\"${f1(rr)}\" fill=\"rgba(30,20,44,.28)\"/><path d=\"M${f1(x - rr)} ${f1(y)} a${f1(rr)} ${f1(rr)} 0 0 1 ${f1(rr * 2)} 0\" fill=\"none\" stroke=\"rgba(245,232,255,.3)\" stroke-width=\"2\"/>`; }\n    }\n  }\n  // land, as on the globe: soft shallows, a foam edge, flat saturated regions with biome patches, dashed region borders, an inked coast\n  const all = toD(w.land), regLoops = toD(w.regions.flatMap(g => g.loops));\n  let land = `<path d=\"${toD(w.shallow2)}\" fill=\"${th.shallow}\" opacity=\".3\" fill-rule=\"evenodd\" filter=\"url(#soft${id})\"/><path d=\"${toD(w.shallow1)}\" fill=\"${B.foam}\" opacity=\".28\" fill-rule=\"evenodd\" filter=\"url(#soft${id})\"/>`;\n  land += `<path d=\"${all}\" fill=\"${th.shadow}\" opacity=\".45\" fill-rule=\"evenodd\" transform=\"translate(0 8)\" filter=\"url(#shadow${id})\"/>`;\n  if (th.glowCoast) land += `<path d=\"${regLoops}\" fill=\"none\" stroke=\"#ffb03a\" stroke-width=\"8\" opacity=\".7\" filter=\"url(#soft${id})\"/>`;\n  land += `<path d=\"${regLoops}\" fill=\"none\" stroke=\"${B.foam}\" stroke-width=\"4\" stroke-linejoin=\"round\" opacity=\".85\"/>`;\n  land += w.regions.map((g, i) => `<path d=\"${toD(g.loops)}\" fill=\"${B.land[i % 4]}\" fill-rule=\"evenodd\"/>`).join('');\n  defs += `<clipPath id=\"exp${id}\"><path d=\"${regLoops}\" clip-rule=\"evenodd\"/><\/clipPath>`;\n  land += `<g clip-path=\"url(#exp${id})\"><path d=\"${toD(w.lo)}\" fill=\"${B.lo}\" opacity=\".5\" fill-rule=\"evenodd\"/><path d=\"${toD(w.hi)}\" fill=\"${B.hi}\" opacity=\".55\" fill-rule=\"evenodd\"/><\/g>`;\n  land += w.regions.map(g => `<path d=\"${toD(g.loops)}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".5\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/>`).join('');\n  land += `<path d=\"${regLoops}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".75\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/>`;\n  // uncharted: flat grey, no detail\n  const LK = LOCK[P.type];\n  land += w.locked.map(g => `<path d=\"${toD(g.loops)}\" fill=\"${LK[1]}\" fill-rule=\"evenodd\" transform=\"translate(0 4)\"/><path d=\"${toD(g.loops)}\" fill=\"${LK[0]}\" fill-rule=\"evenodd\"/><path d=\"${toD(g.loops)}\" fill=\"none\" stroke=\"${LK[2]}\" stroke-opacity=\".6\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/>`).join('');\n  // the chosen region: everything else dims, the region keeps full colour under a white glow\n  let focus = '';\n  if (mode === 'card') focus = `<path d=\"M-400 -400H800V1300H-400Z${toD(sel.loops)}\" fill=\"#03121e\" opacity=\".42\" fill-rule=\"evenodd\"/>\n    <path d=\"${toD(sel.loops)}\" fill=\"none\" stroke=\"#fff\" stroke-width=\"${f1(3 / z)}\" stroke-linejoin=\"round\" filter=\"url(#glow${id})\"/>`;\n  // a frame of puffy cloud at the edge of what's charted\n  let clouds = ''; const rc = rng(P.id + 'cloud');\n  const ring = (x0, x1, y0, y1, s1, s2, lo, hi) => { const pts = []; for (let x = x0; x <= x1; x += s1) pts.push([x, y0], [x, y1]); for (let y = y0 + s2; y < y1 - s2 * .5; y += s2) pts.push([x0, y], [x1, y]);\n    pts.forEach(([px2, py2]) => { const x = px2 + rc() * 30 - 15, y = py2 + rc() * 30 - 15; if (y < 66 || nearExp(x, y, 18) || (x > 50 && x < 340 && y > 150 && y < 760)) return; clouds += cloudPuff(rc, x, y, lo + rc() * (hi - lo), th); }); };\n  ring(-30, 420, 0, 900, 80, 95, .9, 1.4);\n  // uncharted veils in map space\n  const rv = rng(P.id + 'veil'); let veils = '';\n  defs += `<radialGradient id=\"veil${id}\" cx=\"50%\" cy=\"50%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".42\"/><stop offset=\".62\" stop-color=\"#eef6fb\" stop-opacity=\".26\"/><stop offset=\"1\" stop-color=\"#e2eef8\" stop-opacity=\"0\"/><\/radialGradient>`;\n  w.locked.forEach((g, i) => { const c = w.conts[w.conts.length - w.locked.length + i], [ax, ay] = g.at;\n    veils += `<ellipse cx=\"${f1(ax)}\" cy=\"${f1(ay)}\" rx=\"${f1(c.s * 1.1)}\" ry=\"${f1(c.s * .9)}\" fill=\"url(#veil${id})\"/>`;\n    for (let q = 0; q < 2; q++) veils += cloudPuff(rv, ax + (rv() - .5) * c.s * 1.4, ay + (rv() - .5) * c.s, .5 + rv() * .35, th); });\n  // ---- screen space: names and markers (uncharted land is never labelled) ----\n  let ui = '';\n  const [sx, sy] = S(sel.at[0], sel.at[1]);\n  w.regions.forEach((g, i) => { const [x, y] = S(g.at[0], g.at[1]);\n    if (i === P.sel) return;\n    if (mode === 'card') { if (seen(x, y, P.regions[i].length * 4.3 + 10)) ui += `<g opacity=\".8\">${textLabel(x, y + 5, P.regions[i], th, 14)}<\/g>`; return; }\n    ui += textLabel(x, y + 5, P.regions[i], th, 15); });\n  if (mode === 'card') ui += pillLabel(sx, sy, P.regions[P.sel], { fill: '#FFE44D', ink: '#15302a', size: 15 });\n  else ui += `<g transform=\"translate(${f1(sx)} ${f1(sy - 22)})\"><circle class=\"port-ping\" r=\"13\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"/><circle r=\"13\" fill=\"var(--orange)\" stroke=\"#fff\" stroke-width=\"2.5\"/><circle r=\"4.5\" fill=\"#fff\"/><\/g>`\n    + pillLabel(sx, sy + 14, `${P.regions[P.sel]} · you were here`, { dot: 'var(--orange)' });\n  return `<svg viewBox=\"0 0 390 844\"><defs>${defs}<\/defs><g transform=\"translate(${f1(tx)} ${f1(ty)}) scale(${f1(z)})\">${ground}${detail}${land}${focus}${veils}${clouds}<\/g>${ui}<\/svg>`;\n}\nfunction screenMap(P, mode) {\n  const th = T[P.type], E = P.enc;\n  const top = `<div class=\"map-top\"><div class=\"pill\">${backIcon}${mode === 'card' ? P.n g[0]}, ${g[1]} 42%, ${g[2]} 78%, ${g[3]})`;\n  return `<span class=\"g-planet${ringed ? ' ringed' : ''}\" style=\"width:${s}px;height:${s}px;background:${bg};--ring:${T[type].land[1]}\"><\/span>`;\n}\nconst BLOBS = ['M-8 -2Q-8 -7-3 -6Q0 -10 4 -7Q9 -6 7 -1Q9 3 6 5Q2 4 1 7Q-3 9-5 5Q-9 4-8 -2Z', 'M-6 -7Q-1 -9 2 -6Q6 -9 8 -4Q6 0 8 3Q7 8 2 7Q-1 5-3 8Q-8 7-7 2Q-10 -3-6 -7Z',\n  'M-5 -8Q0 -6 3 -8Q9 -7 7 -2Q4 1 8 4Q6 9 1 7Q-3 9-6 6Q-9 2-6 -1Q-9 -6-5 -8Z', 'M-8 0Q-9 -6-3 -6Q0 -10 5 -7Q9 -3 6 1Q8 6 3 7Q0 5-3 8Q-8 7-6 3Q-9 2-8 0Z'];\nconst regionGlyph = (type, i, s = 18) => `<svg class=\"g-region\" width=\"${s}\" height=\"${s}\" viewBox=\"-10 -10 20 20\"><path d=\"${BLOBS[i % 4]}\" fill=\"${BIO[type].land[i % 4]}\" stroke=\"${BIO[type].ink}\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><\/svg>`;\nconst roomGlyph = (s = 22) => `<svg width=\"${s}\" height=\"${s}\" viewBox=\"-16 -10 32 20\" aria-hidden=\"true\"><rect x=\"-7\" y=\"-4\" width=\"14\" height=\"8\" rx=\"2.5\" fill=\"#15302a\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M-13 0h6M7 0h6\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n  <rect x=\"-15.5\" y=\"-3\" width=\"3.5\" height=\"6\" fill=\"currentColor\"/><rect x=\"12\" y=\"-3\" width=\"3.5\" height=\"6\" fill=\"currentColor\"/><circle r=\"1.6\" fill=\"#ffb347\"/><\/svg>`;\nconst glyph = g => g[0] === 'sun' ? sunGlyph() : g[0] === 'planet' ? planetGlyph(g[1], 20, g[2]) : g[0] === 'region' ? regionGlyph(g[1], g[2]) : roomGlyph();\n\nconst statusbar = '<div class=\"statusbar\"><span>9:41<\/span><i><\/i><\/div>';\nconst spacePhone = inner => `<div class=\"phone\" data-scene=\"overview\" data-anim><canvas><\/canvas><div class=\"labels\"><\/div><div class=\"dimtop\"><\/div>${inner}${tabbar()}${statusbar}<\/div>`;\n\n/* U08 · Search, empty query */\nfunction screenSearchEmpty() {\n  const kinds = [['Systems', sunGlyph()], ['Planets', planetGlyph('lush')], ['Regions', regionGlyph('lush', 1, 20)], ['Rooms', `<span style=\"color:#fffdf2\">${roomGlyph()}<\/ v><\/div>`);\n}\n\n/* U08 · List view: the outline sheet over the landed map */\nconst OUTLINE = [\n  { t: 'Machine learning', k: 'System', d: 0, g: ['sun'], anc: 1, open: 1 },\n  { t: 'Attention', k: '4 regions', d: 1, g: ['planet', 'barren'] },\n  { t: 'Inference & serving', k: 'Planet', d: 1, g: ['planet', 'lush'], anc: 1, open: 1 },\n  { t: 'Batching', k: 'Region', d: 2, g: ['region', 'lush', 0] },\n  { t: 'Deployment', k: 'Region', d: 2, g: ['region', 'lush', 1], cur: 1 },\n  { t: 'Latency', k: 'Region', d: 2, g: ['region', 'lush', 2] },\n  { t: 'Cost', k: 'Region', d: 2, g: ['region', 'lush', 3] },\n  { t: 'Hardware', k: '4 regions', d: 1, g: ['planet', 'scorched', 1] },\n  { t: 'Backend systems', k: '2 planets', d: 0, g: ['sun'] },\n  { t: 'Football', k: '1 planet', d: 0, g: ['sun'] },\n];\nfunction outlineRow(o) {\n  const leaf = o.g[0] === 'region' || o.g[0] === 'room', guides = Array.from({ length: o.d }, (_, l) => `<i class=\"guide\" style=\"left:${17 + l * 22}px\"><\/i>`).join('');\n  return `<div class=\"orow d${o.d}${o.anc ? ' anc' : ''}${o.cur ? ' cur' : ''}\" style=\"padding-left:${8 + o.d * 22}px\">${guides}<span class=\"tw\">${leaf ? '' : ic(o.open ? 'down' : 'fwd', 2.6)}<\/span>${glyph(o.g)}\n    <span class=\"ot\">${o.t}<\/span>${o.cur ? '<span class=\"here\">Looking here<\/span>' : `<span class=\"ok\">${o.k}<\/span>`}<\/div>`;\n}\nfunction screenList() {\n  const P = byId('inference');\n  return `<div class=\"phone\" data-anim><div class=\"map\">${mapSVG(P, 'here')}<\/div>\n    <div class=\"map-top\"><div class=\"pill\">${backIcon}${P.system}<span class=\"level-chip\">Planet<\/span><\/div><\/div>${tabbar()}\n    <div class=\"scrim\"><\/div>\n    <div class=\"sheet\"><div class=\"grab\"><\/div>\n      <div class=\"sh-head\"><div><h2>Your universe<\/h2><p>Every place, in order.<\/p><\/div><span class=\"sh-x\">${ic('close', 2.6)}<\/span><\/div>\n      <div class=\"toggles\"><div class=\"tog\"><span class=\"tr\">Lately<span class=\"sw\"><\/span><\/span><small>Recent activity first<\/small><\/div>\n        <div class=\"tog\"><span class=\"tr\">Simple drawing<span class=\"sw\"><\/span><\/span><small>Flat map for slow devices<\/small><\/div><\/div>\n      <div class=\"sh-label\"><span>Places<\/span><span>3 systems<\/span><\/div>\n      <div class=\"outline\">${OUTLINE.map(outlineRow).join('')}\n        <div class=\"sh-label\" style=\"padding-top:14px\"><span>Rooms<\/span><\/div>${outlineRow({ t: 'Model serving room', k: 'Room', d: 0, g: ['room'] })}<\/div>\n    <\/div>${statusbar}<\/div>`;\n}\n\n/* U03 · Low detail: the same map, flat. No clouds, no blur, no motion, no glass */\nfunction simpleMap(P, wd, ht) {\n  const B = BIO[P.type], th = T[P.type], w = mapWorld(P), LK = LOCK[P.type], pts = w.land.flat();\n  const x0 = Math.min(...pts.map(p => p[0])), x1 = Math.max(...pts.map(p => p[0])), y0 = Math.min(...pts.map(p => p[1])), y1 = Math.max(...pts.map(p => p[1]));\n  const s = Math.min((wd - 28) / (x1 - x0), (ht - 28) / (y1 - y0)), ox = (wd - (x1 + x0) * s) / 2, oy = (ht - (y1 + y0) * s) / 2, S = (x, y) => [x * s + ox, y * s + oy];\n  const ns = 'vector-effect=\"non-scaling-stroke\"';\n  const sea = th.detail === 'bands' ? B.bands.map((c, i) => `<rect x=\"0\" y=\"${f1(i * ht / B.bands.length)}\" width=\"${wd}\" height=\"${f1(ht / B.bands.length + 1)}\" fill=\"${c}\"/>`).join('') : `<rect width=\"${wd}\" height=\"${ht}\" fill=\"${B.globe[2]}\"/>`;\n  let land = w.regions.map((g, i) => `<path d=\"${toD(g.loops)}\" fill=\"${B.land[i % 4]}\" fill-rule=\"evenodd\"/>`).join('');\n  land += w.regions.map(g => `<path d=\"${toD(g.loops)}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".55\" stroke-width=\"1\" stroke-dasharray=\"3 3\" ${ns}/>`).join('');\n  land += w.locked.map(g => `<path d=\"${toD(g.loops)}\" fill=\"${LK[0]}\" fill-rule=\"evenodd\"/>`).join('');\n  land += `<path d=\"${toD(w.land)}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".8\" stroke-width=\"1.4\" stroke-linejoin=\"round\" ${ns}/>`;\n  const names = w.regions.map((g, i) => { const [x, y] = S(g.at[0], g.at[1]); return textLabel(clamp(x, 44, wd - 44), y + 4, P.regions[i], th, 11.5); }).join('');\n  const locks = w.locked.map(g => { const [x, y] = S(g.at[0], g.at[1]); return `<g transform=\"translate(${f1(x)} ${f1(y)})\"><circle r=\"11\" fill=\"${LK[2]}\"/><path d=\"M-4 -1h8v6h-8zM-2.6 -1v-2.4a2.6 2.6 0 0 1 5.2 0V-1\" fill=\"none\" stroke=\"#fff3d6\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/g>`; }).join('');\n  return { svg: `<svg width=\"${wd}\" height=\"${ht}\" viewBox=\"0 0 ${wd} ${ht}\">${sea}<g transform=\"translate(${f1(ox)} ${f1(oy)}) scale(${s.toFixed(4)})\">${land}<\/g>${locks}${names}<\/svg>`, locked: w.locked.length };\n}\nfunction screenLowDetail(P) {\n  const m = simpleMap(P, 358, 340), B = BIO[P.type], LK = LOCK[P.type];\n  return `<div class=\"phone flat\">\n    <div class=\"map-top\"><div class=\"pill\">${backIcon}${P.system}<\/div><span class=\"tag-plain\">Simple drawing<\/span><\/div>\n    <div class=\"ld-head\"><span class=\"eyebrow\">A planet in ${P.system}<\/span><h1>${P.name}<\/h1><\/div>\n    <div class=\"ld-map\">${m.svg}<\/div>\n    <div class=\"ld-legend\"><span><i style=\"background:${B.land[0]}\"><\/i>Explored<\/span><span><i style=\"background:${LK[0]}\"><\/i>Uncharted · ${m.locked} continents<\/span><\/div>\n    <div class=\"ld-regions\">${P.regions.map((r, i) => `<span class=\"rbtn\">${regionGlyph(P.type, i, 20)}${r}<svg class=\"ch\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${ICON.fwd}<\/svg><\/span>`).join('')}<\/div>\n    <div class=\"chips\">${P.route ? `<span class=\"chip light\">Route to ${P.route}${fwdIcon}<\/span>` : ''}<span class=\"chip dark\">${listIcon}List view<\/span><\/div>\n    ${tabbar()}${statusbar}<\/div>`;\n}\n\n\n/* ===================== round 02: getting around by carousel ===================== */\nconst SYSTEMS = [\n  { name: 'Machine learning', planets: ['attention', 'inference', 'hardware'], rooms: 1, here: 1 },\n  { name: 'Backend systems', planets: ['queues', 'storage'], rooms: 0 },\n  { name: 'Football', planets: ['tactics'], rooms: 0 },\n];\nconst plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;\nconst sysMeta = s => [plural(s.planets.length, 'planet'), s.rooms ? plural(s.rooms, 'room') : ''].filter(Boolean).join(' · ');\nconst uniIcon = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3.5\"/><ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4.5\" transform=\"rotate(-20 12 12)\"/><\/svg>';\nconst lockIcon = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"/><\/svg>';\nconst flatten = html => html.replace(/ filter=\"url\\(#[^)]*\\)\"/g, '').replace(/ class=\"(current-a|current-b|cloud|port-ping|band-drift|bubble|storm)\"/g, '');\nlet gid = 0;\n\n/* the approved U03 globe at any size */\nfunction globeHTML(P, size) {\n  const th = T[P.type], g = BIO[P.type].globe, bg = `radial-gradient(circle at 38% 32%, ${g[0]} 0, ${g[1]} 35%, ${g[2]} 72%, ${g[3]} 100%)`;\n  return `<div class=\"mg\" style=\"width:${size}px;height:${size}px;--atmo-line:${th.atmo}aa;--atmo-glow:${th.atmo}66;--rim:${th.rim};--globe-bg:${bg}\"><div class=\"mg-in\" style=\"transform:scale(${(size / 292).toFixed(4)})\">\n    ${P.rings ? ringSVG(th, false) : ''}<div class=\"globe-wrap\"><div class=\"atmosphere\"><\/div><div class=\"globe\">${surfaceBand(P, th)}<div class=\"shade\"><\/div><div class=\"glint\"><\/div><\/div><\/div>${P.rings ? ringSVG(th, true) : ''}<\/div><\/div>`;\n}\n\n/* a system as a portrait: its orange sun and its tiny planets, no orbit lines */\nfunction sysPortrait(s, w = 242, h = 66) {\n  const id = 'sp' + gid++, r = rng(s.name);\n  let defs = `<radialGradient id=\"${id}s\"><stop offset=\"0\" stop-color=\"#fff3c4\"/><stop offset=\".3\" stop-color=\"#ffc061\"/><stop offset=\".62\" stop-color=\"#ff6a2a\"/><stop offset=\"1\" stop-color=\"#ff6a2a\" stop-opacity=\"0\"/><\/radialGradient>`;\n  let g = `<circle cx=\"32\" cy=\"${h / 2}\" r=\"34\" fill=\"url(#${id}s)\" opacity=\".45\"/><circle cx=\"32\" cy=\"${h / 2}\" r=\"17\" fill=\"url(#${id}s)\"/>`;\n  s.planets.forEach((pid, i) => { const P = byId(pid), c = BIO[P.type].globe, x = 92 + (i + .5) * (w - 100) / Math.max(2, s.planets.length) + (r() - .5) * 16, y = h / 2 + (r() - .5) * 28, rr = 6 + r() * 3.5;\n    defs += `<radialGradient id=\"${id}p${i}\" cx=\"35%\" cy=\"30%\"><stop offset=\"0\" stop-color=\"${c[0]}\"/><stop offset=\".5\" stop-color=\"${c[1]}\"/><stop offset=\"1\" stop-color=\"${c[3]}\"/><\/radialGradient>`;\n    if (P.rings) g += `<ellipse cx=\"${f1(x)}\" cy=\"${f1(y)}\" rx=\"${f1(rr * 1.9)}\" ry=\"${f1(rr * .45)}\" fill=\"none\" stroke=\"${T[P.type].land[1]}\" stroke-width=\"1.6\" transform=\"rotate(-14 ${f1(x)} ${f1(y)})\"/>`;\n    g += `<circle cx=\"${f1(x)}\" cy=\"${f1(y)}\" r=\"${f1(rr)}\" fill=\"url(#${id}p${i})\"/>`; });\n  return `<svg width=\"${w}\" height=\"${h}\" viewBox=\"0 0 ${w} ${h}\" aria-hidden=\"true\"><defs>${defs}<\/defs>${g}<\/svg>`;\n}\n\n/* continents: which regions sit on which explored continent, and how many are uncharted */\nfunction contOf(P) {\n  const w = mapWorld(P), n = P.regions.length, per = T[P.type].archipelago ? Array(4).fill(1) : [n - 1, 1]; let k = 0;\n  return { w, explored: per.map(c => { const a = Array.from({ length: c }, (_, j) => k + j); k += c; return a; }), locked: w.locked.length };\n}\n/* a little piece of the landed map: one region, one continent or one uncharted mass, fitted to a box */\nfunction thumb(P, sets, wd, ht, o = {}) {\n  const B = BIO[P.type], pts = sets.flatMap(s => s.loops.flat()), pad = o.pad ?? 8, ns = 'vector-effect=\"non-scaling-stroke\"';\n  const x0 = Math.min(...pts.map(p => p[0])), x1 = Math.max(...pts.map(p => p[0])), y0 = Math.min(...pts.map(p => p[1])), y1 = Math.max(...pts.map(p => p[1]));\n  const s = Math.min((wd - pad * 2) / (x1 - x0), (ht - pad * 2) / (y1 - y0)), ox = (wd - (x1 + x0) * s) / 2, oy = (ht - (y1 + y0) * s) / 2;\n  const sea = P.type === 'gas' ? B.bands.map((c, i) => `<rect y=\"${f1(i * ht / 5)}\" width=\"${wd}\" height=\"${f1(ht / 5 + 1)}\" fill=\"${c}\"/>`).join('') : `<rect width=\"${wd}\" height=\"${ht}\" fill=\"${B.globe[2]}\"/><rect width=\"${wd}\" height=\"${ht}\" fill=\"${B.globe[1]}\" opacity=\".35\"/>`;\n  const all = toD(sets.flatMap(st => st.loops));\n  let body = `<path d=\"${all}\" fill=\"none\" stroke=\"${B.foam}\" stroke-width=\"4\" stroke-opacity=\".8\" stroke-linejoin=\"round\" ${ns}/>`;\n  body += sets.map(st => `<path d=\"${toD(st.loops)}\" fill=\"${st.fill}\" fill-rule=\"evenodd\"/>`).join('');\n  body += sets.length > 1 ? sets.map(st => `<path d=\"${toD(st.loops)}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".5\" stroke-width=\"1\" stroke-dasharray=\"3 3\" ${ns}/>`).join('') : '';\n  body += `<path d=\"${all}\" fill=\"none\" stroke=\"${o.lock ? '#3a4a52' : B.ink}\" stroke-opacity=\".8\" stroke-width=\"1.3\" stroke-linejoin=\"round\" ${ns}/>`;\n  const names = (o.names || []).map(n => textLabel(clamp(n.at[0] * s + ox, n.name.length * 3.4 + 4, wd - n.name.length * 3.4 - 4), n.at[1] * s + oy + 4, n.name, T[P.type], o.size || 11)).join('');\n  const lock = o.lock ? `<g transform=\"translate(${wd / 2} ${ht / 2})\"><circle r=\"13\" fill=\"rgba(12,40,56,.82)\" stroke=\"rgba(255,255,255,.6)\" stroke-width=\"1.2\"/><path d=\"M-4.5 -1h9v7h-9zM-3 -1v-2.6a3 3 0 0 1 6 0V-1\" fill=\"none\" stroke=\"#ffe6a8\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/g>` : '';\n  return `<svg class=\"thumb\" width=\"${wd}\" height=\"${ht}\" viewBox=\"0 0 ${wd} ${ht}\" aria-hidden=\"true\">${sea}<g transform=\"translate(${f1(ox)} ${f1(oy)}) scale(${s.toFixed(4)})\">${body}<\/g>${lock}${names}<\/svg>`;\n}\nconst regionThumb = (P, i, s = 44) => { const w = mapWorld(P); return thumb(P, [{ loops: w.regions[i].loops, fill: BIO[P.type].land[i % 4] }], s, s, { pad: 5 }); };\nconst contThumb = (P, idx, wd, ht, names) => { const w = mapWorld(P); return thumb(P, idx.map(i => ({ loops: w.regions[i].loops, fill: BIO[P.type].land[i % 4] })), wd, ht, { names: names ? idx.map(i => ({ at: w.regions[i].at, name: P.regions[i] })) : [] }); };\nconst lockedThumb = (P, li, wd, ht) => thumb(P, [{ loops: mapWorld(P).locked[li].loops, fill: LOCK[P.type][0] }], wd, ht, { lock: true });\nconst rchip = (P, i) => `<span class=\"rchip\">${regionGlyph(P.type, i, 18)}${P.regions[i]}${i === P.sel && P.id === 'inference' ? '<span class=\"od\" title=\"You were here\"><\/span>' : ''}<\/span>`;\nconst dots = (n, on, top) => `<div class=\"dots\" style=\"top:${top}px\">${Array.from({ length: n }, (_, i) => `<i${i === on ? ' class=\"on\"' : ''}><\/i>`).join('')}<\/div>`;\n\n/* ---------- A · fly-through carousels: one level per screen, swipe sideways, tap to go deeper ---------- */\nfunction screenA1() {\n  const cw = 270, x0 = (390 - cw) / 2, order = [[2, -1], [0, 0], [1, 1]];\n  const cards = order.map(([si, o]) => { const s = SYSTEMS[si];\n    return `<div class=\"ccard glass syscard${o ? ' side' : ''}\" style=\"left:${x0 + o * (cw + 14)}px\">${sysPortrait(s)}<h3>${s.name}<\/h3><span class=\"meta\">${sysMeta(s)}<\/span>\n      <div class=\"foot\">${s.here ? '<span class=\"youhere\">You’re here<\/span>' : '<span><\/span>'}<span class=\"enter\">Enter<i>→<\/i><\/span><\/div><\/div>`; }).join('');\n  return `<div class=\"phone\" data-scene=\"overview\" data-anim><canvas><\/canvas><div class=\"labels\"><\/div>\n    <div class=\"mapfade\" style=\"background:linear-gradient(180deg,rgba(0,0,0,.6) 0,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 46%,rgba(0,0,0,.85) 70%)\"><\/div>\n    <div class=\"crumbs\"><div class=\"pill\">${uniIcon}Your universe<span class=\"level-chip\">3 systems<\/span><\/div><\/div>\n    <div class=\"swipe\" style=\"top:500px\">Swipe to fly between systems<\/div>\n    <div class=\"car\" style=\"top:524px\">${cards}<\/div>${dots(3, 0, 724)}${tabbar()}${statusbar}<\/div>`;\n}\nfunction screenA2() {\n  const ps = SYSTEMS[0].planets.map(byId), P = ps[1], C = contOf(P), big = 228, sm = 124, cy = 296;\n  return `<div class=\"phone\" data-anim>${stars('a2')}<div class=\"sunglow\"><\/div>\n    <div class=\"crumbs\"><div class=\"pill\">${backIcon}Your universe<\/div><div class=\"here-chip\">${sunGlyph(14)}Machine learning<\/div><\/div>\n    <div style=\"position:absolute;z-index:4;left:-44px;top:${cy - sm / 2}px;opacity:.55\">${globeHTML(ps[0], sm)}<\/div>\n    <div style=\"position:absolute;z-index:4;left:${390 - sm + 44}px;top:${cy - sm / 2}px;opacity:.55\">${globeHTML(ps[2], sm)}<\/div>\n    <div style=\"position:absolute;z-index:5;left:${195 - big / 2}px;top:${cy - big / 2}px\">${globeHTML(P, big)}<\/div>\n    <span class=\"side-name\" style=\"left:36px;top:${cy + sm / 2 + 16}px\">‹ ${ps[0].name}<\/span><span class=\"side-name\" style=\"left:354px;top:${cy + sm / 2 + 16}px\">${ps[2].name} ›<\/span>\n    <div class=\"pcap\" style=\"top:${cy + big / 2 + 36}px\"><span class=\"eyebrow\">Planet 2 of 3 · ${T[P.type].label}<\/span><h1>${P.name}<\/h1>\n      <div class=\"facts\"><span class=\"fact\">${plural(P.regions.length, 'region')}<\/span><span class=\"fact or\">You were here · ${P.regions[P.sel]}<\/span><\/div><\/div>\n    ${dots(3, 1, 596)}<div class=\"ctas\" style=\"top:620px\"><span class=\"enter big\">Land on ${P.name}<i>→<\/i><\/span><\/div>${tabbar()}${statusbar}<\/div>`;\n}\nfunction screenA3() {\n  const P = byId('inference'), C = contOf(P), total = C.explored.length + C.locked, cw = 300, x0 = 45, top = 432;\n  const main = C.explored[0], other = C.explored[1];\n  const card = (o, inner) => `<div class=\"ccard glass contcard${o ? ' side' : ''}\" style=\"left:${x0 + o * (cw + 14)}px\">${inner}<\/div>`;\n  const cards = card(-1, `${lockedThumb(P, 0, 276, 128)}<div class=\"cc-head\"><b>Uncharted<\/b><span>Continent 5 of ${total}<\/span><\/div><span class=\"locked-note\">${lockIcon}Explore more to chart it<\/span>`)\n    + card(0, `${contThumb(P, main, 276, 128, true)}<div class=\"cc-head\"><b>${plural(main.length, 'region')}<\/b><span>Continent 1 of ${total}<\/span><\/div><div class=\"rchips\">${main.map(i => rchip(P, i)).join('')}<\/div>`)\n    + card(1, `${contThumb(P, other, 276, 128, true)}<div class=\"cc-head\"><b>${plural(other.length, 'region')}<\/b><span>Continent 2 of ${total}<\/span><\/div><div class=\"rchips\">${other.map(i => rchip(P, i)).join('')}<\/div>`);\n  return `<div class=\"phone\" data-anim><div class=\"map\">${mapSVG(P, 'here')}<\/div>\n    <div class=\"mapfade\" style=\"background:linear-gradient(180deg,rgba(2,10,16,0) 34%,rgba(2,10,16,.7) 54%,rgba(2,10,16,.92) 70%)\"><\/div>\n    <div class=\"crumbs\"><div class=\"pill\">${backIcon}Machine learning<\/div><div class=\"here-chip\">${planetGlyph(P.type, 16)}${P.name}<\/div><\/div>\n    <div class=\"swipe\" style=\"top:${top - 26}px\">Swipe through continents · tap a region to land<\/div>\n    <div class=\"car\" style=\"top:${top}px\">${cards}<\/div>${dots(total, 0, 726)}${tabbar()}${statusbar}<\/div>`;\n}\n\n/* ---------- B · one sheet, three rails: every level visible at once ---------- */\nfunction screenB(si, pid) {\n  const s = SYSTEMS[si], P = byId(pid), C = contOf(P), total = C.explored.length + C.locked, first = C.explored[0];\n  const sys = SYSTEMS.map((x, i) => `<span class=\"spill${i === si ? ' on' : ''}\">${sunGlyph(16)}${x.name}<\/span>`).join('');\n  const pl = s.planets.map(byId).map(p => `<span class=\"ptile${p.id === pid ? ' on' : ''}\">${p.id === 'inference' ? '<i class=\"yh\" title=\"You were here\"><\/i>' : ''}${globeHTML(p, 70)}${p.name}<\/span>`).join('');\n  const ct = C.explored.map((idx, ci) => `<span class=\"ctile${ci === 0 ? ' on' : ''}\">${contThumb(P, idx, 130, 78)}<span>${plural(idx.length, 'region')}<em>${ci + 1}/${total}<\/em><\/span><\/span>`).join('')\n    + Array.from({ length: C.locked }, (_, li) => `<span class=\"ctile\">${lockedThumb(P, li, 130, 78)}<span>Uncharted<em>${C.explored.length + li + 1}/${total}<\/em><\/span><\/span>`).join('');\n  const target = first.includes(P.sel) ? P.regions[P.sel] : P.regions[first[0]];\n  return `<div class=\"phone\" data-anim><div class=\"map\">${mapSVG(byId('inference'), 'here')}<\/div>\n    <div class=\"map-top\"><div class=\"pill\">${backIcon}Machine learning<span class=\"level-chip\">Planet<\/span><\/div><\/div>${tabbar()}<div class=\"scrim\"><\/div>\n    <div class=\"rsheet glass\"><div class=\"grab\"><\/div>\n      <div class=\"rs-head\"><h2>Find your way<\/h2><span class=\"rs-x\">${ic('close', 2.6)}<\/span><\/div>\n      <div class=\"rl\"><span>Systems<\/span><span>${SYSTEMS.length}<\/span><\/div><div class=\"rail\">${sys}<\/div>\n      <div class=\"rl\"><span>Planets in ${s.name}<\/span><span>${s.planets.length}<\/span><\/div><div class=\"rail\">${pl}<\/div>\n      <div class=\"rl\"><span>Continents on ${P.name}<\/span><span>${total}<\/span><\/div><div class=\"rail\">${ct}<\/div>\n      <div class=\"rs-chips\">${first.map(i => rchip(P, i)).join('')}<\/div>\n      <div class=\"rs-cta\" style=\"margin-top:14px\"><span class=\"enter big\">Land on ${target}<i>→<\/i><\/span><\/div>\n    <\/div>${statusbar}<\/div>`;\n}\n\n/* ---------- C · the orbit dial: the sun at the bottom, planets turn around it ---------- */\nfunction screenC() {\n  const s = SYSTEMS[0], ps = s.planets.map(byId), P = ps[1], C = contOf(P), cx = 195, cy = 742, R = 168, big = 210, gy = 262;\n  const ang = [-128, -90, -52], sz = [46, 52, 46];\n  const dial = ps.map((p, i) => { const a = ang[i] * Math.PI / 180, x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R, on = p === P;\n    return `<div class=\"dial-p${on ? ' on' : ''}\" style=\"left:${f1(x)}px;top:${f1(y + 12)}px\">${on ? `<span class=\"ringsel\">${globeHTML(p, sz[i])}<\/span>` : globeHTML(p, sz[i])}${p.name}<\/div>`; }).join('');\n  return `<div class=\"phone\" data-anim>${stars('c')}<div class=\"dial-sun\"><\/div>\n    <div class=\"crumbs\"><div class=\"pill\">${uniIcon}Your universe<\/div><\/div>\n    <div class=\"sysrow\">${SYSTEMS.map((x, i) => `<span class=\"spill${i === 0 ? ' on' : ''}\">${sunGlyph(16)}${x.name}<\/span>`).join('')}<\/div>\n    <div style=\"position:absolute;z-index:5;left:${195 - big / 2}px;top:${gy - big / 2}px\">${globeHTML(P, big)}<\/div>\n    <div class=\"pcap\" style=\"top:${gy + big / 2 + 22}px\"><span class=\"eyebrow\">Planet 2 of 3 · ${T[P.type].label}<\/span><h1>${P.name}<\/h1>\n      <div class=\"facts\"><span class=\"fact\">${plural(P.regions.length, 'region')}<\/span><span class=\"fact or\">You were here<\/span><\/div><\/div>\n    ${dial}<div class=\"swipe\" style=\"top:676px\">Turn the dial · tap the big planet to land<\/div>${tabbar()}${statusbar}<\/div>`;\n}\n\n/* ---------- simple drawing, 1: the landed map, flat ---------- */\nfunction screenS1(P) {\n  return `<div class=\"phone flat\"><div class=\"map\">${flatten(mapSVG(P, 'here'))}<\/div>\n    <div class=\"map-top\"><div class=\"pill\">${backIcon}${P.system}<\/div><span class=\"tag-plain\">Simple drawing<\/span><span class=\"listbtn\">${listIcon}<\/span><\/div>\n    <div class=\"plate\"><span class=\"eyebrow\">A planet in ${P.system}<\/span><h1>${P.name}<\/h1><\/div>\n    <div class=\"rstrip\"><div class=\"rl\"><span>${plural(P.regions.length, 'region')} · tap to land<\/span><\/div><div class=\"rrow\">${P.regions.map((r, i) => `<span class=\"rcard\">${regionThumb(P, i, 46)}<span><b>${r}<\/b><small>${i === P.sel ? '<i><\/i>You were here' : 'Land ›'}<\/small><\/span><\/span>`).join('')}<\/div><\/div>\n    ${tabbar()}${statusbar}<\/div>`;\n}\n/* ---------- simple drawing, 2: a flat globe (no spin, clouds or blur) and region tiles ---------- */\nfunction flatDisc(P, D) {\n  const w = globeWorld(P), B = BIO[P.type], th = T[P.type], LK = LOCK[P.type], id = 'fd' + gid++, s = D / 360, x0 = w.regions[0].at[0] - 180;\n  let land = '';\n  if (P.type === 'gas') land += Array.from({ length: 9 }, (_, i) => { const y = i * 40; return `<path d=\"M-60 ${y} ${Array.from({ length: 11 }, (_, k) => `Q${-60 + k * 60 + 30} ${y + (k % 2 ? 9 : -9)} ${-60 + k * 60 + 60} ${y}`).join(' ')} V${y + 44} H-60Z\" fill=\"${B.bands[i % 5]}\"/>`; }).join('');\n  land += `<path d=\"${toD(w.land)}\" fill=\"none\" stroke=\"${B.foam}\" stroke-width=\"3.4\" stroke-linejoin=\"round\" opacity=\".85\"/>`;\n  land += w.regions.map((g, i) => `<path d=\"${toD(g.loops)}\" fill=\"${B.land[i % 4]}\" fill-rule=\"evenodd\"/>`).join('');\n  land += w.locked.map(g => `<path d=\"${toD(g.loops)}\" fill=\"${LK[0]}\" fill-rule=\"evenodd\"/>`).join('');\n  land += w.regions.map(g => `<path d=\"${toD(g.loops)}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".5\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>`).join('');\n  land += `<path d=\"${toD(w.land)}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".75\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/>`;\n  const copies = [-480, 0, 480].map(dx => `<use href=\"#${id}l\" x=\"${dx}\"/>`).join('');\n  const names = w.regions.map((g, i) => { let x = ((g.at[0] - x0) % 480 + 480) % 480; x *= s; const y = g.at[1] * s; if (Math.hypot(x - D / 2, y - D / 2) > D / 2 - 18) return '';\n    return textLabel(x, y + 4, P.regions[i], th, 12); }).join('');\n  const sea = P.type === 'gas' ? '' : `<circle cx=\"${D / 2}\" cy=\"${D / 2}\" r=\"${D / 2}\" fill=\"${B.globe[1]}\"/><circle cx=\"${D * .42}\" cy=\"${D * .38}\" r=\"${D * .36}\" fill=\"${B.globe[0]}\" opacity=\".25\"/>`;\n  return `<svg width=\"${D}\" height=\"${D}\" viewBox=\"0 0 ${D} ${D}\" aria-hidden=\"true\"><defs><clipPath id=\"${id}c\"><circle cx=\"${D / 2}\" cy=\"${D / 2}\" r=\"${D / 2}\"/><\/clipPath>\n      <g id=\"${id}l\">${land}<\/g><mask id=\"${id}m\"><rect width=\"${D}\" height=\"${D}\" fill=\"#fff\"/><circle cx=\"${D * .4}\" cy=\"${D * .36}\" r=\"${D * .62}\" fill=\"#000\"/><\/mask><\/defs>\n    <circle cx=\"${D / 2}\" cy=\"${D / 2}\" r=\"${D / 2 + 11}\" fill=\"none\" stroke=\"${th.atmo}\" stroke-opacity=\".45\" stroke-width=\"1.5\"/>\n    <g clip-path=\"url(#${id}c)\">${sea}<g transform=\"translate(${f1(-x0 * s)} 0) scale(${s.toFixed(4)})\">${copies}<\/g>\n      <rect width=\"${D}\" height=\"${D}\" fill=\"${th.shadow}\" opacity=\".5\" mask=\"url(#${id}m)\"/><\/g>\n    <circle cx=\"${D / 2}\" cy=\"${D / 2}\" r=\"${D / 2}\" fill=\"none\" stroke=\"${th.rim}\" stroke-width=\"2\"/><\/svg>`;\n}\nfunction screenS2(P) {\n  const B = BIO[P.type], LK = LOCK[P.type], C = contOf(P), D = 270, top = 190;\n  return `<div class=\"phone flat\"><div class=\"flatsky\">${stars('flat' + P.id).replace('<div class=\"starfield\">', '').replace(/<\\/div>$/, '')}<\/div>\n    <div class=\"map-top\"><div class=\"pill\">${backIcon}${P.system}<\/div><span class=\"tag-plain\">Simple drawing<\/span><span class=\"listbtn\">${listIcon}<\/span><\/div>\n    <div class=\"ld-head\"><span class=\"eyebrow\">A planet in ${P.system}<\/span><h1>${P.name}<\/h1><\/div>\n    <div class=\"disc\" style=\"top:${top}px\">${flatDisc(P, D)}<\/div>\n    <div class=\"ld-legend\" style=\"top:${top + D + 22}px;justify-content:center\"><span><i style=\"background:${B.land[0]}\"><\/i>Explored<\/span><span><i style=\"background:${LK[0]}\"><\/i>Uncharted · ${C.locked}<\/span><\/div>\n    <div class=\"rtiles\" style=\"top:${top + D + 52}px\">${P.regions.map((r, i) => `<span class=\"rtile\">${regionThumb(P, i, 62)}<div><b>${r}<\/b><small>${i === P.sel ? '<i><\/i>You were here' : 'Land ›'}<\/small><\/div><\/span>`).join('')}<\/div>\n    ${tabbar()}${statusbar}<\/div>`;\n}\n\n\n/* ===================== round 03: the orbit dial, with a wheel of systems ===================== */\nICON.filter = '<path d=\"M4 7h9M17 7h3M4 17h3M11 17h9\"/><circle cx=\"15\" cy=\"7\" r=\"2\"/><circle cx=\"9\" cy=\"17\" r=\"2\"/>';\nICON.chevDown = '<path d=\"M6 9l6 6 6-6\"/>';\n/* the whole universe: three systems we have planets for, and four more (example data) */\nconst UNI = [\n  { name: 'Economics', types: ['ocean', 'barren'], planets: ['Cost of living', 'Markets'], rooms: 1 },\n  { name: 'Machine learning', ids: ['attention', 'inference', 'hardware'], rooms: 1, here: 1 },\n  { name: 'Astronomy', types: ['frozen', 'gas'], planets: ['Exoplanets', 'Black holes'] },\n  { name: 'Backend systems', ids: ['queues', 'storage'] },\n  { name: 'Football', ids: ['tactics'] },\n  { name: 'Climate', types: ['scorched', 'ocean'], planets: ['Energy', 'Oceans'] },\n  { name: 'Predictive history', types: ['barren'], planets: ['Empires'] },\n];\nconst uniPlanets = s => s.ids ? s.ids.map(byId).map(P => ({ id: P.id, name: P.name, type: P.type, rings: !!P.rings, regions: P.regions.length }))\n  : s.planets.map((n, i) => ({ name: n, type: s.types[i], rings: s.types[i] === 'gas' }));\nconst markIn = (t, q) => { if (!q) return t; const i = t.toLowerCase().indexOf(q); return i < 0 ? t : `${t.slice(0, i)}<mark>${t.slice(i, i + q.length)}<\/mark>${t.slice(i + q.length)}`; };\n\n/* a system as an orb: its sun with its tiny planets around it, no orbit lines */\nfunction orbSVG(s, S, o = {}) {\n  const id = 'ob' + gid++, ps = uniPlanets(s), r = rng(s.name + 'orb'), c = S / 2;\n  let defs = `<radialGradient id=\"${id}s\"><stop offset=\"0\" stop-color=\"#fff3c4\"/><stop offset=\".3\" stop-color=\"#ffc061\"/><stop offset=\".62\" stop-color=\"#ff6a2a\"/><stop offset=\"1\" stop-color=\"#ff6a2a\" stop-opacity=\"0\"/><\/radialGradient>`;\n  let g = `<circle cx=\"${c}\" cy=\"${c}\" r=\"${f1(S * .5)}\" fill=\"url(#${id}s)\" opacity=\".28\"/><circle cx=\"${c}\" cy=\"${c}\" r=\"${f1(S * .24)}\" fill=\"url(#${id}s)\"/>`;\n  const a0 = r() * TAU;\n  ps.forEach((p, i) => { const a = a0 + i * TAU / ps.length + (r() - .5) * .5, d = S * (.36 + r() * .07), x = c + Math.cos(a) * d, y = c + Math.sin(a) * d * .82, rr = Math.max(2.2, S * (.06 + r() * .025)), gl = BIO[p.type].globe;\n    defs += `<radialGradient id=\"${id}p${i}\" cx
