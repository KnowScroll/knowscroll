<\/div><\/div>\n  <div class=\"center\"><h2 id=\"h2\">Your universe starts quiet.<\/h2><p id=\"pp\">It takes shape from what you watch and read.<\/p><span class=\"btn space\" id=\"go\" style=\"margin-top:8px\">${icon('explore', 20)}Go to Explore<\/span><\/div>\n  <span class=\"chip skip\" id=\"skip\" role=\"button\">Skip<\/span>${tabbar}`;\nconst $ = id => document.getElementById(id);\nconst rise = (el, k, dy = 10) => { el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`; };\nfunction chrome(T) {\n  const A = T_ARRIVE - .4; rise($('hdr'), smooth(A, A + .6, T), -8); rise($('h2'), smooth(A + .2, A + .8, T)); rise($('pp'), smooth(A + .35, A + .95, T)); rise($('go'), smooth(A + .5, A + 1.1, T));\n  const sk = 1 - smooth(T_ARRIVE - .7, T_ARRIVE - .2, T); $('skip').style.opacity = sk; $('skip').style.visibility = sk > 0 ? 'visible' : 'hidden';\n  $('flash').style.opacity = smooth(T_BANG - .05, T_BANG + .02, T) * (1 - smooth(T_BANG + .04, T_BANG + .6, T)) * .9;\n  $('flash2').style.opacity = smooth(T_EXIT - .25, T_EXIT + .15, T) * (1 - smooth(T_EXIT + .15, T_EXIT + 1, T)) * .22;\n}\n\n/* ===================== page: beats, storyboard, controls ===================== */\nconst f2 = x => x.toFixed(2);\nconst BEATS = [\n  [0, 1.6, 'Dust streams in', 'Black, then pink, violet and warm dust flows in from off screen along five spiral arms. Nothing appears out of nowhere: the spiral is built by what streams in. The camera circles slowly (about 18°) so it reads in depth.'],\n  [1.6, T_SHAKE, 'The star forms', 'The dust sinks into the centre and builds the star: a tiny ember first, growing with every bit that falls in. It is a ball, not a disc: painted cells turn on it, the approved atmosphere rim glows round it, and it floats gently. Sparkles appear around it, more and more of them.'],\n  [T_SHAKE, T_BANG, 'About to blow', 'A light tremble that builds: the star quivers, glows hotter, the sparkles twinkle faster. In the last fifth of a second it squeezes.'],\n  [T_BANG, T_BANG + .35, 'Bang', 'Warm flash, two soft shock rings (warm, then pink), the dust and sparkles burst outward and the stars switch on.'],\n  [T_BANG + .35, T_WARP, 'Travel', 'A long cruise; stars stretch into short streaks. We pass: ' + PASS.map(([s, n]) => `${n.toLowerCase()} (${f2(when(s))} s)`).join(', ') + '.'],\n  [T_WARP, T_FULL, 'Towards light speed', 'A slow, smooth three-second build: more and more stars come straight at us as bright points, their trails grow longer and the view widens to +34°.'],\n  [T_FULL, T_EXIT, 'Light speed', 'A moment at full speed.'],\n  [T_EXIT, T_ARRIVE, 'Drop out', 'A faint, slow white glow and we come to a smooth stop over 2.5 s: most of the slowing early, then a long glide. Streaks shorten back into stars and the view narrows on the same curve.'],\n  [T_ARRIVE, T_END, 'Empty universe', 'Lands on U01 Empty exactly (same camera, same stars, same drift). Title, line and Go to Explore rise in one after another. Then it is the live screen.'],\n];\nconst beatsEl = $('beats');\nbeatsEl.innerHTML = BEATS.map(([a, b, n, d]) => `<tr><td>${f2(a)}–${f2(b)} s<\/td><td><b>${n}<\/b> · ${d}<\/td><\/tr>`).join('');\nconst SHOTS = [[.9, 'Dust streams in'], [2.4, 'A tiny star forms'], [4.0, 'It grows, sparkles build'], [5.5, 'Trembling'], [T_BANG + .06, 'Bang'], [T_BANG + .5, 'Through the burst'],\n  [when(290 - 44), 'A lush planet'], [when(680 - 58), 'Over a system'], [when(1040 - 40), 'An exotic planet'], [when(1210 - 50), 'Beside a system'], [15.4, 'Building to light speed'], [17.1, 'Light speed'], [T_END + .3, 'Empty universe']];\n\nlet T = 0, playing = true, rate = 1;\nconst reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n$('shots').innerHTML = SHOTS.map(([s, n], i) => { frame(s); return `<div class=\"shot\" data-t=\"${s}\"><img alt=\"${n}\" src=\"${canvas.toDataURL('image/jpeg', .82)}\"><b>${f2(s)} s<\/b><span>${n}<\/span><\/div>`; }).join('');\nconst scrub = $('scrub'), tc = $('tc'), pauseB = $('pause');\nscrub.max = T_MAX;\nfunction show() { frame(T); chrome(T); scrub.value = Math.min(T, T_MAX); const beat = BEATS.findLastIndex(([a]) => T >= a);\n  tc.textContent = `${f2(Math.min(T, T_MAX))} s · ${BEATS[beat][2]}`; beatsEl.querySelectorAll('tr').forEach((tr, i) => tr.classList.toggle('cur', i === beat)); }\nconst setPlay = p => { playing = p; pauseB.textContent = p ? 'Pause' : 'Play'; };\n$('replay').onclick = () => { T = 0; setPlay(true); };\npauseB.onclick = () => { if (!playing && T >= T_MAX) T = 0; setPlay(!playing); };\n$('slow').onclick = e => { rate = rate === 1 ? .25 : 1; e.target.classList.toggle('on', rate !== 1); };\nscrub.oninput = () => { T = +scrub.value; setPlay(false); show(); };\n$('shots').onclick = e => { const s = e.target.closest('.shot'); if (s) { T = +s.dataset.t; setPlay(false); show(); } };\n$('skip').onclick = () => { if (T < T_ARRIVE - .05) T = T_ARRIVE - .05; };\nconst phone = $('phone');\nphone.addEventListener('pointermove', e => { const r = phone.getBoundingClientRect(); pointer.set((e.clientX - r.left) / r.width * 2 - 1, (e.clientY - r.top) / r.height * 2 - 1); });\nphone.addEventListener('pointerleave', () => pointer.set(0, 0));\nconst hashT = /t=([\\d.]+)/.exec(location.hash);\nif (hashT) { T = +hashT[1]; setPlay(false); }\nif (reduce) { T = T_END + .3; setPlay(false); }   // reduced motion: no opening, straight to the empty universe\nshow();\nlet last = 0, prev = null;\nfunction loop(now) { requestAnimationFrame(loop); if (reduce || now - last < 33) return; const dt = prev === null ? 0 : Math.min(.1, (now - prev) / 1000); prev = now; last = now;\n  if (playing) T += dt * rate; show(); }\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "Enter a system", "path": "animations/enter-system-finalized.html", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Universe Entering<\/title>\n<link rel=\"preconnect\ 5,.16)}\n\n@media (max-width:440px){ .phone{transform:scale(.86);transform-origin:top left;margin-bottom:-118px} }\n<\/style>\n<\/head>\n<body>\n<header class=\"intro\">\n  <span class=\"kicker\">KnowScroll · Universe · Animations · Entering a system · Final<\/span>\n  <h1>Going in by ship<\/h1>\n  <p>Tap a system on the overview: a small rocket rises in from the bottom edge, a short flame out of its engine, and we follow it in.\n     The overview hands over to the system view, the rocket pulls ahead and parks beside a planet, right where the system view keeps its ship.\n     It starts and ends on the finalized screens, drawn with the approved scene code.<\/p>\n<\/header>\n<div class=\"tools\"><button id=\"replay\">Replay<\/button><button id=\"pause\">Pause<\/button><button id=\"slow\">Slow ×0.25<\/button>\n  <input type=\"range\" id=\"scrub\" min=\"0\" max=\"5\" step=\"0.01\" value=\"0\"><span class=\"tc\" id=\"tc\">0.00 s<\/span><\/div>\n<div class=\"stage\">\n  <div class=\"phone\" id=\"phone\"><canvas id=\"cS\"><\/canvas><canvas id=\"cO\"><\/canvas><div class=\"labels\" id=\"lS\"><\/div><div class=\"labels\" id=\"lO\"><\/div>\n    <div class=\"chrome\" id=\"chrome\"><\/div>\n    <div class=\"statusbar\"><span>9:41<\/span><i><\/i><\/div><\/div>\n  <div class=\"side\">\n    <div><h3>Storyboard · click a frame to jump there<\/h3><\/div>\n    <div class=\"shots\" id=\"shots\"><\/div>\n    <div><h3>Beats<\/h3><\/div>\n    <table class=\"beats\" id=\"beats\"><\/table>\n  <\/div>\n<\/div>\n<div id=\"err\"><\/div>\n\n<script>window.addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += (e.message || 'error') + '\\n'; });<\/script>\n<script type=\"module\">\nimport * as THREE from 'three';\n\n/* ===================== copied verbatim from universe-above/universe-drafts-finalized.html ===================== */\nconst W = 390, H = 844, PR = Math.min(1.5, window.devicePixelRatio || 1), TAU = Math.PI * 2;\nconst clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst smooth = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };\nconst mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];\nfunction rng(seed) { let h = 2166136261; for (const ch of String(seed)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);\n  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nfunction hsl(h, s, l) { h = ((h % 360) + 360) % 360 / 360; s /= 100; l /= 100;\n  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return 255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))); };\n  return [f(0), f(8), f(4)]; }\nconst v3 = c => new THREE.Vector3(c[0] / 255, c[1] / 255, c[2] / 255);\nconst hexV = h => v3([parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);\nfunction ramp(stops, t) { t = clamp(t) * (stops.length - 1); const i = Math.min(stops.length - 2, t | 0); const k = t - i; return mix3(stops[i], stops[i + 1], k * k * (3 - 2 * k)); }\n\n/* ===================== smooth noise (low frequency only: painted, not photographic) ===================== */\nconst perm = new Uint8Array(512);\n(() => { const p = [...Array(256).keys()], r = rng('knowscroll'); for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; })();\nconst fade = t => t * t * t * (t * (t * 6 - 15) + 10);\nfunction grad(h, x, y, z) { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14) ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }\nfunction noise(x, y, z) {\n  let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z); x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;\n  const u = fade(x), v = fade(y), w = fade(z), A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z, B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;\n  return lerp(lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u), lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),\n    lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u), lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);\n}\nfunction fbm(x, y, z, o = 3) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * noise(x * f, y * f, z * f); f *= 2.03; a *= .5; } return s; }\n\n/* ===================== planet genomes: a type never repeats in a universe ===================== */\nconst TYPES = ['lush', 'toxic', 'frozen', 'scorched', 'barren', 'exotic', 'gas', 'ocean'];\nconst FAMILY_SHIFT = { teal: 0, cobalt: 18, coral: -18, amber: -10, pink: 25, violet: 30 };\nconst used = new Set();\nfunction genome(id, family) {\n  const r = rng(id), order = [...TYPES]; for (let i = order.length - 1; i > 0; i--) { const j = (r() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]]; }\n  const type = order.find(t => !used.has(t)) || order[0]; used.add(type);\n  return { id, type, d: FAMILY_SHIFT[family] + (r() - .5) * 30, size: .8 + r() * .5, tilt: (r() - .5) * .7, spin: .12 + r() * .12, rings: type === 'gas' || (type === 'frozen' && r() < .5), moon: r() < .45 };\n}\nconst G = {\n  attention: genome('attention', 'teal'), inference: genome('inference', 'teal'), hardware: genome('hardware', 'teal'),\n  queues: genome('queues', 'cobalt'), storage: genome('storage', 'cobalt'), tactics: genome('tactics', 'coral'),\n};\nG.hardware.rings = true; // the system screen shows one ringed world\n/* ===================== painted textures ===================== */\nconst STYLE = d => ({\n  lush:     { ramp: [hsl(200 + d, 70, 34), hsl(185 + d, 75, 48), hsl(120 + d, 55, 46), hsl(95 + d, 65, 56), hsl(70 + d, 70, 68)], sea: .5, atmo: hsl(190 + d, 95, 68), clouds: .8 },\n  tox ion pose(cam, pos, target, fov) { cam.position.copy(pos); cam.fov = fov; cam.updateProjectionMatrix(); cam.lookAt(target); cam.updateMatrixWorld(); }\nfunction tickAll(t) { time.value = t; ticksO.forEach(f => f(t)); ticksS.forEach(f => f(t)); sceneO.updateMatrixWorld(true); sceneS.updateMatrixWorld(true); }\n\n/* ===================== the timeline ===================== */\nconst A = { END: 5.3, MAX: 5.7, CAM0: .35, CAM1: 4.6, X0: 1.45, X1: 2.25, SHIP0: .4, GO: 2.55, SHIP1: 4.4 };\n// the camera, in U02 units around Machine learning: the overview camera and the U02 camera are the two ends of one swing\nconst REL0 = V(...CAMS.overview.pos).sub(ML_O).multiplyScalar(K), TGT0 = V(...CAMS.overview.target).sub(ML_O).multiplyScalar(K);\nconst REL1 = V(...CAMS.system.pos), TGT1 = V(...CAMS.system.target);\nconst sph = v => ({ r: v.length(), el: Math.asin(v.y / v.length()), yaw: Math.atan2(v.x, v.z) }), S0 = sph(REL0), S1 = sph(REL1);\nfunction camA(T, t) {\n  const e = smoother((T - A.CAM0) / (A.CAM1 - A.CAM0)), b = Math.sin(Math.PI * e);\n  const r = S0.r * Math.pow(S1.r / S0.r, e), el = lerp(S0.el, S1.el, e) - .14 * b, yaw = lerp(S0.yaw, S1.yaw, e) - .5 * b;\n  const pos = V(r * Math.cos(el) * Math.sin(yaw), r * Math.sin(el), r * Math.cos(el) * Math.cos(yaw)).add(driftV(t, CAMS.overview.drift * K).lerp(driftV(t, CAMS.system.drift), e));\n  return { pos, target: TGT0.clone().lerp(TGT1, e), fov: 38 + 4 * b };\n}\n// the rocket: rises in from under the bottom edge right in front of us and leads the way (we follow close behind),\n// then pulls ahead into the system and parks where the U02 ship sits\nconst CS0 = V(.34, -1.85, -2.7), CSH = V(.06, -.42, -4.6), CSF = V(0, -.3, -16);\nfunction shipAt(T) {\n  const c = camA(T, 4 + T); pose(camTmp, c.pos, c.target, c.fov);\n  const cs = q => CS0.clone().lerp(CSH, easeOut((q - A.SHIP0) / 1.1)).add(V(Math.sin(q * 1.3) * .05, Math.sin(q * 1.9) * .04, 0));\n  const p0 = camTmp.localToWorld(cs(T)), p1 = camTmp.localToWorld(CSF.clone()), dock = pB.localToWorld(DOCK.clone());\n  const away = c.pos.clone().sub(dock).setY(0).normalize(), p2 = dock.clone().add(V(0, 2.2, 0)).addScaledVector(away, 3.2);\n  const x = clamp((T - A.GO) / (A.SHIP1 - A.GO)), s = Math.pow(x * x * (3 - 2 * x), .7);   // eases off, then a long glide in to park\n  // while we follow close behind, it shows three-quarters from behind, nose up as it climbs in\n  const look = V(-.3, .18, -1).add(cs(T + .03).sub(cs(T)).multiplyScalar(20)).normalize().applyQuaternion(camTmp.quaternion);\n  return { pos: bez(p0, p1, p2, dock, s), tail: dock.clone().sub(p2).normalize(), look, s };\n}\nfunction shipA(T) {\n  const a = shipAt(T), b = shipAt(T + .03), d = b.pos.clone().sub(a.pos), go = d.length() > 1e-3 ? d.normalize() : a.tail;\n  return { pos: a.pos, dir: a.look.clone().lerp(go, smooth(0, .2, a.s)).normalize(), s: a.s };\n}\nconst toO = p => ML_O.clone().addScaledVector(p, 1 / K);\nfunction frame(T) {\n  const t = 4 + T; tickAll(t);\n  const c = camA(T, t); pose(camS, c.pos, c.target, c.fov); pose(camO, toO(c.pos), toO(c.target), c.fov);\n  LIGHT_RS.copy(camS.localToWorld(KEY.clone())); LIGHT_RO.copy(camO.localToWorld(KEY.clone().multiplyScalar(1 / K)));\n  const sh = shipA(T), dk = smooth(A.SHIP1 - .05, A.SHIP1 + .25, T), on = T > A.SHIP0, heat = 1 - .7 * smooth(A.SHIP1 - 1, A.SHIP1, T);\n  const big = 1 + 1.5 * Math.pow(Math.sin(Math.PI * sh.s), .8), size = .42 * big * (1 - dk);   // stays readable on the long way in, back to true size when parked\n  // the plume feels the ship's acceleration: sideways bends its tip back, forwards stretches it a little\n  const h = .06, acc = shipAt(T + h).pos.add(shipAt(T - h).pos).addScaledVector(sh.pos, -2).multiplyScalar(1 / (h * h));\n  const aL = acc.applyQuaternion(rocketS.quaternion.clone().invert()).multiplyScalar(-.0022 / Math.max(size, .05));\n  const bend = new THREE.Vector2(aL.x, aL.z), bl = bend.length(); if (bl > .1) bend.multiplyScalar(.1 / bl);\n  const push = clamp(-aL.y * .5, -.25, .3), fade = smooth(A.SHIP0, A.SHIP0 + .25, T);\n  rocketS.userData.set(sh.pos, sh.dir, size, on, heat * fade, T, bend, push);\n  rocketO.userData.set(toO(sh.pos), sh.dir, .42 / K, on, heat * fade, T, bend, push);\n  cone.visible = dk > 0; cone.scale.setScalar(Math.max(.001, dk));\n  const X = smooth(A.X0, A.X1, T);\n  if (X < 1) rO.render(sceneO, camO); if (X > 0) rS.render(sceneS, camS);\n  cO.style.opacity = 1 - X;\n  const lo = 1 - smooth(.05, .45, T), ls = smooth(4.3, 4.9, T);\n  labO.el.style.opacity = lo; if (lo > 0) labO.place(camO); labS.el.style.opacity = ls; if (ls > 0) labS.place(camS);\n  return { X, tap: sysO[0].position.clone().project(camO) };\n}\n\n/* ===================== chrome: U01 Overview and U02 System, as finalized ===================== */\nconst ICONS = {\n  explore: '<rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"3\"/><path d=\"M8 3l4 4 4-4\"/>', universe: '<circle cx=\"12\" cy=\"12\" r=\"3.5\"/><ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4.5\" transform=\"rotate(-20 12 12)\"/>',\n  talk: '<path d=\"M4 5h16v11H9l-5 4z\"/>', keep: '<path d=\"M6 3h12v18l-6-4-6 4z\"/>', back: '<path d=\"M15 5l-7 7 7 7\"/>', arrowRight: '<path d=\"M5 12h14\"/><path d=\"M13 6l6 6-6 6\"/>',\n  search: '<circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M20 20l-4-4\"/>', list: '<path d=\"M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01\"/>',\n};\nconst icon = (n, s = 20) => `<svg width=\"${s}\" height=\"${s}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"${s >= 20 ? 2 : 2.4}\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${ICONS[n]}<\/svg>`;\nconst chip = (l, o = {}) => `<span class=\"chip ${o.solid ? 'solid' : ''}\">${o.ic ? icon(o.ic, 16) : ''}${o.dot !== undefined ? `<span class=\"dot ${o.dot ? 'on' : ''}\"><\/span>` : ''}${l}<\/span>`;\nconst tabbar = `<nav class=\"tabbar\">${[['explore', 'Explore'], ['universe', 'Universe'], ['talk', 'Talk'], ['keep', 'Keep']].map(([k, l]) => `<div class=\"tab ${k === 'universe' ? 'cur' : ''}\">${icon(k, 22)}<span>${l}<\/span><\/div>`).join('')}<\/nav>`;\n$('chrome').innerHTML = `<div class=\"layer\" id=\"chO\"><div class=\"top\"><div class=\"row\"><h1 class=\"title\">Your universe<\/h1><div class=\"avatar\">U<\/div><\/div><div class=\"actions\"><span class=\"ib\">${icon('search', 22)}<\/span>${chip('Lately', { dot: false })}<\/div><\/div>\n    <div class=\"bottom\"><div class=\"actions\">${chip('Return to Attention', { solid: true, ic: 'arrowRight' })}${chip('List view', { ic: 'list' })}<\/div><\/div><\/div>\n  <div class=\"layer\" id=\"chS\"><div class=\"top\"><div class=\"row\" id=\"sRow\">${chip('Universe', { solid: true, ic: 'back' })}${chip('Lately', { dot: false })}<\/div><div style=\"padding-top:6px\" id=\"sHead\"><h1 class=\"title\" style=\"font-size:30px;line-height:34px\">Machine learning<\/h1><span class=\"eyebrow\" style=\"margin-top:4px\">A system<\/span><\/div><\/div>\n    <div class=\"bottom\" id=\"sBot\"><div class=\"actions\">${chip('List view', { ic: 'list' })}<\/div><\/div><\/div>\n  <span class=\"tap\" id=\"tap\"><\/span>${tabbar}`;\nconst rise = (el, k, dy = 10) => { el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`; };\nfunction chrome(T, r) {\n  const tp = $('tap'), k = clamp(T / .6), v = (r.tap.x * .5 + .5) * W, h = (-r.tap.y * .5 + .5) * H;   // one ring opens and fades where you touched\n  tp.style.opacity = T < .6 ? .9 * (1 - k) : 0; tp.style.transform = `translate(${v}px, ${h}px) scale(${1 + 2.2 * easeOut(k)})`;\n  $('chO').style.opacity = 1 - smooth(.05, .4, T);\n  rise($('sRow'), smooth(4.35, 4.85, T), -8); rise($('sHead'), smooth(4.5, 5.0, T)); rise($('sBot'), smooth(4.6, 5.1, T));\n}\n\n/* ===================== page: beats, storyboard, controls ===================== */\nconst f2 = x => x.toFixed(2);\nconst BEATS = [\n  [0, .4, 'Tap', 'A tap on Machine learning. One ring opens and fades where you touched; the overview header, chips and names fade away. The tab bar stays.'],\n  [.4, A.X0, 'Launch', 'A small rocket rises in from under the bottom edge, right in front of us, a short, dense flame out of its engine, and heads for the system. The camera starts to swing after it.'],\n  [A.X0, A.X1, 'Closer look', 'The overview drawing hands over to the detailed U02 drawing: same sun, same size, same place, so only the planets settle into their U02 orbits.'],\n  [A.X1, A.SHIP1, 'Swing in', 'The camera swings round and settles over the system. The rocket pulls ahead, smaller and smaller, and parks beside Inference & serving, where the U02 ship sits. Its flame shortens as it eases off and dims as it parks.'],\n  [A.SHIP1, A.END, 'U02 System', 'Lands exactly on U02 as finalized (same camera, same stars, same drift). Back chip, title and List view rise in, then the planet names.'],\n];\nconst SHOTS = [[0, 'Tap Machine learning'], [.75, 'The rocket rises in'], [1.3, 'Following it'], [1.85, 'Handing over'], [2.6, 'Swinging round'], [3.1, 'Pulling ahead'], [3.6, 'Flying in'], [4.25, 'Parking'], [5.3, 'U02 System']];\nconst snap = X => { const c = document.createElement('canvas'); c.width = 195; c.height = 422; const g = c.getContext('2d'); g.drawImage(cS, 0, 0, 195, 422);\n  if (X < 1) { g.globalAlpha = 1 - X; g.drawImage(cO, 0, 0, 195, 422); } return c.toDataURL('image/jpeg', .82); };\nconst beatsEl = $('beats'), scrub = $('scrub'), tc = $('tc'), pauseB = $('pause');\nbeatsEl.innerHTML = BEATS.map(([a, b, n, d]) => `<tr><td>${f2(a)}–${f2(b)} s<\/td><td><b>${n}<\/b> · ${d}<\/td><\/tr>`).join('');\n$('shots').innerHTML = SHOTS.map(([s, n]) => { const r = frame(s); return `<div class=\"shot\" data-t=\"${s}\"><img alt=\"${n}\" src=\"${snap(r.X)}\"><b>${f2(s)} s<\/b><span>${n}<\/span><\/div>`; }).join('');\nscrub.max = A.MAX;\nlet T = 0, playing = true, rate = 1;\nfunction show() { const r = frame(T); chrome(T, r); scrub.value = Math.min(T, A.MAX);\n  const beat = Math.max(0, BEATS.findLastIndex(([a]) => T >= a));\n  tc.textContent = `${f2(Math.min(T, A.MAX))} s · ${BEATS[beat][2]}`; beatsEl.querySelectorAll('tr').forEach((tr, i) => tr.classList.toggle('cur', i === beat)); }\nconst setPlay = p => { playing = p; pauseB.textContent = p ? 'Pause' : 'Play'; };\n$('replay').onclick = () => { T = 0; setPlay(true); };\npauseB.onclick = () => { if (!playing && T >= A.MAX) T = 0; setPlay(!playing); };\n$('slow').onclick = e => { rate = rate === 1 ? .25 : 1; e.target.classList.toggle('on', rate !== 1); };\nscrub.oninput = () => { T = +scrub.value; setPlay(false); show(); };\n$('shots').onclick = e => { const s = e.target.closest('.shot'); if (s) { T = +s.dataset.t; setPlay(false); show(); } };\nconst reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst hashT = /t=([\\d.]+)/.exec(location.hash);\nif (hashT) { T = +hashT[1]; setPlay(false); }\nif (reduce) { T = A.END + .2; setPlay(false); }   // reduced motion: no flight, straight to U02\nshow();\nlet last = 0, prev = null;\nfunction loop(now) { requestAnimationFrame(loop); if (reduce || now - last < 33) return; const dt = prev === null ? 0 : Math.min(.1, (now - prev) / 1000); prev = now; last = now;\n  if (playing) { T += dt * rate; if (T > A.MAX + 1.2) T = 0; } show(); }   // loops, with a pause on U02\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "Enter a planet", "path": "animations/enter-planet-finalized.html", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Entering a Planet<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<!--\n  Animations: entering a planet. FINALIZED 2026-10-29 (copy of enter-planet-04.html). Never change it.\n  Round 04: entering a planet. Round 03 feedback: slow it down a bit more (glide 2.3 s -> 3.0 s).\n  Round 01 (GTA-style snap out and three punches) was dropped: \"taking too long, and unnecessary\".\n  Round 02 brief: \"smooth, fast but not too fast, and looking good\" (one glide, about 2 s).\n  Round 02 feedback: too fast, slow it down; the hand-over from the space render to the world render just happens at the end; it should be\n  a smooth change while travelling in, the world becoming clearer and clearer as we near the planet.\n  U02 System (Machine learning) -> U03 planet (Inference & serving), about 4 s. One continuous glide (distance on a log curve, soft landing).\n  The U03 globe rides exactly on the 3D planet the whole way in (same spot, same size, worked out from the camera every frame); it fades in\n  from blurred to sharp as we close in, so the painted planet turns into the world gradually; the U03 starfield comes in at the end.\n  Scene code is copied from universe-above/universe-drafts-finalized.html (utilities, genomes, textures, shaders, makeSun, makePlanet,\n  makeSystem, halo, makeSky, makeStation, makeShip, CAMS) and the globe from world-views/world-views-finalized.html (world builder,\n  surfaceBand, screenPlanet). New code: the glide, the globe tracking and the timeline. Add #t=1.8 to the URL to freeze on a moment.\n-->\n<script type=\"importmap\">{ \"imports\": { \"three\": \"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js\" } }<\/script>\n<style>\n:root{\n  --paper:#FFFDF2; --ink:#15302A; --ink2:#566962; --focus:#FFE44D; --fresh:#14C79B;\n  --label:#FFFDF2; --label2:rgba(255,253,242,.72);\n  --f-display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;\n  --f-text:'Instrument Sans',system-ui,sans-serif;\n  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;\n  --page:#0C0C0E; --page-ink:#F2EEE3; --page-ink2:#A29C8E; --page-edge:rgba(242,238,227,.16);\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:var(--page);color:var(--page-ink);font-family:var(--f-text);padding:32px 16px 80px}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer}\n.intro{max-width:1240px;margin:0 auto 18px}\n.intro .kicker{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--page-ink2)}\n.intro h1{font:800 36px/40px var(--f-display);letter-spacing:-.02em;margin-top:6px}\n.intro p{color:var(--page-ink2);font-size:15px;line-height:22px;margin-top:8px;max-width:840px}\n.tools{max-width:1240px;margin:0 auto 26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.tools button{border:1.5px solid var(--page-edge);border-radius:999px;padding:8px 14px;font:600 13px/1 var(--f-text)}\n.tools button.on{background:var(--page-ink);color:var(--page)}\n.tools .sep{width:1px;height:24px;background:var(--page-edge);margin:0 4px}\n.tools input[type=range]{width:260px;accent-color:#FFE44D}\n.tools .tc{font:500 12px/16px var(--f-mono);color:var(--page-ink2);min-width:150px}\n#err{position:fixed;left:12px;bottom:12px;max-width:600px;background:#B23A0B;color:#fff;font:12px/16px var(--f-mono);padding:10px;border-radius:8px;display:none;white-space:pre-wrap;z-index:99}\n\n.stage{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;max-width:1240px;margin:0 auto}\n.side{width:min(640px,100%);display:flex;flex-direction:column;gap:22px}\n.side h3{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--page-ink2)}\n.side .lead{font:700 20px/26px var(--f-display);margin-top:6px}\n.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}\n.shot{display:flex;flex-direction:column;gap:6px;cursor:pointer}\n.shot img{width:100%;aspect-ratio:390/844;border-radius:14px;background:#020308;box-shadow:0 0 0 1px var(--page-edge);display:block}\n.shot b{font:500 11px/14px var(--f-mono);color:var(--page-ink2)}\n.shot span{font:600 13px/17px var(--f-text)}\n.beats{width:100%;border-collapse:collapse;font-size:13.5px;line-height:19px}\n.beat nsform:uppercase;color:var(--label2);display:block}\n.avatar{width:40px;height:40px;border-radius:999px;background:var(--focus);color:var(--ink);font:800 16px/1 var(--f-display);display:flex;align-items:center;justify-content:center;flex:none}\n.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font:600 14px/18px var(--f-text);white-space:nowrap;border:1px solid rgba(255,253,242,.5);background:rgba(2,3,8,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}\n.chip.solid{background:var(--paper);color:var(--ink);border-color:var(--paper)}\n.chip .dot{width:8px;height:8px;border-radius:4px;border:1px solid currentColor}\n.ib{width:48px;height:48px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:rgba(255,253,242,.94);color:var(--ink)}\n.tap{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border:2px solid var(--paper);border-radius:50%;opacity:0;pointer-events:none}\n.tabbar{position:absolute;z-index:4;left:14px;right:14px;bottom:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border:1px solid rgba(255,255,255,.15);border-radius:24px;background:rgba(10,20,28,.42);box-shadow:0 18px 40px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35)}\n.tab{display:grid;gap:5px;justify-items:center;padding:9px 4px 8px;color:rgba(255,255,255,.6);border-radius:17px;font:800 11px/1 var(--f-text)}\n.tab svg{width:21px;height:21px;stroke-width:1.9}\n.tab.cur{color:#fff;background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}\n\n/* ---------- U03 globe, copied from world-views/world-views-finalized.html (scoped to .u03) ---------- */\n.u03{position:absolute;inset:0;z-index:2;color:#fffdf2;opacity:0;pointer-events:none}\n.u03 .starfield{position:absolute;inset:0;background:radial-gradient(circle at 50% 4 acing:.1em;text-transform:uppercase;color:rgba(255,253,242,.7)}\n.u03 .caption h1{font:800 32px/36px var(--f-display);letter-spacing:-.02em}\n.u03 .hint{display:flex;align-items:center;gap:8px;margin-top:4px;color:#b8e2e3;font:700 13px/1 var(--f-text)}\n.u03 .hint span{display:grid;width:26px;height:26px;place-items:center;border:1px solid rgba(255,255,255,.2);border-radius:50%;font-size:13px}\n.u03 .chips{position:absolute;z-index:30;left:14px;right:14px;bottom:106px;display:flex;flex-wrap:wrap;gap:8px}\n.u03 .chip{display:inline-flex;align-items:center;gap:7px;height:42px;min-height:0;padding:0 15px;border:0;border-radius:999px;font:800 14px/1 var(--f-text);white-space:nowrap;backdrop-filter:none;-webkit-backdrop-filter:none}\n.u03 .chip.light{background:rgba(255,253,242,.94);color:#15302a;box-shadow:0 5px 0 rgba(0,0,0,.25)}\n.u03 .chip.dark{background:rgba(6,20,30,.6);color:#fff;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}\n.u03 .chip svg{width:16px;height:16px}\n@media (max-width:440px){ .phone{transform:scale(.86);transform-origin:top left;margin-bottom:-118px} }\n<\/style>\n<\/head>\n<body>\n<header class=\"intro\">\n  <span class=\"kicker\">KnowScroll · Universe · Animations · Entering a planet · Final<\/span>\n  <h1>Gliding in<\/h1>\n  <p>Tap a planet in a system: the camera turns onto it and glides in, unhurried, as the sun and the other worlds slide away.\n     On the way the planet slowly comes into focus as its world: the U03 globe fades in on top of it, blurred at first and sharper the closer we get,\n     until it lands exactly where the globe sits. About four seconds.<\/p>\n<\/header>\n<div class=\"tools\"><button id=\"replay\">Replay<\/button><button id=\"pause\">Pause<\/button><button id=\"slow\">Slow ×0.25<\/button>\n  <input type=\"range\" id=\"scrub\" min=\"0\" max=\"5\" step=\"0.01\" value=\"0\"><span class=\"tc\" id=\"tc\">0.00 s<\/span><\/div>\n<div class=\"stage\">\n  <div class=\"phone\" id=\"phone\"><canvas id=\"cS\"><\/canvas><div class=\"labels\" id=\"lS\"><\/div>\n    <div class=\"u03\" id=\"u03\"><\/div>\n    <div class=\"chrome\" id=\"chrome\"><\/div>\n    <div class=\"statusbar\"><span>9:41<\/span><i><\/i><\/div><\/div>\n  <div class=\"side\">\n    <div><h3>Storyboard · 3D layer only (the globe coming into focus shows on the phone) · click a frame to jump there<\/h3><\/div>\n    <div class=\"shots\" id=\"shots\"><\/div>\n    <div><h3>Beats<\/h3><\/div>\n    <table class=\"beats\" id=\"beats\"><\/table>\n  <\/div>\n<\/div>\n<div id=\"err\"><\/div>\n\n<script>window.addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += (e.message || 'error') + '\\n'; });<\/script>\n<script>\n/* ===================== copied verbatim from world-views/world-views-finalized.html (the U03 globe) ===================== */\nconst TAU = Math.PI * 2;\nconst rng = seed => { let h = 2166136261; for (const c of String(seed)) h = Math.imul(h ^ c.charCodeAt(0), 16777619);\n  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };\nconst f1 = n => n.toFixed(1);\nconst clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;\n\n/* ===================== noise ===================== */\nconst perm = new Uint8Array(512);\n(() => { const p = [...Array(256).keys()], r = rng('knowscroll-world'); for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; })();\nconst fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + (b - a) * t;\nfunction grad(h, x, y, z) { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14) ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }\nfunction noise(x, y, z) {\n  let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z); x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;\n  const u = fade(x), v = fade(y), w = fade(z), A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z, B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;\n  return lerp(lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u), lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),\n    lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u), lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);\n}\nfunction fbm(x, y, z, o) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * noise(x * f, y * f, z * f); f *= 2.03; a *= .5; } return s; }\n\n/* ===================== contours: marching squares, chained and smoothed ===================== */\nconst SEG = { 1: [['L', 'B']], 2: [['B', 'R']], 3: [['L', 'R']], 4: [['T', 'R']], 6: [['T', 'B']], 7: [['T', 'L']], 8: [['T', 'L']], 9: [['T', 'B']], 11: [['T', 'R']], 12: [['L', 'R']], 13: [['R', 'B']], 14: [['L', 'B']] };\nfunction contours(G, iso = 0, passes = 2) {\n  const { W, H, v, x0, y0, cell } = G, pts = new Map(), adj = new Map();\n  const val = (i, j) => (i <= 0 || j <= 0 || i >= W - 1 || j >= H - 1) ? -1 : v[j * W + i] - iso;\n  const key = (e, i, j) => e === 'T' ? `h${i},${j}` : e === 'B' ? `h${i},${j + 1}` : e === 'L' ? `v${i},${j}` : `v${i + 1},${j}`;\n  const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };\n  for (let j = 0; j < H - 1; j++) for (let i = 0; i < W - 1; i++) {\n    const a = val(i, j), b = val(i + 1, j), c = val(i + 1, j + 1), d = val(i, j + 1);\n    const idx = (a > 0 ? 8 : 0) | (b > 0 ? 4 : 0) | (c > 0 ? 2 : 0) | (d > 0 ? 1 : 0); if (idx === 0 || idx === 15) continue;\n    const P = { T: [i + a / (a - b), j], R: [i + 1, j + b / (b - c)], B: [i + d / (d - c), j + 1], L: [i, j + a / (a - d)] };\n    let segs = SEG[idx];\n    if (idx === 5) segs = (a + b + c + d) / 4 > 0 ? [['T', 'L'], ['R', 'B']] : [['T', 'R'], ['L', 'B']];\n    if (idx === 10) segs = (a + b + c + d) / 4 > 0 ? [['T', 'R'], ['L', 'B']] : [['T', 'L'], ['R', 'B']];\n    for (const [e1, e2] of segs) { const k1 = key(e1, i, j), k2 = key(e2, i, j); pts.set(k1, P[e1]); pts.set(k2, P[e2]); link(k1, k2); }\n  }\n  const seen = new Set(), loops = [];\n  for (const start of adj.keys()) { if (seen.has(start)) continue;\n    const loop = []; let prev = null, cur = start;\n    while (cur && !seen.has(cur)) { seen.add(cur); const p = pts.get(cur); loop.push([x0 + p[0] * cell, y0 + p[1] * cell]); const n = adj.get(cur); const next = n.find(k => k !== prev && !seen.has(k)); prev = cur; cur = next; }\n    if (loop.length > 5) loops.push(passes > 1 ? chaikin(chaikin(loop.filter((_, i) => i % 2 === 0))) : chaikin(loop)); }\n  return loops;\n}\nfunction chaikin(p) { const o = []; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; o.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]); } return o; }\nconst toD = loops => loops.map(l => 'M' + l.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') + 'Z').join('');\nfunction grid(x0, y0, x1, y1, cell, fn) { const W = Math.ceil((x1 - x0) / cell) + 1, H = Math.ceil((y1 - y0) / cell) + 1, v = new Float32Array(W * H);\n  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) v[j * W + i] = fn(x0 + i * cell, y0 + j * cell); return { W, H, v, x0, y0, cell }; }\nconst derive = (G, fn) => ({ ...G, v: G.v.map((val, k) => fn(val, G.x0 + (k % G.W) * G.cell, G.y0 + Math.floor(k / G.W) * G.cell, k)) });\n\n/* ===================== the planets ===================== */\nconst PLANETS = [\n  { id: 'inference', name: 'Inference & serving', type: 'lush', system: 'Machine learning', regions: ['Batching', 'Deployment', 'Latency', 'Cost'], sel: 1, route: 'Attention',\n    enc: { kind: 'A Reel', title: 'Where should the model run?', sum: 'Close to the people asking, or close to the hardware, and what each one costs.' } },\n  { id: 'attention', name: 'Attention', type: 'barren', system: 'Machine learning', regions: ['Context windows', 'Saliency', 'Heads', 'Memory'], sel: 0, route: 'Inference & serving', moon: true,\n    enc: { kind: 'A Scroll', title: 'Why long prompts get forgetful', sum: 'What happens to the middle of a very long context, and the tricks that help.' } },\n  { id: 'hardware', name: 'Hardware', type: 'scorched', system: 'Machine learning', regions: ['GPUs', 'Memory bandwidth', 'Interconnect', 'Cooling'], sel: 1, route: 'Inference & serving', rings: true, moon: true,\n    enc: { kind: 'A Reel', title: 'Why GPUs wait on memory', sum: 'Compute got fast. Moving the numbers around did not. Where the time really goes.' } },\n  { id: 'queues', name: 'Queues', type: 'gas', system: 'Backend systems', regions: ['Backpressure', 'Retries', 'Ordering', 'Dead letters'], sel: 0, route: 'Storage', rings: true,\n    enc: { kind: 'A Scroll', title: 'When consumers fall behind', sum: 'Buffers fill, latency climbs and something has to give. Backpressure decides what.' } },\n  { id: 'storage', name: 'Storage', type: 'frozen', system: 'Backend systems', regions: ['Replication', 'Indexes', 'Caching', 'Backups'], sel: 0, route: 'Queues', rings: true,\n    enc: { kind: 'A Reel', title: 'Leaders, followers and the lag', sum: 'Why a read can miss a write you just made, and how replicas catch up.' } },\n  { id: 'tactics', name: 'Tactics', type: 'ocean', system: 'Football', regions: ['Pressing', 'Formations', 'Set pieces', 'Counters'], sel: 0, moon: true,\n    enc: { kind: 'A Reel', title: 'Why teams press high', sum: 'Winning the ball near the goal is worth more than winning it anywhere else.' } },\n];\n\n/* ===================== one look per planet type: flat colour, soft edges ===================== */\nconst T = {\n  lush:     { label: 'Lush world', sea: ['#1d7d97', '#0f5670', '#052c41'], shallow: '#4fc3c9', globe: ['#7fd9d6', '#3fa8bd', '#1c6f93', '#0d3f5e'],\n c) < (o.s + s) * loosen)) continue; out.push(c); }\n    if (out.length === sizes.length) return out;\n  }\n  return sizes.map((s, i) => ({ x: b.x0 + (i + .5) / sizes.length * (b.x1 - b.x0), y: (b.y0 + b.y1) / 2, s, rot: 0, sx: 1 }));\n}\nfunction buildWorld(P, o) {\n  const th = T[P.type], r = rng(P.id + o.tag), oz = r() * 50, N = o.noise;\n  const conts = placeConts(r, o.sizes, o.bounds, o.period), nExp = o.explored;\n  const dxOf = (x, c) => { let dx = x - c.x; if (o.period) { dx = ((dx % o.period) + o.period * 1.5) % o.period - o.period / 2; } return dx; };\n  const bump = (c, x, y) => { const dx = dxOf(x, c), dy = y - c.y, cs = Math.cos(c.rot), sn = Math.sin(c.rot), u = (dx * cs + dy * sn) / (c.s * c.sx), v = (-dx * sn + dy * cs) / (c.s / c.sx); return 1 - Math.hypot(u, v); };\n  const landFn = (x, y) => {\n    const wx = x + N(x, y, 110, oz + 1.1) * 48, wy = y + N(x, y, 110, oz + 2.3) * 48;\n    const base = Math.max(...conts.map(c => bump(c, wx, wy)));\n    const det = th.soft ? N(wx, wy, 80, oz + 3) * .35 + N(wx, wy, 34, oz + 4) * .14\n      : N(wx, wy, 70, oz + 3) * .42 + N(wx, wy, 30, oz + 4) * .26 + N(wx, wy, 13, oz + 5) * .16 + N(wx, wy, 6, oz + 6) * .09;\n    return base + det - .12;\n  };\n  const G = grid(o.x0, o.y0, o.x1, o.y1, o.cell, landFn);\n  // seeds: explored continents carry the planet's regions; each locked continent is one grey mass\n  const seeds = [], owner = [];\n  const perCont = o.perCont(P.regions.length, nExp);\n  conts.slice(0, nExp).forEach((c, ci) => { const k = perCont[ci], a0 = r() * TAU;\n    for (let q = 0; q < k; q++) { const a = a0 + q * TAU / k, d = k > 1 ? c.s * .45 : 0; seeds.push([c.x + Math.cos(a) * d * c.sx, c.y + Math.sin(a) * d / c.sx]); owner.push('region'); } });\n  conts.slice(nExp).forEach(c => { seeds.push([c.x, c.y]); owner.push('locked'); });\n  const warp = (x, y) => [N(x, y, 60, 9.1 + oz) * o.warp + N(x, y, 22, 5.5 + oz) * o.warp * .35, N(x, y, 60, 4.7 + oz) * o.warp + N(x, y, 22, 6.6 + oz) * o.warp * .35];\n  const D = []; for (let k = 0; k < G.v.length; k++) { const x = G.x0 + (k % G.W) * G.cell, y = G.y0 + Math.floor(k / G.W) * G.cell, [wx, wy] = warp(x, y);\n    D.push(seeds.map(s => { let dx = Math.abs(x + wx - s[0]); if (o.period) dx = Math.min(dx, o.period - dx); return Math.hypot(dx, y + wy - s[1]); })); }\n  const field = idx => derive(G, (val, x, y, k) => { const d = D[k]; let mine = Infinity, other = Infinity;\n    d.forEach((v, j) => { if (idx.includes(j)) mine = Math.min(mine, v); else other = Math.min(other, v); }); return Math.min(val, (other - mine) / 30); });\n  const deepest = F => { // a point well inside the region, close to its middle\n    let mx = -9, sx = 0, sy = 0, n = 0; F.v.forEach((v, k) => { if (v > mx) mx = v; if (v > 0) { sx += (k % F.W); sy += Math.floor(k / F.W); n++; } });\n    if (!n) return [F.x0, F.y0]; const cx = sx / n, cy = sy / n; let bk = 0, bd = Infinity;\n    F.v.forEach((v, k) => { if (v < mx * .35) return; const d = Math.hypot((k % F.W) - cx, Math.floor(k / F.W) - cy); if (d < bd) { bd = d; bk = k; } });\n    return [F.x0 + (bk % F.W) * F.cell, F.y0 + Math.floor(bk / F.W) * F.cell]; };\n  const regions = [], locked = [];\n  seeds.forEach((s, i) => { const F = field([i]); (owner[i] === 'region' ? regions : locked).push({ loops: contours(F, 0, 1), at: deepest(F), seed: s }); });\n  // keep names apart: push overlapping labels vertically, sized by the length of each name\n  for (let pass = 0; pass < 6; pass++) regions.forEach((g, i) => regions.forEach((h, j) => { if (j >= i) return;\n    const half = (P.regions[i].length + P.regions[j].length) * 4.3 + 8, dx = g.at[0] - h.at[0], dy = g.at[1] - h.at[1];\n    if (Math.abs(dx) < half && Math.abs(dy) < 24) { const push = (24 - Math.abs(dy)) / 2 + 1, sgn = dy >= 0 ? 1 : -1; g.at = [g.at[0], g.at[1] + push * sgn]; h.at = [h.at[0], h.at[1] - push * sgn]; } }));\n  const regIdx = owner.map((w, i) => w === 'region' ? i : -1).filter(i => i >= 0);\n  const explored = field(regIdx);\n  const , y, 20, cz + 4) * .35 + N(x, y, 8, cz + 7) * .12 - .32);\n  w.clouds = contours(CG); w.cloudsMid = contours(CG, .1); w.cloudsCore = contours(CG, .2);\n  GLOBEC.set(P.id, w); return w;\n}\n\n/* ===================== chrome ===================== */\nconst tabbar = () => `<nav class=\"worldnav\">${[\n  ['Explore', '<rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"3\"/><path d=\"M8 3l4 4 4-4\"/>'],\n  ['Universe', '<circle cx=\"12\" cy=\"12\" r=\"3.5\"/><ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4.5\" transform=\"rotate(-20 12 12)\"/>', 1],\n  ['Talk', '<path d=\"M4 5h16v11H9l-5 4z\"/>'], ['Keep', '<path d=\"M6 3h12v18l-6-4-6 4z\"/>']].map(([l, d, on]) =>\n  `<div class=\"nav-tab${on ? ' is-active' : ''}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${d}<\/svg><span>${l}<\/span><\/div>`).join('')}<\/nav>`;\nconst backIcon = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/><\/svg>';\nconst listIcon = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01\"/><\/svg>';\nconst fwdIcon = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5l7 7-7 7\"/><\/svg>';\nfunction stars(seed) { const r = rng(seed); return `<div class=\"starfield\"><svg viewBox=\"0 0 390 844\">${Array.from({ length: 140 }, () =>\n  `<circle cx=\"${f1(r() * 390)}\" cy=\"${f1(r() * 844)}\" r=\"${f1(.4 + Math.pow(r(), 3) * 1.4)}\" fill=\"#fffdf2\" opacity=\"${f1(.2 + r() * .7)}\"/>`).join('')}<\/svg><\/div>`; }\nfunction cloudPuff(r, x, y, sc, th) {\n  const lobes = 4 + ((r() * 3) | 0); let cx = 0, d = '';\n  for (let j = 0; j < lobes; j++) { const rr = 13 + r() * 13; d += `<circle cx=\"${f1(cx)}\" cy=\"${f1(-rr * .42 + r() * 4)}\" r=\"${f1(rr)}\"/>`; cx += rr * (.75 + r() * .35); }\n  d += `<rect x=\"-8\" y=\"-12\" width=\"${f1(cx + 16)}\" height=\"24\" rx=\"12\"/>`;\n  const flip = r() < .5 ? -1 : 1, anim = r() > .5 ? ` class=\"cloud\" style=\"--d:${f1(9 + r() * 9)}s;--dx:${f1(4 + r() * 6)}px\"` : '';\n  return `<g transform=\"translate(${f1(x)} ${f1(y)}) scale(${f1(sc * flip)} ${f1(sc)}) translate(${f1(-cx / 2)} 0)\"><g${anim}><g fill=\"${th.cloud[1]}\" transform=\"translate(0 5)\">${d}<\/g><g fill=\"${th.cloud[0]}\">${d}<\/g><\/g><\/g>`;\n}\nconst textLabel = (x, y, name, th, size = 15) => `<text x=\"${f1(x)}\" y=\"${f1(y)}\" text-anchor=\"middle\" font-family=\"Bricolage Grotesque\" font-weight=\"800\" font-size=\"${size}\" fill=\"#15302a\" paint-order=\"stroke\" stroke=\"#fffdf2\" stroke-width=\"5\" stroke-linejoin=\"round\">${name}<\/text>`;\n\n\n/* the planet view: saturated, flat cartoon biomes (every continent in full colour) */\nconst BIO = {\n  lush:     { globe: ['#a4f5ee', '#43c9d6', '#178cba', '#0a4f7e'], land: ['#5fd36f', '#8ee25c', '#3fbf6a', '#b5ea6a'], lo: '#2a9a55', hi: '#f2d57e', peak: '#9a8460', ink: '#14402e', foam: '#e9fffb', trees: '#1f8a4a', forms: 'mountains' },\n  ocean:    { globe: ['#b8f4ff', '#3fb4f0', '#1670cc', '#0a3a80'], land: ['#7ee06a', '#5fd07a', '#a6ec6a', '#4fc36e'], lo: '#2f9e55', hi: '#ffe08a', peak: '#8a9a6a', ink: '#12403a', foam: '#f2fdff', trees: '#228a4c', forms: 'mountains' },\n  frozen:   { globe: ['#e6f8ff', '#8fcaf5', '#3c86d0', '#163f80'], land: ['#f6fcff', '#d8efff', '#c2e6ff', '#e9f8ff'], lo: '#9fd2f5', hi: '#ffffff', peak: '#7894bb', ink: '#24497a', foam: '#ffffff', forms: 'mountains' },\n  scorched: { globe: ['#ff9a6a', '#e0483e', '#8e1a36', '#3e0716'], land: ['#ff7a45', '#ff5a3c', '#ffa04a', '#f06a3a'], lo: '#8a2030', hi: '#ffd25a', peak: '#4a141c', ink: '#3a0a14', foam: '#ffd2a0', forms: 'volcanoes' },\n  barren:   { globe: ['#dcc6f2', '#9d82c4', '#60488a', '#2c1f48'], land: ['#f7cf86', '#eeb062', '#e39a52', '#f9dca0'], lo: '#c06a3a', hi: '#fff2cc', peak: '#7a4e2e', ink: '#4a2a18', foam: '#f4eaff', forms: 'mesas' },\n  gas:      { globe: ['#ffe2c0', '#ff9ab8', '#b07ae0', '#4e2a86'], land: ['#fff1e0', '#ffd6c0', '#ffc6da', '#ecd2ff'], lo: '#ff8fb6', hi: '#ffffff', peak: '#c070d0', ink: '#7a3a68', foam: '#ffffff', forms: 'swirls',\n              bands: ['#ffb07a', '#ff7fa6', '#b88aff', '#ffd27a', '#ff6f9a'] },\n};\n/* ===================== U03: the planet from orbit ===================== */\nfunction surfaceBand(P, th) {\n  const w = globeWorld(P), id = P.id;\n  let body = '';\n  if (th.detail === 'bands') {\n    for (let i = 0; i < 9; i++) { const y = i * 40, c = BIO.gas.bands[i % 5];\n      body += `<path d=\"M-60 ${y} ${Array.from({ length: 11 }, (_, k) => `Q${-60 + k * 60 + 30} ${y + (k % 2 ? 9 : -9)} ${-60 + k * 60 + 60} ${y}`).join(' ')} V${y + 44} H-60Z\" fill=\"${c}\"/>`; }\n    body = `<g filter=\"url(#soft${id})\">${body}<\/g>`;\n  }\n  const B = BIO[P.type], all = toD(w.land), rf = rng(P.id + 'forms');\n  // soft shallows, then a white foam edge just outside every coast\n  body += `<path d=\"${toD(w.shallow2)}\" fill=\"${th.shallow}\" opacity=\".35\" fill-rule=\"evenodd\" filter=\"url(#soft${id})\"/><path d=\"${toD(w.shallow1)}\" fill=\"${B.foam}\" opacity=\".35\" fill-rule=\"evenodd\" filter=\"url(#soft${id})\"/>`;\n  if (th.glowCoast) body += `<path d=\"${all}\" fill=\"none\" stroke=\"#ffb03a\" stroke-width=\"6\" opacity=\".8\" filter=\"url(#soft${id})\"/>`;\n  body += `<path d=\"${all}\" fill=\"none\" stroke=\"${B.foam}\" stroke-width=\"3.6\" stroke-linejoin=\"round\" opacity=\".85\"/>`;\n  // every continent in full colour: explored regions and the rest alike\n  body += w.regions.map((g, i) => `<path d=\"${toD(g.loops)}\" fill=\"${B.land[i % 4]}\" fill-rule=\"evenodd\"/>`).join('');\n  body += w.locked.map((g, i) => `<path d=\"${toD(g.loops)}\" fill=\"${B.land[(i + 1) % 4]}\" fill-rule=\"evenodd\"/>`).join('');\n  // flat cartoon biomes: lowland, bright patches, highlands\n  body += `<path d=\"${toD(w.lo)}\" fill=\"${B.lo}\" opacity=\".6\" fill-rule=\"evenodd\"/><path d=\"${toD(w.hi)}\" fill=\"${B.hi}\" opacity=\".62\" fill-rule=\"evenodd\"/>`;\n  body += w.regions.map(g => `<path d=\"${toD(g.loops)}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".45\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>`).join('');\n  body += `<path d=\"${all}\" fill=\"none\" stroke=\"${B.ink}\" stroke-opacity=\".7\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/>`;\n  const names = w.regions.map((g, i) => textLabel(g.at[0], g.at[1] + 5, P.regions[i], th, 14)).join('');\n  // cumulus seen from orbit: a cast shadow on the ground, a cool underside, a white body, brighter inner puffs and a sunlit core\n  const cb = toD(w.clouds), cm = toD(w.cloudsMid), cc = toD(w.cloudsCore);\n  const clouds = `<path d=\"${cb}\" fill=\"#06182a\" opacity=\".22\" fill-rule=\"evenodd\" transform=\"translate(4 7)\" filter=\"url(#cshadow${id})\"/>`\n    + `<path d=\"${cb}\" fill=\"#a9bcd2\" opacity=\".9\" fill-rule=\"evenodd\" transform=\"translate(0 2)\" filter=\"url(#csoft${id})\"/>`\n    + `<path d=\"${cb}\" fill=\"#e6eef7\" fill-rule=\"evenodd\" filter=\"url(#csoft${id})\"/>`\n    + `<path d=\"${cm}\" fill=\"#f6f9fd\" fill-rule=\"evenodd\" transform=\"translate(-.6 -1)\" filter=\"url(#csoft${id})\"/>`\n    + `<path d=\"${cc}\" fill=\"#ffffff\" fill-rule=\"evenodd\" transform=\"translate(-1.2 -2)\" filter=\"url(#csoft${id})\"/>`;\n  const defs = `<filter id=\"soft${id}\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\"><feGaussianBlur stdDeviation=\"1.6\"/><\/filter>`\n    + `<filter id=\"csoft${id}\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\"><feGaussianBlur stdDeviation=\".9\"/><\/filter><filter id=\"cshadow${id}\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\"><feGaussianBlur stdDeviation=\"3\"/><\/filter>`;\n  return `<svg class=\"surface\" viewBox=\"0 0 960 360\"><defs>${defs}<clipPath id=\"slice${id}\"><rect x=\"0\" y=\"0\" width=\"480\" height=\"360\"/><\/clipPath>\n    <g id=\"band${id}\"><g clip-path=\"url(#slice${id})\">${body}<\/g><\/g><g id=\"cl${id}\"><g clip-path=\"url(#slice${id})\">${clouds}<\/g><\/g><g id=\"nm${id}\"><g clip-path=\"url(#slice${id})\">${names}<\/g><\/g><\/defs>\n    <use href=\"#band${id}\" x=\"0\"/><use href=\"#band${id}\" x=\"480\"/><g class=\"cloudband\"><use href=\"#cl${id}\" x=\"0\"/><use href=\"#cl${id}\" x=\"480\"/><use href=\"#cl${id}\" x=\"960\"/><\/g><use href=\"#nm${id}\" x=\"0\"/><use href=\"#nm${id}\" x=\"480\"/><\/svg>`;\n}\nfunction ringSVG(th, front) {\n  const rx = 215, ry = 48, arc = front ? `M${-rx} 0 A${rx} ${ry} 0 0 0 ${rx} 0` : `M${-rx} 0 A${rx} ${ry} 0 0 1 ${rx} 0`;\n  return `<svg class=\"ring ${front ? 'front' : 'back'}\" viewBox=\"-235 -235 470 470\"><g transform=\"rotate(-14)\" fill=\"none\" stroke-linecap=\"round\">\n    <path d=\"${arc}\" stroke=\"${th.land[2]}\" stroke-width=\"13\" opacity=\".9\"/><path d=\"${arc}\" stroke=\"${th.land[1]}\" stroke-width=\"4\" transform=\"scale(1.05 1.07)\" opacity=\".8\"/><path d=\"${arc}\" stroke=\"${th.hi}\" stroke-width=\"2\" transform=\"scale(.95 .93)\" opacity=\".7\"/><\/g><\/svg>`;\n}\nconst MOON = `<svg viewBox=\"0 0 40 40\"><circle cx=\"20\" cy=\"20\" r=\"15.6\" fill=\"#f1ead6\"/><path d=\"M20 4.4A15.6 15.6 0 0 1 20 35.6 20.5 20.5 0 0 0 20 4.4Z\" fill=\"#cbc3aa\"/>\n  <circle cx=\"14.6\" cy=\"15\" r=\"4.1\" fill=\"#ddd5bd\"/><circle cx=\"24.4\" cy=\"24.6\" r=\"2.7\" fill=\"#ddd5bd\"/><circle cx=\"15.8\" cy=\"26.4\" r=\"2.1\" fill=\"#ddd5bd\"/><\/svg>`;\nfunction screenPlanet(P) {\n  const th = T[P.type], g = BIO[P.type].globe;\n  const bg = `radial-gradient(circle at 38% 32%, ${g[0]} 0, ${g[1]} 35%, ${g[2]} 72%, ${g[3]} 100%)`;\n  const caps = th.caps ? `<svg class=\"caps\" viewBox=\"0 0 292 292\"><defs><filter id=\"capb${P.id}\"><feGaussianBlur stdDeviation=\"3\"/><\/filter><\/defs><g filter=\"url(#capb${P.id})\" fill=\"#fff\">\n    <path d=\"M30 46 Q90 20 146 30 Q210 18 262 46 Q230 70 190 62 Q160 78 120 66 Q80 76 30 46Z\" opacity=\".9\"/><path d=\"M40 252 Q100 236 146 246 Q200 232 252 252 Q200 290 146 286 Q90 292 40 252Z\" opacity=\".85\"/><\/g><\/svg>` : '';\n  return `<div class=\"phone\" data-anim style=\"--atmo-line:${th.atmo}aa;--atmo-glow:${th.atmo}66;--rim:${th.rim};--globe-bg:${bg}\">\n    ${stars(P.id)}\n    <div class=\"map-top\"><div class=\"pill\">${backIcon}${P.system}<\/div><\/div>\n    ${P.rings ? ringSVG(th, false) : ''}\n    <div class=\"globe-wrap\"><div class=\"atmosphere\"><\/div><div class=\"globe soft\">${surfaceBand(P, th)}${caps}<div class=\"shade\"><\/div><div class=\"glint\"><\/div><\/div><\/div>\n    ${P.rings ? ringSVG(th, true) : ''}\n    ${P.moon ? `<div class=\"moon\" data-moon>${MOON}<\/div>` : ''}\n    <div class=\"caption\"><span class=\"eyebrow\">A planet in ${P.system}<\/span><h1>${P.name}<\/h1><div class=\"hint\"><span>↔<\/span>Drag to rotate · tap to land<\/div><\/div>\n    <div class=\"chips\">${P.route ? `<span class=\"chip light\">Route to ${P.route}${fwdIcon}<\/span>` : ''}<span class=\"chip dark\">${listIcon}List view<\/span><\/div>\n    ${tabbar()}<div class=\"statusbar\"><span>9:41<\/span><i><\/i><\/div><\/div>`;\n}\n<\/script>\n<script type=\"module\">\nimport * as THREE from 'three';\n\n/* ===================== copied verbatim from universe-above/universe-drafts-finalized.html ===================== */\nconst W = 390, H = 844, PR = Math.min(1.5, window.devicePixelRatio || 1), TAU = Math.PI * 2;\nconst clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst smooth = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };\nconst mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];\nfunction rng(seed) { let h = 2166136261; for (const ch of String(seed)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);\n  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nfunction hsl(h, s, l) { h = ((h % 360) + 360) % 360 / 360; s /= 100; l /= 100;\n  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return 255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))); };\n  return [f(0), f(8), f(4)]; }\nconst v3 = c => new THREE.Vector3(c[0] / 255, c[1] / 255, c[2] / 255);\nconst hexV = h => v3([parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);\nfunction ramp(stops, t) { t = clamp(t) * (stops.length - 1); const i = Math.min(stops.length - 2, t | 0); const k = t - i; return mix3(stops[i], stops[i + 1], k * k * (3 - 2 * k)); }\n\n/* ===================== smooth noise (low frequency only: painted, not photographic) ===================== */\nconst perm = new Uint8Array(512);\n(() => { const p = [...Array(256).keys()], r = rng('knowscroll'); for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; })();\nconst fade = t => t * t * t * (t * (t * 6 - 15) + 10);\nfunction grad(h, x, y, z) { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14) ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }\nfunction noise(x, y, z) {\n  let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z); x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;\n  const u = fade(x), v = fade(y), w = fade(z), A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z, B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;\n  return lerp(lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u), lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),\n    lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u), lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);\n}\nfunction fbm(x, y, z, o = 3) { let a = .5, f = 1, s = p:4px\">A system<\/span><\/div><\/div>\n    <div class=\"bottom\"><div class=\"actions\">${chip('List view', { ic: 'list' })}<\/div><\/div><\/div>\n  <span class=\"tap\" id=\"tap\"><\/span>${tabbar}`;\n// U03: the approved globe page for Inference & serving, minus its own status bar and tab bar (the phone keeps one of each)\n{ const tmp = document.createElement('div'); tmp.innerHTML = screenPlanet(PLANETS[0]); const ph = tmp.firstElementChild;\n  ph.querySelector('.worldnav').remove(); ph.querySelector('.statusbar').remove(); const u = $('u03'); u.setAttribute('style', ph.getAttribute('style')); u.innerHTML = ph.innerHTML; }\nconst U = { star: $('u03').querySelector('.starfield'), globe: $('u03').querySelector('.globe-wrap'), top: $('u03').querySelector('.map-top'), cap: $('u03').querySelector('.caption'), chips: $('u03').querySelector('.chips') };\nconst rise = (el, k, dy = 10) => { el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`; };\nfunction chrome(T, r) {\n  const tp = $('tap'), k = clamp(T / .5), v = (r.tap.x * .5 + .5) * W, h = (-r.tap.y * .5 + .5) * H;   // one ring opens and fades where you touched\n  tp.style.opacity = T < .5 ? .9 * (1 - k) : 0; tp.style.transform = `translate(${v}px, ${h}px) scale(${1 + 2.2 * easeOut(k)})`;\n  $('chS').style.opacity = 1 - smooth(.03, .28, T);\n  // the world comes into focus on top of the painted planet: fading in, blurred at first, sharp on arrival\n  $('u03').style.opacity = r.focus > 0 ? 1 : 0; U.star.style.opacity = r.stars; U.globe.style.opacity = r.focus;\n  U.globe.style.transform = `translate(${r.gx - 195}px, ${r.gy - 372}px) translate(-50%, -50%) scale(${r.gs})`;\n  U.globe.style.filter = r.focus < 1 ? `blur(${(6 * (1 - r.focus)).toFixed(2)}px)` : 'none';\n  rise(U.top, smooth(3.05, 3.5, T), -8); rise(U.cap, smooth(3.15, 3.6, T)); rise(U.chips, smooth(3.25, 3.7, T));\n}\n\n/* ===================== page: beats, storyboard, controls ===================== */\nconst f2 = x => x.toFixed(2);\nconst gT = x => P.G0 + (P.G1 - P.G0) * x;   // glide progress to time\nconst BEATS = [\n  [0, P.G0, 'Tap', 'A tap on Inference & serving. One ring opens where you touched; the system header, chips and names fade away. The tab bar stays.'],\n  [P.G0, gT(.3), 'Set off', 'The camera turns onto the planet and starts to glide in; the sun, the station and the other worlds slide away. The parked ship bows out.'],\n  [gT(.3), gT(.97), 'Coming into focus', 'Still gliding in, at an even-feeling, unhurried speed. The U03 globe fades in exactly on the painted planet (same spot, same size), blurred at first and sharper the closer we get; the glow round the planet and the bloom of the sun ease down. Near the end the U03 starfield comes in.'],\n  [gT(.97), P.G1, 'Land', 'A soft landing with the globe sharp, exactly where U03 has it.'],\n  [P.G1 - .1, P.END, 'U03 Planet', 'The back pill, name, hint and chips rise in. Then it is the live globe.'],\n];\nconst SHOTS = [[0, 'Tap'], [.6, 'Setting off'], [1.05, 'Turning onto it'], [1.5, 'Gliding in'], [1.95, 'Closing in'], [2.4, 'Nearly there'], [2.85, 'Landing'], [3.15, 'Landed']];\nconst beatsEl = $('beats'), scrub = $('scrub'), tc = $('tc'), pauseB = $('pause');\nbeatsEl.innerHTML = BEATS.map(([a, b, n, d]) => `<tr><td>${f2(a)}–${f2(b)} s<\/td><td><b>${n}<\/b> · ${d}<\/td><\/tr>`).join('');\n$('shots').innerHTML = SHOTS.map(([s, n]) => { frame(s); return `<div class=\"shot\" data-t=\"${s}\"><img alt=\"${n}\" src=\"${cS.toDataURL('image/jpeg', .82)}\"><b>${f2(s)} s<\/b><span>${n}<\/span><\/div>`; }).join('');\nscrub.max = P.MAX;\nlet T = 0, playing = true, rate = 1;\nfunction show() { const r = frame(T); chrome(T, r); scrub.value = Math.min(T, P.MAX);\n  const beat = Math.max(0, BEATS.findLastIndex(([a]) => T >= a));\n  tc.textContent = `${f2(Math.min(T, P.MAX))} s · ${BEATS[beat][2]}`; beatsEl.querySelectorAll('tr').forEach((tr, i) => tr.classList.toggle('cur', i === beat)); }\nconst setPlay = p => { playing = p; pauseB.textContent = p ? 'Pause' : 'Play'; };\n$('replay').onclick = () => { T = 0; setPlay(true); };\npauseB.onclick = () => { if (!playing && T >= P.MAX) T = 0; setPlay(!playing); };\n$('slow').onclick = e => { rate = rate === 1 ? .25 : 1; e.target.classList.toggle('on', rate !== 1); };\nscrub.oninput = () => { T = +scrub.value; setPlay(false); show(); };\n$('shots').onclick = e => { const s = e.target.closest('.shot'); if (s) { T = +s.dataset.t; setPlay(false); show(); } };\nconst reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst hashT = /t=([\\d.]+)/.exec(location.hash);\nif (hashT) { T = +hashT[1]; setPlay(false); }\nif (reduce) { T = P.END + .2; setPlay(false); }   // reduced motion: no glide, straight to U03\nshow();\nlet last = 0, prev = null;\nfunction loop(now) { requestAnimationFrame(loop); if (reduce || now - last < 33) return; const dt = prev === null ? 0 : Math.min(.1, (now - prev) / 1000); prev = now; last = now;\n  if (playing) { T += dt * rate; if (T > P.MAX + 1.2) T = 0; } show(); }   // loops, with a pause on U03\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "Enter a ringed planet", "path": "animations/enter-planet-rings-finalized.html", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Entering a Planet<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<!--\n  Animations: entering a planet with rings or a moon. FINALIZED 2026-10-30 (copy of enter-planet-rings-03.html). Never change it.\n  Round 03: entering a planet with rings and a moon.\n  Round 02 feedback: rings good; but the 3D moon kept orbiting on its own on the way in and slipped behind the planet at random moments.\n  Round 03: from the start of the glide the 3D moon leaves its own orbit and heads for the U03 moon's place, always on the near side of the\n  planet (1.6 planet radii in front of its centre), so it never ducks behind; it shrinks to the U03 size near the end and hands over.\n  Round 02:\n  Round 01 feedback: the rings do not fade out nicely; it looks like the planet loses its rings and a small ring is left.\n  Round 02: no swap of two different rings. The painted 3D ring turns into the U03 ring on the way in: its band narrows to the U03 ring's\n  radii (1.42 to 1.56 planet radii) and it tilts to the U03 angle (seen 13 degrees from edge-on, turned 14 degrees), following the camera,\n  so by the time the U03 ring is sharp the two lie on top of each other and the 3D one only then fades. The 3D moon does the same:\n  it slides onto the U03 moon's place on its orbit and shrinks to its size before handing over.\n  Round 01 notes: Built from animations/enter-planet-finalized.html (same glide, same timings),\n  on Hardware (scorched, rings, a moon) instead of Inference & serving. Question from the design file: the finalized planet entry shows a planet\n  without rings or a moon; for these, the U03 ring and moon must arrive with the globe.\n  What is new: the U03 rings (back and front) and the U03 moon ride on the 3D planet exactly like the globe does (projected centre, radius / 146),\n  fading in blurred to sharp with it, the moon already on its U03 orbit (once every 9000 / 1000 * 2pi s, behind the globe when it is on the far side);\n  meanwhile the painted 3D ring and moon fade out on the same curve, so there is never a double ring at full strength.\n  The parked U02 ship stays where it is (it sits by Inference & serving, not by this planet).\n  Scene code is copied from universe-above/universe-drafts-finalized.html and the globe from world-views/world-views-finalized.html.\n  Add #t=2.2 to the URL to freeze on a moment.\n-->\n<script type=\"importmap\">{ \"imports\": { \"three\": \"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js\" } }<\/script>\n<style>\n:root{\n  --paper:#FFFDF2; --ink:#15302A; --ink2:#566962; --focus:#FFE44D; --fresh:#14C79B;\n  --label:#FFFDF2; --label2:rgba(255,253,242,.72);\n  --f-display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;\n  --f-text:'Instrument Sans',system-ui,sans-serif;\n  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;\n  --page:#0C0C0E; --page-ink:#F2EEE3; --page-ink2:#A29C8E; --page-edge:rgba(242,238,227,.16);\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:var(--page);color:var(--page-ink);font-family:var(--f-text);padding:32px 16px 80px}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer}\n.intro{max-width:1240px;margin:0 auto 18px}\n.intro .kicker{font:500 11px/14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--page-ink2)}\n.intro h1{font:800 36px/40px var(--f-display);letter-spacing:-.02em;margin-top:6px}\n.intro p{color:var(--page-ink2);font-size:15px;line-height:22px;margin-top:8px;max-width:840px}\n.tools{max-width:1240px;margin:0 auto 26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.tools button{border:1.5px solid var(--page-edge);border-radius:999px;padding:8px 14px;font:600 13px/1 var(--f-text)}\n.tools button.on{background:var(--page-ink);color:var(--page)}\n.tools .sep{width:1px;height:24px;background:var(--page-edge);margin:0 4px}\n.tools input[type=range]{width:260px;accent-color:#FFE44D}\n.tools .tc{font:500 12px/16px var(--f-mono);color:var(--page-ink2);min-width:150px}\n#err{position:fixed;left:12px;bottom:12px;max-width:600px;background:#B23A0B;color:#fff;font:12px/16px var(--f-mono);padding:10px;border-radius:8px;display:none;white-space:pre-wrap;z-index:99}\n\n.stage{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;max-width:1240px;margin:0 auto}\n.side{width:min(640px,100%);display:flex;flex-direction:column;gap:22px}\n.side h3{font:500 11px n.u03 .moon svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 12px rgba(255,249,226,.3))}\n.u03 .moon.behind{z-index:4}\n@media (max-width:440px){ .phone{transform:scale(.86);transform-origin:top left;margin-bottom:-118px} }\n<\/style>\n<\/head>\n<body>\n<header class=\"intro\">\n  <span class=\"kicker\">KnowScroll · Universe · Animations · Entering a planet · Rings and a moon · Final<\/span>\n  <h1>Gliding in, rings and all<\/h1>\n  <p>The same glide as the finalized planet entry, onto Hardware, which has rings and a moon. As the world comes into focus on the planet,\n     the painted ring narrows and tilts into the U03 ring and the moon slides onto its U03 orbit, so they hand over without a jump. About four seconds.<\/p>\n<\/header>\n<div class=\"tools\"><button id=\"replay\">Replay<\/button><button id=\"pause\">Pause<\/button><button id=\"slow\">Slow ×0.25<\/button>\n  <input type=\"range\" id=\"scrub\" min=\"0\" max=\"5\" step=\"0.01\" value=\"0\"><span class=\"tc\" id=\"tc\">0.00 s<\/span><\/div>\n<div class=\"stage\">\n  <div class=\"phone\" id=\"phone\"><canvas id=\"cS\"><\/canvas><div class=\"labels\" id=\"lS\"><\/div>\n    <div class=\"u03\" id=\"u03\"><\/div>\n    <div class=\"chrome\" id=\"chrome\"><\/div>\n    <div class=\"statusbar\"><span>9:41<\/span><i><\/i><\/div><\/div>\n  <div class=\"side\">\n    <div><h3>Storyboard · 3D layer only (the globe coming into focus shows on the phone) · click a frame to jump there<\/h3><\/div>\n    <div class=\"shots\" id=\"shots\"><\/div>\n    <div><h3>Beats<\/h3><\/div>\n    <table class=\"beats\" id=\"beats\"><\/table>\n  <\/div>\n<\/div>\n<div id=\"err\"><\/div>\n\n<script>window.addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += (e.message || 'error') + '\\n'; });<\/script>\n<script>\n/* ===================== copied verbatim from world-views/world-views-finalized.html (the U03 globe) ===================== */\nconst TAU = Math.PI * 2;\nconst rng = seed => { let h = 2166136261; for (const c of String(seed)) h = Math.imul(h ^ c.charCodeAt(0), 16777619);\n  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };\nconst f1 = n => n.toFixed(1);\nconst clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;\n\n/* ===================== noise ===================== */\nconst perm = new Uint8Array(512);\n(() => { const p = [...Array(256).keys()], r = rng('knowscroll-world'); for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; })();\nconst fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + (b - a) * t;\nfunction grad(h, x, y, z) { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14) ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }\nfunction noise(x, y, z) {\n  let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z); x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;\n  const u = fade(x), v = fade(y), w = fade(z), A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z, B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;\n  return lerp(lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u), lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),\n    lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u), lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);\n}\nfunction fbm(x, y, z, o) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * noise(x * f, y * f, z * f); f *= 2.03; a *= .5; } return s; }\n\n/* ===================== contours: marching squares, chained and smoothed ===================== */\nconst SEG = { 1: [['L', 'B']], 2: [['B', 'R']], 3: [['L', 'R']], 4: [['T', 'R']], 6: [['T', 'B']], 7: [['T', 'L']], 8: [['T', 'L']], 9: [['T', 'B']], 11: [['T', 'R']], 12: [['L', 'R']], 13: [['R', 'B']], 14: [['L', 'B']] };\nfunction contours(G, iso = 0, passes = 2) {\n  const { W, H, v, x0, y0, cell } = G, pts = new Map(), adj = new Map();\n  const val = (i, j) => (i <= 0 || j <= 0 || i >= W - 1 || j >= H - 1) ? -1 : v[j * W + i] - iso;\n  const key = (e, i, j) => e === 'T' ? `h${i},${j}` : e === 'B' ? `h${i},${j + 1}` : e === 'L' ? `v${i},${j}` : `v${i + 1},${j}`;\n  const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };\n  for (let j = 0; j < H - 1; j++) for (let i = 0; i < W - 1; i++) {\n    const a = val(i, j), b = val(i + 1, j), c = val(i + 1, j + 1), d = val(i, j + 1);\n    const idx = (a > 0 ? 8 : 0) | (b > 0 ? 4 : 0) | (c > 0 ? 2 : 0) | (d > 0 ? 1 : 0); if (idx === 0 || idx === 15) continue;\n    const P = { T: [i + a / (a - b), j], R: [i + 1, j + b / (b - c)], B: [i + d / (d - c), j + 1], L: [i, j + a / (a - d)] };\n    let segs = SEG[idx];\n    if (idx === 5) segs = (a + b + c + d) / 4 > 0 ? [['T', 'L'], ['R', 'B']] : [['T', 'R'], ['L', 'B']];\n    if (idx === 10) segs = (a + b + c + d) / 4 > 0 ? [['T', 'R'], ['L', 'B']] : [['T', 'L'], ['R', 'B']];\n    for (const [e1, e2] of segs) { const k1 = key(e1, i, j), k2 = key(e2, i, j); pts.set(k1, P[e1]); pts.set(k2, P[e2]); link(k1, k2); }\n  }\n  const seen = new Set(), loops = [];\n  for (const start of adj.keys()) { if (seen.has(start)) continue;\n    const loop = []; let prev = null, cur = start;\n    while (cur && !seen.has(cur)) { seen.add(cur); const p = pts.get(cur); loop.push([x0 + p[0] * cell, y0 + p[1] * cell]); const n = adj.get(cur); const next = n.find(k => k !== prev && !seen.has(k)); prev = cur; cur = next; }\n    if (loop.length > 5) loops.push(passes > 1 ? chaikin(chaikin(loop.filter((_, i) => i % 2 === 0))) : chaikin(loop)); }\n  return loops;\n}\nfunction chaikin(p) { const o = []; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; o.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]); } return o; }\nconst toD = loops => loops.map(l => 'M' + l.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') + 'Z').join('');\nfunction grid(x0, y0, x1, y1, cell, fn) { const W = Math.ceil((x1 - x0) / cell) + 1, H = Math.ceil((y1 - y0) / cell) + 1, v = new Float32Array(W * H);\n  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) v[j * W + i] = fn(x0 + i * cell, y0 + j * cell); return { W, H, v, x0, y0, cell }; }\nconst derive = (G, fn) => ({ ...G, v: G.v.map((val, k) => fn(val, G.x0 + (k % G.W) * G.cell, G.y0 + Math.floor(k / G.W) * G.cell, k)) });\n\n/* ===================== the planets ===================== */\nconst PLANETS = [\n  { id: 'inference', name: 'Inference & serving', type: 'lush', system: 'Machine learning', regions: ['Batching', 'Deployment', 'Latency', 'Cost'], sel: 1, route: 'Attention',\n    enc: { kind: 'A Reel', title: 'Where should the model run?', sum: 'Close to the people asking, or close to the hardware, and what each one costs.' } },\n  { id: 'attention', name: 'Attention', type: 'barren', system: 'Machine learning', regions: ['Context windows', 'Saliency', 'Heads', 'Memory'], sel: 0, route: 'Inference & serving', moon: true,\n    enc: { kind: 'A Scroll', title: 'Why long prompts get forgetful', sum: 'What happens to the middle of a very long context, and the tricks that help.' } },\n  { id: 'hardware', name: 'Hardware', type: 'scorched', system: 'Machine learning', regions: ['GPUs', 'Memory bandwidth', 'Interconnect', 'Cooling'], sel: 1, route: 'Inference & serving', rings: true, moon: true,\n    enc: { kind: 'A Reel', title: 'Why GPUs wait on memory', sum: 'Compute got fast. Moving the numbers around did not. Where the time really goes.' } },\n  { id: 'queues', name: 'Queues', type: 'gas', system: 'Backend systems', regions: ['Backpressure', 'Retries', 'Ordering', 'Dead letters'], sel: 0, route: 'Storage', rings: true,\n    enc: { kind: 'A Scroll', title: 'When consumers fall behind', sum: 'Buffers fill, latency climbs and something has to give. Backpressure decides what.' } },\n  { id: 'storage', name: 'Storage', type: 'frozen', system: 'Backend systems', regions: ['Replication', 'Indexes', 'Caching', 'Backups'], sel: 0, route: 'Queues', rings: true,\n    enc: { kind: 'A Reel', title: 'Leaders, followers and the lag', sum: 'Why a read can miss a write you just made, and how replicas catch up.' } },\n  { id: 'tactics', name: 'Tactics', type: 'ocean', system: 'Football', regions: ['Pressing', 'Formations', 'Set pieces', 'Counters'], sel: 0, moon: true,\n    enc: { kind: 'A Reel', title: 'Why teams press high', sum: 'Winning the ball near the goal is worth more than winning it anywhere else.' } },\n];\n\n/* ===================== one look per planet type: flat colour, soft edges ===================== */\nconst T = {\n  lush:     { label: 'Lush world', sea: ['#1d7d97', '#0f5670', '#052c41'], shallow: '#4fc3c9', globe: ['#7fd9d6', '#3fa8bd', '#1c6f93', '#0d3f5e'],\n              land: ['#6fd27f', '#a6e58a', '#4fb878', '#93d6a8'], hi: '#e9d9a0', lo: '#2f8f5c', coast: '#1e5a4a', cloud: ['#f6fcff', '#9dc0d4'], atmo: '#83f2ea', rim: '#b9fff2',\n              accent: '#33c4b4', mc: '#8edbe0', wave: 'rgba(203,245,255,.26)', current: 'rgba(196,242,255,.32)', grat: 'rgba(190,240,255,.1)', detail: 'waves', cover: .1, shadow: '#04283a' },\n  ocean:    { label: 'Ocean world', sea: ['#33a7ea', '#1667b6', '#0a2f6a'], shallow: '#7fd8f7', globe: ['#8fdcff', '#3d9fe0', '#1a63b4', '#0b3270'],\n              land: ['#7ee08e', '#5fcf7c', '#a5e88a', '#4fc06e'], hi: '#ffe7a8', lo: '#2f9a62', coast: '#1d5a4c', cloud: ['#ffffff', '#a7cbe6'], atmo: '#9fe0ff', rim: '#d4f4ff',\n              accent: '#ffd058', mc: '#ffe39a', wave: 'rgba(225,246,255,.34)', current: 'rgba(225,246,255,.36)', grat: 'rgba(210,240,255,.12)', detail: 'waves', archipelago: true, cover: -.1, shadow: '#082a5e' },\n  frozen:   {
