# Shared start of every flow (run with `runFlow: start-app.yaml`, never on its own): a cold start of the signed-out
# app, then a wait for the shell.
#
# The emulator is software-rendered and starts under load, so Android sometimes shows "Pixel Launcher isn't
# responding" (or "System UI ...") over the app. While it is up, the app is not in the view hierarchy and
# every wait times out, so the dialog is dismissed with Wait. A dialog about the app itself is never dismissed:
# an ANR of KnowScroll must fail the flow.
appId: com.knowscroll.client
---
- launchApp:
    clearState: true
    stopApp: true
- repeat:
    times: 40
    while:
      notVisible:
        id: destination-explore
    commands:
      - runFlow:
          when:
            visible: (?!KnowScroll)[A-Za-z ]* isn.t responding
          commands:
            - tapOn: Wait
      - assertVisible:
          id: destination-explore
          optional: true
# Fonts load and the session is read (no stored token: signed out, no network wait) before anything renders.
- assertVisible:
    id: destination-explore
