# Shared (run with `runFlow: scroll-down.yaml`, never on its own): scrolls an Explore Reel page to its
# end, where the hint and the Next subject button are. The swipe starts above the video (a swipe
# on the video itself is a move to something new) and goes up the page.
appId: com.knowscroll.client
---
- repeat:
    times: 5
    commands:
      - swipe:
          start: 50%, 27%
          end: 50%, 8%
