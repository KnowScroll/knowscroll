# The developer gallery, only in a build made with EXPO_PUBLIC_KS_GALLERY=1: opened by deep link, scrolled,
# then left with the system Back. The API health panel asks the world origin baked into the build; the
# flow does not depend on the answer.
appId: com.knowscroll.client
name: Developer gallery by deep link
tags:
  - gallery
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: destination-explore
    timeout: 120000
- openLink: knowscroll://gallery
- extendedWaitUntil:
    visible:
      id: ks-component-gallery
    timeout: 60000
- assertVisible: Components
- assertVisible: API health
- takeScreenshot: gallery-01-top
- scrollUntilVisible:
    element: Pressed toggles
    timeout: 90000
- takeScreenshot: gallery-02-toggles
- scrollUntilVisible:
    element: Banner
    timeout: 90000
- takeScreenshot: gallery-03-banner
- scrollUntilVisible:
    element: Bottom sheet and scrim
    timeout: 90000
- takeScreenshot: gallery-04-sheet
- scrollUntilVisible:
    element: Type scale
    timeout: 90000
- takeScreenshot: gallery-05-type-scale
# The gallery is a screen pushed over the tabs: Back returns to the shell.
- back
- extendedWaitUntil:
    visible:
      id: destination-explore
    timeout: 30000
- assertVisible: Nothing is ready to play yet.
- takeScreenshot: gallery-06-back-to-shell
