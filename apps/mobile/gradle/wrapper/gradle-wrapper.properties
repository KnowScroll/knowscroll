# KnowScroll mobile — Gradle wrapper
# Version is frozen at slice-1 (Gradle 9.6.0).
# The wrapper jar (gradle-wrapper.jar) is generated by `gradle wrapper`
# at the coordinator step — the slice bootstrap does not commit jars
# to the repo. Until the coordinator runs `gradle wrapper`, building
# requires Gradle 9.6.0 to be on the PATH.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
